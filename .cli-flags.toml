# flags-2-env canonical configuration; see github.com/flags-2-env/flags-2-env.
# flags-2-env reads .cli-flags.toml (not .cli-args.toml).
[flags.core-perf]
env = "ORES_CORE_PERF"
aliases = ["core-perf"]
type = "bool"
default = "false"
help = "Record bounded, allocation-free core timing phases; dump JSONL to stderr on exit."

[flags.core-debug]
env = "ORES_CORE_DEBUG"
aliases = ["core-debug"]
type = "bool"
default = "false"
help = "Record bounded core-only numeric diagnostic events; dump JSONL to stderr on exit."

# Select an explicit entry-package manifest; implemented by OresProjectConfig.
[flags.manifest-path]
env = "ORES_MANIFEST_PATH"
aliases = ["manifest-path"]
type = "string"
help = "Explicit .ores.pkg.toml for the Oreslang entry package."

[flags.project-root]
env = "ORES_PROJECT_ROOT"
aliases = ["project-root"]
type = "string"
help = "Directory containing the entry package's .ores.pkg.toml."

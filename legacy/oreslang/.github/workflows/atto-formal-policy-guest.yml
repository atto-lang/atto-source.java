name: Cross-org AttoLang OTel and Opto real Java guests
on:
  pull_request:
    paths:
      - 'src/test/java/dev/oreslang/AttoFormalPolicyGuestTest.java'
      - 'src/test/resources/atto/formal-policy-v1/**'
      - 'docs/ATTO_FORMAL_POLICY_GUEST.md'
      - '.github/workflows/atto-formal-policy-guest.yml'
  push:
    branches: [main]
    paths:
      - 'src/test/java/dev/oreslang/AttoFormalPolicyGuestTest.java'
      - 'src/test/resources/atto/formal-policy-v1/**'
      - 'docs/ATTO_FORMAL_POLICY_GUEST.md'
      - '.github/workflows/atto-formal-policy-guest.yml'
permissions:
  contents: read
jobs:
  java-linked-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout immutable PR source head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify exact checked out source head and blobs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object src/test/resources/atto/formal-policy-v1/otel-delivery.atto)" = "0388755a1660ed3d9543e1a5db982a9c328b91bc"
          test "$(git hash-object src/test/resources/atto/formal-policy-v1/opto-ack.atto)" = "50f691b51c782835b26cb7d9cea3db44d7678d41"
          test "$(git hash-object src/test/resources/atto/formal-policy-v1/otel-delivery.stdout)" = "c4e6e607cedc1dd890981ff5f76e101f41d016f6"
          test "$(git hash-object src/test/resources/atto/formal-policy-v1/opto-ack.stdout)" = "8a9e229a36d840df32d35fd54dc021ac7c9503af"
          echo "ATTO_FORMAL_JAVA_HEAD=$EXPECTED_HEAD"
      - name: Compile and execute canonical AttoLang policies with negative controls
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=AttoFormalPolicyGuestTest -DfailIfNoTests=true test
          test -s target/surefire-reports/TEST-dev.oreslang.AttoFormalPolicyGuestTest.xml
          grep -q '<testsuite' target/surefire-reports/TEST-dev.oreslang.AttoFormalPolicyGuestTest.xml
      - name: Retain JUnit receipts including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atto-formal-policy-java-junit
          path: target/surefire-reports/*AttoFormalPolicyGuestTest*
          if-no-files-found: warn

name: Typed callable return exact-head JVM and AOT
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/typed-callable-exact-head-jvm-aot.yml'
      - 'pom.xml'
      - 'docs/grammar.ebnf'
      - 'src/main/java/dev/oreslang/nodes/**'
      - 'tools/ci/VerifyTypedCallableSurefire.java'
      - 'src/main/java/dev/oreslang/ast/**'
      - 'src/main/java/dev/oreslang/parser/**'
      - 'src/main/java/dev/oreslang/types/**'
      - 'src/main/java/dev/oreslang/compiler/**'
      - 'src/test/java/dev/oreslang/*Lambda*Test.java'
      - 'src/test/java/dev/oreslang/*Callable*Test.java'
      - 'src/test/java/dev/oreslang/*TreeShaker*Test.java'
# Re-run this PR event after runner admission; do not mislabel manual main runs
# as executed proof for a particular PR head.
permissions:
  contents: read

concurrency:
  group: typed-callable-exact-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  full-jdk25:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head; never persist credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fail closed on checkout or tree mismatch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}' | wc -c)" -eq 41
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'JVM_HEAD=%s JVM_TREE=%s RUN=%s JOB=%s ATTEMPT=%s\n' \
            "$EXPECTED_HEAD" "$(git rev-parse 'HEAD^{tree}')" "$GITHUB_RUN_ID" "$GITHUB_JOB" "$GITHUB_RUN_ATTEMPT"
      - name: Install JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Exercise the report guard against adversarial synthetic reports
        shell: bash
        run: |
          set -euo pipefail
          java tools/ci/VerifyTypedCallableSurefire.java --self-test
      - name: Execute exact-source official JUnit engine, not synthetic probes
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp \
            -Dtest=ExplicitLambdaReturnContractTest,NamedCallableBindingSignatureTest,CallableReturnParserBoundaryTest,TypedLambdaTreeShakerContractTest \
            -DfailIfNoTests=true test
      - name: Require official JUnit XML, exact suites and at least 38 executed cases
        shell: bash
        run: |
          set -euo pipefail
          # Do not accept a verifier rewritten by a build/test step.
          test "$(git hash-object tools/ci/VerifyTypedCallableSurefire.java)" = \
               "$(git rev-parse HEAD:tools/ci/VerifyTypedCallableSurefire.java)"
          java tools/ci/VerifyTypedCallableSurefire.java target/surefire-reports
      - name: Execute full Maven verification against same exact tree
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp verify
          java tools/ci/VerifyTypedCallableSurefire.java target/surefire-reports
      - name: Verify exact source head after Maven
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet HEAD --
          printf 'JVM_VERIFIED_HEAD=%s TREE=%s\n' "$EXPECTED_HEAD" "$(git rev-parse 'HEAD^{tree}')"

  native-aot:
    needs: full-jdk25
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact PR head for source-owned AOT
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify native build source identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'AOT_HEAD=%s TREE=%s RUN=%s\n' \
            "$EXPECTED_HEAD" "$(git rev-parse 'HEAD^{tree}')" "$GITHUB_RUN_ID"
      - name: Install GraalVM JDK 25 with Native Image
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
      - name: Build real AOT launcher with no fallback
        shell: bash
        run: |
          set -euo pipefail
          native-image --version
          mvn -B -ntp -Pnative-aot -DskipTests -Dnative.image.optimization=-O0 package
          test -x target/ores-aot
      - name: Prove AOT build mode and execute positive and negative guests
        shell: bash
        run: |
          set -euo pipefail
          info="$(./target/ores-aot --build-info)"
          printf '%s\n' "$info" | jq -e '.build_mode == "aot" and .guest_execution == "interpreter-no-jit"'
          mkdir -p target/typed-callable-evidence
          cat > target/typed-callable-evidence/valid.atto <<'ATTO'
          fnc calculate(): int {
              const add = |a: int, b: int| -> int { return a + b; };
              const add2<(int, int) => int> = fnc(a: int, b: int) -> int {
                  return add(a, b);
              };
              defer || -> { stdio.println("cleanup"); };
              return add2(19, 23);
          }
          pub fnc main(): void {
              stdio.println(calculate());
              return;
          }
          ATTO
          cat > target/typed-callable-evidence/invalid.atto <<'ATTO'
          pub fnc main(): void {
              const bad<(int, int) => void> = fnc(a: int, b: int) -> int {
                  return a + b;
              };
              return;
          }
          ATTO
          # Prove the checker accepts the same valid guest before relying on
          # its rejection of the deliberately invalid callable signature.
          ./target/ores-aot --check target/typed-callable-evidence/valid.atto \
            > target/typed-callable-evidence/valid-check.stdout \
            2> target/typed-callable-evidence/valid-check.stderr
          ./target/ores-aot target/typed-callable-evidence/valid.atto \
            > target/typed-callable-evidence/actual.stdout
          printf 'cleanup\n42\n' > target/typed-callable-evidence/expected.stdout
          diff -u target/typed-callable-evidence/expected.stdout target/typed-callable-evidence/actual.stdout
          if ./target/ores-aot --check target/typed-callable-evidence/invalid.atto \
              > target/typed-callable-evidence/negative.stdout 2> target/typed-callable-evidence/negative.stderr; then
            echo 'NOT_CERTIFIED: incompatible declared callable result was accepted' >&2
            exit 1
          fi
          test -s target/typed-callable-evidence/negative.stderr
          # An unrelated CLI/permission/source failure must not pass this test.
          grep -Fq 'lambda declared return type' target/typed-callable-evidence/negative.stderr
          echo 'AOT_GUEST_EXECUTED=TRUE'
      - name: Assert exact source head remained unchanged
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet HEAD --
          printf 'AOT_GUEST_HEAD=%s TREE=%s RUN=%s\n' \
            "$EXPECTED_HEAD" "$(git rev-parse 'HEAD^{tree}')" "$GITHUB_RUN_ID"

name: Untrusted host primitives exact-head

on:
  pull_request:
    paths:
      - '.github/workflows/untrusted-host-primitives.yml'
      - 'pom.xml'
      - 'src/main/java/dev/oreslang/runtime/GuestAdmissionDeadline.java'
      - 'src/main/java/dev/oreslang/runtime/UntrustedSourceIdentity.java'
      - 'src/main/java/dev/oreslang/runtime/UntrustedSourceImageCache.java'
      - 'src/main/java/dev/oreslang/runtime/VerifiedCloseFence.java'
      - 'src/test/java/dev/oreslang/runtime/GuestAdmissionDeadlineTest.java'
      - 'src/test/java/dev/oreslang/runtime/UntrustedSourceIdentityTest.java'
      - 'src/test/java/dev/oreslang/runtime/UntrustedSourceImageCacheTest.java'
      - 'src/test/java/dev/oreslang/runtime/VerifiedCloseFenceTest.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact reviewed checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Execute four host JUnit classes
        run: >-
          mvn -B -ntp
          -Dtest=UntrustedSourceIdentityTest,UntrustedSourceImageCacheTest,VerifiedCloseFenceTest,GuestAdmissionDeadlineTest
          -DfailIfNoTests=true test
      - name: Write source-free exact-head test receipt
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          observed = subprocess.run(
              ["git", "rev-parse", "HEAD"], capture_output=True, text=True,
              check=False).stdout.strip()
          requested = (
              "UntrustedSourceIdentityTest",
              "UntrustedSourceImageCacheTest",
              "VerifiedCloseFenceTest",
              "GuestAdmissionDeadlineTest",
          )
          paths = [
              Path("target/surefire-reports/TEST-dev.oreslang.runtime." + name + ".xml")
              for name in requested
          ]
          counts = {"tests": 0, "errors": 0, "failures": 0, "skipped": 0}
          for path in paths:
              if not path.is_file():
                  continue
              root = ET.parse(path).getroot()
              for key in counts:
                  counts[key] += int(root.get(key, "0"))
          receipt = {
              "expected_head": os.environ["EXPECTED_SHA"],
              "checkout_matches_head": observed == os.environ["EXPECTED_SHA"],
              "required_report_count": len(paths),
              "present_report_count": sum(path.is_file() for path in paths),
              "full_native_isolate_tested": False,
              **counts,
          }
          receipt["verified"] = (
              receipt["checkout_matches_head"]
              and receipt["present_report_count"] == 4
              and counts["tests"] >= 12
              and counts["errors"] == 0
              and counts["failures"] == 0
              and counts["skipped"] == 0
          )
          out = Path("target/host-primitives-ci/receipt.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(receipt, sort_keys=True) + chr(10),
                         encoding="utf-8")
          print("Host JUnit evidence:", receipt)
          if not receipt["verified"]:
              raise SystemExit("exact-head host JUnit evidence incomplete or failing")
          PY
      - name: Retain only source-free JUnit receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: untrusted-host-primitives-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/host-primitives-ci/receipt.json
          if-no-files-found: error
          retention-days: 7

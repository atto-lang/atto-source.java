name: Java Native AOT and guest-GC claim admission

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/NativeBuildMode.java'
      - 'src/main/java/dev/oreslang/launcher/OresMain.java'
      - 'src/test/java/dev/oreslang/launcher/DeploymentGuaranteeAdmissionTest.java'
      - 'docs/NATIVE_DEPLOYMENT.md'
      - '.github/workflows/java-aot-gc-proof-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-only-host-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact reviewed PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact source head and tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Execute strict AOT/GC claim and mode tests
        run: |
          mvn -B -ntp -Dtest=DeploymentGuaranteeAdmissionTest,NativeBuildModeTest,ManagedReferenceBuildInfoTest -DfailIfNoTests=true test
      - name: Verify executed nonempty JUnit results
        run: |
          set -euo pipefail
          for name in DeploymentGuaranteeAdmissionTest NativeBuildModeTest ManagedReferenceBuildInfoTest; do
            report="target/surefire-reports/TEST-dev.oreslang.${name}.xml"
            case "$name" in
              DeploymentGuaranteeAdmissionTest|ManagedReferenceBuildInfoTest)
                report="target/surefire-reports/TEST-dev.oreslang.launcher.${name}.xml" ;;
              NativeBuildModeTest)
                report="target/surefire-reports/TEST-dev.oreslang.runtime.${name}.xml" ;;
            esac
            test -s "$report"
            grep -Eq 'tests="[1-9][0-9]*"' "$report"
            grep -q 'errors="0"' "$report"
            grep -q 'failures="0"' "$report"
            grep -q 'skipped="0"' "$report"
          done
          echo 'HOST/JVM CLAIM DENIAL EXECUTED; NOT GUEST MACHINE-CODE AOT OR ZERO-GC PROOF'

name: Region ownership host admission and negative compiler gate
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/RegionOwnershipGate.java'
      - 'src/main/java/dev/oreslang/runtime/DopRegionSchedule.java'
      - 'src/test/java/dev/oreslang/runtime/RegionOwnershipGateCheck.java'
      - 'scripts/test-region-ownership-gate.sh'
      - '.github/workflows/region-ownership-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
          lfs: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
      - name: Prove exact checkout and execute Java host/compile-negative checks
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain --untracked-files=all)"
          javac -version
          bash -n scripts/test-region-ownership-gate.sh
          bash scripts/test-region-ownership-gate.sh
          echo "REGION_HOST_ONLY_RECEIPT_HEAD=$expected"
          echo "REGION_HOST_ONLY_RECEIPT_TREE=$(git rev-parse 'HEAD^{tree}')"

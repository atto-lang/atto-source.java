name: Actor JNI native arena lifecycle and telemetry soak
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorNativeArena.java'
      - 'src/main/java/dev/oreslang/runtime/ActorLinearMemory.java'
      - 'src/main/c/**'
      - 'src/main/java/dev/oreslang/runtime/OresSymbol.java'
      - 'src/main/java/dev/oreslang/runtime/NativeCarrierExecutor.java'
      - 'src/test/java/dev/oreslang/runtime/ActorNativeArenaSoak.java'
      - 'scripts/verify-actor-native-arena-soak.sh'
      - '.github/workflows/native-arena-soak.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native-arena-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up JDK25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Build JNI and execute bounded arena lifetime soak
        env:
          ATTO_EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/verify-actor-native-arena-soak.sh
      - name: Evidence scope
        run: echo 'REAL JNI HOST A RENA ONLY; NO GRAAL AOT, EPSILON COLLECTION, TENANT SANDBOX OR COMPILED GUEST CERTIFICATION'

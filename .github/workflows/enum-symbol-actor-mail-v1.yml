name: AttoLang enum symbol actor mail v1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enum-symbol-actor-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
      - name: Execute real enum guest and actor transport JUnit tests
        run: >-
          mvn -B -ntp
          -Dtest=ActorNominalEnumSymbolTransportTest,EnumMatchArmSyntaxGuestTest
          -DfailIfNoTests=true test
      - name: Upload real Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enum-symbol-actor-mail-surefire
          path: target/surefire-reports/
          if-no-files-found: warn

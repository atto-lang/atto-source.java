name: AOT artifact manifest contract
on:
  push:
    paths:
      - 'contracts/v1/aot-artifact/**'
      - '.github/workflows/aot-artifact-contract.yml'
  pull_request:
    paths:
      - 'contracts/v1/aot-artifact/**'
      - '.github/workflows/aot-artifact-contract.yml'
permissions:
  contents: read
jobs:
  structural-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate strict JSON Schema and adversarial fixtures
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.26.0
          python contracts/v1/aot-artifact/test_contract.py
          python contracts/v1/aot-artifact/test_strict_json.py
          python contracts/v1/aot-artifact/test_parity_loader.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Compile pinned TypeSpec declaration
        working-directory: contracts/v1/aot-artifact
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx tsp compile .
      - name: Require generated TypeSpec and normative JSON Schema parity
        working-directory: contracts/v1/aot-artifact
        run: |
          python test_typespec_parity.py ./tsp-output

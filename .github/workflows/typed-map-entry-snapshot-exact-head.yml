name: Typed Map nominal Entry snapshot exact-head

on:
  push:
    branches:
      - 'reconcile/map-entry-snapshot-after-put-20261020'
    paths:
      - 'src/main/java/dev/oreslang/runtime/OresEntry.java'
      - 'src/main/java/dev/oreslang/runtime/OresKeyedMap.java'
      - 'src/test/java/dev/oreslang/runtime/OresEntryRuntimeTest.java'
      - 'src/test/java/dev/oreslang/runtime/OresKeyedMapNominalEntrySnapshotTest.java'
      - 'src/test/java/dev/oreslang/runtime/OresKeyedMapTest.java'
      - 'docs/MAP_ENTRY_ITERATION_CONTRACT.md'
      - '.github/workflows/typed-map-entry-snapshot-exact-head.yml'
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/OresEntry.java'
      - 'src/main/java/dev/oreslang/runtime/OresKeyedMap.java'
      - 'src/test/java/dev/oreslang/runtime/OresEntryRuntimeTest.java'
      - 'src/test/java/dev/oreslang/runtime/OresKeyedMapNominalEntrySnapshotTest.java'
      - 'src/test/java/dev/oreslang/runtime/OresKeyedMapTest.java'
      - 'docs/MAP_ENTRY_ITERATION_CONTRACT.md'
      - '.github/workflows/typed-map-entry-snapshot-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-entry-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          test -n "$SOURCE_TREE"
          printf 'Exact commit: %s\nExact tree: %s\n' "$EXPECTED_SHA" "$SOURCE_TREE" | tee -a "$GITHUB_STEP_SUMMARY"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Run nominal Entry snapshot regressions
        run: >
          mvn -B -ntp
          -Dsurefire.failIfNoSpecifiedTests=true
          -Dtest=OresKeyedMapNominalEntrySnapshotTest,OresEntryRuntimeTest,OresKeyedMapTest
          test
      - name: Verify tests did not modify tracked source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .

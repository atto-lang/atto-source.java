name: Error pattern exact-head verification
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/test/java/dev/oreslang/ErrorPattern*.java'
      - 'src/test/java/dev/oreslang/PatternMatchingHardeningTest.java'
      - '.github/workflows/error-pattern-source-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: error-pattern-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  error-pattern-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # pull_request defaults to refs/pull/N/merge, which is not the
          # exact source head that the matching regression suite must prove.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Verify exact checked source revision
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          WORKFLOW_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # This workflow does not authorize cross-repository source checkout.
          test "$SOURCE_REPO" = "$WORKFLOW_REPO"
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          printf 'source-head=%s\n' "$ACTUAL_HEAD_SHA"
          printf 'expected-head=%s\n' "$EXPECTED_HEAD_SHA"
          test "$ACTUAL_HEAD_SHA" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"
          java --version
          mvn --version
      - name: Focused matching and error-effect regression
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=ErrorPatternMatrixTest,ErrorPatternGuardPurityTest,PatternMatchingHardeningTest,ValueMatchExpressionTest,ValueMatchSuspensionTest,TypedExceptionalEffectAdmissionTest test
      - name: Full Maven verification
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp verify
      - name: Upload exact-head test reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: error-pattern-surefire-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

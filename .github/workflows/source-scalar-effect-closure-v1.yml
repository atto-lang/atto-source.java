name: Source-derived scalar effects v1
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/types/EffectContracts.java'
      - 'src/main/java/dev/oreslang/types/ScalarSourceEffectFactsV1.java'
      - 'src/test/java/dev/oreslang/ScalarSourceEffectFactsV1Test.java'
      - 'docs/SOURCE_SCALAR_EFFECT_CLOSURE_V1.md'
      - '.github/workflows/source-scalar-effect-closure-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checked-source-effect-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact tree and source files
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git hash-object src/main/java/dev/oreslang/types/EffectContracts.java
          git hash-object src/main/java/dev/oreslang/types/ScalarSourceEffectFactsV1.java
          git hash-object src/test/java/dev/oreslang/ScalarSourceEffectFactsV1Test.java
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Run checked-source positive and negative compiler tests
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=ScalarSourceEffectFactsV1Test,TypeclassesAndEffectsFoundationTest,EffectGraphAdmissionBoundaryTest,FormalEffectClosureModelCheckTest -DfailIfNoTests=true test

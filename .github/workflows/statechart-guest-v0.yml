name: Oreslang Symbol Statechart V0 guest tests

on:
  pull_request:
    paths:
      - 'stdlib/behavior/statechart.ores'
      - 'examples/statechart-symbol-*.ores'
      - 'src/test/java/dev/oreslang/StatechartGuestV0Test.java'
      - 'docs/STATECHART_GUEST_V0.md'
      - '.github/workflows/statechart-guest-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run real linked guest Statechart examples and reject invalid models
        run: mvn -B -ntp -P '!native-thread-unix' -Dtest=StatechartGuestV0Test test

name: Atto Java pipeline bang exact-head parser admission
# Source-owned only; private-source CI export remains governed by issue #65.
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/test/java/dev/oreslang/PipelineStopBangAdmissionTest.java'
      - '.github/workflows/atto-java-pipeline-bang-exact-head.yml'
  push:
    branches:
      - feat/pipeline-stop-bang-admission-20261120

permissions:
  contents: read

jobs:
  pipeline-stop-source-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head, no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact head, clean source, and reviewed Git blobs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "ATTO_SOURCE_SHA=$(git rev-parse HEAD)"
          echo "ATTO_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          for file in src/main/java/dev/oreslang/parser/Parser.java src/test/java/dev/oreslang/PipelineStopBangAdmissionTest.java; do
            test -f "$file"
            test "$(git hash-object "$file")" = "$(git rev-parse "HEAD:$file")"
            printf 'ATTO_BLOB=%s:%s\n' "$file" "$(git rev-parse "HEAD:$file")"
          done
      - name: Setup GraalVM JDK25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: graalvm
          java-version: '25'
      - name: Execute actual source parser JUnit and representative guard guest
        run: |
          set -euo pipefail
          mvn -B -ntp -DfailIfNoTests=true \
            -Dtest=PipelineStopBangAdmissionTest,AttoGuardLanguageTest \
            clean test
      - name: Verify named JUnit cases executed with no errors or skips
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          expected = {
              "dev.oreslang.PipelineStopBangAdmissionTest": {
                  "forwardAndReverseBangFormsRetainOriginalFailClosedBoundary",
                  "malformedBangSuffixCannotBeTreatedAsASeparateKeyword",
                  "gracefulStopAndStopBangRemainEquallyUnsupported",
                  "ordinaryStringsAndCommentsDoNotCreateBangOperations",
              },
              "dev.oreslang.AttoGuardLanguageTest": set(),
          }
          for suite, names in expected.items():
              report = pathlib.Path("target/surefire-reports") / ("TEST-" + suite + ".xml")
              if not report.is_file() or report.is_symlink() or not report.stat().st_size:
                  raise SystemExit(f"JUnit report missing or untrusted: {report}")
              root = ET.parse(report).getroot()
              cases = root.findall(".//testcase")
              actual = [x.attrib.get("name") for x in cases]
              totals = [int(root.attrib.get(k, "0")) for k in ("tests", "errors", "failures", "skipped")]
              if not cases or len(actual) != len(set(actual)) or not names.issubset(actual):
                  raise SystemExit(f"JUnit cases missing or duplicated: {suite}")
              if totals[0] != len(actual) or any(totals[1:]) or any(root.find(f".//{tag}") is not None for tag in ("failure", "error", "skipped")):
                  raise SystemExit(f"JUnit failure/skip/invalid totals: {suite}: {totals}")
              print(f"ATTO_JUNIT_EXECUTED={suite}:{len(cases)}")
          print("PIPE_BANG_NEGATIVE_SOURCE_GATE=EXECUTED")
          print("PIPE_BANG_TRANSPORT_RUNTIME=NOT_EXECUTED")
          PY

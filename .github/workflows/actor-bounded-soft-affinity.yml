name: Bounded actor soft affinity - exact head
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorAffinityDispatcher.java'
      - 'src/main/java/dev/oreslang/runtime/SoftLaneSelector.java'
      - 'src/test/java/dev/oreslang/runtime/SoftLaneSelectorTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorAffinitySoftSpillTest.java'
      - 'scripts/test-actor-affinity-standalone.sh'
      - 'scripts/actor-affinity/**'
      - '.github/workflows/actor-bounded-soft-affinity.yml'
permissions:
  contents: read
jobs:
  exact-locality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Assert exact branch and tree
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Production selector standalone JDK smoke
        run: bash scripts/test-actor-affinity-standalone.sh
      - name: Runtime/JUnit regression
        run: mvn -B -ntp -Dtest=SoftLaneSelectorTest,ActorAffinitySoftSpillTest,ActorAffinityDispatcherTest -DfailIfNoTests=true test

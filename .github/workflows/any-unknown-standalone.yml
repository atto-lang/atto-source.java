name: Any/Unknown standalone Java 21 type contract

on:
  push:
    branches:
      - feat/safe-any-unknown-type-contract-20261013
    paths:
      - 'src/main/java/dev/oreslang/types/Types.java'
      - 'src/test/java/dev/oreslang/types/AnyUnknownJavaSmoke.java'
      - '.github/workflows/any-unknown-standalone.yml'
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/types/Types.java'
      - 'src/test/java/dev/oreslang/types/AnyUnknownJavaSmoke.java'
      - '.github/workflows/any-unknown-standalone.yml'
  workflow_dispatch:

jobs:
  exact-source-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile checked-in Types.java without dependencies
        run: |
          mkdir -p build/any-unknown-smoke
          javac --release 21 -Xlint:all -Werror -d build/any-unknown-smoke \
            src/main/java/dev/oreslang/types/Types.java \
            src/test/java/dev/oreslang/types/AnyUnknownJavaSmoke.java
      - name: Execute type-soundness assertions
        run: |
          java -ea -cp build/any-unknown-smoke dev.oreslang.types.AnyUnknownJavaSmoke

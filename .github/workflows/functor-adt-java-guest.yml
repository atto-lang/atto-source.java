name: AttoLang nested functor ADT Java guest
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/main/java/dev/oreslang/types/OwnershipChecker.java'
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/test/java/dev/oreslang/NestedFunctorAdtGuestTest.java'
      - 'src/test/resources/atto/functor-v1/**'
      - '.github/workflows/functor-adt-java-guest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Compile and execute .atto guest ADT regression
        run: mvn -B -ntp -Dtest=NestedFunctorAdtGuestTest test
      - name: Explicit parity boundary
        if: always()
        run: echo 'Java/GraalVM JUnit guest test only; LLVM/Wasm/Forge/.NET/Native-AOT=NOT_EXECUTED'

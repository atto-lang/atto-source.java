name: Java signed-i64 inline task exact-head JDK25 JVM-only admission
on:
  push:
    branches:
      - feat/typed-task-sync-cancel-admission-v1-20261120
  pull_request:
    paths:
      - 'src/compiler/asyncv1/**'
      - 'tests/compiler/**'
      - 'fixtures/async_v1/**'
      - 'ci/async/**'
      - 'ci/admission/exact-tree.sh'
      - '.github/workflows/java-signed-i64-inline-guest.yml'

permissions:
  contents: read

jobs:
  signed-i64-jvm:
    name: JDK25 signed-i64 compiled guest admission
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ATTO_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ATTO_EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Install JDK25 without requiring GraalVM Native Image
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25'
      - name: Execute exact-tree Java compiler and JVM guest matrix
        run: bash ci/async/verify-java-signed-i64-jvm.sh

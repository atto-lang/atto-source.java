name: Derived CopyPlan v1 exact-head JVM guest tests
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/types/DerivedCopyPlanV1.java'
      - 'src/main/java/dev/oreslang/types/DerivedGraphCopyPlan.java'
      - 'src/main/java/dev/oreslang/types/GraphCopyTransaction.java'
      - 'src/main/java/dev/oreslang/types/GraphTopology.java'
      - 'src/main/java/dev/oreslang/types/CopyScalarAdmission.java'
      - 'src/main/java/dev/oreslang/types/CopyPlanCache.java'
      - 'src/test/java/dev/oreslang/CopyPlanCacheTest.java'
      - 'tests/graph-topology-host/CopyScalarAdmissionTest.java'
      - 'tests/graph-topology-host/TopologyTest.java'
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/main/java/dev/oreslang/parser/Lexer.java'
      - 'src/test/java/dev/oreslang/MoveBangAliasTest.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/test/java/dev/oreslang/DerivedGraphCopyPlanTest.java'
      - 'src/test/java/dev/oreslang/GraphCopyTransactionTest.java'
      - 'src/main/java/dev/oreslang/types/OwnershipChecker.java'
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/test/java/dev/oreslang/DerivedCopyPlanGuestTest.java'
      - 'src/test/java/dev/oreslang/CopyPolicyCompilerTest.java'
      - '.github/workflows/derived-copy-plan-exact-head.yml'
  push:
    branches: [feat/derived-copy-plan-v1-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  copy-plan-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable source head and clean source tree
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          echo "DERIVED_COPY_HEAD=$EXPECTED"
          echo "DERIVED_COPY_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Set up GraalVM 25 JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
          cache: maven
      - name: Execute exact graph topology host harness
        run: |
          set -euo pipefail
          javac -Xlint:all -Werror -d "$RUNNER_TEMP/graph-topology" \
            src/main/java/dev/oreslang/types/GraphTopology.java \
            tests/graph-topology-host/TopologyTest.java
          java -Xss256k -cp "$RUNNER_TEMP/graph-topology" TopologyTest
          echo 'GRAPH_TOPOLOGY_SCOPE=HOST_COMPONENT_ONLY'
      - name: Execute exact scalar-copy host admission harness
        run: |
          set -euo pipefail
          javac -Xlint:all -Werror -d "$RUNNER_TEMP/copy-scalar" \
            src/main/java/dev/oreslang/types/CopyScalarAdmission.java \
            tests/graph-topology-host/CopyScalarAdmissionTest.java
          java -cp "$RUNNER_TEMP/copy-scalar" CopyScalarAdmissionTest
          echo 'COPY_SCALAR_SCOPE=HOST_COMPONENT_ONLY'
      - name: Run actual type-checker and GraalVM guest-copy JUnit
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=MoveBangAliasTest,DerivedCopyPlanGuestTest,CopyPolicyCompilerTest,OwnershipAndClosureTest,DerivedGraphCopyPlanTest,GraphCopyTransactionTest,CopyPlanCacheTest -DfailIfNoTests=true -Dsurefire.failIfNoSpecifiedTests=true test
      - name: Capture executed Surefire receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find target/surefire-reports -type f -name 'TEST-*.xml' -print

name: Critical suspends Java compiler and guest verification

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/ast/**'
      - 'src/main/java/dev/oreslang/parser/**'
      - 'src/main/java/dev/oreslang/types/**'
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/main/java/dev/oreslang/nodes/CriticalTicketCleanup.java'
      - 'src/test/java/dev/oreslang/nodes/CriticalTicketCleanupTest.java'
      - 'src/main/java/dev/oreslang/runtime/CriticalGate.java'
      - 'src/test/java/dev/oreslang/Critical*Test.java'
      - 'src/test/java/dev/oreslang/TaskCaptureAdmissionIdentityTest.java'
      - 'src/test/java/dev/oreslang/runtime/CriticalGateTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorCriticalGateIdentityTest.java'
      - 'src/test/java/dev/oreslang/CriticalActorGuestExecutionTest.java'
      - 'src/test/java/dev/oreslang/ActorBorrowCompilerAdmissionTest.java'
      - 'tools/VerifyAssuranceSurefire.java'
      - 'examples/critical-actor-checked-v1.ores'
      - 'examples/critical-actor-checked-v1.atto'
      - 'examples/critical-actor-early-return-v1.ores'
      - 'examples/critical-actor-early-return-v1.atto'
      - 'src/main/java/dev/oreslang/runtime/ActorRuntime.java'
      - '.github/workflows/critical-suspends-java-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-guest-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout immutable original Java PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind tested Git tree to exact requested PR head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git diff --quiet
          echo "SOURCE_COMMIT=$EXPECTED"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile critical AST, Task authority and .ores Truffle guest tests
        run: |
          set -euo pipefail
          java tools/VerifyAssuranceSurefire.java --self-test
          mvn -B -ntp -Dores.runtime.carriers=java \
            -DfailIfNoTests=true -DskipTests=false -Dmaven.test.skip=false \
            -Dtest=CriticalBodyEffectsTest,CriticalSuspendsV1SyntaxTest,TaskCaptureAdmissionIdentityTest,CriticalGateTest,ActorCriticalGateIdentityTest,CriticalActorGuestExecutionTest,CriticalTicketCleanupTest,ActorBorrowCompilerAdmissionTest \
            clean test
          test -s target/classes/dev/oreslang/compiler/OresCompiler.class
          sha256sum target/classes/dev/oreslang/compiler/OresCompiler.class
          # Stronger than grep on XML fragments: inspect suite identity,
          # every testcase result, counts, duplicates, and exact required names.
          java tools/VerifyAssuranceSurefire.java target/surefire-reports
          # Do not emit the pass-only gate after a head drift or tracked-tree mutation.
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p target/atto-guest-evidence
          compiler_sha="$(sha256sum target/classes/dev/oreslang/compiler/OresCompiler.class | cut -d ' ' -f1)"
          fixture_sha="$(sha256sum examples/critical-actor-checked-v1.atto | cut -d ' ' -f1)"
          [[ "$compiler_sha" =~ ^[a-f0-9]{64}$ ]]
          [[ "$fixture_sha" =~ ^[a-f0-9]{64}$ ]]
          printf '{"classification":"SCOPED_SUREFIRE_CASES_OBSERVED","proof":"NOT_INDEPENDENTLY_VERIFIED","guest":"CANDIDATE_ONLY","run_id":"%s","attempt":"%s","head":"%s","tree":"%s","job":"%s","compiler_class_sha256":"%s","fixture_sha256":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "$GITHUB_JOB" \
            "$compiler_sha" "$fixture_sha" \
            > target/atto-guest-evidence/suite-gate-completed.json
      - name: Record scoped exact-head Java/Truffle guest canary evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD"
          mkdir -p target/atto-guest-evidence
          printf '{"classification":"JVM_TRUFFLE_ATTO_GUEST_CANDIDATE_UNVERIFIED","proof":"NOT_INDEPENDENTLY_VERIFIED","native_aot":"NOT_EXECUTED","actor_borrow_refinement":"NOT_EXECUTED","source_head":"%s","source_tree":"%s","run_id":"%s","attempt":"%s","job":"%s"}\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" \
            > target/atto-guest-evidence/checkout.json
          sha256sum examples/critical-actor-checked-v1.atto \
            examples/critical-actor-early-return-v1.atto \
            > target/atto-guest-evidence/fixture-sha256.txt
          if test -s target/classes/dev/oreslang/compiler/OresCompiler.class; then
            sha256sum target/classes/dev/oreslang/compiler/OresCompiler.class \
              > target/atto-guest-evidence/compiler-class-sha256.txt
          fi
          if test -s target/surefire-reports/TEST-dev.oreslang.CriticalActorGuestExecutionTest.xml; then
            cp target/surefire-reports/TEST-dev.oreslang.CriticalActorGuestExecutionTest.xml \
              target/atto-guest-evidence/
          fi
      - name: Upload scoped evidence without asserting proof before independent verification
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: java-truffle-atto-guest-source-only-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/atto-guest-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Mark evidence scope
        run: |
          echo "Scoped Java admission/host-ticket tests plus Truffle polyglot actor-critical guest fixture."
          echo "JVM-hosted Graal/Truffle guest suite included; Native Image/AOT and cross-backend parity remain unverified."

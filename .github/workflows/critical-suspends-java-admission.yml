name: Critical suspends Java compiler and guest verification

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/ast/**'
      - 'src/main/java/dev/oreslang/parser/**'
      - 'src/main/java/dev/oreslang/types/**'
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/main/java/dev/oreslang/runtime/CriticalGate.java'
      - 'src/test/java/dev/oreslang/Critical*Test.java'
      - 'src/test/java/dev/oreslang/runtime/CriticalGateTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorCriticalGateIdentityTest.java'
      - 'src/test/java/dev/oreslang/CriticalActorGuestExecutionTest.java'
      - 'examples/critical-actor-checked-v1.ores'
      - 'examples/critical-actor-early-return-v1.ores'
      - 'src/main/java/dev/oreslang/runtime/ActorRuntime.java'
      - '.github/workflows/critical-suspends-java-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-guest-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind tested Git tree to exact requested PR head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git diff --quiet
          echo "SOURCE_COMMIT=$EXPECTED"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile critical AST/effects/gate tests and native .ores Graal guest fixture
        run: |
          set -euo pipefail
          mvn -B -ntp -Dores.runtime.carriers=java \
            -Dtest=CriticalBodyEffectsTest,CriticalSuspendsV1SyntaxTest,CriticalGateTest,ActorCriticalGateIdentityTest,CriticalActorGuestExecutionTest \
            test
          test -s target/classes/dev/oreslang/compiler/OresCompiler.class
          sha256sum target/classes/dev/oreslang/compiler/OresCompiler.class
      - name: Mark evidence scope
        run: |
          echo "Scoped Java host-ticket tests plus native Graal actor critical guest fixture."
          echo "Graal actor-critical guest fixture was included; cross-backend parity remains unverified."

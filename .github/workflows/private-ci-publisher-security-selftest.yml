name: private-ci publisher security self-test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/publish-private-ci-source.py'
      - 'scripts/publish-private-ci-source-v3.py'
      - 'scripts/test-publish-private-ci-source.py'
      - 'scripts/test-publish-private-ci-source-v3.py'
      - 'scripts/test-private-ci-destination.sh'
      - '.github/workflows/private-ci-publisher-security-selftest.yml'
  push:
    branches:
      - main
      - security/private-ci-fail-closed-current-main-20261020
    paths:
      - 'scripts/publish-private-ci-source.py'
      - 'scripts/publish-private-ci-source-v3.py'
      - 'scripts/test-publish-private-ci-source.py'
      - 'scripts/test-publish-private-ci-source-v3.py'
      - 'scripts/test-private-ci-destination.sh'
      - '.github/workflows/private-ci-publisher-security-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-ci-publisher-selftest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publisher-security-selftest:
    # Never execute a fork's PR-head code in a private-source checkout.
    # Same-repository branches remain eligible for exact-head testing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact branch or PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 --version
      - name: Test production fail-closed export gate
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN
          python3 -I -S scripts/test-publish-private-ci-source.py -k real_gate
      - name: Run full offline publisher adversarial suite
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN
          python3 -I -S scripts/test-publish-private-ci-source.py
          python3 -I -S scripts/test-publish-private-ci-source-v3.py
          bash scripts/test-private-ci-destination.sh


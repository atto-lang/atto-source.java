name: Private CI destination policy self-test
on:
  pull_request:
    paths:
      - 'scripts/check-private-ci-destination.sh'
      - 'scripts/test-private-ci-destination.sh'
      - 'scripts/run-in-private-ci-destination.sh'
      - 'scripts/publish-private-ci-source.py'
      - 'scripts/test-publish-private-ci-source.py'
      - 'scripts/test-private-ci-merged-main.py'
      - 'scripts/test-private-ci-review-coverage.py'
      - '.github/workflows/private-ci-mirror-preflight.yml'
      - '.github/private-ci-approved-repositories.txt'
      - '.github/CODEOWNERS'
      - 'docs/security/CI_PRIVATE_SOURCE_MIRRORING.md'
      - 'tools/verify-exact-source-tree.sh'
      - 'tools/test-verify-exact-source-tree.sh'
  push:
    paths:
      - 'scripts/check-private-ci-destination.sh'
      - 'scripts/test-private-ci-destination.sh'
      - 'scripts/run-in-private-ci-destination.sh'
      - 'scripts/publish-private-ci-source.py'
      - 'scripts/test-publish-private-ci-source.py'
      - 'scripts/test-private-ci-merged-main.py'
      - 'scripts/test-private-ci-review-coverage.py'
      - '.github/workflows/private-ci-mirror-preflight.yml'
      - '.github/private-ci-approved-repositories.txt'
      - '.github/CODEOWNERS'
      - 'docs/security/CI_PRIVATE_SOURCE_MIRRORING.md'
      - 'tools/verify-exact-source-tree.sh'
      - 'tools/test-verify-exact-source-tree.sh'
permissions:
  contents: read
jobs:
  preflight-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Assert private CI guard fail-closed behavior
        run: |
          set -euo pipefail
          bash -n scripts/check-private-ci-destination.sh scripts/test-private-ci-destination.sh scripts/run-in-private-ci-destination.sh
          python3 -m py_compile scripts/publish-private-ci-source.py scripts/test-publish-private-ci-source.py scripts/test-private-ci-merged-main.py scripts/test-private-ci-review-coverage.py
          python3 -B scripts/test-private-ci-review-coverage.py
          bash scripts/test-private-ci-destination.sh
          bash -n tools/verify-exact-source-tree.sh tools/test-verify-exact-source-tree.sh
          bash tools/test-verify-exact-source-tree.sh
          for attempt in 1 2 3; do
            echo "Private publisher adversarial pass ${attempt}/3"
            python3 -B scripts/test-publish-private-ci-source.py
          done
          # This separate module is also imported through load_tests above.
          # Run it explicitly so CI logs and evidence always show its verdict.
          python3 -B scripts/test-private-ci-merged-main.py

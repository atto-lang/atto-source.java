name: Private CI destination policy self-test
on:
  pull_request:
    paths:
      - 'scripts/check-private-ci-destination.sh'
      - 'scripts/test-private-ci-destination.sh'
      - 'scripts/run-in-private-ci-destination.sh'
      - 'scripts/publish-private-ci-source.py'
      - 'scripts/test-publish-private-ci-source.py'
      - 'scripts/ci_private_mirror_preflight.py'
      - 'tests/test_ci_private_mirror_preflight.py'
      - 'scripts/test-native-actor-exact-tree-ci.sh'
      - 'scripts/test-private-ci-security-offline.sh'
      - '.github/private-ci-approved-repositories.txt'
      - '.github/CODEOWNERS'
      - 'docs/security/CI_PRIVATE_SOURCE_MIRRORING.md'
  push:
    paths:
      - 'scripts/check-private-ci-destination.sh'
      - 'scripts/test-private-ci-destination.sh'
      - 'scripts/run-in-private-ci-destination.sh'
      - 'scripts/publish-private-ci-source.py'
      - 'scripts/test-publish-private-ci-source.py'
      - 'scripts/ci_private_mirror_preflight.py'
      - 'tests/test_ci_private_mirror_preflight.py'
      - 'scripts/test-native-actor-exact-tree-ci.sh'
      - 'scripts/test-private-ci-security-offline.sh'
      - '.github/private-ci-approved-repositories.txt'
      - '.github/CODEOWNERS'
      - 'docs/security/CI_PRIVATE_SOURCE_MIRRORING.md'
permissions:
  contents: read
jobs:
  preflight-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Assert private CI guard fail-closed behavior
        run: |
          set -euo pipefail
          sh scripts/test-private-ci-security-offline.sh
          # Repeat the publisher's randomized TOCTOU checks without writing
          # bytecode caches into the clean source checkout.
          export PYTHONDONTWRITEBYTECODE=1
          for attempt in 2 3; do
            echo "Private publisher adversarial repeat ${attempt}/3"
            python3 -B scripts/test-publish-private-ci-source.py
          done

name: Java persistence sidecar host contract (not guest parity)
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/persistence/**'
      - 'src/test/java/dev/oreslang/runtime/persistence/**'
      - 'scripts/test-batch-persistence-sidecar-host.sh'
      - '.github/workflows/persistence-sidecar-java-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-reference-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Host-only byte ownership, fencing and batching contract
        run: bash scripts/test-batch-persistence-sidecar-host.sh

name: ownership-integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/main/java/dev/oreslang/types/**"
      - "src/main/java/dev/oreslang/nodes/**"
      - "src/main/java/dev/oreslang/runtime/**"
      - "src/test/java/dev/oreslang/**"
      - "docs/formal/OwnershipCarrierHandoff*"
      - ".github/workflows/ownership-integration.yml"
      - "scripts/verify-ownership-tlc.sh"

permissions:
  contents: read

concurrency:
  group: ownership-integration-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  integrated-front-end-and-runtime:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'audit/integrated-ownership-effects-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Exact source commit: $EXPECTED_SHA"
          git ls-files -z | xargs -0 sha256sum > /tmp/ownership-source-manifest.sha256
          sha256sum /tmp/ownership-source-manifest.sha256
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Admission, borrow, reduction and cancellation regression gates
        run: |
          mvn -B -ntp -Dores.runtime.carriers=native \
            -Dtest=AutomaticLoopBorrowAdmissionTest,AutomaticLoopEffectAdmissionTest,IntegratedOwnershipAdmissionGateTest,OwnershipSuspensionAuditTest,OwnershipFiftyProgramBoundaryMatrixTest,UntrustedActorBorrowBoundaryMatrixTest,BorrowedOperandSuspensionAuditTest,BlockingChannelEffectMatrixTest,CriticalConsoleAndNoBlockAuditTest,OwnershipEffectAuditTest,SourceCriticalActorStateTest,SourceSerialActorStateTest,SourceLoopSoftPreemptionTest,SourceSealedStateReductionIntegrationTest,SourceContinuationSingleDeliveryTest,SourceBoundaryTraceTest,SelectSourceFlowSafetyTest,AsyncAwaitLanguageTest,AsyncChannelBoundaryTest,DynamicSelectOptionLanguageTest,SourceActorOutputStreamExecutionTest,ActorContinuationTeardownTest,OresFutureCallbackTest,ActorBorrowSuspensionInterleavingTest,FormalBorrowReductionBoundaryModelTest \
            test
      - name: Verify full source suite
        run: mvn -B -ntp -Dores.runtime.carriers=native verify

  formal-ownership-tlc:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'audit/integrated-ownership-effects-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact TLC source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Safe model and two counterexample mutations
        run: bash scripts/verify-ownership-tlc.sh

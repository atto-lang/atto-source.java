name: Verified readonly structural guest 84 (Java)
on:
  push:
    branches:
      - feature/readonly-shape-projection-parity-v1-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-structural-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact source identity
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Compile and execute actual Truffle guest and typed witness tests
        run: mvn -B -ntp -Dtest=ReadonlyShapeGuest84Test,ReadonlyShapeProjectionV1Test test

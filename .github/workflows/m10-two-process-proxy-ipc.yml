name: M10 restricted Atto source actor across two OS processes (JVM)
on:
  push:
    paths:
      - 'src/m6/AttoM6Runtime.java'
      - 'src/m10/**'
      - 'src/compiler/m10/**'
      - 'tests/m10/**'
      - 'fixtures/m10/**'
      - 'ci/m10/**'
      - '.github/workflows/m10-two-process-proxy-ipc.yml'
  pull_request:
    paths:
      - 'src/m6/AttoM6Runtime.java'
      - 'src/m10/**'
      - 'src/compiler/m10/**'
      - 'tests/m10/**'
      - 'fixtures/m10/**'
      - 'ci/m10/**'
      - '.github/workflows/m10-two-process-proxy-ipc.yml'
permissions:
  contents: read
jobs:
  m10-atto-source-to-jvm-two-process:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile restrictive .atto guest and prove independent-process delivery
        shell: bash
        run: |
          set -euo pipefail
          ATTO_EXPECTED_HEAD_SHA="$(git rev-parse HEAD)" bash ci/m10/verify-remote-actor-ipc-jvm.sh

name: Neuron protected-state parser and loan-contract gate

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/ast/Ast.java'
      - 'src/main/java/dev/oreslang/ast/AnnotationExpander.java'
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/main/java/dev/oreslang/runtime/ActorStateReadWriteLoans.java'
      - 'src/test/java/dev/oreslang/NeuronActorV0Test.java'
      - 'src/test/java/dev/oreslang/runtime/ActorStateReadWriteLoansTest.java'
      - '.github/workflows/neuron-state-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuron-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  neuron-state-host-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind source head and source tree to receipt
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "NEURON_STATE_HEAD=$EXPECTED_HEAD"
          echo "NEURON_STATE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Prepare GraalVM Java toolchain
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Run protected-state AST and host-only loan-contract JUnit cases
        run: |
          set -euo pipefail
          mvn -B -ntp '-Dtest=NeuronActorV0Test,ActorStateReadWriteLoansTest' test
          echo "NEURON_STATE_HOST_TESTS_EXECUTED=1"

      # Important: this is a compiler/host contract gate only, not a guest
      # inference receipt. Neuron guest emission remains fail-closed until
      # handle_state MIR and borrow checking are actually implemented.

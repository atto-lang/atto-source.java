name: durable-m0-compiler

on:
  push:
    branches: ["feat/durable-m0-*"]
  pull_request:
    paths:
      - "src/main/java/dev/oreslang/compiler/Durable*.java"
      - "src/test/java/dev/oreslang/Durable*.java"
      - "src/test/java/dev/oreslang/AttoSourceExtensionTest.java"
      - "src/test/java/dev/oreslang/launcher/AttoCliSourceExtensionTest.java"
      - "src/test/resources/fixtures/durable/*.atto"
      - "src/main/java/dev/oreslang/launcher/OresMain.java"
      - "src/main/java/dev/oreslang/config/OresProjectConfig.java"
      - "src/main/java/dev/oreslang/interop/MixedSourceUnit.java"
      - "pom.xml"
      - "docs/DURABLE_ACTIVITY_WORKFLOW_DECLARATIONS_V1.md"
      - ".github/workflows/durable-m0-compiler.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durable-m0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-semantics:
    name: durable-m0-java-junit-not-guest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Fail closed on source mismatch
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo "EXACT_SOURCE_HEAD=$EXPECTED_HEAD"
          echo "EXACT_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "DURABLE_M0_GATE=G1_COMPILER_ONLY_NOT_GUEST"

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Toolchain receipt
        shell: bash
        run: |
          set -euo pipefail
          java --version
          native-image --version
          mvn --version

      - name: Compile and execute durable M0 JUnit tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp '-Dtest=DurableActivityWorkflowDeclarationTest,DurableWorkflowSemanticAnalysisTest,AttoSourceExtensionTest,AttoCliSourceExtensionTest' test

      - name: Verify nonzero executed JUnit cases and report counts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(target/surefire-reports/TEST-dev.oreslang.Durable*Test.xml
                   target/surefire-reports/TEST-dev.oreslang.AttoSourceExtensionTest.xml
                   target/surefire-reports/TEST-dev.oreslang.launcher.AttoCliSourceExtensionTest.xml)
          if (( ${#reports[@]} != 4 )); then
            printf 'Expected 4 AttoLang JUnit XML reports, found %s\n' "${#reports[@]}" >&2
            exit 1
          fi
          total=0
          failed=0
          errors=0
          skipped=0
          for report in "${reports[@]}"; do
            test -s "$report"
            # Surefire testsuite attributes occur on the opening element.
            for attribute in tests failures errors skipped; do
              value="$(grep -o -m1 "${attribute}=\"[0-9]*\"" "$report" | head -n1 | cut -d '"' -f2)"
              [[ "$value" =~ ^[0-9]+$ ]] || exit 1
              case "$attribute" in
                tests) total=$((total + value)) ;;
                failures) failed=$((failed + value)) ;;
                errors) errors=$((errors + value)) ;;
                skipped) skipped=$((skipped + value)) ;;
              esac
            done
          done
          echo "DURABLE_M0_JUNIT|tests=$total|failures=$failed|errors=$errors|skipped=$skipped"
          if (( total < 33 || failed != 0 || errors != 0 || skipped != 0 )); then
            echo "Durable M0 JUnit not fully executed/passing" >&2
            exit 1
          fi

      - name: Preserve exact-head JUnit receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: durable-m0-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/TEST-dev.oreslang.Durable*Test.xml
            target/surefire-reports/dev.oreslang.Durable*Test.txt
            target/surefire-reports/TEST-dev.oreslang.AttoSourceExtensionTest.xml
            target/surefire-reports/dev.oreslang.AttoSourceExtensionTest.txt
            target/surefire-reports/TEST-dev.oreslang.launcher.AttoCliSourceExtensionTest.xml
            target/surefire-reports/dev.oreslang.launcher.AttoCliSourceExtensionTest.txt
          if-no-files-found: warn
          retention-days: 30

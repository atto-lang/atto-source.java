name: durable-m0-compiler

on:
  push:
    branches: ["feat/durable-m0-*"]
  pull_request:
    paths:
      - "src/main/java/dev/oreslang/compiler/Durable*.java"
      - "src/test/java/dev/oreslang/Durable*.java"
      - "docs/DURABLE_ACTIVITY_WORKFLOW_DECLARATIONS_V1.md"
      - ".github/workflows/durable-m0-compiler.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durable-m0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-semantics:
    name: durable-m0-java-junit-not-guest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Fail closed on source mismatch
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo "EXACT_SOURCE_HEAD=$EXPECTED_HEAD"
          echo "EXACT_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "DURABLE_M0_GATE=G1_COMPILER_ONLY_NOT_GUEST"

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Toolchain receipt
        shell: bash
        run: |
          set -euo pipefail
          java --version
          native-image --version
          mvn --version

      - name: Compile and execute durable M0 JUnit tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp '-Dtest=DurableActivityWorkflowDeclarationTest,DurableWorkflowSemanticAnalysisTest' test

      - name: Verify nonzero executed JUnit cases and report counts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          paths = sorted(glob.glob("target/surefire-reports/TEST-dev.oreslang.Durable*Test.xml"))
          if len(paths) != 2:
              raise SystemExit(f"Expected 2 exact durable JUnit XML reports, found {len(paths)}: {paths}")
          total = failed = errors = skipped = 0
          for path in paths:
              root = ET.parse(path).getroot()
              total += int(root.attrib.get("tests", 0))
              failed += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))
          print(f"DURABLE_M0_JUNIT|tests={total}|failures={failed}|errors={errors}|skipped={skipped}")
          if total < 28 or failed or errors or skipped:
              raise SystemExit("Durable M0 JUnit not fully executed/passing")
          PY

      - name: Preserve exact-head JUnit receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: durable-m0-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/TEST-dev.oreslang.Durable*Test.xml
            target/surefire-reports/dev.oreslang.Durable*Test.txt
          if-no-files-found: warn
          retention-days: 30

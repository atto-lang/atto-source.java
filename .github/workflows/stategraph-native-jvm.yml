name: StateGraph Java native guest admission
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  stategraph-graal-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Build real Java Oreslang compiler / launcher
        run: |
          mvn -B -ntp -DskipTests package
          mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile=target/conformance-classpath.txt
      - name: Execute StateGraph scalar, branch and nominal guest candidates
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/test-stategraph-native-jvm.sh

name: Tensor2D source-native guest admission
on:
  pull_request:
    paths:
      - 'stdlib/tensor.ores'
      - 'examples/native-tensor2d-admission.ores'
      - 'formal/tensor/**'
      - '.github/workflows/tensor2d-guest-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  big-int-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run independent BigInt reference checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node --test formal/tensor/tensor2d-reference.test.mjs
  real-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Compile and execute real Oreslang tensor guest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          mvn -B -ntp -DskipTests compile
          mvn -B -ntp exec:java -Dexec.args="examples/native-tensor2d-admission.ores" | tee "${RUNNER_TEMP}/tensor-guest.out"
          grep -Fx 'TENSOR2D-GUEST-ADMISSION-OK' "${RUNNER_TEMP}/tensor-guest.out"

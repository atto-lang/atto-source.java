name: AttoLang named callable Java/Graal exact-head guest gate

on:
  push:
    branches: [audit/product-call-contract-20261026]
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/parser/**'
      - 'src/main/java/dev/oreslang/types/**'
      - 'src/main/java/dev/oreslang/ast/**'
      - 'src/test/java/dev/oreslang/NamedArgumentAndRecordSpreadTest.java'
      - 'src/test/java/dev/oreslang/ClassCallableProductBindingTest.java'
      - 'src/test/java/dev/oreslang/GenericNamedOptionalCallTest.java'
      - 'pom.xml'
      - '.github/workflows/named-call-java-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  named-call-java-guest:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout immutable same-org PR head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source commit and tree
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo "ATTO_NAMED_JAVA_HEAD=$EXPECTED_SHA"
          echo "ATTO_NAMED_JAVA_TREE=$(git rev-parse 'HEAD^{tree}')"

      - name: Setup supported GraalVM 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Execute actual parser, typecheck, ownership and Graal guest JUnit
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp \
            -Dtest=NamedArgumentAndRecordSpreadTest,ClassCallableProductBindingTest,GenericNamedOptionalCallTest \
            -DfailIfNoTests=true \
            test
          for suite in NamedArgumentAndRecordSpreadTest ClassCallableProductBindingTest GenericNamedOptionalCallTest; do
            report="target/surefire-reports/TEST-dev.oreslang.${suite}.xml"
            test -s "$report"
            grep -q '<testcase ' "$report"
            echo "ATTO_NAMED_JAVA_EXECUTED_SUITE=$suite"
          done

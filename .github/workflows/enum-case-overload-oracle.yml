name: Enum case overload oracle
on:
  pull_request:
    paths:
      - 'docs/ENUM_CASE_OVERLOAD_SPECIALIZATION.md'
      - 'src/main/java/dev/oreslang/types/EnumCaseOverloadPolicy.java'
      - 'src/main/java/dev/oreslang/types/EnumCaseSourceBindings.java'
      - 'src/main/java/dev/oreslang/types/EnumCaseSourceCallPlan.java'
      - 'src/main/java/dev/oreslang/ast/EnumV2Migration.java'
      - 'src/main/java/dev/oreslang/types/EnumTag32Plan.java'
      - 'src/main/java/dev/oreslang/ast/Ast.java'
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/test/java/dev/oreslang/Enum*.java'
      - 'contracts/v2/**'
      - '.github/workflows/enum-case-overload-oracle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relation-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Compile real parser, migration and offline enum binding regression suites
        run: |
          mvn -B -ntp -Dores.runtime.carriers=native \
            -Dtest=EnumFrontendMainRebaseTest,EnumFrontendRootAdmissionTest,EnumCaseSourceBindingsTest,EnumCaseSourceCallPlanTest,EnumCaseOverloadPolicyTest,EnumCaseAstBoundaryAuditTest,EnumV2MigrationTest,EnumTag32SchemaVisibilityTest,EnumNullaryStagedLiteralBindingTest \
            test
      - name: Compile isolated Java policy under strict warnings
        run: |
          mkdir -p /tmp/ores-enum-policy
          javac --release 21 -Xlint:all -Werror -d /tmp/ores-enum-policy src/main/java/dev/oreslang/types/EnumCaseOverloadPolicy.java
      - name: Exhaustively check overload relation against finite oracle
        run: |
          python3 -B -m unittest discover -s contracts/v2 -p 'test_enum_case_*.py' -v
          python3 -B -O -m unittest discover -s contracts/v2 -p 'test_enum_case_*.py' -v

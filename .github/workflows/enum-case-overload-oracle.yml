name: Enum case overload oracle
on:
  pull_request:
    paths:
      - 'docs/ENUM_CASE_OVERLOAD_SPECIALIZATION.md'
      - 'src/main/java/dev/oreslang/types/EnumCaseOverloadPolicy.java'
      - 'src/test/java/dev/oreslang/EnumCaseOverloadPolicyTest.java'
      - 'contracts/v2/test_enum_case_overlap_model.py'
      - '.github/workflows/enum-case-overload-oracle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relation-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Exhaustively check overload relation against finite oracle
        run: |
          python3 -B -m unittest discover -s contracts/v2 -p 'test_enum_case_overlap_model.py' -v
          python3 -B -O -m unittest discover -s contracts/v2 -p 'test_enum_case_overlap_model.py' -v

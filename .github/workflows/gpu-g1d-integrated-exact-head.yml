name: AttoLang GPU G1d integrated exact-head JUnit (source/host only)

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/ast/Ast.java'
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/main/java/dev/oreslang/compiler/Gpu*.java'
      - 'src/test/java/dev/oreslang/Gpu*.java'
      - 'src/test/java/dev/oreslang/AttoGpuExplicitLaunchAdmissionTest.java'
      - '.github/workflows/gpu-g1d-integrated-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-pr-head-g1d-junit:
    name: Exact PR head GPU source/host JUnit (NOT physical GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head (not synthetic merge ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify exact source HEAD and create nonpromoting receipt
        shell: bash
        env:
          GPU_EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GPU_RUN_ID: ${{ github.run_id }}
          GPU_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GPU_EXPECTED_PR_HEAD" || {
            echo "GPU_G1D_FAIL: wrong checkout head" >&2
            exit 1
          }
          receipt="$RUNNER_TEMP/gpu-g1d-exact-head.txt"
          {
            printf 'evidence_class JAVA_COMPILER_JUNIT_SOURCE_AND_HOST_ONLY\n'
            printf 'gpu_guest_executed false\nphysical_gpu_executed false\n'
            printf 'compiler_gpu_dispatch_proven false\n'
            printf 'git_head %s\n' "$actual"
            printf 'git_tree %s\n' "$(git rev-parse HEAD^{tree})"
            printf 'workflow_run_id %s\nworkflow_run_attempt %s\n' "$GPU_RUN_ID" "$GPU_RUN_ATTEMPT"
            git show --format='git_parent %P' --no-patch HEAD
            java -version 2>&1
            mvn -version
          } | tee "$receipt"

      - name: Run exact-head compiler and integrated GPU source JUnit
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp \
            '-Dtest=AttoGpuExplicitLaunchAdmissionTest,GpuLaunchGeometryTest,GpuLaunchSourceHirV1Test,GpuKernelSourceHirV1Test,GpuKernelTailGuardV1Test,GpuKernelSourceLinkV1Test,GpuKernelSourceCapacityJoinV1Test,GpuKernelTypedSourceArgsV1Test,GpuKernelTypedSourceControlFlowV1Test,GpuKernelTypecheckEntryPointsV1Test,GpuLaunchFootprintsTest,GpuLaunchFootprintsPropertyTest,GpuKernelCapacityPreflightV1Test' \
            test

      - name: Upload source/host JUnit receipt and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-g1d-junit-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gpu-g1d-exact-head.txt
            target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 7

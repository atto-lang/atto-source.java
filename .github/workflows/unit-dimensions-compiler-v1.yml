name: Compile-time dimension algebra v1
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/types/UnitDimensions.java'
      - 'src/test/java/dev/oreslang/UnitDimensionsTest.java'
      - 'docs/UNIT_DIMENSIONS_AOT_V1.md'
      - '.github/workflows/unit-dimensions-compiler-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler-dimension-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git hash-object src/main/java/dev/oreslang/types/UnitDimensions.java
          git hash-object src/test/java/dev/oreslang/UnitDimensionsTest.java
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Execute actual bounded algebra JUnit tests
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=UnitDimensionsTest -DfailIfNoTests=true test

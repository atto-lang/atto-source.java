# Private source stays in its own source repository. This is actual linked .atto
# JIT guest execution, not a host arithmetic checksum or parser-only test.
name: AttoLang DOP Java scalar JIT guest exact-head
on:
  pull_request:
    paths:
      - 'contracts/dop-scalar-guest-v1/**'
      - 'src/test/java/dev/oreslang/DopScalarGuestParityTest.java'
      - 'scripts/ci/DopGuestJUnitReceiptVerifier.java'
      - '.github/workflows/dop-scalar-java-guest.yml'
      - 'src/main/java/**'
      - 'pom.xml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scalar-dop-java-jit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install JDK 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: checkout-head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          fixture='contracts/dop-scalar-guest-v1/soa-int-update.atto'
          test -f "$fixture" && test ! -L "$fixture"
          test "$(git hash-object "$fixture")" = 'aedc778e3e8dd2940600f047540c159b0129830a'
          printf 'ATTO_DOP_JAVA_HEAD=%s TREE=%s FIXTURE_BLOB=%s\n' \
            "$EXPECTED_HEAD" "$(git rev-parse 'HEAD^{tree}')" "$(git hash-object "$fixture")"
      - name: Run independent source-free JUnit evidence validator tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dop-junit-verifier"
          javac -Xlint:all -Werror -d "$RUNNER_TEMP/dop-junit-verifier" \
            scripts/ci/DopGuestJUnitReceiptVerifier.java
          timeout 30s java -cp "$RUNNER_TEMP/dop-junit-verifier" \
            DopGuestJUnitReceiptVerifier --self-test
      - name: Compile source compiler and JUnit guest harness
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests test-compile
          test -f target/classes/dev/oreslang/compiler/IncrementalCompiler.class
          test -f target/classes/dev/oreslang/runtime/LinkedProgramRunner.class
          compiler_tree_digest="$(find target/classes -type f -name '*.class' -print0 \
            | LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | awk '{print $1}')"
          test "${#compiler_tree_digest}" -eq 64
          printf '%s\n' "$compiler_tree_digest" > "$RUNNER_TEMP/dop-junit-verifier/compiler-class-tree.sha256"
          printf 'DOP_JIT_COMPILER_CLASS_TREE_SHA256=%s\n' "$compiler_tree_digest"
      - name: compile-guest
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"
          mvn -B -ntp             '-Dtest=DopScalarGuestParityTest#canonicalSoaGuestCompilerAdmissionDoesNotRequireExecuting'             -DfailIfNoTests=true test
          test -s target/surefire-reports/TEST-dev.oreslang.DopScalarGuestParityTest.xml
          cp target/surefire-reports/TEST-dev.oreslang.DopScalarGuestParityTest.xml             "$RUNNER_TEMP/dop-junit-verifier/compile-guest.junit.xml"
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"
      - name: execute-guest
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"
          mvn -B -ntp \
            '-Dtest=DopScalarGuestParityTest#identicalScalarSoaSourceCompilesAndReturnsZeroFromRealJitGuest+incorrectGuestChecksumIsDetectedByActualCompiledExecution' \
            -DfailIfNoTests=true test
          test -s "$RUNNER_TEMP/dop-junit-verifier/compile-guest.junit.xml"
          java -cp "$RUNNER_TEMP/dop-junit-verifier" \
            DopGuestJUnitReceiptVerifier "$EXPECTED_HEAD" target/surefire-reports
          test -s "$RUNNER_TEMP/dop-junit-verifier/compiler-class-tree.sha256"
          compiler_tree_after="$(find target/classes -type f -name '*.class' -print0 \
            | LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | awk '{print $1}')"
          test "$compiler_tree_after" = "$(cat "$RUNNER_TEMP/dop-junit-verifier/compiler-class-tree.sha256")"
          printf 'DOP_JIT_COMPILER_CLASS_TREE_SHA256_FINAL=%s\n' "$compiler_tree_after"
          java_bin="$(readlink -f "$(command -v java)")"
          report='target/surefire-reports/TEST-dev.oreslang.DopScalarGuestParityTest.xml'
          test -f "$java_bin" && test -x "$java_bin" && test ! -L "$java_bin"
          test -f "$report" && test ! -L "$report" && test -s "$report"
          printf 'DOP_JIT_RUNTIME_BINARY_SHA256=%s\n' "$(sha256sum "$java_bin" | awk '{print $1}')"
          printf 'DOP_JIT_JUNIT_REPORT_SHA256=%s\n' "$(sha256sum "$report" | awk '{print $1}')"
          printf 'DOP_JIT_RUNTIME_VERSION=%s\n' "$(java -version 2>&1 | head -n 1)"
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ATTO_DOP_JAVA_JIT_GUEST_EXECUTED_WITH_VERIFIED_TWO_CASE_REPORT head=$EXPECTED_HEAD"
      - name: Retain exact-case JUnit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atto-dop-java-jit-two-case-junit
          path: target/surefire-reports/*DopScalarGuestParityTest*
          if-no-files-found: warn

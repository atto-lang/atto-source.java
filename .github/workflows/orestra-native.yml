name: Orestra native Oreslang integration
on:
  push:
    branches: ["feat/orestra-native-fixtures-*"]
  pull_request:
    paths:
      - "src/test/java/dev/oreslang/OrestraNativeSourceIntegrationTest.java"
      - "src/test/resources/orestra-mirror/**"
      - ".github/workflows/orestra-native.yml"
permissions:
  contents: read
jobs:
  graal-linked:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Compile and run actual reviewed Orestra sources
        run: mvn -B -ntp -Dtest=OrestraNativeSourceIntegrationTest test

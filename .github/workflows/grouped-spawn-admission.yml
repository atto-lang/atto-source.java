name: Grouped spawn admission (host only)
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorSpawn*.java'
      - 'src/main/java/dev/oreslang/runtime/ActorStartupSchema.java'
      - 'src/test/java/dev/oreslang/runtime/ActorSpawnAdmissionSmoke.java'
      - 'src/test/java/dev/oreslang/runtime/ActorSpawnLiveReceiveSmoke.java'
      - '.github/workflows/grouped-spawn-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify head and execute host lifecycle
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'head=%s tree=%s\n' "$EXPECTED_HEAD" "$(git rev-parse HEAD^{tree})"
          mkdir -p target/grouped-spawn-admission
          javac --release 21 -Xlint:all -Werror -d target/grouped-spawn-admission src/main/java/dev/oreslang/runtime/ActorSpawnAdmission.java src/main/java/dev/oreslang/runtime/ActorSpawnChargePlan.java src/main/java/dev/oreslang/runtime/ActorSpawnReservation.java src/main/java/dev/oreslang/runtime/ActorStartupSchema.java src/test/java/dev/oreslang/runtime/ActorSpawnAdmissionSmoke.java src/test/java/dev/oreslang/runtime/ActorSpawnLiveReceiveSmoke.java
          java -cp target/grouped-spawn-admission dev.oreslang.runtime.ActorSpawnAdmissionSmoke
          java -cp target/grouped-spawn-admission dev.oreslang.runtime.ActorSpawnLiveReceiveSmoke

name: Inferred scalar select JVM guest (restricted profile)
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/test/java/dev/oreslang/TypedDefaultSelectGuestTest.java'
      - '.github/workflows/inferred-scalar-select-guest.yml'
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: '25'
          distribution: 'graalvm'
      - name: Verify exact head and run focused guest regressions
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD^{tree}
          mvn -B -ntp -Dtest=TypedDefaultSelectGuestTest -Dsurefire.failIfNoSpecifiedTests=true test

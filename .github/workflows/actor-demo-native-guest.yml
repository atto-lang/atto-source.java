name: Actor step demo native Graal guest
on:
  push:
    branches:
      - feat/actor-step-source-guest-baseline-20261028
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-guest-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact committed source checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git ls-files 'src/test/resources/parity/step-demo-v1/*.ores' | wc -l)" -eq 14
          # Four actor-step fixtures + fourteen canonical demo fixtures.
          test "$(git ls-files 'src/test/resources/parity/actor-*.ores' | wc -l)" -eq 4
          test "$(git hash-object src/test/resources/parity/actor-coordinator-fork-join.ores)" = "80b8da1ba193b30137efa122d94f30b52dae7d46"
          echo "NATIVE_GUEST_SOURCE_HEAD=$EXPECTED_SHA"
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Compile and execute eighteen real Oreslang guest cases
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-native-guest-reports.mjs
          mkdir -p target
          git rev-parse HEAD > target/native-guest-provenance.txt
          java -version 2>> target/native-guest-provenance.txt
          mvn -B -ntp -Dtest=SourceActorStepWorkflowExecutionTest,SourceActorDemoWorkflowExecutionTest test 2>&1 | tee target/native-guest-maven.log
          java scripts/VerifyNativeGuestReports.java target/surefire-reports
      - name: Preserve compiler and guest evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actor-native-guest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/
            target/native-guest-provenance.txt
            target/native-guest-maven.log
          if-no-files-found: warn
          retention-days: 7

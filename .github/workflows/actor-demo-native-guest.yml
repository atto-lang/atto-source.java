name: Actor step demo native Graal guest
on:
  push:
    branches:
      - feat/actor-step-source-guest-baseline-20261028
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-guest-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact committed source checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git ls-files 'src/test/resources/parity/step-demo-v1/*.ores' | wc -l)" -eq 14
          # Four actor-step fixtures + fourteen canonical demo fixtures.
          test "$(git ls-files 'src/test/resources/parity/actor-*.ores' | wc -l)" -eq 4
          test "$(git hash-object src/test/resources/parity/actor-coordinator-fork-join.ores)" = "9470d82a3180744c28abe9f890545b9bafdb2110"
          echo "NATIVE_GUEST_SOURCE_HEAD=$EXPECTED_SHA"
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Compile and execute eighteen real Oreslang guest cases
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -B -ntp -Dtest=SourceActorStepWorkflowExecutionTest,SourceActorDemoWorkflowExecutionTest test
          test -s target/surefire-reports/TEST-dev.oreslang.SourceActorStepWorkflowExecutionTest.xml
          test -s target/surefire-reports/TEST-dev.oreslang.SourceActorDemoWorkflowExecutionTest.xml
          # Surefire can generate valid XML for partial test selection or skips.
          # Require the exact expected executed case totals, and no errors/failures/skips.
          for suite in \
            target/surefire-reports/TEST-dev.oreslang.SourceActorStepWorkflowExecutionTest.xml \
            target/surefire-reports/TEST-dev.oreslang.SourceActorDemoWorkflowExecutionTest.xml; do
            for zero in errors failures skipped; do
              grep -Eq "$zero=\"0\"" "$suite"
            done
          done
          grep -Eq 'tests="4"' target/surefire-reports/TEST-dev.oreslang.SourceActorStepWorkflowExecutionTest.xml
          grep -Eq 'tests="14"' target/surefire-reports/TEST-dev.oreslang.SourceActorDemoWorkflowExecutionTest.xml
          echo 'NATIVE_GUEST_EXECUTED_WITH_REAL_COMPILER cases=18'

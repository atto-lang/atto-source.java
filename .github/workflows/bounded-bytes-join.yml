name: Bounded Bytes join runtime and guest regression
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/OresBytes.java'
      - 'src/main/java/dev/oreslang/runtime/BoundedByteAccumulator.java'
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/test/java/dev/oreslang/AttoBytesCodecGuestTest.java'
      - 'src/test/java/dev/oreslang/runtime/BoundedByteAccumulatorTest.java'
      - '.github/workflows/bounded-bytes-join.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bytes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse HEAD HEAD^{tree}
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: "25.3"
          java-version: "25"
          distribution: graalvm
      - name: Runtime regression tests, not performance scores
        run: mvn -B -ntp -Dtest=BoundedByteAccumulatorTest,OresBytesBinaryCodecTest,OresBytesNioResp2Test,AttoBytesCodecGuestTest -Dsurefire.failIfNoSpecifiedTests=true test

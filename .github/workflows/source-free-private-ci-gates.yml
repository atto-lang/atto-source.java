name: Source-free private CI gate regression
on:
  pull_request:
    paths:
      - 'scripts/check-private-ci-destination.sh'
      - 'scripts/test-private-ci-destination.sh'
      - 'scripts/run-in-private-ci-destination.sh'
      - 'scripts/publish-private-ci-source*.py'
      - 'scripts/nio_verify_raw_worktree.py'
      - 'tests/test_nio_raw_worktree_link_aliases.py'
      - '.github/private-ci-approved-repositories.txt'
      - '.github/workflows/source-free-private-ci-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
# This job must never receive write credentials or private-source export secrets.
# CI execution is not authorization for source transfer.
jobs:
  policy-negative-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify mainline destination allowlist is empty
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/private-ci-approved-repositories.txt')
          entries = [line.strip() for line in path.read_text().splitlines() if line.strip() and not line.lstrip().startswith('#')]
          if entries:
              raise SystemExit('DENIED: active private-source destinations require separate independent authorization')
          print('PASS: no active private-source destinations')
          PY
      - name: Reject unauthorized destinations without publishing
        run: bash scripts/test-private-ci-destination.sh
      - name: Verify source-free publisher regression fixtures
        run: |
          python3 scripts/test-publish-private-ci-source.py
          python3 scripts/test-publish-private-ci-source-v3.py
      - name: Verify exact-tree link-alias regression from committed blobs
        run: |
          set -euo pipefail
          verifier=scripts/nio_verify_raw_worktree.py
          test_path=tests/test_nio_raw_worktree_link_aliases.py
          verifier_blob="$(git rev-parse --verify "HEAD:$verifier")"
          test_blob="$(git rev-parse --verify "HEAD:$test_path")"
          test "$(git hash-object --no-filters -- "$verifier")" = "$verifier_blob"
          test "$(git hash-object --no-filters -- "$test_path")" = "$test_blob"
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          mkdir -p "$tmp/scripts" "$tmp/tests"
          git cat-file blob "$verifier_blob" > "$tmp/scripts/nio_verify_raw_worktree.py"
          git cat-file blob "$test_blob" > "$tmp/tests/test_nio_raw_worktree_link_aliases.py"
          python3 -I -B "$tmp/tests/test_nio_raw_worktree_link_aliases.py"

name: Source-free private CI gate regression
on:
  pull_request:
    paths:
      - 'scripts/check-private-ci-destination.sh'
      - 'scripts/test-private-ci-destination.sh'
      - 'scripts/run-in-private-ci-destination.sh'
      - 'scripts/publish-private-ci-source*.py'
      - '.github/private-ci-approved-repositories.txt'
      - '.github/workflows/source-free-private-ci-gates.yml'
      - 'tests/private-ci-v3-codeowners.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
# This job must never receive write credentials or private-source export secrets.
# CI execution is not authorization for source transfer.
jobs:
  policy-negative-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact source PR-head checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Verify mainline destination allowlist is empty
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/private-ci-approved-repositories.txt')
          # Use the same deny-all byte grammar as the V3 CODEOWNERS policy
          # regression. Whitespace-prefixed pseudo-comments are NOT comments.
          raw = path.read_bytes()
          if not raw or len(raw) > 16384 or any(c != 10 and not 32 <= c <= 126 for c in raw):
              raise SystemExit('DENIED: noncanonical private-source destination policy bytes')
          entries = [line for line in raw.split(b'\n') if line and not line.startswith(b'#')]
          if entries:
              raise SystemExit('DENIED: active or malformed private-source destination policy entries')
          print('PASS: no active private-source destinations')
          PY
      - name: Reject unauthorized destinations without publishing
        run: bash scripts/test-private-ci-destination.sh
      - name: Verify source-free publisher regression fixtures
        run: |
          python3 scripts/test-publish-private-ci-source.py
          python3 scripts/test-publish-private-ci-source-v3.py

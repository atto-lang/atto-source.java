name: DOP owned CPU + graph exact-head verification

on:
  push:
    branches:
      - integration/dop-owned-cpu-execution-graph-20261016
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dop-owned-graph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-owned-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source commit in the same private repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Assert original repo, commit and clean input tree
        id: provenance
        shell: bash
        env:
          EXPECTED: ${{ github.sha }}
          EXPECTED_REPO_ID: '1400792274'
          ACTUAL_REPO_ID: ${{ github.repository_id }}
          SOURCE_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$ACTUAL_REPO_ID" = "$EXPECTED_REPO_ID"
          test "$SOURCE_PRIVATE" = true
          test "$GITHUB_REPOSITORY" = 'ores-truffle-oreslang/oreslang-source.java'
          test "$(git remote get-url origin | sed -E 's#^https://github.com/##; s#\.git$##')" = 'ores-truffle-oreslang/oreslang-source.java'
          git diff --quiet
          install -d -m 700 "$RUNNER_TEMP/dop-graph-evidence"
          {
            printf 'DOP_GRAPH_SOURCE_HEAD=%s\n' "$(git rev-parse HEAD)"
            printf 'DOP_GRAPH_SOURCE_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'DOP_GRAPH_REPOSITORY=%s\n' "$GITHUB_REPOSITORY"
            printf 'DOP_GRAPH_EVENT=%s\n' "$GITHUB_EVENT_NAME"
            printf 'DOP_GRAPH_RUNTIME_BLOB=%s\n' "$(git hash-object src/main/java/dev/oreslang/runtime/DopGraphCpuIntegrationV1.java)"
            printf 'DOP_GRAPH_EXECUTION_BLOB=%s\n' "$(git hash-object src/main/java/dev/oreslang/runtime/ExecutionGraphV1.java)"
            printf 'DOP_GRAPH_TEST_BLOB=%s\n' "$(git hash-object src/test/java/dev/oreslang/runtime/DopGraphCpuIntegrationV1Test.java)"
            printf '%s\n' 'DOP_GRAPH_SCOPE=host-only owned F32 CPU region and independent I64 graph'
          } > "$RUNNER_TEMP/dop-graph-evidence/provenance.txt"
      - name: Install Java 21 for standalone source assertions
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Planner and owned-region standalone assertions
        run: bash scripts/test-dop-planner-standalone.sh
      - name: Compile and test actual Maven project (DOP and graph)
        run: mvn -B -ntp -Dtest='Dop*,ExecutionGraphV1Test,ExecutionGraphChannelV1Test,ExecutionSurfaceV1Test' -DfailIfNoTests=true test
      - name: Verify exact integration and scheduler-admission regressions executed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          report = pathlib.Path('target/surefire-reports/TEST-dev.oreslang.runtime.DopGraphCpuIntegrationV1Test.xml')
          if not report.is_file():
              raise SystemExit('Missing exact DOP integration Surefire XML')
          root = ET.parse(report).getroot()
          required = {
              'zeroRowOwnedCpuGraphCompletesWithoutAccessingStorage',
              'emptySliceOfPopulatedBufferDoesNotTouchOtherRows',
              'inlineExecutorFailsBeforeTouchingOwnedStorage',
              'inlineThenThrowReportsSchedulerRejectionNotInlineError',
              'startedWorkerCannotWriteIfSchedulerRejectsAfterEnqueue',
          }
          methods = {node.attrib.get('name') for node in root.iter('testcase')}
          if not required.issubset(methods):
              raise SystemExit('Missing executed DOP admission/integration regressions: ' + repr(sorted(required - methods)))
          for field in ('failures', 'errors', 'skipped'):
              if int(root.attrib.get(field, '0')) != 0:
                  raise SystemExit('DOP integration contains nonpassing cases: ' + field)
          if int(root.attrib.get('tests', '0')) < len(required):
              raise SystemExit('Impossible DOP integration test count')

          graph_report = pathlib.Path('target/surefire-reports/TEST-dev.oreslang.runtime.ExecutionGraphV1Test.xml')
          if not graph_report.is_file():
              raise SystemExit('Missing exact ExecutionGraphV1 Surefire XML')
          graph_root = ET.parse(graph_report).getroot()
          graph_required = {
              'inlineExecutorIsRejectedBeforeCpuEvaluation',
              'inlineThenThrowPreservesSchedulerRejection',
              'startedWorkerCannotPublishIfSchedulerRejectsAfterStart',
              'duplicateExecutorDispatchHasExactlyOneTerminalPublication',
              'cancelledQueuedFutureNeverExecutesOrPublishes',
          }
          graph_methods = {node.attrib.get('name') for node in graph_root.iter('testcase')}
          if not graph_required.issubset(graph_methods):
              raise SystemExit('Missing executed graph admission regressions: ' + repr(sorted(graph_required - graph_methods)))
          for field in ('failures', 'errors', 'skipped'):
              if int(graph_root.attrib.get(field, '0')) != 0:
                  raise SystemExit('ExecutionGraphV1 contains nonpassing cases: ' + field)
          print('Verified executed DOP and standalone graph scheduler-admission regressions in Surefire XML')
          PY
      - name: Record passing exact-head test suite
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/dop-graph-evidence/provenance.txt"
          printf 'DOP_GRAPH_TESTS=PASS\nDOP_GRAPH_TARGET=Dop*,ExecutionGraphV1Test,ExecutionGraphChannelV1Test,ExecutionSurfaceV1Test\n' > "$RUNNER_TEMP/dop-graph-evidence/test-outcome.txt"
      - name: Retain bounded provenance and JUnit reports inside source repository
        if: ${{ always() && steps.provenance.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, pinned
        with:
          name: dop-owned-graph-java-evidence
          path: |
            ${{ runner.temp }}/dop-graph-evidence/provenance.txt
            ${{ runner.temp }}/dop-graph-evidence/test-outcome.txt
            target/surefire-reports/*.xml
          if-no-files-found: error
          retention-days: 7

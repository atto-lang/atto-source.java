name: Compiled Atto timed microbenchmark smoke
on:
  pull_request:
    paths:
      - 'tests/fixtures/sharkbench-microbench/**'
      - '.github/workflows/atto-timed-guest-microbench.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: "25.3"
          java-version: "25"
          distribution: graalvm
      - name: Execute actual timed guest forks (diagnostics only)
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tests/fixtures/sharkbench-microbench/run-timed.sh "$EXPECTED" "$(git rev-parse 'HEAD^{tree}')" "$RUNNER_TEMP/atto-timed"
      - name: Print raw diagnostic receipt on success
        run: cat "$RUNNER_TEMP/atto-timed/identity.txt" "$RUNNER_TEMP/atto-timed/"*.json

name: java-package-namespace-linker
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/ast/Ast.java'
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/main/java/dev/oreslang/imports/ImportRules.java'
      - 'src/main/java/dev/oreslang/compiler/ImportGraph.java'
      - 'src/main/java/dev/oreslang/compiler/IncrementalCompiler.java'
      - 'src/main/java/dev/oreslang/compiler/PackageNamespaceLinker.java'
      - 'src/main/java/dev/oreslang/runtime/LinkedProgramRunner.java'
      - 'src/main/java/dev/oreslang/runtime/PinnedNamespaceProgramRunner.java'
      - 'src/main/java/dev/oreslang/runtime/PinnedNamespacePackageInventory.java'
      - 'src/test/java/dev/oreslang/PinnedNamespacePackageInventoryTest.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/test/java/dev/oreslang/PinnedNamespaceRuntimeTest.java'
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/test/java/dev/oreslang/PackageNamespaceLinkerTest.java'
      - 'docs/PACKAGE_LOCAL_NAMESPACE_PHASE1.md'
      - '.github/workflows/java-package-namespace-linker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-namespace-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head before tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "EXACT_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile parser/linker and execute exact-head regression suite
        run: mvn -B -Dtest=PackageNamespaceLinkerTest,PinnedNamespaceRuntimeTest,PinnedNamespacePackageInventoryTest,ImportSelectorSyntaxTest test

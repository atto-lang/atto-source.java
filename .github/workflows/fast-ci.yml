name: fast-ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify read-only Actions triage unit tests
        run: python3 -m unittest discover -s tests -p 'test_ci_run_triage.py' -v
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify compiler/runtime tests
        run: mvn -B -ntp -Dores.runtime.carriers=native verify
      - name: Run examples
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/showcase.ores"
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/modules-namespaces-callables.ores"
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/async-await.ores" | tee /tmp/oreslang-async-await.out
          grep -F "144" /tmp/oreslang-async-await.out
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/callables.ores" | tee /tmp/oreslang-callables.out
          grep -F "120:9:13" /tmp/oreslang-callables.out
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/native-testing-harness-guards.ores"
          timeout 180s mvn -B -ntp -DskipTests exec:java -Dexec.args="tests/test_std_harness_regressions.ores" | tee /tmp/ores-harness-regressions-jit.out
          grep -Fqx "ORES_TEST|SUMMARY|total=30|passed=30|failed=0|skipped=0|filtered=0" /tmp/ores-harness-regressions-jit.out
          test "$(grep -c '^ORES_TEST|PASS|native-testing-core/' /tmp/ores-harness-regressions-jit.out)" -eq 30
          test "$(grep -c '^ORES_TEST|SUMMARY|' /tmp/ores-harness-regressions-jit.out)" -eq 1
          test "$(grep -c '^ORES_TEST|' /tmp/ores-harness-regressions-jit.out)" -eq 31
          timeout 180s mvn -B -ntp -DskipTests exec:java -Dexec.args="tests/test_std_harness_scalar_parity_batch4.ores" | tee /tmp/ores-harness-scalar-jit.out
          grep -Fqx "ORES_TEST|SUMMARY|total=24|passed=24|failed=0|skipped=0|filtered=0" /tmp/ores-harness-scalar-jit.out
          test "$(grep -c '^ORES_TEST|PASS|compiler-scalar-parity-batch4/' /tmp/ores-harness-scalar-jit.out)" -eq 24
          test "$(grep -c '^ORES_TEST|SUMMARY|' /tmp/ores-harness-scalar-jit.out)" -eq 1
          test "$(grep -c '^ORES_TEST|' /tmp/ores-harness-scalar-jit.out)" -eq 25
          timeout 180s mvn -B -ntp -DskipTests exec:java -Dexec.args="tests/test_std_harness_meta_batch4.ores" | tee /tmp/ores-harness-meta-jit.out
          grep -Fqx "ORES_TEST|SUMMARY|total=12|passed=12|failed=0|skipped=0|filtered=0" /tmp/ores-harness-meta-jit.out
          test "$(grep -c '^ORES_TEST|PASS|harness-meta-batch4/' /tmp/ores-harness-meta-jit.out)" -eq 12
          test "$(grep -c '^ORES_TEST|SUMMARY|' /tmp/ores-harness-meta-jit.out)" -eq 1
          test "$(grep -c '^ORES_TEST|' /tmp/ores-harness-meta-jit.out)" -eq 13
          timeout 180s mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/native-testing-regressions-40.ores" | tee /tmp/ores-regressions-40-fast-jit.out
          grep -Fqx "ORES_TEST|SUMMARY|total=40|passed=40|failed=0|skipped=0|filtered=0" /tmp/ores-regressions-40-fast-jit.out
          test "$(grep -c '^ORES_TEST|PASS|stdlib/' /tmp/ores-regressions-40-fast-jit.out)" -eq 40
          test "$(grep -c '^ORES_TEST|SUMMARY|' /tmp/ores-regressions-40-fast-jit.out)" -eq 1
          test "$(grep -c '^ORES_TEST|' /tmp/ores-regressions-40-fast-jit.out)" -eq 41
          timeout 180s mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/native-testing-runner-matrix.ores" | tee /tmp/ores-runner-matrix-fast-jit.out
          grep -Fqx "ORES_TEST_RUNNER_MATRIX_OK|cases=12" /tmp/ores-runner-matrix-fast-jit.out
          test "$(grep -c '^ORES_TEST_RUNNER_MATRIX_OK|' /tmp/ores-runner-matrix-fast-jit.out)" -eq 1
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/native-testing.ores" | tee /tmp/oreslang-native-testing.out
          grep -Fx "ORES_TEST|SUMMARY|total=4|passed=3|failed=0|skipped=1|filtered=0" /tmp/oreslang-native-testing.out
          test "$(grep -c '^ORES_TEST|SUMMARY|' /tmp/oreslang-native-testing.out)" -eq 1
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/native-testing-semantics.ores" | tee /tmp/oreslang-native-testing-semantics.out
          grep -Fx "ORES_TEST|SUMMARY|total=1|passed=1|failed=0|skipped=0|filtered=2" /tmp/oreslang-native-testing-semantics.out
          grep -Fx "ORES_TEST|SUMMARY|total=2|passed=1|failed=1|skipped=0|filtered=0" /tmp/oreslang-native-testing-semantics.out
          test "$(grep -c '^ORES_TEST|SUMMARY|' /tmp/oreslang-native-testing-semantics.out)" -eq 2

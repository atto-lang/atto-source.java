name: Strict filesystem completion I/O

on:
  pull_request:
    paths:
      - 'src/main/c/oresuring.c'
      - 'scripts/build-native-thread.sh'
      - 'src/main/java/dev/oreslang/runtime/StrictFileIoProvider.java'
      - 'src/main/java/dev/oreslang/runtime/LinuxUringFileIoProvider.java'
      - 'src/main/java/dev/oreslang/runtime/RuntimePermissions.java'
      - 'src/main/java/dev/oreslang/runtime/OresContext.java'
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/main/resources/META-INF/native-image/dev.oreslang/oreslang/reachability-metadata.json'
      - 'src/test/java/dev/oreslang/runtime/LinuxUringFileIoProviderTest.java'
      - 'src/test/java/dev/oreslang/runtime/AsyncNativeIoTest.java'
      - 'src/test/java/dev/oreslang/runtime/RuntimePermissionsTest.java'
      - 'tools/strict-filesystem-io-audit.py'
      - 'docs/STRICT_FILESYSTEM_IO.md'
      - '.github/workflows/strict-filesystem-io.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/c/oresuring.c'
      - 'scripts/build-native-thread.sh'
      - 'src/main/java/dev/oreslang/runtime/StrictFileIoProvider.java'
      - 'src/main/java/dev/oreslang/runtime/LinuxUringFileIoProvider.java'
      - 'src/main/java/dev/oreslang/runtime/RuntimePermissions.java'
      - 'src/main/java/dev/oreslang/runtime/OresContext.java'
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/main/resources/META-INF/native-image/dev.oreslang/oreslang/reachability-metadata.json'
      - 'src/test/java/dev/oreslang/runtime/LinuxUringFileIoProviderTest.java'
      - 'src/test/java/dev/oreslang/runtime/AsyncNativeIoTest.java'
      - 'src/test/java/dev/oreslang/runtime/RuntimePermissionsTest.java'
      - 'tools/strict-filesystem-io-audit.py'
      - 'docs/STRICT_FILESYSTEM_IO.md'
      - '.github/workflows/strict-filesystem-io.yml'

permissions:
  contents: read

jobs:
  strict-filesystem:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Audit strict filesystem reachability
        run: python3 tools/strict-filesystem-io-audit.py
      - name: Compile native io_uring bridge with strict warnings
        run: bash scripts/build-native-thread.sh
      - name: Compile Java and tests
        run: mvn -B -ntp -DskipTests test
      - name: Execute provider lifecycle and kernel completion tests
        run: mvn -B -ntp -Dtest=LinuxUringFileIoProviderTest test
      - name: Execute strict permission regression
        run: mvn -B -ntp '-Dtest=RuntimePermissionsTest#strictFilesystemAdmissionIsLexicalScopedAndDenyFirst' test
      - name: Execute async filesystem integration regression
        run: mvn -B -ntp '-Dtest=AsyncNativeIoTest#strictFilesystemReadWriteAppendAndExistsCompleteWithoutWorkerFallback' test
      - name: Validate Native Image JNI metadata
        run: mvn -B -ntp -Pnative-aot -DskipTests package

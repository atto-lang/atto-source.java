name: Shared UNTRUSTED Graal isolate E2E
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/untrusted-isolate-e2e.yml'
      - 'pom.xml'
      - 'src/main/java/dev/oreslang/**'
      - 'src/test/java/dev/oreslang/**'
      - 'docs/ACTOR_HEAP_ISOLATION.md'

permissions:
  contents: read

jobs:
  host-admission:
    name: Host source must fail closed
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify host-only source admission and tests not requiring an isolate
        run: >
          mvn -B -ntp
          -Dtest=SourceActorSpawnExecutionTest,IsolationHotReloadTest,SharedUntrustedIsolatePoolTest
          test

  native-isolate-e2e:
    name: Real shared language isolate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
          components: native-image
      - name: Build Oreslang language isolate shared library
        run: mvn -B -ntp -DskipTests -Pnative-isolate package
      - name: Require a native-image isolate artifact (no interpreter fallback)
        run: |
          set -eu
          test -s target/liboresvm.so
          file target/liboresvm.so
      - name: Execute physically isolated actor and hot-reload tests without skip
        env:
          ORES_TEST_SHARED_UNTRUSTED_ISOLATE: 'true'
        run: |
          set -eu
          mvn -B -ntp \
            -DargLine="-Dpolyglot.engine.IsolateLibrary=${PWD}/target/liboresvm.so" \
            -Dtest=SharedUntrustedIsolatePoolTest,UntrustedJitCodeUnitTest \
            test
      - name: Report actually executed integration tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          files = glob.glob('target/surefire-reports/TEST-*Isolate*Test.xml')
          files += glob.glob('target/surefire-reports/TEST-*UntrustedJitCodeUnitTest.xml')
          seen = set()
          enabled = 0
          for file in files:
              if file in seen:
                  continue
              seen.add(file)
              root = ET.parse(file).getroot()
              enabled += int(root.get('tests', '0')) - int(root.get('skipped', '0'))
          print('Executed isolate-related tests:', enabled)
          if not seen or enabled == 0:
              raise SystemExit('no isolate integration tests were executed')
          PY

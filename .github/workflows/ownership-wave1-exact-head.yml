# Same source repository only. Never export private source to external CI.
# Zero assigned runners / zero steps means NOT_EXECUTED, not a test result.
name: AttoLang ownership Wave 1 exact-head compiler/guest
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/types/OwnershipChecker.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/test/java/dev/oreslang/PointerlessFncOwnershipTest.java'
      - 'src/test/java/dev/oreslang/StaticBorrowEscapeBoundaryTest.java'
      - 'src/test/java/dev/oreslang/ProjectedMethodReceiverLoanTest.java'
      - 'src/test/java/dev/oreslang/PrimitiveBorrowCopyTest.java'
      - 'src/test/java/dev/oreslang/SharedBorrowContractTest.java'
      - 'src/test/java/dev/oreslang/AttoOwnershipWave1GuestTest.java'
      - 'src/test/java/dev/oreslang/TernaryArmTypeSoundnessTest.java'
      - 'src/test/resources/atto/ownership-wave1/**'
      - 'src/test/resources/borrow-contract.tsv'
      - 'scripts/ci/OwnershipWave1ReceiptVerifier.java'
      - 'scripts/ci/ownership-wave1-required-methods-v1.txt'
      - '.github/workflows/ownership-wave1-exact-head.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ownership-wave1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  ownership-junit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure GraalVM and JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Prove exact source commit and tree were checked out
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "ATTO_OWNERSHIP_WAVE1_COMMIT=$(git rev-parse HEAD)"
          echo "ATTO_OWNERSHIP_WAVE1_TREE=$(git rev-parse 'HEAD^{tree}')"
          java -version
          mvn -version
      - name: Compile and test JDK-only strict ownership receipt verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atto-wave1-receipt"
          javac -Xlint:all -Werror -d "$RUNNER_TEMP/atto-wave1-receipt" scripts/ci/OwnershipWave1ReceiptVerifier.java
          java -cp "$RUNNER_TEMP/atto-wave1-receipt" OwnershipWave1ReceiptVerifier \
            --self-test scripts/ci/ownership-wave1-required-methods-v1.txt
      - name: Execute ownership, primitive-copy and ternary type-soundness JUnit tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dores.runtime.carriers=native -DfailIfNoTests=true \
            -Dtest=PointerlessFncOwnershipTest,StaticBorrowEscapeBoundaryTest,ProjectedMethodReceiverLoanTest,PrimitiveBorrowCopyTest,SharedBorrowContractTest,AttoOwnershipWave1GuestTest,TernaryArmTypeSoundnessTest \
            test
      - name: Verify exact-head ownership Surefire methods without synthetic promotion
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          java -cp "$RUNNER_TEMP/atto-wave1-receipt" OwnershipWave1ReceiptVerifier \
            "$EXPECTED_HEAD" "$(git rev-parse 'HEAD^{tree}')" \
            scripts/ci/ownership-wave1-required-methods-v1.txt \
            target/surefire-reports
          echo "ATTO_WAVE1_EXECUTED_JUNIT_METHODS=103"
      - name: Full project Maven regression
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dores.runtime.carriers=native verify

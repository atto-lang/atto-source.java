name: Actor critical MIR and compiled receive (MAIN NOT EXECUTED)
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/compiler/ActorCriticalStateMirV1.java'
      - 'src/main/java/dev/oreslang/compiler/VerifiedCriticalStateActorGuestV1.java'
      - 'src/main/java/dev/oreslang/compiler/ActorCriticalStatePreflight.java'
      - 'src/main/java/dev/oreslang/compiler/PackageNamespaceBuild.java'
      - 'src/main/java/dev/oreslang/types/ActorReceiverBinder.java'
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/test/java/dev/oreslang/ActorCriticalStateSyntaxV2Test.java'
      - 'src/test/java/dev/oreslang/ActorCriticalStateGuestV1Test.java'
      - 'src/test/java/dev/oreslang/ExternalActorRuntimeIngressSyntaxTest.java'
      - 'contracts/declared-actor-stateful-counter-v2/**'
      - '.github/workflows/actor-critical-mir-junit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typed-mir-and-compiled-receive-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA before toolchain installation
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "SOURCE_HEAD=$SOURCE_SHA"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Compile and execute typed MIR, ingress and real mailbox tests
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -B -ntp -Dtest=ActorCriticalStateSyntaxV2Test,ExternalActorRuntimeIngressSyntaxTest,ActorCriticalStateGuestV1Test -DfailIfNoTests=true -Dsurefire.failIfNoSpecifiedTests=true test
          test -f target/surefire-reports/TEST-dev.oreslang.ActorCriticalStateSyntaxV2Test.xml
          test -f target/surefire-reports/TEST-dev.oreslang.ExternalActorRuntimeIngressSyntaxTest.xml
          test -f target/surefire-reports/TEST-dev.oreslang.ActorCriticalStateGuestV1Test.xml
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path("target/surefire-reports")
          names = ["ActorCriticalStateSyntaxV2Test", "ExternalActorRuntimeIngressSyntaxTest", "ActorCriticalStateGuestV1Test"]
          total = 0
          for name in names:
              p = root / f"TEST-dev.oreslang.{name}.xml"
              xml = ET.parse(p).getroot()
              t = int(xml.attrib.get("tests", "0"))
              total += t
              for k in ("errors", "failures", "skipped"):
                  if int(xml.attrib.get(k, "0")):
                      raise SystemExit(f"{name} has {k} != 0")
              if not t:
                  raise SystemExit(f"{name} executed zero tests")
          print(f"ATTO_ACTOR_CRITICAL_RECEIVE_JUNIT_PASS tests={total} SOURCE_MIR_MAILBOX_EXECUTED=true FULL_ATTO_MAIN_EXECUTED=false")
          PY

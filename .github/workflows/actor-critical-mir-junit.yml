name: Actor critical MIR and compiled receive (MAIN NOT EXECUTED)
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/ast/Ast.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/main/java/dev/oreslang/runtime/ActorRuntime.java'
      - 'src/main/java/dev/oreslang/runtime/SharedCodeImageStore.java'
      - 'pom.xml'
      - 'scripts/build-native-thread.sh'
      - 'src/main/java/dev/oreslang/compiler/ActorDeclaredMainLinkV1.java'
      - 'src/main/java/dev/oreslang/compiler/ActorCriticalStateMirV1.java'
      - 'src/main/java/dev/oreslang/compiler/VerifiedCriticalStateActorGuestV1.java'
      - 'src/main/java/dev/oreslang/compiler/ActorCriticalStatePreflight.java'
      - 'src/main/java/dev/oreslang/compiler/PackageNamespaceBuild.java'
      - 'src/main/java/dev/oreslang/types/ActorReceiverBinder.java'
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/test/java/dev/oreslang/ActorCriticalStateSyntaxV2Test.java'
      - 'src/test/java/dev/oreslang/ActorCriticalStateGuestV1Test.java'
      - 'src/test/java/dev/oreslang/ExternalActorRuntimeIngressSyntaxTest.java'
      - 'contracts/declared-actor-stateful-counter-v2/**'
      - '.github/workflows/actor-critical-mir-junit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typed-mir-and-compiled-receive-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA before toolchain installation
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "SOURCE_HEAD=$SOURCE_SHA"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Compile and execute typed MIR, ingress and real mailbox tests
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -B -ntp -Dtest=ActorCriticalStateSyntaxV2Test,ExternalActorRuntimeIngressSyntaxTest,ActorCriticalStateGuestV1Test -DfailIfNoTests=true -Dsurefire.failIfNoSpecifiedTests=true test
          test -f target/surefire-reports/TEST-dev.oreslang.ActorCriticalStateSyntaxV2Test.xml
          test -f target/surefire-reports/TEST-dev.oreslang.ExternalActorRuntimeIngressSyntaxTest.xml
          test -f target/surefire-reports/TEST-dev.oreslang.ActorCriticalStateGuestV1Test.xml
          # Fail closed if a test class vanishes, a test is skipped, or the
          # pinned minimum suite shrinks. No Python or test-code override.
          total=0
          for item in 'ActorCriticalStateSyntaxV2Test:18' 'ExternalActorRuntimeIngressSyntaxTest:3' 'ActorCriticalStateGuestV1Test:7'; do
            name="${item%%:*}"
            minimum="${item##*:}"
            report="target/surefire-reports/TEST-dev.oreslang.${name}.xml"
            test -f "$report" || { echo "Missing JUnit result: $report" >&2; exit 1; }
            header="$(grep -m1 -E '^<testsuite[[:space:]]' "$report")" || {
              echo "Missing testsuite root for $name" >&2; exit 1;
            }
            declare -A counts=()
            for key in tests failures errors skipped; do
              if [[ ! "$header" =~ [[:space:]]${key}=\"([0-9]+)\" ]]; then
                echo "Missing or malformed $key result for $name" >&2; exit 1
              fi
              counts[$key]="${BASH_REMATCH[1]}"
            done
            if (( 10#${counts[tests]} < minimum || 10#${counts[failures]} != 0 || 10#${counts[errors]} != 0 || 10#${counts[skipped]} != 0 )); then
              echo "JUnit gate failed for $name: tests=${counts[tests]} failures=${counts[failures]} errors=${counts[errors]} skipped=${counts[skipped]}" >&2
              exit 1
            fi
            total=$((total + 10#${counts[tests]}))
            unset counts
            echo "ATTO_JUNIT_CLASS_PASS $name"
          done
          if (( total < 28 )); then echo "Too few tests: $total" >&2; exit 1; fi
          echo "ATTO_ACTOR_CRITICAL_RECEIVE_JUNIT_PASS tests=$total SOURCE_MIR_MAILBOX_EXECUTED=true FULL_ATTO_MAIN_EXECUTED=false"

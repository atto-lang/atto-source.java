name: Supervisor failure escrow host-only exact-blob test
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/SupervisorFailureEscrowV1.java'
      - 'src/test/java/dev/oreslang/runtime/SupervisorFailureEscrowV1Standalone.java'
      - 'scripts/verify-supervisor-failure-escrow-v1.sh'
      - '.github/workflows/supervisor-failure-escrow-host-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-escrow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source blob and execute 554 host assertions
        shell: bash
        run: bash scripts/verify-supervisor-failure-escrow-v1.sh

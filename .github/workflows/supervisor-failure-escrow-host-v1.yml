name: Supervisor admission/fence linearization (real ActorRuntime)
on:
  push:
    branches:
      - integration/serialized-data-supervisor-permit-20261125
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/SupervisorFailureEscrowV1.java'
      - 'src/test/java/dev/oreslang/runtime/SupervisorFailureEscrowV1Standalone.java'
      - 'src/main/java/dev/oreslang/runtime/SupervisorFailureEscrowRuntimeBridgeV1.java'
      - 'src/main/java/dev/oreslang/runtime/SupervisorEscrowSubtreeRecoveryV1.java'
      - 'src/test/java/dev/oreslang/runtime/SupervisorEscrowSubtreeRecoveryIntegrationTest.java'
      - 'src/test/java/dev/oreslang/runtime/SupervisorEscrowDataAdmissionRaceStandalone.java'
      - 'src/test/java/dev/oreslang/runtime/SupervisorEscrowAdmissionLinearizationIntegrationTest.java'
      - 'src/main/java/dev/oreslang/runtime/ActorRuntime.java'
      - 'src/main/java/dev/oreslang/runtime/ActorDataDecodeEscrowV1.java'
      - 'src/main/java/dev/oreslang/types/PortableCodecRegistry.java'
      - 'src/main/java/dev/oreslang/runtime/MessagePackWireV2.java'
      - 'src/test/java/dev/oreslang/types/ActorDataDescriptorFixture.java'
      - 'src/test/java/dev/oreslang/runtime/ActorSerializedI64AdmissionTest.java'
      - 'src/test/java/dev/oreslang/runtime/SupervisorSerializedDataIntegrationTest.java'
      - 'src/test/standalone/dev/oreslang/runtime/ActorDataDecodeEscrowHarness.java'
      - 'src/test/java/dev/oreslang/runtime/SupervisorFailureEscrowRuntimeIntegrationTest.java'
      - 'scripts/verify-supervisor-escrow-runtime-bridge-v1.sh'
      - 'scripts/verify-supervisor-failure-escrow-v1.sh'
      - '.github/workflows/supervisor-failure-escrow-host-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-escrow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          git rev-parse HEAD 'HEAD^{tree}'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify source hashes and execute real ActorRuntime JUnit
        shell: bash
        run: bash scripts/verify-supervisor-escrow-runtime-bridge-v1.sh

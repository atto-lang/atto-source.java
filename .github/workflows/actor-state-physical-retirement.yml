name: Actor state physical retirement exact-head
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorStateLoans.java'
      - 'src/main/java/dev/oreslang/runtime/ActorStateRwLoans.java'
      - 'src/test/java/dev/oreslang/runtime/ActorStateRwLoansCarrierMatrixTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorStateRwRetirementPublishRaceTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorStateExclusiveRetirementPublishRaceTest.java'
      - '.github/workflows/actor-state-physical-retirement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-loan-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source SHA and test fixture provenance
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          for path in \
            src/main/java/dev/oreslang/runtime/ActorStateLoans.java \
            src/main/java/dev/oreslang/runtime/ActorStateRwLoans.java \
            src/test/java/dev/oreslang/runtime/ActorStateRwLoansCarrierMatrixTest.java \
            src/test/java/dev/oreslang/runtime/ActorStateRwRetirementPublishRaceTest.java \
            src/test/java/dev/oreslang/runtime/ActorStateExclusiveRetirementPublishRaceTest.java; do
            git ls-files --error-unmatch -- "$path" >/dev/null
            echo "STATE_LOAN_SHA $path $(git hash-object "$path")"
          done
          echo "ACTOR_STATE_SOURCE_SHA=$EXPECTED_SHA"
      - name: Install JDK25 GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          distribution: graalvm
          java-version: '25'
          version: '25.3'
          cache: maven
      - name: Compile and execute real JVM state retirement tests
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -version
          mvn -B -ntp \
            -Dtest=ActorStateRwLoansTest,ActorStateRwLoansCarrierMatrixTest,ActorStateRwRetirementPublishRaceTest,ActorStateExclusiveRetirementPublishRaceTest,ActorStateLoanRetirementGateTest \
            -DfailIfNoTests=true test
          for cls in \
            ActorStateRwLoansTest \
            ActorStateRwLoansCarrierMatrixTest \
            ActorStateRwRetirementPublishRaceTest \
            ActorStateExclusiveRetirementPublishRaceTest \
            ActorStateLoanRetirementGateTest; do
            report="target/surefire-reports/TEST-dev.oreslang.runtime.${cls}.xml"
            test -s "$report"
            grep -Eq '<testsuite[^>]*tests="[1-9][0-9]*"' "$report"
            for field in errors failures skipped; do
              grep -Eq '<testsuite[^>]*'${field}'="0"' "$report"
            done
            echo "STATE_LOAN_SUITE_VERIFIED $cls"
          done
          echo "ACTOR_STATE_PHYSICAL_RETIREMENT_EXACT_SHA_PASS"

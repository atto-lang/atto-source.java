name: Scoped permission contract integrity (NOT runtime parity)

on:
  pull_request:
    paths:
      - "contracts/v1/SCOPED_PERMISSIONS_V1.md"
      - "contracts/v1/scoped-permissions-v1.json"
      - "contracts/v1/verify_scoped_permissions.py"
      - "contracts/v1/test_verify_scoped_permissions.py"
      - ".github/workflows/scoped-permission-contract.yml"
      - "src/test/java/dev/oreslang/runtime/ScopedPermissionV1GoldenTest.java"
      - "src/main/java/dev/oreslang/runtime/RuntimePermissions.java"
      - "src/main/java/dev/oreslang/runtime/IsolatePolicy.java"
      - "src/main/java/dev/oreslang/runtime/NativeIo.java"
      - "src/main/java/dev/oreslang/runtime/CapabilityChecker.java"
      - "src/main/java/dev/oreslang/runtime/LinkedProgramRunner.java"
      - "src/main/java/dev/oreslang/launcher/OresMain.java"
      - "src/test/java/dev/oreslang/runtime/ScopedCompileTimePermissionTest.java"
      - "src/test/java/dev/oreslang/runtime/NativeIoSymlinkBoundaryTest.java"
      - "src/test/java/dev/oreslang/runtime/NativeIoPinnedNetworkTest.java"
      - "src/test/java/dev/oreslang/launcher/DenoCliDefaultPermissionsTest.java"
      - "src/test/java/dev/oreslang/launcher/Flags2EnvLauncherTest.java"
      - "src/test/java/dev/oreslang/runtime/RuntimePermissionCeilingTest.java"
      - "src/main/java/dev/oreslang/runtime/NativeBuildPermissions.java"
      - "src/test/java/dev/oreslang/runtime/NativeBuildPermissionsTest.java"
      - "pom.xml"
      - ".cli-flags.toml"
      - "scripts/with-flags2env.sh"
      - "tests/test_flags2env_wrapper.py"
      - "docs/CLI_FLAGS2ENV.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-and-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head before policy-gate tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate shared vector schema only (not runtime proof)
        run: python3 contracts/v1/verify_scoped_permissions.py --validate-only
      - name: Negative report-gate unit tests only (not guest execution)
        run: python3 -m unittest discover -s contracts/v1 -p 'test_verify_scoped_permissions.py' -v

  # Runs the actual Java permission-policy evaluator/serializer against all
  # reviewed golden vectors. This is NOT host-syscall/runtime sandbox proof.
  java-policy-vectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout this private source without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head before Java policy tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Configure GraalVM JDK 25 for actual Java policy tests
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          java-version: '25'
          distribution: 'graalvm'
      - name: Execute all 52 reviewed cases against RuntimePermissions and IsolatePolicy
        run: mvn -B -ntp -Dtest=ScopedPermissionV1GoldenTest test
      - name: Execute guest CLI compile/runtime and real host I/O boundary regressions
        run: >
          mvn -B -ntp
          '-Dtest=DenoCliDefaultPermissionsTest,Flags2EnvLauncherTest,RuntimePermissionCeilingTest,NativeBuildPermissionsTest,ScopedCompileTimePermissionTest,NativeIoSymlinkBoundaryTest,NativeIoPinnedNetworkTest,NativeSocketBoundaryTest,ScopedPermissionInteropTest'
          test
      - name: Exercise no-eval flags2env wrapper trust boundary
        run: python3 tests/test_flags2env_wrapper.py --root .
      - name: Write exact-head source-free Java security test receipt
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          expected = "de3594482d10623241a94cf531fd9e4fe71c49769dd68b2098f4ed5363870ac5"
          corpus = pathlib.Path("contracts/v1/scoped-permissions-v1.json").read_bytes()
          if hashlib.sha256(corpus).hexdigest() != expected:
              raise SystemExit("canonical permission corpus changed after tests")
          receipt = {
              "schema": "oreslang-scoped-java-host-security-ci-v1",
              "tested_head_sha": os.environ["EXPECTED_SHA"],
              "tested_tree_sha": os.popen("git rev-parse HEAD^{tree}").read().strip(),
              "canonical_vectors_sha256": expected,
              "canonical_vectors": 52,
              "policy_vectors_and_host_boundary_suites_completed": True,
              "guest_host_io_parity_proven": False,
              "native_image_tested": False,
          }
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ores-scoped-java-receipt.json"
          out.write_text(json.dumps(receipt, sort_keys=True, indent=2)+"\n", encoding="utf-8")
          print("JAVA_HOST_BOUNDARY_RECEIPT_OK", out)
          PY
      - name: Upload source-free Java permission test receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scoped-java-host-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ores-scoped-java-receipt.json
          if-no-files-found: error
          retention-days: 7

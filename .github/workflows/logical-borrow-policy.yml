name: Logical borrow policy
on:
  pull_request:
    paths:
      - src/main/java/dev/oreslang/types/DataOrientedBorrowChecker.java
      - verification/DopPolicyProbe.java
      - scripts/test_dop_policy_parity.py
      - .github/workflows/logical-borrow-policy.yml
  push:
    branches: [main]
    paths:
      - src/main/java/dev/oreslang/types/DataOrientedBorrowChecker.java
      - verification/DopPolicyProbe.java
      - scripts/test_dop_policy_parity.py
      - .github/workflows/logical-borrow-policy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compare production policy with independent model
        run: python3 scripts/test_dop_policy_parity.py --java-root .

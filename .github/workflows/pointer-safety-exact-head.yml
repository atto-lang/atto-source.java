name: Pointer ownership exact-head safety

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/OresPointer.java'
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/main/java/dev/oreslang/types/OwnershipChecker.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/main/java/dev/oreslang/runtime/ActorRuntime.java'
      - 'src/test/java/dev/oreslang/RuntimePointerTest.java'
      - 'src/test/java/dev/oreslang/runtime/OresPointerSafetyTest.java'
      - '.github/workflows/pointer-safety-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pointer-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse 'HEAD^{tree}'
      - name: GraalVM JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Compile pointer ownership slice
        run: mvn -B -ntp -DskipTests test-compile
      - name: Execute pointer borrow, escape, domain and zero-copy regressions
        run: mvn -B -ntp -Dtest=RuntimePointerTest,OresPointerSafetyTest test
      - name: Recheck tracked source after execution
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --

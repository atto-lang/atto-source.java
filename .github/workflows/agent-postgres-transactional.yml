name: AI PostgreSQL durable actor claim (HOST ONLY)
on:
  pull_request:
  push:
    branches: [feat/agent-dispatch-host-gate-parity-20261029]
permissions:
  contents: read
jobs:
  transactional-claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ores_dispatch_test
          POSTGRES_HOST_AUTH_METHOD: trust # Ephemeral test-only DB; localhost bind below.
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd='pg_isready -U postgres -d ores_dispatch_test'
          --health-interval=5s --health-timeout=3s --health-retries=12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: ores_dispatch_test
      ORES_TEST_PG_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/ores_dispatch_test
      ORES_TEST_PG_USER: ores_dispatch_test_runtime
      ORES_TEST_PG_PASSWORD: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
      - name: Install isolated PostgreSQL test clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client libpostgresql-jdbc-java
      - name: Create immutable claim schema and EXECUTE-only test role
        run: |
          set -euo pipefail
          psql -U postgres -v ON_ERROR_STOP=1 -f contracts/v1/agent-dispatch/postgresql/001_actor_dispatch_v1.sql
          psql -U postgres -v ON_ERROR_STOP=1 -f contracts/v1/agent-dispatch/postgresql/002_test_fixture.sql
          psql -U postgres -v ON_ERROR_STOP=1 -c 'ALTER ROLE ores_dispatch_test_runtime LOGIN'
          if psql -U ores_dispatch_test_runtime -tAc 'SELECT count(*) FROM ores_dispatch.claim_v1' >/dev/null 2>&1; then
            echo 'SECURITY_FAILURE direct table read granted'; exit 2
          fi
      - name: Compile and execute PostgreSQL host claim tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pg-dispatch-classes"
          javac -d "$RUNNER_TEMP/pg-dispatch-classes" \
            contracts/v1/agent-dispatch/AgentHostDispatchGate.java \
            contracts/v1/agent-dispatch/PostgresActorDispatchClaim.java \
            contracts/v1/agent-dispatch/PostgresActorDispatchClaimContractTest.java \
            contracts/v1/agent-dispatch/PgDispatchClaimIntegrationTest.java
          CP="$RUNNER_TEMP/pg-dispatch-classes:/usr/share/java/postgresql.jar"
          java -cp "$CP" PostgresActorDispatchClaimContractTest
          java -cp "$CP" PgDispatchClaimIntegrationTest java-100
          # Independent JVMs sharing one logical effect (not merely threads).
          pids=()
          for i in {1..12}; do
            java -cp "$CP" PgDispatchClaimIntegrationTest probe java-process-race >"$RUNNER_TEMP/java-proc-$i.log" 2>&1 &
            pids+=("$!")
          done
          winners=0; denied=0
          for pid in "${pids[@]}"; do
            rc=0
            wait "$pid" || rc=$?
            if [ "$rc" -eq 0 ]; then winners=$((winners+1))
            elif [ "$rc" -eq 2 ]; then denied=$((denied+1))
            else echo "unexpected Java process status $rc"; exit 1; fi
          done
          test "$winners" -eq 1
          test "$denied" -eq 11
          rows=$(psql -U postgres -tAc "SELECT count(*) FROM ores_dispatch.claim_v1 WHERE tenant_id='tenant' AND actor_id='worker' AND dispatch_id='java-process-race'")
          test "$rows" -eq 1
          if psql -U ores_dispatch_test_runtime -tAc "SELECT count(*) FROM ores_dispatch.runtime_binding_v1" >/dev/null 2>&1; then
            echo 'SECURITY_FAILURE runtime can read actor bindings'; exit 2
          fi
          java -cp "$CP" PgDispatchClaimIntegrationTest probe-hold java-killed >"$RUNNER_TEMP/claim.log" 2>&1 &
          pid=$!
          seen=0
          for i in {1..60}; do
            if grep -q '^CLAIM_COMMITTED$' "$RUNNER_TEMP/claim.log"; then seen=1; break; fi
            sleep 0.25
          done
          test "$seen" -eq 1
          kill -9 "$pid"
          wait "$pid" || true
          rc=0
          java -cp "$CP" PgDispatchClaimIntegrationTest probe java-killed || rc=$?
          test "$rc" -eq 2
          psql -U postgres -v ON_ERROR_STOP=1 -c "UPDATE ores_dispatch.actor_fence_v1 SET actor_generation=8, activation_epoch=10, exact_revision=repeat('c',40) WHERE tenant_id='tenant' AND actor_id='worker'"
          rc=0
          java -cp "$CP" PgDispatchClaimIntegrationTest probe java-after-fence || rc=$?
          # New generation is authorized, but an old logical effect cannot replay.
          rc=0
          java -cp "$CP" PgDispatchClaimIntegrationTest probe-newgen java-killed || rc=$?
          test "$rc" -eq 2
          java -cp "$CP" PgDispatchClaimIntegrationTest probe-newgen java-fresh
          echo 'PG_JAVA_REAL_DB_CLAIM_PASS host_only=true native_guest=false'

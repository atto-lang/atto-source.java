name: Type and ADT Java source regression
on:
  pull_request:
    paths:
      - "src/main/java/dev/oreslang/parser/Parser.java"
      - "src/test/java/dev/oreslang/ForwardTypeDeclarationHardeningTest.java"
      - ".github/workflows/type-adt-java-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  declaration-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR commit within the same repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Execute parser, forward-linker and Java guest regression
        run: mvn -B -ntp -Dtest=ForwardTypeDeclarationHardeningTest test
      - name: Report exact source revision
        if: always()
        run: |
          git rev-parse HEAD
          echo "JAVA_SOURCE_REGRESSION; LLVM=NOT_EXECUTED; AOT=NOT_EXECUTED"

name: Actor upgrade epoch exact-head

on:
  pull_request:
    paths:
      - '.github/workflows/actor-upgrade-epoch-exact-head.yml'
      - 'pom.xml'
      - 'src/main/java/dev/oreslang/runtime/ActorUpgradeEpochGate.java'
      - 'src/test/java/dev/oreslang/runtime/ActorUpgradeEpochGateTest.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actor-epoch-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact submitted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Refuse a non-exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
          cache: maven
      - name: Run focused actor JUnit regression
        run: mvn -B -ntp -Dtest=ActorUpgradeEpochGateTest -DfailIfNoTests=true test
      - name: Record exact-tree JUnit receipt (not a Graal isolate proof)
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def git(*args):
              return subprocess.run(
                  ["git", *args], capture_output=True, text=True,
                  check=False).stdout.strip()

          expected = os.environ["EXPECTED_SHA"]
          observed = git("rev-parse", "HEAD")
          tree = git("rev-parse", "HEAD^{tree}")
          report = Path("target/surefire-reports/TEST-dev.oreslang.runtime.ActorUpgradeEpochGateTest.xml")
          counts = {"tests": 0, "errors": 0, "failures": 0, "skipped": 0}
          parsed = False
          if report.is_file():
              try:
                  result = ET.parse(report).getroot()
                  for key in counts:
                      counts[key] = int(result.get(key, "0"))
                  parsed = True
              except (ET.ParseError, ValueError):
                  pass
          verified = (len(expected) == 40 and observed == expected
                      and len(tree) == 40 and parsed
                      and counts["tests"] >= 7
                      and not (counts["errors"] or counts["failures"]
                               or counts["skipped"]))
          receipt = {
              "test_class": "ActorUpgradeEpochGateTest",
              "expected_head": expected,
              "observed_head": observed,
              "git_tree_sha": tree,
              "junit_xml_parsed": parsed,
              "host_junit_verified": verified,
              "native_untrusted_isolate_verified": False,
              **counts,
          }
          out = Path("target/ci-evidence/actor-epoch-junit.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(receipt, sort_keys=True) + "\n",
                         encoding="utf-8")
          print("Focused test evidence:", receipt)
          if not verified:
              raise SystemExit("missing or failed exact-head JUnit test receipt")
          PY
      - name: Retain source-free test receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: actor-epoch-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-evidence/actor-epoch-junit.json
          retention-days: 7
          if-no-files-found: error

name: Java checked-i64 opt-in guest parity (exact source)
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/OresLanguage.java'
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/main/java/dev/oreslang/runtime/AttoCheckedI64Profile.java'
      - 'src/test/java/dev/oreslang/AttoCheckedI64ProfileTest.java'
      - 'contracts/checked-i64-java-js-v1/**'
      - '.github/workflows/checked-i64-java-js.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-jvm-guest-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Authenticate exact source head, blob and tree
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git diff --quiet HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          casefile=contracts/checked-i64-java-js-v1/cases.tsv
          test "$(git hash-object "$casefile")" = "$(git rev-parse "HEAD:$casefile")"
          echo "CHECKED_I64_JAVA_HEAD=$EXPECTED TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Execute real Java/Graal guest conformance and legacy wrapping regression
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=AttoCheckedI64ProfileTest,GraalI64RuntimeCharacterizationTest -DfailIfNoTests=true test
          test -s target/surefire-reports/dev.oreslang.AttoCheckedI64ProfileTest.txt
          test -s target/surefire-reports/dev.oreslang.GraalI64RuntimeCharacterizationTest.txt
          echo 'CHECKED_I64_JAVA_GUEST_TESTS_EXECUTED=true'
      - name: Upload actual JUnit receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checked-i64-java-junit
          path: target/surefire-reports/*CheckedI64ProfileTest*
          if-no-files-found: warn

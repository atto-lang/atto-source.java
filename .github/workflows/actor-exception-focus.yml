name: Actor exception host-only JUnit regression

on:
  push:
    branches:
      - feat/native-actor-errors-flags2env-20261014
    paths:
      - "src/main/java/dev/oreslang/runtime/ActorRuntime.java"
      - "src/main/java/dev/oreslang/runtime/ControlWakeRetryQueue.java"
      - "src/test/java/dev/oreslang/runtime/ActorTypedEffectControlTest.java"
      - "src/test/java/dev/oreslang/TypedExceptionalEffectAdmissionTest.java"
      - "src/test/java/dev/oreslang/SourceActorOnThrowExecutionTest.java"
      - "src/test/java/dev/oreslang/runtime/ActorIncarnationIdentityTest.java"
      - "src/test/java/dev/oreslang/runtime/ActorCrossRuntimeRestartAuthorityTest.java"
      - "src/test/java/dev/oreslang/runtime/ControlWakeRetryStandaloneStress.java"
      - "scripts/verify_actor_control_retry_standalone.sh"
      - "scripts/verify_actor_exception_jvm.sh"
      - "tests/test_actor_ci_checkout_proof.py"
      - "scripts/check_private_ci_destination.py"
      - "tests/test_private_ci_destination.py"
      - ".github/workflows/actor-exception-focus.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actor-exception-focus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          version: "25.3"
          java-version: "25"
          distribution: "graalvm"
          cache: maven
      - name: Record runtime provenance
        run: |
          echo "source_repo=${GITHUB_REPOSITORY}"
          echo "source_sha=${GITHUB_SHA}"
          java --version
          mvn --version
      - name: Exercise 100k CONTROL retries against checked-out production class
        run: |
          git hash-object -- src/main/java/dev/oreslang/runtime/ControlWakeRetryQueue.java
          bash scripts/verify_actor_control_retry_standalone.sh
      - name: Test clean and stale source SHA admission (mock toolchains)
        run: python3 -m unittest discover -s tests -p 'test_actor_ci_checkout_proof.py' -v
      - name: Check private-source transfer policy
        run: python3 -m unittest discover -s tests -p 'test_private_ci_destination.py' -v
      - name: Run complete focused source-actor exception, restart and admission JUnit
        env:
          ORESLANG_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/verify_actor_exception_jvm.sh

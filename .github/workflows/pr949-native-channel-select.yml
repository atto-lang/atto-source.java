name: PR949 private native channel-select contract
on:
  push:
    branches:
      - integration/future-select-runtime-current-main-20261014
  workflow_dispatch:
# Self-hosted mode requires explicit exact-SHA approval in repository variable
# ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA; other branches/commits fail at job
# admission. No shared Maven cache on an ephemeral private-source runner.
permissions:
  contents: read
concurrency:
  group: pr949-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Denial check never checks out repository source and never uses a private
  # runner. If the approved SHA is missing/mismatched, executable test jobs
  # skip before self-hosted admission, while this job makes the workflow FAIL
  # rather than falsely appear green from skipped required checks.
  deny-unapproved-runner:
    if: ${{ github.repository != 'ores-truffle-oreslang/oreslang-source.java' || github.event.repository.private != true || github.ref != 'refs/heads/integration/future-select-runtime-current-main-20261014' || (vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER == 'true' && (vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA == '' || vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA != github.sha)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed without source checkout
        shell: bash
        run: |
          echo "::error::Private CI job admission denied: verify private repository/ref and exact approved commit SHA"
          exit 1
  syntax-and-guest:
    if: ${{ github.repository == 'ores-truffle-oreslang/oreslang-source.java' && github.event.repository.private == true && github.ref == 'refs/heads/integration/future-select-runtime-current-main-20261014' && (vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER != 'true' || (vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA != '' && vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA == github.sha)) }}
    # Admin opt-in: enable ONLY after registering a disposable, repo-scoped
    # ephemeral Linux x64 runner labeled oreslang-private-ephemeral.
    # Without approval/configuration continue using GitHub-hosted runners.
    runs-on: ${{ vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER == 'true' && fromJSON('["self-hosted","linux","x64","oreslang-private-ephemeral"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restrict execution to the private source repository
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ores-truffle-oreslang/oreslang-source.java"
          test "$GITHUB_REF" = "refs/heads/integration/future-select-runtime-current-main-20261014"
          test "${{ github.event.repository.private }}" = "true"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Native contract source head: $(git rev-parse HEAD)"
          echo "Native contract source tree: $(git rev-parse HEAD^{tree})"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: '25'
          distribution: graalvm
          version: '25.3'

      - name: Compile and execute the same fixture plus Future waiter lifecycle regressions
        run: mvn -B -ntp '-Dtest=NativeChannelSelectSmokeTest,OresFutureHostWaiterDetachmentTest,OresFutureTerminalAdmissionRetentionTest,FutureChannelSelectTest,ChannelMappedSelectionCancellationTest,ChannelMappedCancellationStressTest,ChannelSelectFairAdmissionRaceTest,SelectPeerFutureAliasReadinessTest,ChannelCommittedCompletionDrainTest,PrivateCiRunnerWorkflowSecurityTest' test
  full-jvm-verify:
    needs: syntax-and-guest
    if: ${{ github.repository == 'ores-truffle-oreslang/oreslang-source.java' && github.event.repository.private == true && github.ref == 'refs/heads/integration/future-select-runtime-current-main-20261014' && (vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER != 'true' || (vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA != '' && vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA == github.sha)) }}
    # Admin opt-in; each job needs a fresh single-use ephemeral worker.
    runs-on: ${{ vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER == 'true' && fromJSON('["self-hosted","linux","x64","oreslang-private-ephemeral"]') || 'ubuntu-24.04' }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify private original exact-head source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ores-truffle-oreslang/oreslang-source.java"
          test "$GITHUB_REF" = "refs/heads/integration/future-select-runtime-current-main-20261014"
          test "${{ github.event.repository.private }}" = "true"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Source head $(git rev-parse HEAD)"
          echo "Source tree $(git rev-parse HEAD^{tree})"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: '25'
          distribution: graalvm
          version: '25.3'

      - name: Complete Maven verification
        run: mvn -B -ntp -Dores.runtime.carriers=native verify

  native-compiled-guest:
    needs: syntax-and-guest
    if: ${{ github.repository == 'ores-truffle-oreslang/oreslang-source.java' && github.event.repository.private == true && github.ref == 'refs/heads/integration/future-select-runtime-current-main-20261014' && (vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER != 'true' || (vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA != '' && vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA == github.sha)) }}
    # Admin opt-in: enable ONLY after registering a disposable, repo-scoped
    # ephemeral Linux x64 runner labeled oreslang-private-ephemeral.
    # Without approval/configuration continue using GitHub-hosted runners.
    runs-on: ${{ vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER == 'true' && fromJSON('["self-hosted","linux","x64","oreslang-private-ephemeral"]') || 'ubuntu-24.04' }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        mode: [native-aot, native-hybrid]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restrict execution to original private source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ores-truffle-oreslang/oreslang-source.java"
          test "$GITHUB_REF" = "refs/heads/integration/future-select-runtime-current-main-20261014"
          test "${{ github.event.repository.private }}" = "true"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Native contract source head: $(git rev-parse HEAD)"
          echo "Native contract source tree: $(git rev-parse HEAD^{tree})"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: '25'
          distribution: graalvm
          version: '25.3'

      - name: Compile native guest runner
        run: mvn -B -ntp -DskipTests -P${{ matrix.mode }} package
      - name: Execute compiled native channel-select guest
        shell: bash
        run: |
          set -euo pipefail
          bin=target/ores-aot
          if test "${{ matrix.mode }}" = "native-hybrid"; then
            bin=target/ores-hybrid
          fi
          timeout --signal=TERM --kill-after=5s 60s "$bin" examples/native-channel-select-smoke.ores > /tmp/native-select-result.txt
          actual="$(cat /tmp/native-select-result.txt)"
          if test "$actual" != "first:7:9"; then
            echo "::error::Compiled native channel-select guest produced unexpected output"
            exit 1
          fi
          echo "NATIVE_CHANNEL_SELECT_PASS mode=${{ matrix.mode }}"

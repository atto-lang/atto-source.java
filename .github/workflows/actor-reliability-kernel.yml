name: Actor reliability kernel

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorRuntime.java'
      - 'src/main/java/dev/oreslang/runtime/CoreLog.java'
      - 'src/main/java/dev/oreslang/runtime/SupervisorRestartWindow.java'
      - 'src/test/java/dev/oreslang/runtime/ActorReliabilityKernelTest.java'
      - 'src/test/java/dev/oreslang/runtime/SupervisorRestartWindowTest.java'
      - 'docs/ACTOR_RELIABILITY_KERNEL_V1.md'
      - 'scripts/verify_actor_reliability_kernel.py'
      - '.github/workflows/actor-reliability-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Run finite reliability admission model
        run: python3 scripts/verify_actor_reliability_kernel.py
      - name: Run reliability, watchdog, root-fault and send-contract tests
        run: >
          mvn -B -ntp
          -Dtest=SupervisorRestartWindowTest,ActorReliabilityKernelTest,ActorTurnWatchdogTest,RootExitSupervisorFaultInjectionTest,ActorSendContractTest
          test

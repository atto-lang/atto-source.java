name: Refinement exact-head proof core

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/ast/**'
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/main/java/dev/oreslang/parser/RefinementSyntax.java'
      - 'src/main/java/dev/oreslang/types/RefinementRules.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/main/java/dev/oreslang/compiler/ZordeSchemaGenerator.java'
      - 'src/test/java/dev/oreslang/RefinementRulesTest.java'
      - 'src/test/java/dev/oreslang/RefinementSyntaxGateTest.java'
      - 'src/test/java/dev/oreslang/ZordeSchemaGeneratorTest.java'
      - 'src/test/java/dev/oreslang/ZordeStdlibSourceTest.java'
      - 'stdlib/zorde.ores'
      - '.github/workflows/refinement-exact-head.yml'
  push:
    branches:
      - 'ci/refinement-exact-head-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse 'HEAD^{tree}'
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Execute refinement parser, schema, and stdlib regressions
        run: mvn -B -ntp -Dtest=RefinementRulesTest,RefinementSyntaxGateTest,ZordeSchemaGeneratorTest,ZordeStdlibSourceTest test
      - name: Recheck source tree after tests
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --

name: ADT source-local exact-head certification
# Security #22/#77: private Oreslang source stays in original organization.
on:
  push:
    branches:
      - design/enum-and-tagged-actor-messages-20261011
permissions:
  contents: read
concurrency:
  group: adt-source-local-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deny-unapproved:
    if: ${{ !(github.repository == 'ores-truffle-oreslang/oreslang-source.java' && github.repository_id == '1400792274' && github.event.repository.private == true && github.event.repository.fork == false && github.event_name == 'push' && github.ref == 'refs/heads/design/enum-and-tagged-actor-messages-20261011' && github.ref_protected == true && vars.ORESLANG_ADT_PRIVATE_RUNNER == 'true' && vars.ORESLANG_ADT_APPROVED_SHA == github.sha && vars.ORESLANG_ADT_APPROVED_SHA != '' && vars.ORESLANG_ADT_APPROVED_TREE != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Deny source execution without independent reviewed-tree authorization
        run: |
          echo "ADT_SOURCE_ADMISSION=DENIED" >&2
          exit 1
  adt-portable:
    if: ${{ github.repository == 'ores-truffle-oreslang/oreslang-source.java' && github.repository_id == '1400792274' && github.event.repository.private == true && github.event.repository.fork == false && github.event_name == 'push' && github.ref == 'refs/heads/design/enum-and-tagged-actor-messages-20261011' && github.ref_protected == true && vars.ORESLANG_ADT_PRIVATE_RUNNER == 'true' && vars.ORESLANG_ADT_APPROVED_SHA == github.sha && vars.ORESLANG_ADT_APPROVED_SHA != '' && vars.ORESLANG_ADT_APPROVED_TREE != '' }}
    runs-on: [self-hosted, linux, x64, oreslang-private-ephemeral]
    timeout-minutes: 15
    steps:
      - name: Verify protected source-local authorization before checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ vars.ORESLANG_ADT_APPROVED_SHA }}
          EXPECTED_TREE: ${{ vars.ORESLANG_ADT_APPROVED_TREE }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ores-truffle-oreslang/oreslang-source.java"
          test "$GITHUB_REPOSITORY_ID" = "1400792274"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$GITHUB_REF" = "refs/heads/design/enum-and-tagged-actor-messages-20261011"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # pinned checkout v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Verify exact tree and clean checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ vars.ORESLANG_ADT_APPROVED_SHA }}
          EXPECTED_TREE: ${{ vars.ORESLANG_ADT_APPROVED_TREE }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ADT_EXACT_SOURCE_TREE=VERIFIED; CROSS_ORG_SOURCE_EXPORT=NONE"
      - name: Source-owned policy check (host only)
        run: node --test tests/adt_ci_admission.test.mjs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # pinned setup-java v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile production continuation queue without Maven
        run: bash scripts/verify-adt-queue.sh
  adt-targeted:
    needs: adt-portable
    if: ${{ github.repository == 'ores-truffle-oreslang/oreslang-source.java' && github.repository_id == '1400792274' && github.event.repository.private == true && github.event.repository.fork == false && github.event_name == 'push' && github.ref == 'refs/heads/design/enum-and-tagged-actor-messages-20261011' && github.ref_protected == true && vars.ORESLANG_ADT_PRIVATE_RUNNER == 'true' && vars.ORESLANG_ADT_APPROVED_SHA == github.sha && vars.ORESLANG_ADT_APPROVED_SHA != '' && vars.ORESLANG_ADT_APPROVED_TREE != '' }}
    runs-on: [self-hosted, linux, x64, oreslang-private-ephemeral]
    timeout-minutes: 50
    steps:
      - name: Verify protected source-local authorization before checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ vars.ORESLANG_ADT_APPROVED_SHA }}
          EXPECTED_TREE: ${{ vars.ORESLANG_ADT_APPROVED_TREE }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ores-truffle-oreslang/oreslang-source.java"
          test "$GITHUB_REPOSITORY_ID" = "1400792274"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$GITHUB_REF" = "refs/heads/design/enum-and-tagged-actor-messages-20261011"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # pinned checkout v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Verify exact tree and clean checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ vars.ORESLANG_ADT_APPROVED_SHA }}
          EXPECTED_TREE: ${{ vars.ORESLANG_ADT_APPROVED_TREE }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ADT_EXACT_SOURCE_TREE=VERIFIED; CROSS_ORG_SOURCE_EXPORT=NONE"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # pinned v1.6.7, no cache
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
      - name: Real parser, typechecker, and guest runtime conformance
        run: |
          mvn -B -ntp -Dores.runtime.carriers=native \
            -Dtest=AdtConformanceCorpusTest,AlgebraicDataTypeMatchTest,ExclusiveAdtMatchSafetyTest,EnumScalarPayloadRangeHardeningTest,EnumOwnershipMatchTest,NestedEnumLocalValueTest,AdtFiniteMatchOracleTest,ExplicitDispatchStatementSyntaxTest,NumericPatternEqualityTest,MatchContinuationQueueTest,TrainingErrorNominalResultGuestTest test
  adt-full:
    needs: adt-targeted
    if: ${{ github.repository == 'ores-truffle-oreslang/oreslang-source.java' && github.repository_id == '1400792274' && github.event.repository.private == true && github.event.repository.fork == false && github.event_name == 'push' && github.ref == 'refs/heads/design/enum-and-tagged-actor-messages-20261011' && github.ref_protected == true && vars.ORESLANG_ADT_PRIVATE_RUNNER == 'true' && vars.ORESLANG_ADT_APPROVED_SHA == github.sha && vars.ORESLANG_ADT_APPROVED_SHA != '' && vars.ORESLANG_ADT_APPROVED_TREE != '' }}
    runs-on: [self-hosted, linux, x64, oreslang-private-ephemeral]
    timeout-minutes: 70
    steps:
      - name: Verify protected source-local authorization before checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ vars.ORESLANG_ADT_APPROVED_SHA }}
          EXPECTED_TREE: ${{ vars.ORESLANG_ADT_APPROVED_TREE }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ores-truffle-oreslang/oreslang-source.java"
          test "$GITHUB_REPOSITORY_ID" = "1400792274"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$GITHUB_REF" = "refs/heads/design/enum-and-tagged-actor-messages-20261011"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # pinned checkout v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Verify exact tree and clean checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ vars.ORESLANG_ADT_APPROVED_SHA }}
          EXPECTED_TREE: ${{ vars.ORESLANG_ADT_APPROVED_TREE }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ADT_EXACT_SOURCE_TREE=VERIFIED; CROSS_ORG_SOURCE_EXPORT=NONE"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # pinned v1.6.7, no cache
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
      - name: Complete source-local Maven conformance
        run: mvn -B -ntp -Dores.runtime.carriers=native clean verify
      - name: Exact execution declaration (only on real success)
        run: |
          echo "ADT_JAVA_GUEST=EXECUTED; LLVM_PARITY=NOT_EXECUTED"
          echo "CROSS_ORG_PRIVATE_SOURCE_EXPORT=NONE"

name: ADT exact-head verification

on:
  push:
    branches:
      - design/enum-and-tagged-actor-messages-20261011
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/parser/**'
      - 'src/main/java/dev/oreslang/types/**'
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/test/java/dev/oreslang/*Adt*'
      - 'src/test/java/dev/oreslang/*ADT*'
      - 'src/test/java/dev/oreslang/*Enum*'
      - 'src/test/java/dev/oreslang/ExplicitDispatchStatementSyntaxTest.java'
      - 'contracts/v2/adt-conformance/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adt-exact-head-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adt-targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Record exact source revision and runtime
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          java --version
          mvn --version
      - name: Run ADT guest compiler/runtime conformance and stress tests
        run: |
          mvn -B -ntp -Dores.runtime.carriers=native \
            -Dtest=AdtConformanceCorpusTest,AlgebraicDataTypeMatchTest,ExclusiveAdtMatchSafetyTest,EnumScalarPayloadRangeHardeningTest,EnumOwnershipMatchTest,NestedEnumLocalValueTest,AdtFiniteMatchOracleTest,ExplicitDispatchStatementSyntaxTest,NumericPatternEqualityTest \
            test
      - name: Upload exact-head targeted test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adt-targeted-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: ignore

  adt-full:
    needs: adt-targeted
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Full exact-head Maven verification
        run: mvn -B -ntp -Dores.runtime.carriers=native verify
      - name: Upload full suite reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adt-full-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: ignore

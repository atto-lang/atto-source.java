name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify
        run: mvn -B -ntp verify
      - name: Run showcase
        run: mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/showcase.ores"
      - name: Compile and run shared Oreslang program
        run: mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"

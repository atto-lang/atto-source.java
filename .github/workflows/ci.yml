name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo "EXACT_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Validate canonical receipt escapes (source-free)
        run: bash tests/test_ores_test_escape_canonicality.sh
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: GraalVM diagnostics
        run: |
          java --version
          native-image --version
      - name: Verify JIT/JVM profile
        run: mvn -B -ntp -Dores.runtime.carriers=native verify
      - name: Run showcase
        run: mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/showcase.ores"
      - name: Load native stdlib through the modular JVM launcher
        run: |
          mvn -B -ntp -DskipTests dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
          java --enable-native-access=ALL-UNNAMED -p "target/classes:$(cat target/classpath.txt)" -m dev.oreslang/dev.oreslang.launcher.OresMain examples/native-core-library.ores
      - name: Compile and run shared Oreslang program
        run: mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"
      - name: Run native Oreslang test framework
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/native-testing-harness-guards.ores"
          timeout 180s mvn -B -ntp -DskipTests exec:java -Dexec.args="tests/test_std_harness_regressions.ores" | tee /tmp/ores-harness-regressions-jit.out
          bash scripts/verify_ores_test_receipts.sh /tmp/ores-harness-regressions-jit.out native-testing-core 30
          timeout 180s mvn -B -ntp -DskipTests exec:java -Dexec.args="tests/test_std_harness_scalar_parity_batch4.ores" | tee /tmp/ores-harness-scalar-jit.out
          bash scripts/verify_ores_test_receipts.sh /tmp/ores-harness-scalar-jit.out compiler-scalar-parity-batch4 24
          timeout 180s mvn -B -ntp -DskipTests exec:java -Dexec.args="tests/test_std_harness_meta_batch4.ores" | tee /tmp/ores-harness-meta-jit.out
          bash scripts/verify_ores_test_receipts.sh /tmp/ores-harness-meta-jit.out harness-meta-batch4 12
          timeout 180s mvn -B -ntp -DskipTests exec:java -Dexec.args="tests/test_std_harness_accounting_batch5.ores" | tee /tmp/ores-accounting-batch5-jit.out
          bash scripts/verify_ores_test_receipts.sh /tmp/ores-accounting-batch5-jit.out harness-accounting-batch5 16
          timeout 180s mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/native-testing-regressions-40.ores" | tee /tmp/ores-regressions-40-jit.out
          bash scripts/verify_ores_test_receipts.sh /tmp/ores-regressions-40-jit.out stdlib 40
          timeout 180s mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/native-testing-runner-matrix.ores" | tee /tmp/ores-runner-matrix-jit.out
          grep -Fqx "ORES_TEST_RUNNER_MATRIX_OK|cases=12" /tmp/ores-runner-matrix-jit.out
          test "$(grep -c '^ORES_TEST_RUNNER_MATRIX_OK|' /tmp/ores-runner-matrix-jit.out)" -eq 1
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/native-testing.ores" | tee /tmp/ores-testing-jit.out
          grep -Fx "ORES_TEST|SUMMARY|total=4|passed=3|failed=0|skipped=1|filtered=0" /tmp/ores-testing-jit.out
          test "$(grep -c '^ORES_TEST|SUMMARY|' /tmp/ores-testing-jit.out)" -eq 1
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/native-testing-semantics.ores" | tee /tmp/ores-testing-semantics-jit.out
          grep -Fx "ORES_TEST|SUMMARY|total=1|passed=1|failed=0|skipped=0|filtered=2" /tmp/ores-testing-semantics-jit.out
          grep -Fx "ORES_TEST|SUMMARY|total=2|passed=1|failed=1|skipped=0|filtered=0" /tmp/ores-testing-semantics-jit.out
          test "$(grep -c '^ORES_TEST|SUMMARY|' /tmp/ores-testing-semantics-jit.out)" -eq 2
          # Expected-failure guests must emit their exact summary before a
          # nonzero exit. Compiler errors and timeouts alone are not evidence.
          for variant in empty skipped filtered failed; do
            case "$variant" in
              empty) expected="total=0|passed=0|failed=0|skipped=0|filtered=0" ;;
              skipped) expected="total=1|passed=0|failed=0|skipped=1|filtered=0" ;;
              filtered) expected="total=0|passed=0|failed=0|skipped=0|filtered=1" ;;
              failed) expected="total=1|passed=0|failed=1|skipped=0|filtered=0" ;;
            esac
            out="/tmp/ores-testing-negative-${variant}.out"
            set +e
            timeout 180s mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/native-testing-negative-${variant}.ores" > "$out" 2>&1
            result=$?
            set -e
            if [ "$result" -eq 0 ] || [ "$result" -eq 124 ] || [ "$result" -eq 137 ]; then
              echo "Expected guest rejection with non-timeout failure: $variant (exit $result)" >&2
              exit 1
            fi
            grep -Fqx "ORES_TEST|SUMMARY|${expected}" "$out"
            test "$(grep -c '^ORES_TEST|SUMMARY|' "$out")" -eq 1
            if [ "$variant" = "failed" ]; then
              grep -Fq "native Oreslang test suite failed" "$out"
            else
              grep -Fq "native Oreslang test suite was empty or only skipped/filtered" "$out"
            fi
            if grep -Fq "UNEXPECTED_SUCCESS" "$out"; then
              echo "Expected guest rejection continued past require_success: $variant" >&2
              exit 1
            fi
          done
      - name: Run Orestra integration smoke under JVM/JIT
        run: |
          set -euo pipefail
          for case in placement-smoke edge-guards workload-state-smoke control-plane-smoke; do
            mvn -B -ntp -DskipTests exec:java -Dexec.args="integration/orestra/examples/${case}.ores" | tee "/tmp/${case}-jit.out"
          done
          grep -x "orestra-placement-ok" /tmp/placement-smoke-jit.out
          grep -x "orestra-edge-guards-ok" /tmp/edge-guards-jit.out
          grep -x "orestra-workload-state-ok" /tmp/workload-state-smoke-jit.out
          grep -x "orestra-control-plane-ok" /tmp/control-plane-smoke-jit.out

  native-aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo "EXACT_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: GraalVM diagnostics
        run: |
          java --version
          native-image --version
      - name: Build interpreter-only AOT image
        run: mvn -B -ntp -Pnative-aot -DskipTests package
      - name: Verify compressed reference mode is baked into AOT image
        run: |
          ./target/ores-aot --build-info | tee /tmp/ores-aot-build-info.json
          grep -F '"managed_reference_mode":"compressed32"' /tmp/ores-aot-build-info.json
      - name: Run AOT image
        run: ./target/ores-aot --mode=aot --platform=linux examples/together.ores
      - name: Load packaged native stdlib under AOT
        run: ./target/ores-aot --mode=aot --platform=linux examples/native-core-library.ores
      - name: Run AOT proper tail-call stress
        run: |
          ./target/ores-aot --mode=aot --platform=linux examples/proper-tail-call.ores | tee /tmp/ores-aot-tail.out
          grep -F "0|0|0" /tmp/ores-aot-tail.out
      - name: Run native Oreslang tests under AOT
        run: |
          set -euo pipefail
          ./target/ores-aot --mode=aot --platform=linux examples/native-testing-harness-guards.ores
          timeout 180s ./target/ores-aot --mode=aot --platform=linux tests/test_std_harness_regressions.ores | tee /tmp/ores-harness-regressions-aot.out
          bash scripts/verify_ores_test_receipts.sh /tmp/ores-harness-regressions-aot.out native-testing-core 30
          timeout 180s ./target/ores-aot --mode=aot --platform=linux tests/test_std_harness_scalar_parity_batch4.ores | tee /tmp/ores-harness-scalar-aot.out
          bash scripts/verify_ores_test_receipts.sh /tmp/ores-harness-scalar-aot.out compiler-scalar-parity-batch4 24
          timeout 180s ./target/ores-aot --mode=aot --platform=linux tests/test_std_harness_meta_batch4.ores | tee /tmp/ores-harness-meta-aot.out
          bash scripts/verify_ores_test_receipts.sh /tmp/ores-harness-meta-aot.out harness-meta-batch4 12
          timeout 180s ./target/ores-aot --mode=aot --platform=linux tests/test_std_harness_accounting_batch5.ores | tee /tmp/ores-accounting-batch5-aot.out
          bash scripts/verify_ores_test_receipts.sh /tmp/ores-accounting-batch5-aot.out harness-accounting-batch5 16
          timeout 180s ./target/ores-aot --mode=aot --platform=linux examples/native-testing-regressions-40.ores | tee /tmp/ores-regressions-40-aot.out
          bash scripts/verify_ores_test_receipts.sh /tmp/ores-regressions-40-aot.out stdlib 40
          timeout 180s ./target/ores-aot --mode=aot --platform=linux examples/native-testing-runner-matrix.ores | tee /tmp/ores-runner-matrix-aot.out
          grep -Fqx "ORES_TEST_RUNNER_MATRIX_OK|cases=12" /tmp/ores-runner-matrix-aot.out
          test "$(grep -c '^ORES_TEST_RUNNER_MATRIX_OK|' /tmp/ores-runner-matrix-aot.out)" -eq 1
          ./target/ores-aot --mode=aot --platform=linux examples/native-testing.ores | tee /tmp/ores-testing-aot.out
          grep -Fx "ORES_TEST|SUMMARY|total=4|passed=3|failed=0|skipped=1|filtered=0" /tmp/ores-testing-aot.out
          test "$(grep -c '^ORES_TEST|SUMMARY|' /tmp/ores-testing-aot.out)" -eq 1
          ./target/ores-aot --mode=aot --platform=linux examples/native-testing-semantics.ores | tee /tmp/ores-testing-semantics-aot.out
          grep -Fx "ORES_TEST|SUMMARY|total=1|passed=1|failed=0|skipped=0|filtered=2" /tmp/ores-testing-semantics-aot.out
          grep -Fx "ORES_TEST|SUMMARY|total=2|passed=1|failed=1|skipped=0|filtered=0" /tmp/ores-testing-semantics-aot.out
          test "$(grep -c '^ORES_TEST|SUMMARY|' /tmp/ores-testing-semantics-aot.out)" -eq 2
      - name: Run Orestra integration smoke under native AOT
        run: |
          set -euo pipefail
          for case in placement-smoke edge-guards workload-state-smoke control-plane-smoke; do
            ./target/ores-aot --mode=aot --platform=linux "integration/orestra/examples/${case}.ores" | tee "/tmp/${case}-aot.out"
          done
          grep -x "orestra-placement-ok" /tmp/placement-smoke-aot.out
          grep -x "orestra-edge-guards-ok" /tmp/edge-guards-aot.out
          grep -x "orestra-workload-state-ok" /tmp/workload-state-smoke-aot.out
          grep -x "orestra-control-plane-ok" /tmp/control-plane-smoke-aot.out

  native-aot-ref64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo "EXACT_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: GraalVM diagnostics
        run: |
          java --version
          native-image --version
      - name: Build full-width AOT image
        run: mvn -B -ntp -Pnative-aot,native-ref64 -DskipTests package
      - name: Verify native64 reference mode is baked into AOT image
        run: |
          ./target/ores-aot --build-info | tee /tmp/ores-aot-ref64-build-info.json
          grep -F '"managed_reference_mode":"native64"' /tmp/ores-aot-ref64-build-info.json
      - name: Run full-width AOT image
        run: ./target/ores-aot --mode=aot --platform=linux examples/together.ores
      - name: Load packaged native stdlib under full-width AOT
        run: ./target/ores-aot --mode=aot --platform=linux examples/native-core-library.ores

  native-hybrid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo "EXACT_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: GraalVM diagnostics
        run: |
          java --version
          native-image --version
      - name: Build AOT host with guest JIT
        run: mvn -B -ntp -Pnative-hybrid -DskipTests package
      - name: Verify compressed reference mode is baked into hybrid image
        run: |
          ./target/ores-hybrid --build-info | tee /tmp/ores-hybrid-build-info.json
          grep -F '"managed_reference_mode":"compressed32"' /tmp/ores-hybrid-build-info.json
      - name: Run hybrid image
        run: ./target/ores-hybrid --mode=hybrid --platform=linux examples/together.ores
      - name: Load packaged native stdlib under hybrid
        run: ./target/ores-hybrid --mode=hybrid --platform=linux examples/native-core-library.ores
      - name: Run hybrid proper tail-call stress
        run: |
          ./target/ores-hybrid --mode=hybrid --platform=linux examples/proper-tail-call.ores | tee /tmp/ores-hybrid-tail.out
          grep -F "0|0|0" /tmp/ores-hybrid-tail.out
      - name: Run native Oreslang tests under hybrid host
        run: |
          set -euo pipefail
          ./target/ores-hybrid --mode=hybrid --platform=linux examples/native-testing-harness-guards.ores
          timeout 180s ./target/ores-hybrid --mode=hybrid --platform=linux tests/test_std_harness_regressions.ores | tee /tmp/ores-harness-regressions-hybrid.out
          bash scripts/verify_ores_test_receipts.sh /tmp/ores-harness-regressions-hybrid.out native-testing-core 30
          timeout 180s ./target/ores-hybrid --mode=hybrid --platform=linux tests/test_std_harness_scalar_parity_batch4.ores | tee /tmp/ores-harness-scalar-hybrid.out
          bash scripts/verify_ores_test_receipts.sh /tmp/ores-harness-scalar-hybrid.out compiler-scalar-parity-batch4 24
          timeout 180s ./target/ores-hybrid --mode=hybrid --platform=linux tests/test_std_harness_meta_batch4.ores | tee /tmp/ores-harness-meta-hybrid.out
          bash scripts/verify_ores_test_receipts.sh /tmp/ores-harness-meta-hybrid.out harness-meta-batch4 12
          timeout 180s ./target/ores-hybrid --mode=hybrid --platform=linux tests/test_std_harness_accounting_batch5.ores | tee /tmp/ores-accounting-batch5-hybrid.out
          bash scripts/verify_ores_test_receipts.sh /tmp/ores-accounting-batch5-hybrid.out harness-accounting-batch5 16
          timeout 180s ./target/ores-hybrid --mode=hybrid --platform=linux examples/native-testing-regressions-40.ores | tee /tmp/ores-regressions-40-hybrid.out
          bash scripts/verify_ores_test_receipts.sh /tmp/ores-regressions-40-hybrid.out stdlib 40
          timeout 180s ./target/ores-hybrid --mode=hybrid --platform=linux examples/native-testing-runner-matrix.ores | tee /tmp/ores-runner-matrix-hybrid.out
          grep -Fqx "ORES_TEST_RUNNER_MATRIX_OK|cases=12" /tmp/ores-runner-matrix-hybrid.out
          test "$(grep -c '^ORES_TEST_RUNNER_MATRIX_OK|' /tmp/ores-runner-matrix-hybrid.out)" -eq 1
          ./target/ores-hybrid --mode=hybrid --platform=linux examples/native-testing.ores | tee /tmp/ores-testing-hybrid.out
          grep -Fx "ORES_TEST|SUMMARY|total=4|passed=3|failed=0|skipped=1|filtered=0" /tmp/ores-testing-hybrid.out
          test "$(grep -c '^ORES_TEST|SUMMARY|' /tmp/ores-testing-hybrid.out)" -eq 1
          ./target/ores-hybrid --mode=hybrid --platform=linux examples/native-testing-semantics.ores | tee /tmp/ores-testing-semantics-hybrid.out
          grep -Fx "ORES_TEST|SUMMARY|total=1|passed=1|failed=0|skipped=0|filtered=2" /tmp/ores-testing-semantics-hybrid.out
          grep -Fx "ORES_TEST|SUMMARY|total=2|passed=1|failed=1|skipped=0|filtered=0" /tmp/ores-testing-semantics-hybrid.out
          test "$(grep -c '^ORES_TEST|SUMMARY|' /tmp/ores-testing-semantics-hybrid.out)" -eq 2
      - name: Run Orestra integration smoke under native hybrid
        run: |
          set -euo pipefail
          for case in placement-smoke edge-guards workload-state-smoke control-plane-smoke; do
            ./target/ores-hybrid --mode=hybrid --platform=linux "integration/orestra/examples/${case}.ores" | tee "/tmp/${case}-hybrid.out"
          done
          grep -x "orestra-placement-ok" /tmp/placement-smoke-hybrid.out
          grep -x "orestra-edge-guards-ok" /tmp/edge-guards-hybrid.out
          grep -x "orestra-workload-state-ok" /tmp/workload-state-smoke-hybrid.out
          grep -x "orestra-control-plane-ok" /tmp/control-plane-smoke-hybrid.out

  polyglot-isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo "EXACT_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: GraalVM diagnostics
        run: |
          java --version
          native-image --version
      - name: Build Oreslang polyglot isolate library
        run: mvn -B -ntp -Pnative-isolate -DskipTests package
      - name: Locate isolate library
        id: isolate
        shell: bash
        run: |
          lib="$(find target -maxdepth 1 -type f \( -name 'oresvm.so' -o -name 'liboresvm.so' -o -name 'oresvm.dylib' -o -name 'liboresvm.dylib' \) | head -n1)"
          test -n "$lib"
          echo "path=$PWD/$lib" >> "$GITHUB_OUTPUT"
      - name: Run strict program in Oreslang polyglot isolate
        run: timeout 180s mvn -B -ntp -Dpolyglot.engine.IsolateLibrary="${{ steps.isolate.outputs.path }}" -DskipTests exec:java -Dexec.args="--strict-isolate --mode=hybrid --platform=linux examples/together.ores"
      - name: Load packaged native stdlib under strict isolate
        run: timeout 180s mvn -B -ntp -Dpolyglot.engine.IsolateLibrary="${{ steps.isolate.outputs.path }}" -DskipTests exec:java -Dexec.args="--strict-isolate --mode=hybrid --platform=linux examples/native-core-library.ores"
      - name: Resume root await inside strict isolate JNI scope
        run: |
          timeout 180s mvn -B -ntp -Dpolyglot.engine.IsolateLibrary="${{ steps.isolate.outputs.path }}" -DskipTests exec:java -Dexec.args="--strict-isolate --mode=hybrid --platform=linux examples/strict-root-await.ores" | tee /tmp/ores-strict-root-await.out
          grep -x "42" /tmp/ores-strict-root-await.out

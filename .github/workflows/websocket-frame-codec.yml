name: WebSocket protocol contract
on:
  push:
    branches:
      - feat/websocket-frame-codec-20261026
    paths:
      - src/main/java/dev/oreslang/runtime/ActorRuntime.java
      - src/main/java/dev/oreslang/runtime/AsyncNativeIo.java
      - src/main/java/dev/oreslang/runtime/WebSocketFrameCodec.java
      - src/main/java/dev/oreslang/runtime/WebSocketHandshake.java
      - src/main/java/dev/oreslang/runtime/WebSocketOpeningRequest.java
      - src/main/java/dev/oreslang/runtime/WebSocketSessionState.java
      - src/main/java/dev/oreslang/runtime/WebSocketOutboundGate.java
      - src/main/java/dev/oreslang/runtime/WebSocketNioDuplex.java
      - src/main/java/dev/oreslang/runtime/WebSocketActorConnectionLease.java
      - src/main/java/dev/oreslang/runtime/WebSocketRawUpgrade.java
      - src/main/java/dev/oreslang/runtime/WebSocketSocketDeadlineInput.java
      - src/main/java/dev/oreslang/runtime/WebSocketLoopbackListener.java
      - src/test/java/dev/oreslang/runtime/AsyncNativeIoTest.java
      - src/test/java/dev/oreslang/runtime/WebSocketFrameCodecTest.java
      - src/test/java/dev/oreslang/runtime/WebSocketLiveViewWire41Test.java
      - src/test/resources/parity/ores-liveview-wire-v1.json
      - src/test/java/dev/oreslang/runtime/WebSocketHandshakeTest.java
      - src/test/java/dev/oreslang/runtime/WebSocketOpeningRequestTest.java
      - src/test/java/dev/oreslang/runtime/WebSocketSessionStateTest.java
      - src/test/java/dev/oreslang/runtime/WebSocketOutboundGateTest.java
      - src/test/java/dev/oreslang/runtime/WebSocketNioDuplexTest.java
      - src/test/java/dev/oreslang/runtime/WebSocketActorConnectionLeaseTest.java
      - src/test/java/dev/oreslang/runtime/WebSocketActorMailboxDeliveryTest.java
      - src/test/java/dev/oreslang/runtime/WebSocketRawUpgradeTest.java
      - src/test/java/dev/oreslang/runtime/WebSocketLoopbackListenerTest.java
      - src/test/java/dev/oreslang/runtime/WebSocketCounterLiveActorE2ETest.java
      - docs/WEBSOCKET_TRANSPORT_V1.md
      - .github/workflows/websocket-frame-codec.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny-unapproved-runner:
    if: ${{ github.repository != 'ores-truffle-oreslang/oreslang-source.java' || github.event.repository.private != true || github.ref != 'refs/heads/feat/websocket-frame-codec-20261026' || vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER != 'true' || vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA == '' || vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA != github.sha || vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_TREE == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed without source checkout
        shell: bash
        run: |
          echo "::error::Private compiler CI admission denied: require approved ephemeral runner plus exact SHA/tree variables"
          exit 1

  contract:
    if: ${{ github.repository == 'ores-truffle-oreslang/oreslang-source.java' && github.event.repository.private == true && github.ref == 'refs/heads/feat/websocket-frame-codec-20261026' && vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER == 'true' && vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA != '' && vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA == github.sha && vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_TREE != '' }}
    runs-on: [self-hosted, linux, x64, oreslang-private-ephemeral]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify exact private source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ores-truffle-oreslang/oreslang-source.java"
          test "$GITHUB_REF" = "refs/heads/feat/websocket-frame-codec-20261026"
          test "${{ github.event.repository.private }}" = "true"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "${{ vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_TREE }}"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "Verified source SHA: $(git rev-parse HEAD)"
          echo "Verified source tree: $(git rev-parse HEAD^{tree})"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: '25'
          version: '25.3'
          distribution: graalvm
      - name: Execute bounded WebSocket wire contracts
        run: mvn -B -ntp -Dtest='dev.oreslang.runtime.WebSocketFrameCodecTest,dev.oreslang.runtime.WebSocketLiveViewWire41Test,dev.oreslang.runtime.WebSocketHandshakeTest,dev.oreslang.runtime.WebSocketOpeningRequestTest,dev.oreslang.runtime.WebSocketSessionStateTest,dev.oreslang.runtime.WebSocketOutboundGateTest,dev.oreslang.runtime.WebSocketNioDuplexTest,dev.oreslang.runtime.WebSocketActorConnectionLeaseTest,dev.oreslang.runtime.WebSocketActorMailboxDeliveryTest,dev.oreslang.runtime.WebSocketRawUpgradeTest,dev.oreslang.runtime.WebSocketLoopbackListenerTest,dev.oreslang.runtime.WebSocketCounterLiveActorE2ETest,dev.oreslang.runtime.CounterLiveTurnModelConcurrencyTest' test
      - name: Verify server-socket shutdown retirement
        run: mvn -B -ntp -Dtest=dev.oreslang.runtime.AsyncNativeIoTest test

name: Java SQLite durable persistence host (not Oreslang guest parity)
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/persistence/**'
      - 'src/test/java/dev/oreslang/runtime/persistence/**'
      - '.github/workflows/persistence-sidecar-sqlite-durable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jdbc-durable-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned JDBC driver and logging API from Maven Central
        run: |
          set -euo pipefail
          mvn -B -q dependency:get -Dartifact=org.xerial:sqlite-jdbc:3.53.4.0
          mvn -B -q dependency:get -Dartifact=org.slf4j:slf4j-api:2.0.17
      - name: Compile JDBC storage provider with JDK 21 strict warnings
        run: |
          set -euo pipefail
          mkdir -p target/persistence-test
          javac -Xlint:all -Werror -d target/persistence-test \
            src/main/java/dev/oreslang/runtime/persistence/BatchPersistenceSidecar.java \
            src/main/java/dev/oreslang/runtime/persistence/SqlitePersistenceStore.java \
            src/main/java/dev/oreslang/runtime/persistence/SqliteCommandPersistence.java \
            src/test/java/dev/oreslang/runtime/persistence/SqlitePersistenceStoreTestMain.java \
            src/test/java/dev/oreslang/runtime/persistence/SqliteCommandIdentityTestMain.java \
            src/test/java/dev/oreslang/runtime/persistence/SqliteCommandPersistenceTestMain.java
      - name: Run 1000 actor commits, journal restore, epochs, abrupt halt
        run: |
          set -euo pipefail
          JDBC="$HOME/.m2/repository/org/xerial/sqlite-jdbc/3.53.4.0/sqlite-jdbc-3.53.4.0.jar"
          SLF4J="$HOME/.m2/repository/org/slf4j/slf4j-api/2.0.17/slf4j-api-2.0.17.jar"
          sha256sum "$JDBC" "$SLF4J"
          java -ea -cp "target/persistence-test:$JDBC:$SLF4J" \
            dev.oreslang.runtime.persistence.SqlitePersistenceStoreTestMain
          java -ea -cp "target/persistence-test:$JDBC:$SLF4J" \
            dev.oreslang.runtime.persistence.SqliteCommandIdentityTestMain
          java -ea -cp "target/persistence-test:$JDBC:$SLF4J" \
            dev.oreslang.runtime.persistence.SqliteCommandPersistenceTestMain

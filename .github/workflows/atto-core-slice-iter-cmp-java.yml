name: Java Atto core slice/iter/cmp packaged guest
on:
  pull_request:
    paths:
      - 'core/slice.atto'
      - 'core/iter.atto'
      - 'core/cmp.atto'
      - 'src/main/resources/dev/oreslang/core/**'
      - 'src/main/java/dev/oreslang/stdlib/CoreLibrarySources.java'
      - 'src/test/java/dev/oreslang/runtime/AttoCoreSliceIterCmpGuestTest.java'
      - '.github/workflows/atto-core-slice-iter-cmp-java.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD without saved credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact HEAD, clean tree and source/resource blobs
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          for name in slice iter cmp; do
            test "$(git hash-object core/$name.atto)" = "$(git hash-object src/main/resources/dev/oreslang/core/$name.atto)"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile/execute real imported core guest and fail-closed admission
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=AttoCoreSliceIterCmpGuestTest -DfailIfNoTests=true test
          echo "ATTO_CORE_SIC_JAVA_GUEST_EXECUTED=TRUE"
      - name: Preserve JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atto-core-sic-java-evidence
          path: target/surefire-reports/*AttoCoreSliceIterCmpGuestTest*
          if-no-files-found: warn

name: Visibility export safety proof

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/ast/VisibilityPolicy.java'
      - 'src/main/java/dev/oreslang/ast/Ast.java'
      - 'src/main/java/dev/oreslang/compiler/ImportGraph.java'
      - 'src/main/java/dev/oreslang/compiler/IncrementalCompiler.java'
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/test/java/dev/oreslang/ModuleVisibilityProofTest.java'
      - 'verification/visibility/**'
      - '.github/workflows/visibility-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abstract-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exhaustively enumerate export visibility states
        run: python3 verification/visibility/check_model.py

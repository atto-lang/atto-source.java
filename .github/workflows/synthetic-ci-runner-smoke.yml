name: Synthetic CI runner smoke

on:
  push:
    branches:
      - ci/synthetic-policy-smoke-20261020
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm runner executes commands
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import unittest

          class SyntheticPolicySmoke(unittest.TestCase):
              def test_default_deny(self):
                  approved = []
                  self.assertFalse(any(x == "unapproved/carrier" for x in approved))
              def test_sha_binding(self):
                  source = hashlib.sha256(b"synthetic source only").hexdigest()
                  self.assertNotEqual(source, hashlib.sha256(b"modified source").hexdigest())
              def test_public_destination_rejected(self):
                  self.assertFalse({"private": False}["private"])
              def test_runner_provenance(self):
                  self.assertEqual(len(os.environ["GITHUB_SHA"]), 40)

          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromTestCase(SyntheticPolicySmoke))
          print(json.dumps({"commit": os.environ["GITHUB_SHA"],
                            "tests_run": result.testsRun,
                            "failures": len(result.failures),
                            "errors": len(result.errors),
                            "synthetic_only": True}))
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY

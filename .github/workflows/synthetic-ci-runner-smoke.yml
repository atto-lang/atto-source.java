name: Synthetic CI runner smoke

on:
  push:
    branches:
      - ci/synthetic-policy-smoke-20261020
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Pure runner-admission probe: no checkout, no secrets, no source, no Python.
# A red job with no steps is an infrastructure/policy failure, not compiler CI.
permissions: {}

jobs:
  synthetic-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm source-free runner can execute shell commands
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS:-}" != "Linux" ]]; then
            echo 'SOURCE_FREE_RUNNER_PROBE_FAILED: expected a Linux runner' >&2
            exit 1
          fi
          if [[ ! "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'SOURCE_FREE_RUNNER_PROBE_FAILED: malformed GitHub source event SHA' >&2
            exit 1
          fi
          if [[ "${GITHUB_REPOSITORY:-}" != 'ores-truffle-oreslang/oreslang-source.java' ]]; then
            echo 'SOURCE_FREE_RUNNER_PROBE_FAILED: unexpected repository identity' >&2
            exit 1
          fi
          printf 'SOURCE_FREE_RUNNER_PROBE_PASSED repo=%s event_sha=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"

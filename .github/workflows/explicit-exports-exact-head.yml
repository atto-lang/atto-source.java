name: explicit-exports-exact-head

on:
  pull_request:
    paths:
      - "src/main/java/dev/oreslang/ast/Ast.java"
      - "src/main/java/dev/oreslang/ast/AnnotationExpander.java"
      - "src/main/java/dev/oreslang/parser/Parser.java"
      - "src/main/java/dev/oreslang/compiler/ExportResolver.java"
      - "src/main/java/dev/oreslang/compiler/ExportAbiMetadata.java"
      - "src/main/java/dev/oreslang/compiler/OresCompiler.java"
      - "src/main/java/dev/oreslang/compiler/TreeShaker.java"
      - "src/main/java/dev/oreslang/compiler/IncrementalCompiler.java"
      - "src/main/java/dev/oreslang/compiler/ImportGraph.java"
      - "src/main/java/dev/oreslang/types/TypeChecker.java"
      - "src/main/java/dev/oreslang/nodes/OresEvalRootNode.java"
      - "src/test/java/dev/oreslang/ExplicitExportSyntaxTest.java"
      - "src/test/java/dev/oreslang/ExplicitExportSemanticMatrixTest.java"
      - "src/test/java/dev/oreslang/ExplicitVisibilityContractTest.java"
      - "src/test/java/dev/oreslang/ExplicitExportLinkedImportTest.java"
      - "src/test/java/dev/oreslang/ModuleContractHardeningTest.java"
      - ".github/workflows/explicit-exports-exact-head.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exports:
    name: Java explicit export v1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          java --version
      - name: Compile Java sources
        run: mvn -B -ntp -DskipTests compile
      - name: Run explicit export v1 tests
        run: >-
          mvn -B -ntp
          -Dtest=ExplicitExportSyntaxTest,ExplicitExportSemanticMatrixTest,ExplicitVisibilityContractTest,ExplicitExportLinkedImportTest,ModuleContractHardeningTest
          test

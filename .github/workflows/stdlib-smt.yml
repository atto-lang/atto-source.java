name: Native core and stdlib SMT safety gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'stdlib/core.ores'
      - 'stdlib/math.ores'
      - 'stdlib/trace.ores'
      - 'stdlib/testing.ores'
      - 'formal/stdlib/**'
      - 'examples/native-core-smt-refinement.ores'
      - 'examples/native-math-refinement.ores'
      - 'examples/native-math-overflow.ores'
      - '.github/workflows/stdlib-smt.yml'
  push:
    branches: [main]
    paths:
      - 'stdlib/core.ores'
      - 'stdlib/math.ores'
      - 'stdlib/trace.ores'
      - 'stdlib/testing.ores'
      - 'formal/stdlib/**'
      - 'examples/native-core-smt-refinement.ores'
      - 'examples/native-math-refinement.ores'
      - 'examples/native-math-overflow.ores'
      - '.github/workflows/stdlib-smt.yml'
permissions:
  contents: read
jobs:
  formal-stdlib:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enforce exact checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install SMT solver and Rust verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 rustc
      - name: Record exact inputs and tool versions
        run: |
          git rev-parse HEAD
          git hash-object stdlib/core.ores stdlib/trace.ores stdlib/testing.ores
          rustc --version
          z3 -version
      - name: Rust gate regression tests
        run: |
          rustc --edition=2021 --test formal/stdlib/verify.rs -o "${RUNNER_TEMP}/ores-stdlib-formal-tests"
          "${RUNNER_TEMP}/ores-stdlib-formal-tests"
      - name: SMT proof obligations and negative controls
        run: |
          rustc --edition=2021 formal/stdlib/verify.rs -o "${RUNNER_TEMP}/ores-stdlib-formal"
          timeout 90s "${RUNNER_TEMP}/ores-stdlib-formal"
  core-guest-refinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enforce exact checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Execute actual source-owned core from exact checkout
        run: |
          set -euo pipefail
          git rev-parse HEAD
          mvn -B -ntp -DskipTests compile
          mvn -B -ntp exec:java -Dexec.args="examples/native-core-smt-refinement.ores" | tee "${RUNNER_TEMP}/core-refinement.out"
          grep -Fx 'CORE-SMT-REFINEMENT-OK' "${RUNNER_TEMP}/core-refinement.out"
      - name: Verify default checked i64 arithmetic in real Graal guest
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=DefaultCheckedI64ArithmeticTest -DfailIfNoTests=true test
      - name: Execute native Oreslang Math refinement and MIN overflow boundary
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests compile
          mvn -B -ntp exec:java -Dexec.args="examples/native-math-refinement.ores" | tee "${RUNNER_TEMP}/math-refinement.out"
          grep -Fx 'NATIVE-MATH-OK' "${RUNNER_TEMP}/math-refinement.out"
          set +e
          mvn -B -ntp exec:java -Dexec.args="examples/native-math-overflow.ores" >"${RUNNER_TEMP}/math-overflow.out" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          ! grep -F 'wrapped instead of overflowing' "${RUNNER_TEMP}/math-overflow.out"
      - name: Run real Oreslang testing.run_suite guest refinement
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests compile
          mvn -B -ntp exec:java -Dexec.args="examples/native-testing.ores" | tee "${RUNNER_TEMP}/testing-refinement.out"
          grep -F 'ORES_TEST|SUMMARY|total=4|passed=3|failed=0|skipped=1|filtered=0' "${RUNNER_TEMP}/testing-refinement.out"
          mvn -B -ntp -DskipTests compile
          mvn -B -ntp exec:java -Dexec.args="examples/native-testing-semantics.ores" | tee "${RUNNER_TEMP}/testing-semantics.out"
          grep -F 'ORES_TEST|SUMMARY|total=1|passed=1|failed=0|skipped=0|filtered=2' "${RUNNER_TEMP}/testing-semantics.out"
          grep -F 'ORES_TEST|SUMMARY|total=2|passed=1|failed=1|skipped=0|filtered=0' "${RUNNER_TEMP}/testing-semantics.out"

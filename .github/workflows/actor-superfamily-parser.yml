name: AttoLang abstract actor parser admission (NOT guest execution)
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/test/java/dev/oreslang/ActorSuperfamilyParserTest.java'
      - 'src/test/java/dev/oreslang/ActorSuperfamilyTypeCheckTest.java'
      - '.github/workflows/actor-superfamily-parser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-actor-superfamily-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify checkout is the exact source PR head
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          git ls-files src/main/java/dev/oreslang/parser/Parser.java \
            src/test/java/dev/oreslang/ActorSuperfamilyParserTest.java
      - name: Compile parser and run focused JUnit AST admission
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -B -ntp -Dtest=ActorSuperfamilyParserTest,ActorSuperfamilyTypeCheckTest -DfailIfNoTests=true test

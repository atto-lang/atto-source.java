name: Typed effects v1 Java compiler (not guest AOT)
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/compiler/CompilerTypedEffectV1.java'
      - 'src/main/java/dev/oreslang/compiler/OresCompiler.java'
      - 'src/test/java/dev/oreslang/CompilerTypedEffectV1Test.java'
      - 'src/test/java/dev/oreslang/compiler/CompilerTypedEffectV1SelfTest.java'
      - '.github/workflows/typed-effects-v1-java.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typed-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Real Java frontend and source-only effect tests (not Graal guest)
        run: mvn -B -ntp -Dtest=CompilerTypedEffectV1Test test

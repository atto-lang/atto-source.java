name: Virtual actor directory inspection exact-head host tests
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorRuntime.java'
      - 'src/main/java/dev/oreslang/runtime/VirtualActorActivationRegistry.java'
      - 'src/main/java/dev/oreslang/runtime/VirtualActorSupervisorDirectory.java'
      - 'src/main/java/dev/oreslang/runtime/VirtualActorAddressV1.java'
      - 'src/main/java/dev/oreslang/runtime/VirtualActorDirectoryInspection.java'
      - 'src/test/java/dev/oreslang/runtime/VirtualActorDirectoryInspectionTest.java'
      - 'src/test/java/dev/oreslang/runtime/VirtualActorSupervisorDirectoryTest.java'
      - 'src/test/java/dev/oreslang/runtime/VirtualActorIdAddressRestartTest.java'
      - 'src/test/java/dev/oreslang/ExecutableVirtualActorStateContainerTest.java'
      - '.github/workflows/virtual-actor-directory-inspection.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Trusted manual execution runner (PR events stay GitHub-hosted)'
        type: choice
        default: github-hosted-linux
        options:
          - github-hosted-linux
          - self-hosted-linux
permissions:
  contents: read
concurrency:
  group: virtual-actor-inspection-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  local-registry-inspection:
    # Self-hosted execution is opt-in for an authorized manual dispatch only;
    # never run arbitrary pull_request code on a self-hosted machine.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-linux' && fromJSON('["self-hosted", "linux"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "HEAD_SHA=$EXPECTED_SHA"
          echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
          git hash-object src/main/java/dev/oreslang/runtime/ActorRuntime.java
          git hash-object src/main/java/dev/oreslang/runtime/VirtualActorActivationRegistry.java
          git hash-object src/main/java/dev/oreslang/runtime/VirtualActorSupervisorDirectory.java
          git hash-object src/main/java/dev/oreslang/runtime/VirtualActorAddressV1.java
          git hash-object src/main/java/dev/oreslang/runtime/VirtualActorDirectoryInspection.java
          git hash-object src/test/java/dev/oreslang/runtime/VirtualActorDirectoryInspectionTest.java
          git hash-object src/test/java/dev/oreslang/runtime/VirtualActorSupervisorDirectoryTest.java
          git hash-object src/test/java/dev/oreslang/runtime/VirtualActorIdAddressRestartTest.java
          printf 'RUN_ID=%s ATTEMPT=%s RUNNER=%s\\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
          cache: maven
      - name: Run virtual actor address, inspection and existing lifecycle regression tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=VirtualActorDirectoryInspectionTest,VirtualActorSupervisorDirectoryTest,VirtualActorIdAddressRestartTest,ExecutableVirtualActorStateContainerTest -DfailIfNoTests=true test
          for suite in VirtualActorDirectoryInspectionTest VirtualActorSupervisorDirectoryTest VirtualActorIdAddressRestartTest ExecutableVirtualActorStateContainerTest; do
            report="target/surefire-reports/TEST-dev.oreslang.runtime.${suite}.xml"
            if [ "$suite" = "VirtualActorSupervisorDirectoryTest" ]; then
              report="target/surefire-reports/TEST-dev.oreslang.runtime.${suite}.xml"
            fi
            if [ "$suite" = "ExecutableVirtualActorStateContainerTest" ]; then
              report="target/surefire-reports/TEST-dev.oreslang.${suite}.xml"
            fi
            test -s "$report"
            # A zero-test/missing suite is not evidence. Reject failures,
            # errors and skips, and require a positive per-suite test count.
            grep -Eq '<testsuite[^>]*tests="[1-9][0-9]*"' "$report"
            ! grep -Eq 'failures="[1-9]|errors="[1-9]|skipped="[1-9]' "$report"
          done

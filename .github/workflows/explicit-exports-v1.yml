name: explicit-exports-v1

on:
  push:
    branches:
      - "feat/explicit-exports-v1-java-20261025"
  pull_request:
    paths:
      - "src/main/java/dev/oreslang/ast/Ast.java"
      - "src/main/java/dev/oreslang/ast/AnnotationExpander.java"
      - "src/main/java/dev/oreslang/parser/Parser.java"
      - "src/main/java/dev/oreslang/compiler/ExportResolver.java"
      - "src/main/java/dev/oreslang/compiler/IncrementalCompiler.java"
      - "src/main/java/dev/oreslang/compiler/ImportGraph.java"
      - "src/main/java/dev/oreslang/compiler/SourceExportTable.java"
      - "src/main/java/dev/oreslang/compiler/ExportMetadataCollector.java"
      - "src/main/java/dev/oreslang/compiler/OresCompiler.java"
      - "src/main/java/dev/oreslang/compiler/TreeShaker.java"
      - "src/main/java/dev/oreslang/nodes/OresEvalRootNode.java"
      - "src/main/java/dev/oreslang/interop/MixedJavaCompiler.java"
      - "src/main/java/dev/oreslang/types/OwnershipChecker.java"
      - "src/main/java/dev/oreslang/types/TypeChecker.java"
      - "src/test/java/dev/oreslang/ExplicitExportSyntaxTest.java"
      - "src/test/java/dev/oreslang/ExplicitExportLinkedRuntimeTest.java"
      - "src/test/java/dev/oreslang/ExplicitExportIncrementalAbiTest.java"
      - "src/test/java/dev/oreslang/ExplicitExportModuleShapeTest.java"
      - "src/test/java/dev/oreslang/MixedSourceInteropTest.java"
      - "docs/grammar.ebnf"
      - ".github/workflows/explicit-exports-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explicit-exports-v1-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-head:
    name: exact-head export parser and resolver
    # Never run fork PR code on the organization's trusted self-hosted runner.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm runner toolchain
        run: |
          uname -a
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          java -version
          mvn -version
          java -version 2>&1 | grep -Eq 'version "(25|25\.)|openjdk version "25'
      - name: Compile exact head
        run: mvn -B -ntp -DskipTests compile
      - name: Run explicit export regression
        run: mvn -B -ntp -Dtest=ExplicitExportSyntaxTest,ExplicitExportLinkedRuntimeTest,ExplicitExportIncrementalAbiTest,ExplicitExportModuleShapeTest,MixedSourceInteropTest test

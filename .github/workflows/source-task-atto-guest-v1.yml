name: Real Java .atto Task guest slices (exact head)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task-jvm-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source commit
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: '25'
          version: '25.3'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Build JVM guest launcher
        run: |
          mvn -B -ntp -DskipTests package
          mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile=target/conformance-classpath.txt
      - name: Static shell syntax and Bash expansion admission
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/test-source-task-v1-java.sh
          if grep -Fq '\${' scripts/test-source-task-v1-java.sh; then echo 'Escaped Bash expansion detected' >&2; exit 1; fi
      - name: Execute actual .atto source guest (backend-specific slice only)
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          bash scripts/test-source-task-v1-java.sh | tee target/task-v1-guest.log
          test "$(grep -c '^JAVA_FUTURE_TASK_ATTO_GUEST_PASS|' target/task-v1-guest.log)" = 2
          test "$(grep -c '^JAVA_TASK_CAPTURE_REJECT_PASS|' target/task-v1-guest.log)" = 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task-v1-java-source-local
          path: target/task-v1-guest.log
          if-no-files-found: ignore

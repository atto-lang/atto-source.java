name: Atto Java explicit-pipe lambda source and JVM guest conformance
# Source-local only: no cross-org Git tree mirroring or protected-main bypass.
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/test/java/dev/oreslang/*Lambda*Test.java'
      - 'src/test/java/dev/oreslang/AttoFourLambdaStylesConformanceTest.java'
      - 'tests/fixtures/lambda-four-styles-v1/**'
      - '.github/workflows/atto-lambda-explicit-pipes-source-ci.yml'
  push:
    branches:
      - feat/lambda-four-void-spellings-20261120

permissions:
  contents: read

jobs:
  real-source-parser-and-jvm-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Authenticate exact source head and relevant Git blob IDs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "ATTO_SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "ATTO_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          for file in \
            src/main/java/dev/oreslang/parser/Parser.java \
            src/main/java/dev/oreslang/types/TypeChecker.java \
            src/test/java/dev/oreslang/AttoExplicitPipeLambdaHeadParityTest.java \
            src/test/java/dev/oreslang/AttoFourLambdaStylesConformanceTest.java; do
            test -f "$file"
            test "$(git hash-object "$file")" = "$(git rev-parse "HEAD:$file")"
            printf 'ATTO_SOURCE_BLOB=%s:%s\n' "$file" "$(git rev-parse "HEAD:$file")"
          done
      - name: Setup GraalVM JDK25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: graalvm
          java-version: '25'
      - name: Run real parser, type checker and Java/Truffle guest suites
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -DfailIfNoTests=true \
            -Dtest=AttoExplicitPipeLambdaHeadParityTest,LambdaParameterOrderTest,AttoFourLambdaStylesConformanceTest \
            clean test
      - name: Reject empty or skipped required JUnit suites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites = {
              "dev.oreslang.AttoExplicitPipeLambdaHeadParityTest": {
                  "explicitPipesRemainAdmittedInBothCanonicalEditions",
                  "barePlaceholderAndBareNamedHeadsNeverBecomeLambdaExpressions",
                  "bareHeadsInCallArgumentsCannotEvadeTheExpressionGate",
              },
              "dev.oreslang.LambdaParameterOrderTest": {
                  "fourRequestedVoidLambdaStylesHaveSameTypeAndRuntimeContract",
                  "versionedAttoLambdasRequirePipeDelimitersWithoutBreakingLegacyParser",
              },
              "dev.oreslang.AttoFourLambdaStylesConformanceTest": {
                  "fixtureBlobsMatchConformancePr240",
                  "fourLambdaHeadersExecuteAsCheckedAttoGuestsReturning42",
                  "malformedLambdasRejectBeforeGuestExecution",
              },
          }
          for name, expected in suites.items():
              path = Path("target/surefire-reports") / f"TEST-{name}.xml"
              if not path.is_file() or path.is_symlink() or path.stat().st_size == 0:
                  raise SystemExit(f"missing/symlink/empty required JUnit suite: {name}")
              root = ET.parse(path).getroot()
              tests = root.findall(".//testcase")
              names = [x.get("name") for x in tests]
              if not tests or len(names) != len(set(names)) or not expected.issubset(names):
                  raise SystemExit(f"missing/duplicate JUnit cases: {name}")
              if any(root.find(f".//{tag}") is not None for tag in ("error", "failure", "skipped")):
                  raise SystemExit(f"JUnit execution not clean: {name}")
              totals = {k: int(root.get(k,"0")) for k in ("tests","errors","failures","skipped")}
              if totals["tests"] != len(tests) or any(totals[k] for k in ("errors","failures","skipped")):
                  raise SystemExit(f"invalid JUnit totals for {name}: {totals}")
              print(f"ATTO_JAVA_LAMBDA_SUITE_EXECUTED={name}:{len(tests)}")
          print("ATTO_JAVA_LAMBDA_JVM_GUEST=EXECUTED_BY_JUNIT")
          print("ATTO_GRAAL_NATIVE_IMAGE=NOT_EXECUTED")
          PY

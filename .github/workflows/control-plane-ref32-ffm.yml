name: Control-plane Ref32 FFM host (not guest)
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ControlPlaneArena32.java'
      - 'src/main/java/dev/oreslang/runtime/ActorRuntime.java'
      - 'src/test/java/dev/oreslang/runtime/ControlPlaneArena32Test.java'
      - 'src/test/java/dev/oreslang/runtime/ActorRuntimeNativeControlCountersTest.java'
      - '.github/workflows/control-plane-ref32-ffm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-host-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact immutable head, not synthetic PR merge
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile standalone native FFM host arena with all warnings fatal
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          javac -Xlint:all -Werror -d "$temp"             src/main/java/dev/oreslang/runtime/ControlPlaneArena32.java             src/test/java/dev/oreslang/runtime/ControlPlaneArena32Test.java
          java -cp "$temp" dev.oreslang.runtime.ControlPlaneArena32Test | tee "$RUNNER_TEMP/control-ffm-java.log"
          grep -Fx 'PASS java control i128 coherent concurrent host (NOT compiled Atto)' "$RUNNER_TEMP/control-ffm-java.log"
      - name: Run Java 25 actor runtime native-control integration (host only)
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dmaven.compiler.release=25 -Dtest=ActorRuntimeNativeControlCountersTest test
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("target/surefire-reports/TEST-dev.oreslang.runtime.ActorRuntimeNativeControlCountersTest.xml")
          if not path.is_file():
              raise SystemExit("missing JUnit runtime control integration report")
          report = ET.parse(path).getroot()
          for key, wanted in [("tests", 1), ("failures", 0), ("errors", 0), ("skipped", 0)]:
              if int(report.attrib.get(key, "-1")) != wanted:
                  raise SystemExit(f"unexpected test result {key}: {report.attrib}")
          marker = "PASS java actor-runtime native control snapshot managed-byte delta=0 (HOST ONLY)"
          stdout = "".join(elem.text or "" for elem in report.iter("system-out"))
          if marker not in stdout:
              raise SystemExit("missing actual warmed native snapshot allocation receipt")
          print("PASS java JDK25 runtime i128 native root integration JUnit receipt (host only)")
          PY
      - name: Scope of test
        run: echo 'HOST-ONLY Java FFM and ActorRuntime control integration; no compiled Atto guest or whole-process zero GC'

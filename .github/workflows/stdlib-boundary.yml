name: Native Oreslang stdlib boundary
on:
  pull_request:
    paths:
      - 'stdlib/**'
      - 'src/main/java/dev/oreslang/stdlib/CoreLibrarySources.java'
      - 'src/main/java/dev/oreslang/runtime/LinkedProgramRunner.java'
      - 'src/main/resources/dev/oreslang/core/**'
      - 'src/test/java/dev/oreslang/runtime/CoreNumericSingleOwnerTest.java'
      - 'src/test/java/dev/oreslang/runtime/NativeCoreLibraryTest.java'
      - 'tools/stdlib-boundary-audit/**'
      - '.github/workflows/stdlib-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'stdlib/**'
      - 'src/main/java/dev/oreslang/stdlib/CoreLibrarySources.java'
      - 'src/main/java/dev/oreslang/runtime/LinkedProgramRunner.java'
      - 'src/main/resources/dev/oreslang/core/**'
      - 'src/test/java/dev/oreslang/runtime/CoreNumericSingleOwnerTest.java'
      - 'src/test/java/dev/oreslang/runtime/NativeCoreLibraryTest.java'
      - 'tools/stdlib-boundary-audit/**'
      - '.github/workflows/stdlib-boundary.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy
      - name: Rust tests
        run: cargo test --locked --manifest-path tools/stdlib-boundary-audit/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --locked --manifest-path tools/stdlib-boundary-audit/Cargo.toml --all-targets -- -D warnings
      - name: Native stdlib boundary check
        run: cargo run --locked --manifest-path tools/stdlib-boundary-audit/Cargo.toml -- stdlib
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Execute canonical core single-owner JVM regressions
        run: mvn -B -ntp -Dores.runtime.carriers=native -Dtest=CoreNumericSingleOwnerTest,NativeCoreLibraryTest test

# Source-owning repository only. No external private-source mirrors.
# Zero-step Actions failures are runner admission failures, not guest evidence.
name: AttoLang canonical native test harness JVM
on:
  pull_request:
    paths:
      - 'atto-test.toml'
      - 'tests/test_atto_harness_migration.sh'
      - 'stdlib/testing.atto'
      - 'src/main/java/dev/oreslang/**'
      - 'src/test/java/dev/oreslang/Atto*Test.java'
      - 'examples/native-testing*.atto'
      - 'tests/test_std_harness_*.atto'
      - 'tests/native-testing-regressions-40.expected-ids.txt'
      - 'scripts/ci/AttoHarnessGuestReceiptVerifier.java'
      - '.github/workflows/atto-native-harness-jvm.yml'
  push:
    branches: ['integration/atto-test-harness-2460-2395-20261103']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  native-atto-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact AttoLang integration HEAD
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact pinned Git source tree and clean checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo "ATTO_HARNESS_EXACT_HEAD=$EXPECTED_HEAD"
          echo "ATTO_HARNESS_EXACT_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Reject forged and legacy source-only test evidence
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_atto_harness_migration.sh
          bash tests/test_native_test_manifests.sh
          bash tests/test_ores_test_expected_ids.sh
      - name: Setup GraalVM Java 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify independent JUnit report admission oracles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atto-harness-gates"
          javac -Xlint:all -Werror -d "$RUNNER_TEMP/atto-harness-gates" \
            scripts/ci/AttoGuestReceiptVerifier.java \
            scripts/ci/AttoHarnessGuestReceiptVerifier.java
          java -cp "$RUNNER_TEMP/atto-harness-gates" AttoGuestReceiptVerifier --self-test
          java -cp "$RUNNER_TEMP/atto-harness-gates" AttoHarnessGuestReceiptVerifier --self-test
      - name: Compile and execute real AttoLang guest acceptance tests
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mvn -B -ntp \
            -Dtest=AttoCanonicalFixtureGuestTest,AttoImportedModuleClassGuestTest,AttoTestingStdlibSourceTest,AttoNativeTestingGuestIntegrationTest \
            -DfailIfNoTests=true test
          java -cp "$RUNNER_TEMP/atto-harness-gates" AttoGuestReceiptVerifier \
            "$EXPECTED_HEAD" target/surefire-reports
          java -cp "$RUNNER_TEMP/atto-harness-gates" AttoHarnessGuestReceiptVerifier \
            "$EXPECTED_HEAD" target/surefire-reports
          echo "ATTO_HARNESS_COMPILER_GUEST_JUNIT_ACCEPTED head=$EXPECTED_HEAD methods=13"
      - name: Execute canonical 40-case AttoLang guest and verify exact identities
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s mvn -B -ntp -DskipTests exec:java \
            -Dexec.args="examples/native-testing-regressions-40.atto" \
            | tee "$RUNNER_TEMP/atto-40-guest.stdout"
          bash scripts/verify_ores_test_receipts.sh \
            "$RUNNER_TEMP/atto-40-guest.stdout" stdlib 40 \
            tests/native-testing-regressions-40.expected-ids.txt
          echo "ATTO_HARNESS_40_EXECUTED_AND_ORDERED"
      - name: Execute four compiler-admitted negative AttoLang guests
        shell: bash
        run: |
          set -euo pipefail
          for variant in empty skipped filtered failed; do
            case "$variant" in
              empty) summary="total=0|passed=0|failed=0|skipped=0|filtered=0" ;;
              skipped) summary="total=1|passed=0|failed=0|skipped=1|filtered=0" ;;
              filtered) summary="total=0|passed=0|failed=0|skipped=0|filtered=1" ;;
              failed) summary="total=1|passed=0|failed=1|skipped=0|filtered=0" ;;
            esac
            path="examples/native-testing-negative-${variant}.atto"
            timeout 180s mvn -B -ntp -DskipTests exec:java -Dexec.args="--check $path"
            out="$RUNNER_TEMP/atto-negative-${variant}.stdout"
            set +e
            timeout 180s mvn -B -ntp -DskipTests exec:java -Dexec.args="$path" > "$out" 2>&1
            status=$?
            set -e
            if [ "$status" -eq 0 ] || [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "expected guest runtime rejection; got exit $status ($variant)" >&2
              exit 1
            fi
            grep -Fqx "ORES_TEST|SUMMARY|${summary}" "$out"
            if [ "$variant" = failed ]; then
              grep -Fq "native AttoLang test suite failed" "$out"
            else
              grep -Fq "native AttoLang test suite was empty or only skipped/filtered" "$out"
            fi
            if grep -Fq "UNEXPECTED_SUCCESS" "$out"; then
              echo "guest continued past require_success: $variant" >&2
              exit 1
            fi
          done
          echo "ATTO_HARNESS_FOUR_NEGATIVES_COMPILER_ADMITTED_AND_REJECTED"
      - name: Upload exact-head JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atto-canonical-test-harness-guest-junit
          path: |
            target/surefire-reports/*AttoCanonicalFixtureGuestTest*
            target/surefire-reports/*AttoImportedModuleClassGuestTest*
            target/surefire-reports/*AttoTestingStdlibSourceTest*
            target/surefire-reports/*AttoNativeTestingGuestIntegrationTest*
          if-no-files-found: warn

name: CGL GraalVM Linux pilot (not RT certification)
on:
  pull_request:
    paths:
      - 'scripts/cgl-*'
      - 'tests/test_cgl_preflight.py'
      - 'docs/CGL_DEPLOYMENT.md'
      - '.github/workflows/cgl-compat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graal-cgl-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Preflight negative matrix and Linux capabilities
        run: |
          python3 -m unittest discover -s tests -p test_cgl_preflight.py -v
          python3 scripts/cgl-preflight.py
      - name: Build GraalVM launcher and execute actual source
        run: |
          mvn -B -ntp -DskipTests package
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"
  graal-cgl-native-launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Package native launcher and inspect ELF64
        run: |
          mvn -B -ntp -Pnative-aot -DskipTests package
          python3 scripts/cgl-preflight.py --binary target/ores-aot
      - name: Execute native launcher with real Oreslang source
        run: ./target/ores-aot --mode=aot --platform=linux examples/together.ores

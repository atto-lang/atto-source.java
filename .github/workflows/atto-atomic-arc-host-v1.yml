name: Atto atomic Arc/Weak host runtime v1
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/AtomicSharedCellV1.java'
      - 'src/test/java/dev/oreslang/runtime/AtomicSharedCellV1*.java'
      - 'scripts/run-atomic-arc-host-v1.sh'
      - '.github/workflows/atto-atomic-arc-host-v1.yml'
  push:
    paths:
      - 'src/main/java/dev/oreslang/runtime/AtomicSharedCellV1.java'
      - 'src/test/java/dev/oreslang/runtime/AtomicSharedCellV1*.java'
      - 'scripts/run-atomic-arc-host-v1.sh'
      - '.github/workflows/atto-atomic-arc-host-v1.yml'
jobs:
  host-strong-weak:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute JDK host ownership and racing weak-upgrade checks
        run: bash scripts/run-atomic-arc-host-v1.sh

name: Actor Sync source guest progress (Java/Graal)
on:
  pull_request:
    paths:
      - 'stdlib/actor_sync.ores'
      - 'stdlib/actor_sync.atto'
      - 'pom.xml'
      - 'src/main/java/dev/oreslang/interop/MixedSourceUnit.java'
      - 'src/main/java/dev/oreslang/config/OresProjectConfig.java'
      - 'src/main/java/dev/oreslang/stdlib/CoreLibrarySources.java'
      - 'src/test/java/dev/oreslang/config/OresProjectConfigTest.java'
      - 'src/test/java/dev/oreslang/runtime/NativeCoreLibraryTest.java'
      - 'src/test/java/dev/oreslang/ActorSyncStdlibTest.java'
      - 'src/test/resources/actor-sync-v1/**'
      - '.github/workflows/actor-sync-source-guest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-head-graal-source-guest:
    name: Exact-head AttoLang source guest semantics (NOT durable sync)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact revision and pinned .atto/.ores fixture identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          test "$(git hash-object stdlib/actor_sync.ores)" = "3aae079ffe3be8bc2eb2b77bacbd6bddf7e1ce65"
          test "$(git hash-object stdlib/actor_sync.atto)" = "3aae079ffe3be8bc2eb2b77bacbd6bddf7e1ce65"
          test "$(git hash-object src/test/resources/actor-sync-v1/cursor-progression.ores)" = "a454e7107ab62bbaa38cca44627c794b3bf0d4c2"
          test "$(git hash-object src/test/resources/actor-sync-v1/cross-epoch-delta-reject.ores)" = "0f93036cf7ed0581273444159a6a619b75505020"
          test "$(git hash-object src/test/resources/actor-sync-v1/highest-epoch-fence.ores)" = "ae9063472b39f554fa195d79283bd9952e57483d"
          test "$(git hash-object src/test/resources/actor-sync-v1/cursor-progression.atto)" = "a454e7107ab62bbaa38cca44627c794b3bf0d4c2"
          test "$(git hash-object src/test/resources/actor-sync-v1/cross-epoch-delta-reject.atto)" = "0f93036cf7ed0581273444159a6a619b75505020"
          test "$(git hash-object src/test/resources/actor-sync-v1/highest-epoch-fence.atto)" = "ae9063472b39f554fa195d79283bd9952e57483d"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Compile compiler sources and record exact built artifact
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests package
          sha256sum target/*.jar
          java -version
      - name: Execute Oreslang guest progress fixture with JUnit
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=ActorSyncStdlibTest,OresProjectConfigTest,NativeCoreLibraryTest test
          echo "ACTOR_SYNC_SOURCE_GUEST_PROGRESS_ONLY=${{ github.event.pull_request.head.sha || github.sha }}"

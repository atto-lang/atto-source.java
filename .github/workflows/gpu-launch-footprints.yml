name: AttoLang GPU host footprint preflight

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/compiler/GpuLaunchFootprints.java'
      - 'src/test/java/dev/oreslang/GpuLaunchFootprints*.java'
      - 'tests/gpu-launch-footprints/**'
      - 'scripts/verify-gpu-launch-footprints.sh'
      - '.github/workflows/gpu-launch-footprints.yml'

permissions:
  contents: read

jobs:
  checked-gpu-host-footprints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable PR source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile exact source and compare 2048 host-only loan-oracle cases
        shell: bash
        env:
          GPU_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/verify-gpu-launch-footprints.sh | tee "$RUNNER_TEMP/gpu-host-footprints-receipt.txt"

      - name: Upload source-identity and execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-host-footprints-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gpu-host-footprints-receipt.txt
          if-no-files-found: warn
          retention-days: 7

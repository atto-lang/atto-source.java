name: AttoLang canonical .atto compiler gate
on:
  push:
    branches:
      - feat/attolang-canonical-source-import-manifest-20261103
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-atto-linked-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source commit without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record source commit and tree identity before building
        shell: bash
        env:
          ATTO_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$ATTO_EXPECTED_HEAD"
          test "$(git write-tree)" = "$(git rev-parse 'HEAD^{tree}')"
          echo "ATTO_SOURCE_HEAD=$actual"
          echo "ATTO_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          test -f examples/atto-canonical/.atto.pkg.toml
          test -f examples/atto-canonical/src/main.atto
          test -f examples/atto-canonical/src/value.atto
          # Immutable source-byte parity with the native LLVM test fixture.
          test "$(git hash-object --no-filters examples/atto-native-parity/main.atto)" =             '5ffe955025a664d5f069e441a9cbcaa9227d06a8'
          test "$(git hash-object --no-filters examples/atto-native-parity/lib.atto)" =             '62ddcdb8c1cfe60da8aca47734c46bca7bc9ae56'
          test "$(git hash-object --no-filters examples/atto-native-parity/.atto.pkg.toml)" =             '66aa65f18ffcdbb743f9793249b146da083542ce'
          echo 'ATTO_JAVA_SHARED_LLVM_FIXTURE_BLOBS=3/3 PASS'
          test -f scripts/verify-atto-exact-head-source.sh
          bash scripts/verify-atto-exact-head-source.sh
      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Test raw exact-head verifier with source-free adversarial Git mutations
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-atto-raw-source-verifier.sh
      - name: Run exact-head AttoLang import, manifest and linked guest regressions
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=OresProjectConfigTest,AttoMainAdmissionTest,AttoSourceAdmissionTest,CanonicalAttoResourcePackagingTest test
          echo 'ATTO_CANONICAL_JAVA_GUEST_JUNIT=PASS'
      - name: Check canonical .atto package with compiler CLI
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests exec:java \
            -Dexec.args="--check examples/atto-canonical/src/main.atto"
          echo 'ATTO_CANONICAL_CLI_LINKED_CHECK=PASS'
      - name: Execute real linked AttoLang CLI guest and require exact output
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/atto-canonical-guest.stdout"
          errors="$RUNNER_TEMP/atto-canonical-guest.stderr"
          mvn -q -B -ntp -DskipTests exec:java \
            -Dexec.args="examples/atto-canonical/src/main.atto" \
            > "$output" 2> "$errors"
          # Only a real AttoLang-linked guest may produce this exact payload;
          # shell-side printf/echo is never the source of the output.
          printf 42 | cmp -s - "$output" || {
            echo "ATTO_CANONICAL_CLI_OUTPUT_MISMATCH" >&2
            cat "$errors" >&2
            exit 1
          }
          test ! -s "$errors" || {
            echo "ATTO_CANONICAL_CLI_STDERR_NOT_EMPTY" >&2
            cat "$errors" >&2
            exit 1
          }
          echo 'ATTO_CANONICAL_CLI_LINKED_EXECUTE_42=PASS'
      - name: Confirm exact checkout HEAD and tracked source integrity
        shell: bash
        env:
          ATTO_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ATTO_EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git write-tree)"
          bash scripts/verify-atto-exact-head-source.sh
          echo 'ATTO_CANONICAL_SOURCE_IDENTITY_AFTER=PASS'

name: Native Image Epsilon actor-owned JNI memory soak
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorNativeArena.java'
      - 'src/main/java/dev/oreslang/runtime/ActorLinearMemory.java'
      - 'src/main/java/dev/oreslang/runtime/OresSymbol.java'
      - 'src/main/java/dev/oreslang/runtime/NativeCarrierExecutor.java'
      - 'src/main/c/oresarena.c'
      - 'src/test/java/dev/oreslang/runtime/ActorNativeArenaSoak.java'
      - 'src/test/java/dev/oreslang/runtime/ActorRelativeOffset32BitTest.java'
      - 'src/test/java/dev/oreslang/JavaPrecompiledHostImportAotPolicyTest.java'
      - 'src/test/java/dev/oreslang/runtime/SafeHostMemberManifestTest.java'
      - 'scripts/verify-graal-epsilon-native-arena.sh'
      - '.github/workflows/graal-epsilon-native-arena.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-epsilon-native-image-host-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exactly reviewed source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate native arena soak shell syntax before toolchain setup
        run: bash -n scripts/verify-graal-epsilon-native-arena.sh
      - name: Install true GraalVM Native Image JDK25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: graalvm
          java-version: '25'
      - name: Verify actor offset bounds and precompiled Java host import under AOT policy
        run: mvn -B -ntp -Dtest=ActorRelativeOffset32BitTest,SafeHostMemberManifestTest,JavaPrecompiledHostImportAotPolicyTest -DfailIfNoTests=true test
      - name: Build actual Epsilon native executable and run native arena lifetime soak
        env:
          ATTO_EXPECTED_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/verify-graal-epsilon-native-arena.sh
      - name: Evidence scope
        run: |
          echo 'REAL_GRAALVM_NATIVE_IMAGE_EPSILON_HOST_JNI_ONLY'
          echo 'No AttoLang source guest compilation, full zero-GC runtime or hostile tenant security proven'

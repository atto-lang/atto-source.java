name: Java core Option/Result linked guest and ownership exact-head
on:
  pull_request:
    paths:
      - 'core/option.atto'
      - 'core/result.atto'
      - 'core/README.md'
      - 'tests/core_option_result/**'
      - 'src/test/java/dev/oreslang/CoreOptionResultSourceTest.java'
      - 'src/test/java/dev/oreslang/CoreOptionResultBorrowSafetyTest.java'
      - 'src/main/java/dev/oreslang/types/OwnershipChecker.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - '.github/workflows/core-option-result-jvm-borrow-exact-head.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-linked-core-guests-and-borrow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact immutable source PR head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head, root tree and borrow-critical blobs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          printf 'JAVA_CORE_OPTION_HEAD=%s\n' "$EXPECTED_HEAD"
          printf 'JAVA_CORE_OPTION_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')"
          for path in core/option.atto core/result.atto core/README.md tests/core_option_result/scalar_roundtrip.atto tests/core_option_result/lazy_callbacks.atto tests/core_option_result/borrowed_queries.atto src/main/java/dev/oreslang/types/OwnershipChecker.java src/main/java/dev/oreslang/types/TypeChecker.java src/test/java/dev/oreslang/CoreOptionResultSourceTest.java src/test/java/dev/oreslang/CoreOptionResultBorrowSafetyTest.java; do
            test "$(git rev-parse "HEAD:$path")" = "$(git hash-object --no-filters "$path")"
            printf '%s %s\n' "$path" "$(git rev-parse "HEAD:$path")"
          done
      - name: Install pinned GraalVM Java 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: '25'
          version: '25.3'
          distribution: graalvm
          cache: maven
      - name: Execute source-owned core modules, real linked guests and borrow checker negatives
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -B -ntp -Dtest=CoreOptionResultSourceTest,CoreOptionResultBorrowSafetyTest -DfailIfNoTests=true -Dsurefire.failIfNoSpecifiedTests=true test
      - name: Preserve exact-head runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-option-java-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/TEST-dev.oreslang.CoreOptionResultSourceTest.xml
            target/surefire-reports/TEST-dev.oreslang.CoreOptionResultBorrowSafetyTest.xml
            target/classes/
          if-no-files-found: warn
          retention-days: 7

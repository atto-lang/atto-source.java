name: Java M6 real UDS proxy two-process integration (HOST ONLY)
on:
  pull_request:
    paths:
      - 'src/ipc/**'
      - 'src/m6/**'
      - 'tests/ipc/**'
      - 'tests/m6/**'
      - 'tests/compiler/**'
      - 'src/compiler/proxyv1/**'
      - 'fixtures/proxy_v1/**'
      - '.github/workflows/proxy-uds-m6-two-process.yml'
  push:
    paths:
      - 'src/ipc/**'
      - 'src/m6/**'
      - 'tests/ipc/**'
      - 'tests/m6/**'
      - 'tests/compiler/**'
      - 'src/compiler/proxyv1/**'
      - 'fixtures/proxy_v1/**'
      - '.github/workflows/proxy-uds-m6-two-process.yml'
permissions:
  contents: read
jobs:
  host-forked-uds:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact current source HEAD
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: JDK 25 strict compile and forked process
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/proxy-uds
          javac -Xlint:all,-try -Werror -d build/proxy-uds \
            src/ipc/ProxyReceiptGateV1.java \
            src/m6/AttoM6Runtime.java \
            src/ipc/AttoM6ProxyUdsV1.java \
            tests/ipc/AttoM6ProxyUdsV1Probe.java \
            src/compiler/proxyv1/AttoM6ProxyActorSubsetCompiler.java \
            tests/compiler/AttoM6ProxyActorSubsetCompilerProbe.java \
            tests/m6/M6PerMessageTicketProbe.java \
            tests/m6/M6NioRuntimeProbe.java \
            tests/m6/M6SelectorLifecycleAuditProbe.java \
            tests/m6/M6ControlBudgetStressProbe.java
          timeout 120 java -cp build/proxy-uds M6NioRuntimeProbe | tee build/proxy-uds/m6-legacy.txt
          grep -Fx 'M6_NIO_SCHEDULER_SUPERVISOR_NATIVE_HOST=PASS' build/proxy-uds/m6-legacy.txt
          timeout 90 java -cp build/proxy-uds M6PerMessageTicketProbe | tee build/proxy-uds/tickets.txt
          grep -Fx 'M6_TICKET_128_CONCURRENT_MAIL_EXACT_CORRELATION=PASS' build/proxy-uds/tickets.txt
          timeout 90 java -cp build/proxy-uds AttoM6ProxyUdsV1Probe | tee build/proxy-uds/output.txt
          grep -Fx 'ATTO_PROXY_UDS_TWO_OS_PROCESSES=PASS' build/proxy-uds/output.txt
          grep -Fx 'ATTO_PROXY_UDS_SCOPE=EXPERIMENTAL_HOST_M6_NO_COMPILED_ATTO_GUEST' build/proxy-uds/output.txt
          java -cp build/proxy-uds AttoM6ProxyActorSubsetCompilerProbe fixtures/proxy_v1/counter.atto
          sha="$(sha256sum fixtures/proxy_v1/counter.atto | cut -d' ' -f1)"
          java -cp build/proxy-uds AttoM6ProxyActorSubsetCompiler \
            fixtures/proxy_v1/counter.atto --source-sha256 "$sha" \
            --out build/proxy-uds/AttoM6ProxyGuestCounter.java
          javac -Xlint:all,-try -Werror -cp build/proxy-uds -d build/proxy-uds \
            build/proxy-uds/AttoM6ProxyGuestCounter.java
          timeout 90 java -Datto.proxy.compiled_guest=true -cp build/proxy-uds \
            AttoM6ProxyUdsV1Probe | tee build/proxy-uds/guest-output.txt
          grep -Fx 'ATTO_PROXY_UDS_COMPILED_ATTO_PROCESS_B=PASS' build/proxy-uds/guest-output.txt
          grep -Fx 'ATTO_PROXY_UDS_SCOPE=RESTRICTED_COMPILED_ATTO_RECEIVER_HOST_SENDER_ONLY' build/proxy-uds/guest-output.txt
      - run: echo 'JDK25 RESTRICTED COMPILED ATTO RECEIVER + HOST SENDER; no canonical proxy frontend, standard wire, async reactor, Graal Native Image, or backend parity.'

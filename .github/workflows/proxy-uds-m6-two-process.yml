name: Java M6 real UDS proxy two-process integration (HOST ONLY)
on:
  pull_request:
    paths:
      - 'src/ipc/**'
      - 'src/m6/**'
      - 'tests/ipc/**'
      - '.github/workflows/proxy-uds-m6-two-process.yml'
  push:
    paths:
      - 'src/ipc/**'
      - 'src/m6/**'
      - 'tests/ipc/**'
      - '.github/workflows/proxy-uds-m6-two-process.yml'
permissions:
  contents: read
jobs:
  host-forked-uds:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact current source HEAD
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: JDK 25 strict compile and forked process
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/proxy-uds
          javac -Xlint:all -Werror -d build/proxy-uds \
            src/ipc/ProxyReceiptGateV1.java \
            src/m6/AttoM6Runtime.java \
            src/ipc/AttoM6ProxyUdsV1.java \
            tests/ipc/AttoM6ProxyUdsV1Probe.java
          timeout 90 java -cp build/proxy-uds AttoM6ProxyUdsV1Probe | tee build/proxy-uds/output.txt
          grep -Fx 'ATTO_PROXY_UDS_TWO_OS_PROCESSES=PASS' build/proxy-uds/output.txt
          grep -Fx 'ATTO_PROXY_UDS_SCOPE=EXPERIMENTAL_HOST_M6_NO_COMPILED_ATTO_GUEST' build/proxy-uds/output.txt
      - run: echo 'JDK25 HOST+M6 UDS TWO-PROCESS ONLY; no compiled .atto guest, standard wire, async reactor, Graal Native Image, or backend parity.'

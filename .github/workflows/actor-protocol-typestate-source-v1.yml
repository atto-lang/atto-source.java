name: Actor protocol typestate Java source-only admission
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/parser/ActorProtocolTypestateV1.java'
      - 'src/main/java/dev/oreslang/parser/ActorProtocolNominalResolverV1.java'
      - 'src/main/java/dev/oreslang/ast/Ast.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/main/java/dev/oreslang/compiler/TreeShaker.java'
      - 'src/main/java/dev/oreslang/compiler/IncrementalCompiler.java'
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/test/java/dev/oreslang/ActorProtocolTypestateV1Test.java'
      - 'src/test/java/dev/oreslang/ActorProtocolNominalResolverV1Test.java'
      - 'src/test/java/dev/oreslang/ActorProtocolOptimizerContractTest.java'
      - 'src/test/java/dev/oreslang/ActorProtocolIncrementalAbiTest.java'
      - 'src/test/java/dev/oreslang/ActorMessageContractV1Test.java'
      - 'src/test/java/dev/oreslang/ActorProtocolTypestateV1Smoke.java'
      - '.github/workflows/actor-protocol-typestate-source-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-declaration-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify exact checked-out PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet
          git diff --cached --quiet
      - name: Compile canonical Java lexer and protocol declaration preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/protocol-source-v1
          javac --release 21 -Xlint:all -Werror -d build/protocol-source-v1 \
            src/main/java/dev/oreslang/parser/Token.java \
            src/main/java/dev/oreslang/parser/Lexer.java \
            src/main/java/dev/oreslang/parser/ActorProtocolTypestateV1.java \
            src/test/java/dev/oreslang/ActorProtocolTypestateV1Smoke.java
          java -cp build/protocol-source-v1 dev.oreslang.ActorProtocolTypestateV1Smoke
          echo "ATTO_ACTOR_PROTOCOL_JAVA_SOURCE_ONLY=PASS"
          echo "ATTO_ACTOR_PROTOCOL_SOURCE_LEXER=PASS"
          echo "ATTO_ACTOR_PROTOCOL_GUEST_EXECUTION=NOT_EXECUTED"
      - name: Compile production Java compiler and execute real focused JUnit tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=ActorMessageContractV1Test,ActorProtocolTypestateV1Test,ActorProtocolNominalResolverV1Test,ActorProtocolOptimizerContractTest,ActorProtocolIncrementalAbiTest test
          echo "ATTO_ACTOR_PROTOCOL_REAL_JUNIT=PASS"
          echo "ATTO_ACTOR_PROTOCOL_GUEST_EXECUTION=NOT_EXECUTED"

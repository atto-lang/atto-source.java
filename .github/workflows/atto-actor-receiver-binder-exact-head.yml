name: Atto actor receiver binder exact-head regression

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/ast/**'
      - 'src/main/java/dev/oreslang/parser/**'
      - 'src/main/java/dev/oreslang/types/**'
      - 'src/test/java/dev/oreslang/*Actor*Test.java'
      - 'contracts/actor-*/*'
      - 'pom.xml'
      - '.github/workflows/atto-actor-receiver-binder-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actor-receiver-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout immutable PR head without saved token
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert source head and tree provenance
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "RECEIPT source_head=$(git rev-parse HEAD)"
          echo "RECEIPT source_tree=$(git rev-parse HEAD^{tree})"
      - name: Provision GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
      - name: Execute real parser type-checker binder and contract tests
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -version
          mvn -B -ntp -DfailIfNoTests=true \
            -Dtest=ActorReceiverBinderTest,ExternalActorReceiverAstAdmissionTest,StandaloneActorAstAdmissionTest,ActorReceiverContractSignatureTest,ModuleActorContractRequirementTest,ActorMailboxContractShapeTest,ActorLifecycleContractRequirementTest \
            test
      - name: Require nonempty successful Surefire suite reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            ActorReceiverBinderTest \
            ExternalActorReceiverAstAdmissionTest \
            StandaloneActorAstAdmissionTest \
            ActorReceiverContractSignatureTest \
            ModuleActorContractRequirementTest \
            ActorMailboxContractShapeTest \
            ActorLifecycleContractRequirementTest; do
            report="target/surefire-reports/TEST-dev.oreslang.${suite}.xml"
            test -s "$report"
            grep -Eq '<testsuite[^>]*tests="[1-9][0-9]*"' "$report"
            grep -Eq 'failures="0"' "$report"
            grep -Eq 'errors="0"' "$report"
            grep -Eq 'skipped="0"' "$report"
            echo "RECEIPT suite=$suite file=$report"
          done
      - name: Preserve test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atto-actor-receiver-surefire
          path: target/surefire-reports/
          if-no-files-found: warn

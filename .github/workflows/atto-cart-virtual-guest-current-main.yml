name: Atto Cart guest physical actor exact-head proof

on:
  pull_request:
    paths:
      - 'contracts/virtual-actor-cart-v1/**'
      - 'src/test/java/dev/oreslang/AttoCartPhysicalActivationGuestTest.java'
      - 'src/main/java/dev/oreslang/runtime/ActorRuntime.java'
      - 'src/main/java/dev/oreslang/runtime/VirtualActorRuntimeGenerationFence.java'
      - 'src/main/java/dev/oreslang/runtime/VirtualActorCurrentMainDirectory.java'
      - '.github/workflows/atto-cart-virtual-guest-current-main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atto-cart-guest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-cart-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Read back exact Git head, tree, and Cart guest fixture blobs
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "HEAD_SHA=$EXPECTED_HEAD_SHA"
          echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
          git hash-object contracts/virtual-actor-cart-v1/positive/cart_ops.atto
          git hash-object contracts/virtual-actor-cart-v1/positive/cart_main.atto
          git hash-object contracts/virtual-actor-cart-v1/negative/virtual_cart_unsupported.atto
          git hash-object contracts/virtual-actor-cart-v1/expected/cart_main.stdout
          git hash-object contracts/virtual-actor-cart-v1/cases.json
          git hash-object src/test/java/dev/oreslang/AttoCartPhysicalActivationGuestTest.java

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
          cache: maven

      - name: Compile and execute real .atto Cart guest plus all host foundations
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp \
            -Dtest=AttoCartPhysicalActivationGuestTest,VirtualActorGenerationFenceCurrentMainTest,VirtualActorTerminalControlCurrentMainTest,VirtualActorCurrentMainDirectoryTest \
            -DfailIfNoTests=true test
          for test in \
            dev.oreslang.AttoCartPhysicalActivationGuestTest \
            dev.oreslang.runtime.VirtualActorGenerationFenceCurrentMainTest \
            dev.oreslang.runtime.VirtualActorTerminalControlCurrentMainTest \
            dev.oreslang.runtime.VirtualActorCurrentMainDirectoryTest; do
            report="target/surefire-reports/TEST-${test}.xml"
            test -s "$report"
            grep -Eq 'tests="[1-9][0-9]*"' "$report"
            ! grep -Eq 'failures="[1-9]|errors="[1-9]|skipped="[1-9]' "$report"
            echo "EXECUTED_JUNIT=$test"
          done
          echo "COMPILER_GUEST_EVIDENCE=AttoCartPhysicalActivationGuestTest"
          echo "EXACT_HEAD_TESTED=$GITHUB_SHA"

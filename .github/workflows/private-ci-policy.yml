name: Private CI export policy

# Always produce this check for branch protection; no paths filters.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  private-ci-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate issuer contract, ownership and policy grammar
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import ast
          import json
          import re
          from pathlib import Path

          base = Path(".github")

          def read_regular(path, max_bytes=256 * 1024):
              target = Path(path)
              if not target.is_file() or target.is_symlink():
                  raise SystemExit("private CI security input must be a regular non-symlink file: " + str(path))
              raw = target.read_bytes()
              if (not raw or len(raw) > max_bytes or raw.startswith(b"\xef\xbb\xbf")
                      or b"\x00" in raw):
                  raise SystemExit("private CI security input bytes invalid: " + str(path))
              try:
                  return raw.decode("utf-8")
              except UnicodeError as exc:
                  raise SystemExit("private CI security input must be UTF-8: " + str(path)) from exc

          def no_duplicate_keys(pairs):
              out = {}
              for key, value in pairs:
                  if key in out:
                      raise SystemExit("duplicate JSON key in private CI security input")
                  out[key] = value
              return out

          def read_json(path):
              try:
                  return json.loads(read_regular(path), object_pairs_hook=no_duplicate_keys)
              except (ValueError, RecursionError) as exc:
                  raise SystemExit("invalid private CI JSON: " + str(path)) from exc

          declared = read_json(base / "private-ci-required-checks.json")
          expected = {
              "schema": 1,
              "source": {"context": "private-ci-policy", "appId": 15368},
              "carrier": {"context": "carrier-policy", "appId": 15368},
          }
          if (type(declared) is not dict or type(declared.get("schema")) is not int
                  or declared != expected):
              raise SystemExit("private CI required checks must be bound to pinned Actions issuer")

          publisher = ast.parse(read_regular("scripts/publish-private-ci-source.py"))
          vars = {}
          for node in publisher.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id in (
                              "REQUIRED_CODEOWNER_PATHS", "REQUIRED_CODEOWNER",
                              "SOURCE_POLICY_CHECK", "CARRIER_POLICY_CHECK",
                              "GITHUB_ACTIONS_APP_ID"):
                          vars[target.id] = ast.literal_eval(node.value)
          if (len(vars) != 5 or vars["REQUIRED_CODEOWNER"] != "@ORESoftware"
                  or vars["SOURCE_POLICY_CHECK"] != declared["source"]["context"]
                  or vars["CARRIER_POLICY_CHECK"] != declared["carrier"]["context"]
                  or vars["GITHUB_ACTIONS_APP_ID"] != 15368):
              raise SystemExit("publisher security issuer constants mismatch")
          required = vars["REQUIRED_CODEOWNER_PATHS"]
          if not isinstance(required, tuple) or len(required) < 28 or len(set(required)) != len(required):
              raise SystemExit("private CI CODEOWNER path inventory invalid")
          codeowners = read_regular(base / "CODEOWNERS").splitlines()
          rules = [s.strip() for s in codeowners if s.strip() and not s.lstrip().startswith("#")]
          if rules[-len(required):] != [f"{p} @ORESoftware" for p in required]:
              raise SystemExit("terminal CODEOWNERS contract mismatch")
          if (len(rules) <= len(required)
                  or rules[-len(required)-1] != "/.github/workflows/ @ORESoftware"):
              raise SystemExit("unreviewed workflows could spoof protected check name")
          for path in required:
              target = Path(".") / path.lstrip("/")
              if not target.is_file() or target.is_symlink():
                  raise SystemExit("CODEOWNERS mandatory path must be a regular non-symlink file: " + path)
              read_regular(target)

          dest_pattern = re.compile(r"[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]* [1-9][0-9]{0,19}")
          snap_pattern = re.compile(r"[0-9a-f]{40} [0-9a-f]{40} [1-9][0-9]{0,19}")
          def load_lines(name, pattern):
              data = read_regular(base / name).splitlines()
              active = []
              for line in data:
                  if not line or line.startswith("#"):
                      continue
                  if line != line.strip() or not pattern.fullmatch(line):
                      raise SystemExit("unreviewable private CI approval format: " + name)
                  active.append(line)
              return active
          dests = load_lines("private-ci-approved-repositories.txt", dest_pattern)
          names = [line.split()[0].casefold() for line in dests]
          ids = [line.split()[1] for line in dests]
          if len(names) != len(set(names)) or len(ids) != len(set(ids)):
              raise SystemExit("duplicate destination identity")
          snaps = load_lines("private-ci-approved-source-snapshots.txt", snap_pattern)
          if len(snaps) != len(set(snaps)):
              raise SystemExit("duplicate snapshot tuple")
          commit_tree = {}
          for row in snaps:
              commit, tree, _dest = row.split()
              if commit in commit_tree and commit_tree[commit] != tree:
                  raise SystemExit("one source commit maps to inconsistent root trees")
              commit_tree[commit] = tree

          reviewer = read_json(base / "private-ci-independent-reviewer.json")
          expected_reviewer_keys = {"schema", "enabled", "minimumPermission",
                                    "disallowedReviewerIds", "reviewer"}
          if (set(reviewer) != expected_reviewer_keys
                  or type(reviewer.get("schema")) is not int
                  or reviewer["schema"] != 2
                  or type(reviewer.get("enabled")) is not bool
                  or reviewer.get("minimumPermission") not in {"write", "maintain", "admin"}):
              raise SystemExit("invalid independent reviewer policy")
          blocked = reviewer.get("disallowedReviewerIds")
          if (not isinstance(blocked, list) or len(blocked) != 2
                  or any(type(item) is not int or item <= 0 for item in blocked)
                  or set(blocked) != {11139560, 2148448}):
              raise SystemExit("invalid independent reviewer denylist")
          if reviewer["enabled"] is False:
              if reviewer["reviewer"] is not None or dests or snaps:
                  raise SystemExit("approvals require enabled independent reviewer")
          else:
              who = reviewer["reviewer"]
              if (not isinstance(who, dict) or set(who) != {"login", "id"}
                      or not isinstance(who.get("login"), str)
                      or re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?", who["login"]) is None
                      or type(who.get("id")) is not int or who["id"] <= 0
                      or who["id"] in blocked):
                  raise SystemExit("invalid independent reviewer identity")
              if len(dests) > 1 or len(snaps) > 1:
                  raise SystemExit("only one private CI canary may be active")
              if bool(dests) != bool(snaps):
                  raise SystemExit("destination and snapshot approvals must activate together")
              if dests and dests[0].split()[1] != snaps[0].split()[2]:
                  raise SystemExit("destination and snapshot repository IDs differ")
          print("private CI issuer + source policy: PASS")
          PY

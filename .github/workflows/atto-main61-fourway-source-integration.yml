name: Atto Java migrated-main pinned 41-blob fourway integration (review-only)
on:
  workflow_dispatch:
  push:
    branches:
      - ci/atto-main61-fourway-source-integration-20261120
permissions:
  contents: read
concurrency:
  group: atto-java-main61-ready-four-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-closure-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source-owned four-way candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable Git tree SHA and all 41 pinned PR blob identities
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          python3 ci/compiler/verify-fourway-source-closure.py
          echo 'ATTO_FOURWAY_SOURCE_CLOSURE_GATE=PASS'
  baseline-maven:
    needs: source-closure-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact original source repository integration candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure GraalVM JDK 25 for full Maven reactor
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: graalvm
          java-version: '25'
      - name: Require exact current commit and non-sparse source tree
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse --is-inside-work-tree)" = true
          test "$(git config --get core.sparseCheckout || echo false)" != true
          test "$(git ls-files | wc -l)" -gt 300
          git diff --quiet && git diff --cached --quiet
          test -f pom.xml
          test -f scripts/verify_github_run_evidence.py
          echo ATTO_JAVA_FULL_SOURCE_TREE_CHECKOUT=PASS
      - name: Build and execute migrated-main Maven verification
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dmaven.test.failure.ignore=false verify
          echo ATTO_JAVA_MIGRATED_MAIN_MAVEN_VERIFY=PASS
      - name: Require actual source, parser and channel JUnit cases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report_dir = Path('target/surefire-reports')
          if report_dir.is_symlink() or not report_dir.is_dir() or Path('target').is_symlink():
              raise SystemExit('untrusted Surefire report directory')
          required = (
              'dev.oreslang.AttoSourceAdmissionTest',
              'dev.oreslang.AttoGuardLanguageTest',
              'dev.oreslang.ChannelFlowOperatorTest',
          )
          total_tests = 0
          all_suites = list(report_dir.glob('TEST-*.xml'))
          if not all_suites:
              raise SystemExit('no Surefire XML produced by Maven reactor')
          for report in all_suites:
              if report.is_symlink() or not report.is_file() or report.stat().st_size == 0:
                  raise SystemExit(f'invalid Surefire report: {report}')
              data = report.read_bytes()
              if b'<!DOCTYPE' in data.upper() or b'<!ENTITY' in data.upper():
                  raise SystemExit(f'unsafe XML entity: {report}')
              root = ET.fromstring(data)
              cases = root.findall('.//testcase')
              counts = {key: int(root.attrib.get(key, '0')) for key in ('tests', 'errors', 'failures', 'skipped')}
              if counts['tests'] != len(cases) or any(counts[key] for key in ('errors','failures','skipped')):
                  raise SystemExit(f'JUnit count/skip/failure mismatch: {report}: {counts}')
              if any(root.find('.//' + tag) is not None for tag in ('error','failure','skipped')):
                  raise SystemExit(f'JUnit unexpected error/failure/skip element: {report}')
              total_tests += len(cases)
          for suite in required:
              report = report_dir / ('TEST-' + suite + '.xml')
              if not report.is_file() or report.is_symlink():
                  raise SystemExit(f'missing mandatory Atto Java guest suite: {suite}')
              if not ET.fromstring(report.read_bytes()).findall('.//testcase'):
                  raise SystemExit(f'empty required guest suite: {suite}')
          if total_tests < 3:
              raise SystemExit(f'no material Java test execution: {total_tests}')
          print(f'ATTO_JAVA_FULL_MAVEN_JUNIT_EXECUTED={total_tests} suites={len(all_suites)}')
          print('ATTO_SOURCE_PARSER_CHANNEL_REQUIRED_JUNIT=PASS')
          PY
  four-ready-compiler-checks:
    needs: source-closure-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: '58'
            script: ci/compiler/verify-m1-java.sh
            required: ATTO_M1_JAVA_COMPILED_GUEST_NATIVE=PASS
          - pr: '53'
            script: ci/compiler/verify-channel-read.sh
            required: ATTO_CHANNEL_PREHIR_HOST_JVM_NATIVE=PASS
          - pr: '52'
            script: ci/compiler/verify-int-parse-result.sh
            required: ATTO_INT_PARSE_HOST_JVM_NATIVE=PASS
          - pr: '51'
            script: ci/compiler/verify-functional-pipelines.sh
            required: ATTO_JAVA_PIPELINE_GUEST_MATRIX=EXECUTED jvm=5 native_image=2 negative=11 plus_edges=7
    steps:
      - name: Checkout exact original source repository integration candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure GraalVM JDK 25 and Native Image
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: graalvm
          java-version: '25'
      - name: Check exact source checkout provenance
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --quiet && git diff --cached --quiet
          test "$(git ls-files | wc -l)" -gt 300
          echo ATTO_JAVA_FULL_SOURCE_TREE_CHECKOUT=PASS
      - name: Execute original source compiler and Native Image gate
        shell: bash
        env:
          ATTO_EXPECTED_HEAD_SHA: ${{ github.sha }}
          ATTO_NATIVE_IMAGE_REQUIRED: '1'
          SCRIPT: ${{ matrix.script }}
          REQUIRED_MARKER: ${{ matrix.required }}
        run: |
          set -euo pipefail
          bash "$SCRIPT" | tee /tmp/atto-source-local-original-script.log
          grep -Fx "$REQUIRED_MARKER" /tmp/atto-source-local-original-script.log
          echo ATTO_JAVA_FOUR_READY_SOURCE_LOCAL_JOB_PASS=PASS
  admission-regressions:
    needs: source-closure-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact original source repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate source identity before running Python controls
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git ls-files | wc -l)" -gt 300
      - name: Test source CI evidence and destination-denial regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_verify_github_run_evidence.py -v
          python3 -m unittest discover -s tests -p test_private_ci_approval_reset.py -v
          python3 -m unittest discover -s tests -p test_ci_private_mirror_preflight.py -v
          echo ATTO_JAVA_SOURCE_LOCAL_POLICY_NEGATIVE_TESTS=PASS

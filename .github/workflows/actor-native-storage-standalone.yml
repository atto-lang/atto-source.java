name: Native arena standalone JDK25 and JNI evidence

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorNativeArena.java'
      - 'src/main/java/dev/oreslang/runtime/ActorLinearMemory.java'
      - 'src/main/c/oresarena.c'
      - 'src/test/java/dev/oreslang/runtime/ActorNativeStorageStandaloneTest.java'
      - 'scripts/build-native-thread.sh'
      - 'scripts/check-native-arena-abi.sh'
      - '.github/workflows/actor-native-storage-standalone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-jdk25-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source head, never GitHub's generated PR merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify immutable checked-out source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          echo "SOURCE_TREE_SHA=$(git rev-parse 'HEAD^{tree}')"

      - name: Set up JDK 25 for Java 21 source compatibility
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # verified v4 tag target
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Execute standalone native JNI ABI probe
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-native-arena-abi.sh | tee "$RUNNER_TEMP/native-arena-jni-abi.log"

      - name: Compile the actual native carrier and arena JNI library
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/build-native-thread.sh
          test -f target/native/liboresthread.so
          nm -D target/native/liboresthread.so |
            grep -F 'Java_dev_oreslang_runtime_ActorNativeArena_allocateNative'
          nm -D target/native/liboresthread.so |
            grep -F 'Java_dev_oreslang_runtime_ActorNativeArena_releaseNative'

      - name: Execute independent arena and linear-memory storage JUnit suite
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -Dtest=ActorNativeStorageStandaloneTest test | tee "$RUNNER_TEMP/native-arena-junit.log"
          echo 'PASS isolated native arena storage tests (not ActorRuntime or guest parity)'

      - name: Record verified source, JUnit and binary evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import xml.etree.ElementTree as ET

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          head = git("rev-parse", "HEAD")
          root_tree = git("rev-parse", "HEAD^{tree}")
          if head != os.environ["EXPECTED_SHA"] or git("status", "--porcelain"):
              raise SystemExit("incorrect or modified source checkout")
          paths = (
              ".github/workflows/actor-native-storage-standalone.yml",
              "src/main/java/dev/oreslang/runtime/ActorNativeArena.java",
              "src/main/java/dev/oreslang/runtime/ActorLinearMemory.java",
              "src/main/c/oresarena.c",
              "src/test/java/dev/oreslang/runtime/ActorNativeStorageStandaloneTest.java",
              "scripts/build-native-thread.sh",
              "scripts/check-native-arena-abi.sh",
          )
          blobs = {}
          for path in paths:
              actual = git("hash-object", path)
              committed = git("rev-parse", f"HEAD:{path}")
              if actual != committed:
                  raise SystemExit(f"source changed since commit: {path}")
              blobs[path] = committed
          native_binary = pathlib.Path("target/native/liboresthread.so")
          jni_log = pathlib.Path(os.environ["RUNNER_TEMP"], "native-arena-jni-abi.log")
          junit_log = pathlib.Path(os.environ["RUNNER_TEMP"], "native-arena-junit.log")
          xml = pathlib.Path("target/surefire-reports/TEST-dev.oreslang.runtime.ActorNativeStorageStandaloneTest.xml")
          for file in (native_binary, jni_log, junit_log, xml):
              if not file.is_file() or not file.stat().st_size:
                  raise SystemExit(f"missing executed-test artifact: {file}")
          marker = "PASS source-native-JNI ABI: 1000 allocations, zero-fill, isolation, word layout, release"
          if jni_log.read_text().splitlines().count(marker) != 1:
              raise SystemExit("JNI ABI receipt missing, duplicated or forged")
          suite = ET.parse(xml).getroot()
          counts = {key: int(suite.attrib.get(key, "-1"))
                    for key in ("tests", "failures", "errors", "skipped")}
          if counts != {"tests": 12, "failures": 0, "errors": 0, "skipped": 0}:
              raise SystemExit(f"standalone JUnit tests not fully executed: {counts}")
          def sha256(file):
              return hashlib.sha256(file.read_bytes()).hexdigest()
          receipt = {
              "schema": "oreslang-java-native-storage-exact-head-v1",
              "scope": "host-storage-jni-only-not-actor-runtime-or-guest-parity",
              "source_commit": head,
              "source_root_tree": root_tree,
              "source_blobs": blobs,
              "jdk": subprocess.check_output(["java", "-version"],
                         stderr=subprocess.STDOUT, text=True).splitlines()[0],
              "cc": subprocess.check_output(["cc", "--version"],
                        text=True).splitlines()[0],
              "native_binary_sha256": sha256(native_binary),
              "jni_log_sha256": sha256(jni_log),
              "junit_log_sha256": sha256(junit_log),
              "junit_xml_sha256": sha256(xml),
              "junit": counts,
          }
          output = pathlib.Path(os.environ["RUNNER_TEMP"], "native-arena-exact-head-receipt.json")
          output.write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
          print(f"Verified exact-head storage receipt: {output}")
          PY

      - name: Retain native evidence (private source-repo artifact only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4 tag target
        with:
          name: native-arena-storage-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/native-arena-exact-head-receipt.json
            ${{ runner.temp }}/native-arena-jni-abi.log
            ${{ runner.temp }}/native-arena-junit.log
            target/surefire-reports/TEST-dev.oreslang.runtime.ActorNativeStorageStandaloneTest.xml

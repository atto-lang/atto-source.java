name: Graal conformance contract
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable Java PR source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind conformance reports to verified source Git commit
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse --verify HEAD)"
          if [[ "$expected" != "$actual" ]]; then
            echo "refusing conformance from mismatched Java Git commit: $actual != $expected" >&2
            exit 65
          fi
          if ! worktree_status="$(git status --porcelain --untracked-files=all)"; then
            echo "Java conformance Git status inventory failed" >&2
            exit 65
          fi
          if [[ -n "$worktree_status" ]]; then
            echo "refusing dirty Java conformance source checkout" >&2
            exit 65
          fi
          printf 'ORESLANG_SOURCE_SHA=%s\n' "$actual" >> "$GITHUB_ENV"
          printf 'conformance_source_commit=%s\nconformance_source_tree=%s\n' "$actual" "$(git rev-parse 'HEAD^{tree}')"
      - name: Verify every committed Java source blob and fail-closed Git inventory
        run: bash scripts/verify-source-tree.sh "$ORESLANG_SOURCE_SHA"
      - name: Verify synthetic fail-closed Java source checkout admissions
        run: bash tests/java_source_tree_integrity_admission.sh
      - name: Validate source parity launcher fail-closed CLI admissions
        run: bash tests/java_source_parity_launcher_admission.sh
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test AI smoke evidence admission (no compiler claims)
        run: python3 scripts/test_ai_conformance_smoke.py
      - name: Schema validator
        run: python3 -m pip install --break-system-packages 'jsonschema>=4.20,<5'
      - name: Verify conformance runner failure handling
        run: |
          python3 contracts/v1/test_runner.py -v
          python3 contracts/v1/semantics/test_runner.py -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Compile TypeSpec contracts
        run: npm --prefix contracts/v1 install --no-audit --no-fund && npm --prefix contracts/v1 run build && ./contracts/v1/node_modules/.bin/tsp compile contracts/v1/semantics && ./contracts/v1/node_modules/.bin/tsp compile contracts/v1/semantics/traces
      - name: Verify metamorphic generator and adversarial actor trace contracts
        run: |
          python3 contracts/v1/semantics/metamorphic.py --self-test --count 64
          python3 contracts/v1/semantics/test_metamorphic.py -v
          python3 contracts/v1/semantics/traces/validate.py --schema-only
          python3 contracts/v1/semantics/traces/test_trace.py -v
      - name: Validate fixture registry
        run: |
          python3 contracts/v1/run.py --validate
          python3 contracts/v1/semantics/run.py --validate
      - name: Compile Java compiler and resolve runtime dependencies
        run: |
          mvn -B -ntp -DskipTests package
          mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile=target/conformance-classpath.txt
      - name: Execute exact LLVM class/String source through real JVM guest
        run: |
          scripts/run-source-parity.sh tests/fixtures/native-class-string/main.ores > target/java-class-string-parity.stdout
          printf 'hello world\nhiiii 2hiiii' | cmp - target/java-class-string-parity.stdout
      - name: Verify six portable Oreslang scalar guest programs through real GraalVM
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          bash -n scripts/verify-portable-scalar-java.sh
          bash scripts/verify-portable-scalar-java.sh
      - name: Execute byte-identical common-source v1 scalar through real JVM guest
        run: |
          python3 tests/test_native_guest_parity_v1_java.py \
            --repo-root "$PWD" \
            --java-probe "$PWD/contracts/v1/java_probe.py"
      - name: Validate Java compiler admission
        run: python3 contracts/v1/run.py --backend graal --command 'python3 contracts/v1/java_probe.py {source}' --report target/conformance-graal.json
      - name: Real Java compiler AI smoke (source acceptance, rejection, native guest exit)
        run: |
          python3 scripts/ai-conformance-smoke.py \
            --backend java \
            --compiler "$(command -v python3)" \
            --java-probe "$(realpath contracts/v1/java_probe.py)" \
            --source-sha "$ORESLANG_SOURCE_SHA" \
            --report target/ai-conformance-graal.json
      - name: Execute reviewed portable source i64 subset through real Graal guest
        run: python3 scripts/java_source_i64_smoke.py --report target/java-source-i64-subset.json
      - name: Validate Java borrow and semantic diagnostic cases
        run: python3 contracts/v1/semantics/run.py --backend graal --command 'python3 contracts/v1/java_probe.py {source}' --run-command 'python3 contracts/v1/java_probe.py {source} --execute' --revision "$ORESLANG_SOURCE_SHA" --report target/semantics-graal.json
      - name: Verify real shared actor mailbox trace against the contract
        run: |
          mvn -B -ntp -Dores.runtime.carriers=native -Dtest=ActorTraceContractIntegrationTest test
          python3 contracts/v1/semantics/traces/validate.py target/actor-trace-graal.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: graal-conformance-report
          path: |
            target/conformance-graal.json
            target/semantics-graal.json
            target/ai-conformance-graal.json
            target/java-source-i64-subset.json
            target/actor-trace-graal.json
          if-no-files-found: ignore

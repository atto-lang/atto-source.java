name: gpu-compiler-ci

on:
  push:
    branches:
      - "feat/gpu-execution-hardening"
  pull_request:
    paths:
      - "src/main/java/dev/oreslang/compiler/**"
      - "src/main/java/dev/oreslang/parser/**"
      - "src/main/java/dev/oreslang/ast/**"
      - "src/main/java/dev/oreslang/types/**"
      - "src/test/java/dev/oreslang/GpuExecutionTest.java"
      - "src/test/java/dev/oreslang/IncrementalFunctorStaticTest.java"
      - ".github/workflows/gpu-compiler-ci.yml"

permissions:
  contents: read

concurrency:
  group: gpu-compiler-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile GPU compiler path
        run: mvn -B -ntp -DskipTests compile
      - name: Run GPU compiler tests
        run: mvn -B -ntp -Dtest=GpuExecutionTest,IncrementalFunctorStaticTest test

name: OTP GenServer source slice

on:
  pull_request:
    paths:
      - 'stdlib/otp/gen_server.ores'
      - 'stdlib/otp/supervisor.ores'
      - 'src/main/java/dev/oreslang/stdlib/CoreLibrarySources.java'
      - 'src/test/java/dev/oreslang/runtime/NativeOtpGenServerProtocolTest.java'
      - 'src/test/java/dev/oreslang/runtime/NativeOtpSupervisorPolicyTest.java'
      - 'docs/OTP_GENSERVER_PROTOCOL_SLICE.md'
      - '.github/workflows/otp-gen-server-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Execute Oreslang OTP source slices
        run: >
          mvn -B -ntp
          -Dtest=NativeOtpGenServerProtocolTest,NativeOtpSupervisorPolicyTest
          test

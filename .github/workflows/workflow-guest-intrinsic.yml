name: Workflow guest intrinsic compiler and runtime gate

on:
  push:
    branches:
      - feat/typed-workflow-guest-intrinsic-20261029
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/main/java/dev/oreslang/types/OwnershipChecker.java'
      - 'src/main/java/dev/oreslang/runtime/WorkflowGuestPort.java'
      - 'src/main/java/dev/oreslang/runtime/OresContext.java'
      - 'src/main/java/dev/oreslang/runtime/CapabilityChecker.java'
      - 'src/main/java/dev/oreslang/runtime/IsolatePolicy.java'
      - 'src/test/java/dev/oreslang/WorkflowRuntimeIntrinsicTest.java'
      - 'src/test/java/dev/oreslang/runtime/WorkflowGuestPortTest.java'
      - 'examples/workflow-host-request.ores'
      - '.github/workflows/workflow-guest-intrinsic.yml'

permissions:
  contents: read

jobs:
  parser-runtime-intrinsic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile Java runtime and execute targeted JUnit tests
        run: mvn -B -ntp -Dtest=WorkflowRuntimeIntrinsicTest,WorkflowGuestPortTest test
      - name: Check guest source with exact freshly built compiler
        run: |
          mvn -B -ntp -DskipTests dependency:build-classpath -Dmdep.outputFile=target/runtime-classpath.txt
          java -cp "target/classes:$(cat target/runtime-classpath.txt)" \
            dev.oreslang.launcher.OresMain --check examples/workflow-host-request.ores \
            --allow=WORKFLOW_STORAGE
      - name: Execute real guest with deliberately unprovisioned host service
        run: |
          java -cp "target/classes:$(cat target/runtime-classpath.txt)" \
            dev.oreslang.launcher.OresMain examples/workflow-host-request.ores \
            --allow=WORKFLOW_STORAGE

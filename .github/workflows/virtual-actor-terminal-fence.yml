name: Virtual actor terminal fencing exact-head host tests

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorRuntime.java'
      - 'src/main/java/dev/oreslang/runtime/SupervisorFailureControl.java'
      - 'src/test/java/dev/oreslang/runtime/SupervisorFailureControlTest.java'
      - '.github/workflows/virtual-actor-terminal-fence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virtual-actor-terminal-fence-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supervisor-terminal-fencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head and source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "HEAD_SHA=$EXPECTED_SHA"
          echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
          git hash-object src/main/java/dev/oreslang/runtime/ActorRuntime.java
          git hash-object src/main/java/dev/oreslang/runtime/SupervisorFailureControl.java
          git hash-object src/test/java/dev/oreslang/runtime/SupervisorFailureControlTest.java

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
          cache: maven

      - name: Execute supervisor terminal receipt and lifecycle regressions
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=SupervisorFailureControlTest -DfailIfNoTests=true test
          report=target/surefire-reports/TEST-dev.oreslang.runtime.SupervisorFailureControlTest.xml
          test -s "$report"
          grep -Eq '<testsuite[^>]*tests="[1-9][0-9]*"' "$report"
          ! grep -Eq 'failures="[1-9]|errors="[1-9]|skipped="[1-9]' "$report"
          echo "VERIFIED_SUPERVISOR_HOST_SUITE=$report"

name: Native numeric source provenance

on:
  pull_request:
    paths:
      - 'stdlib/math.ores'
      - 'stdlib/bigint.ores'
      - 'stdlib/decimal.ores'
      - 'contracts/v1/numeric-error-abi.json'
      - 'ci/verify-native-numeric-source.sh'
      - '.github/workflows/native-numeric-source-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-canonical-native-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact canonical Git blobs
        shell: bash
        run: bash ci/verify-native-numeric-source.sh

name: Native numeric source provenance

on:
  pull_request:
    paths:
      - 'stdlib/math.ores'
      - 'stdlib/bigint.ores'
      - 'stdlib/decimal.ores'
      - '.github/workflows/native-numeric-source-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-canonical-native-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact canonical Git blobs
        shell: bash
        run: |
          set -euo pipefail
          verify_blob() {
            local expected="$1"
            local path="$2"
            test -f "$path"
            local actual
            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error file=$path::numeric source drift: expected $expected, got $actual"
              exit 1
            fi
            printf 'verified %s %s\n' "$actual" "$path"
          }

          verify_blob 725309eb0edae4d32ffbfe159b05fc7d4091bcc1 stdlib/math.ores
          verify_blob bf05aa719812ee4f47a4228e1b2a8e97fc7fba9b stdlib/bigint.ores
          verify_blob 501c964afa7b4746c6fe2fbd6847db5f9ec0db74 stdlib/decimal.ores

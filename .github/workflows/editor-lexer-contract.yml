name: Editor lexical and parser contract (pinned source)

on:
  pull_request:
    paths:
      - 'src/test/java/dev/oreslang/EditorSyntaxLexerFixtureTest.java'
      - 'src/test/resources/editor-syntax-lexer.tsv'
      - '.github/workflows/editor-lexer-contract.yml'
  push:
    branches: ['test/editor-lexer-parity-20261031']

permissions:
  contents: read

jobs:
  lexer-and-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact private repository head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          echo "COMPILER_SHA=$EXPECTED"
          echo "COMPILER_TREE=$(git rev-parse 'HEAD^{tree}')"
          git diff --exit-code --quiet
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
      - name: Run 69 compiler lexical/parser cases
        run: mvn -B -ntp -Dtest=EditorSyntaxLexerFixtureTest test

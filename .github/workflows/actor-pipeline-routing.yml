name: Java actor pipeline routing host proof
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorPipelineRoutePlan.java'
      - 'src/test/java/dev/oreslang/runtime/ActorPipelineRoutePlanStandaloneSmoke.java'
      - 'src/test/java/dev/oreslang/runtime/ActorPipelineRoutePlanTest.java'
      - 'src/test/java/dev/oreslang/ActorPipelineRoutingAdmissionTest.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'scripts/test-actor-pipeline-route-plan.sh'
      - '.github/workflows/actor-pipeline-routing.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorPipelineRoutePlan.java'
      - 'src/test/java/dev/oreslang/runtime/ActorPipelineRoutePlanStandaloneSmoke.java'
      - 'src/test/java/dev/oreslang/runtime/ActorPipelineRoutePlanTest.java'
      - 'src/test/java/dev/oreslang/ActorPipelineRoutingAdmissionTest.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'scripts/test-actor-pipeline-route-plan.sh'
      - '.github/workflows/actor-pipeline-routing.yml'
permissions:
  contents: read
jobs:
  host-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Log immutable checkout identity
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          git hash-object src/main/java/dev/oreslang/runtime/ActorPipelineRoutePlan.java
      - name: Compile and test Java routing on the image's pinned JDK 21
        run: |
          set -euo pipefail
          : "${JAVA_HOME_21_X64:?hosted image needs Java 21}"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          javac -version
          sh scripts/test-actor-pipeline-route-plan.sh
          mvn -B -ntp -Dsurefire.failIfNoSpecifiedTests=true \
            -Dtest=ActorPipelineRoutePlanTest,ActorPipelineRoutingAdmissionTest test

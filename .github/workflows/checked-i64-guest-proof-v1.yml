name: Checked i64 guest proof v1

on:
  pull_request:
    paths:
      - "contracts/parity/v1/checked-i64-42.ores"
      - ".github/workflows/checked-i64-guest-proof-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-aot-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin exact source and shared guest bytes
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object contracts/parity/v1/checked-i64-42.ores)" = "8e4f76fa1e4752f4996d464cd02a86f609430118"
          git diff --quiet --exit-code HEAD --
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Build exact-head Native Image Oreslang CLI
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests -Pnative-aot package
          test -x target/ores-aot
      - name: Execute byte-identical checked-i64 guest through Native Image
        shell: bash
        run: |
          set -euo pipefail
          set +e
          target/ores-aot contracts/parity/v1/checked-i64-42.ores
          rc=$?
          set -e
          test "$rc" -eq 42
          mkdir -p target/checked-i64-proof
          sha256sum target/ores-aot > target/checked-i64-proof/compiler-sha256.txt
          sha256sum contracts/parity/v1/checked-i64-42.ores > target/checked-i64-proof/source-sha256.txt
          git rev-parse HEAD > target/checked-i64-proof/head-sha.txt
          git rev-parse 'HEAD^{tree}' > target/checked-i64-proof/tree-sha.txt
          printf '%s
' 42 > target/checked-i64-proof/guest-exit.txt
      - name: Upload Native Image compiler and guest proof receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checked-i64-guest-java-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/checked-i64-proof/
            target/ores-aot
          if-no-files-found: error
          retention-days: 14

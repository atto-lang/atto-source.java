name: Strict destructuring leaf policy
on:
  push:
    branches: ['feat/local-destructure-leaf-policy-v1-20261127']
  pull_request:
    paths: ['src/main/java/dev/oreslang/parser/Parser.java','src/test/java/dev/oreslang/DestructureLeafPolicyV1Test.java']
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable head and source tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          bash scripts/verify-source-tree.sh "$EXPECTED_HEAD"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
      - run: mvn -B -ntp -Dtest=DestructureLeafPolicyV1Test,DestructureAndForOfMutabilityTest,DestructureSourceTupleOwnershipTest test

name: Atto optional named scalar exact-head JVM and AOT
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/atto-optional-named-scalar-jvm-aot.yml'
      - 'pom.xml'
      - 'src/main/java/dev/oreslang/ast/**'
      - 'src/main/java/dev/oreslang/parser/**'
      - 'src/main/java/dev/oreslang/types/**'
      - 'src/main/java/dev/oreslang/nodes/**'
      - 'src/main/java/dev/oreslang/compiler/**'
      - 'src/test/java/dev/oreslang/OptionalParameterMainStageTest.java'
      - 'src/test/java/dev/oreslang/CheckedOptionalNamedBinderMainTest.java'
      - 'src/test/java/dev/oreslang/CheckedCallPlanExhaustiveTest.java'
      - 'src/test/java/dev/oreslang/NamedScalarExecutableStageTest.java'
      - 'src/test/java/dev/oreslang/ClosedScalarOptionalGuestTest.java'

permissions:
  contents: read

concurrency:
  group: atto-optional-named-scalar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  exact-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout exact PR head without stored Git credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require the exact source tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet HEAD --
          printf 'ATTO_NAMED_JVM_HEAD=%s TREE=%s ATTEMPT=%s\n' "$EXPECTED_HEAD" "$(git rev-parse 'HEAD^{tree}')" "$GITHUB_RUN_ATTEMPT"
      - name: Install JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Execute actual Java parser, type, ownership, and Graal guest JUnit
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -B -ntp -Dtest=OptionalParameterMainStageTest,CheckedOptionalNamedBinderMainTest,CheckedCallPlanExhaustiveTest,NamedScalarExecutableStageTest,ClosedScalarOptionalGuestTest -DfailIfNoTests=true test
      - name: Validate official JUnit reports without skips, failures or synthetic passes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          names = [
              "OptionalParameterMainStageTest",
              "CheckedOptionalNamedBinderMainTest",
              "CheckedCallPlanExhaustiveTest",
              "NamedScalarExecutableStageTest",
              "ClosedScalarOptionalGuestTest",
          ]
          total = 0
          for name in names:
              file = Path("target/surefire-reports") / ("TEST-dev.oreslang." + name + ".xml")
              if not file.is_file():
                  raise SystemExit("NOT_VERIFIED: missing JUnit XML for " + name)
              root = ElementTree.parse(file).getroot()
              tests = int(root.get("tests", "0"))
              bad = sum(int(root.get(k, "0")) for k in ("errors", "failures", "skipped"))
              if tests == 0 or bad:
                  raise SystemExit(f"NOT_VERIFIED: {name} tests={tests}, bad={bad}")
              total += tests
          if total < 30:
              raise SystemExit("NOT_VERIFIED: expected at least 30 executed JUnit methods, got " + str(total))
          print("ATTO_NAMED_JUNIT_EXECUTED=" + str(total))
          PY
      - name: Preserve source head after validation
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet HEAD --

  native-aot:
    needs: exact-jvm
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install GraalVM JDK 25 with Native Image
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
      - name: Build a real native launcher without test fallback
        shell: bash
        run: |
          set -euo pipefail
          native-image --version
          mvn -B -ntp -Pnative-aot -DskipTests -Dnative.image.optimization=-O0 package
          test -x target/ores-aot
          ./target/ores-aot --build-info | jq -e '.build_mode == "aot" and .guest_execution == "interpreter-no-jit"'
      - name: Compile and execute the requested name-first guest with exit-42 output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/atto-named-evidence
          cat > target/atto-named-evidence/valid.atto <<'ATTO'
          fnc calculate(
            x: int,
            y?: int = 10,
            z?: int?
          ): int {
            return x + y;
          }
          pub fnc main(): void {
            stdio.println(calculate(x: 20, y: 22));
            return;
          }
          ATTO
          ./target/ores-aot --check target/atto-named-evidence/valid.atto
          ./target/ores-aot target/atto-named-evidence/valid.atto > target/atto-named-evidence/actual.stdout
          printf '42\n' > target/atto-named-evidence/expected.stdout
          diff -u target/atto-named-evidence/expected.stdout target/atto-named-evidence/actual.stdout
          cat > target/atto-named-evidence/invalid.atto <<'ATTO'
          fnc calculate(x: int, y?: int = 10, z?: int?): int {
            return x + y;
          }
          pub fnc main(): void {
            stdio.println(calculate(q: 20));
            return;
          }
          ATTO
          if ./target/ores-aot --check target/atto-named-evidence/invalid.atto > target/atto-named-evidence/invalid.stdout 2> target/atto-named-evidence/invalid.stderr; then
            echo 'NOT_VERIFIED: invalid source unexpectedly admitted' >&2
            exit 1
          fi
          test ! -s target/atto-named-evidence/invalid.stdout
          grep -Eq 'SCALAR_CALL_INVALID|unknown named argument' target/atto-named-evidence/invalid.stderr
          printf 'ATTO_NAMED_AOT_GUEST_EXECUTED=TRUE\n'
      - name: Require exact source head unchanged
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet HEAD --
          printf 'ATTO_NAMED_AOT_HEAD=%s TREE=%s\n' "$EXPECTED_HEAD" "$(git rev-parse 'HEAD^{tree}')"

name: Actor two-peer fault native guest E2E CANDIDATE
on:
  pull_request:
    paths:
      - 'tests/fixtures/actor-two-peer-failure-v1/**'
      - 'scripts/test-actor-two-peer-failure-v1.sh'
      - '.github/workflows/actor-two-peer-failure-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-peer-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Pin exact source and assert local script syntax
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          test "$(git hash-object tests/fixtures/actor-two-peer-failure-v1/two-peer-failure-matrix.atto)" = eaac813262ca184930ba124180ed692e21329969
          bash -n scripts/test-actor-two-peer-failure-v1.sh
          printf 'HEAD=%s\nTREE=%s\nSTATUS=NOT_CERTIFIED\n' "$EXPECTED_HEAD" "$(git rev-parse 'HEAD^{tree}')" > "$RUNNER_TEMP/actor-two-peer-provenance.log"
      - name: Set up GraalVM/JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Compile and execute real two-peer JVM guest (candidate)
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          bash scripts/test-actor-two-peer-failure-v1.sh 2>&1 | tee "$RUNNER_TEMP/actor-two-peer-execution.log"
      - name: Retain unverified guest candidate logs, even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: actor-two-peer-java-candidate
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/actor-two-peer-provenance.log
            ${{ runner.temp }}/actor-two-peer-execution.log

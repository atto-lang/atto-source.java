name: Guest Future cancellation contract
on:
  push:
    branches:
      - feat/guest-future-cancel-20261026
    paths:
      - src/main/java/dev/oreslang/types/TypeChecker.java
      - src/main/java/dev/oreslang/types/OwnershipChecker.java
      - src/main/java/dev/oreslang/nodes/OresEvalRootNode.java
      - src/test/java/dev/oreslang/FutureCancellationLanguageTest.java
      - .github/workflows/guest-future-cancel.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny-unapproved-runner:
    if: ${{ github.repository != 'ores-truffle-oreslang/oreslang-source.java' || github.event.repository.private != true || github.ref != 'refs/heads/feat/guest-future-cancel-20261026' || vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER != 'true' || vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA == '' || vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA != github.sha || vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_TREE == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed without source checkout
        shell: bash
        run: |
          echo "::error::Private compiler CI admission denied: require approved ephemeral runner plus exact SHA/tree variables"
          exit 1

  contract:
    if: ${{ github.repository == 'ores-truffle-oreslang/oreslang-source.java' && github.event.repository.private == true && github.ref == 'refs/heads/feat/guest-future-cancel-20261026' && vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER == 'true' && vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA != '' && vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA == github.sha && vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_TREE != '' }}
    runs-on: [self-hosted, linux, x64, oreslang-private-ephemeral]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify exact private source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ores-truffle-oreslang/oreslang-source.java"
          test "$GITHUB_REF" = "refs/heads/feat/guest-future-cancel-20261026"
          test "${{ github.event.repository.private }}" = "true"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "${{ vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_TREE }}"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "Verified source SHA: $(git rev-parse HEAD)"
          echo "Verified source tree: $(git rev-parse HEAD^{tree})"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: '25'
          version: '25.3'
          distribution: graalvm
      - name: Run guest Future cancellation contracts
        run: mvn -B -ntp -Dtest=FutureCancellationLanguageTest test
      - name: Run channel cancellation regressions
        run: mvn -B -ntp -Dtest='dev.oreslang.runtime.ChannelMappedSelectionCancellationTest,dev.oreslang.runtime.ChannelMappedCancellationStressTest,dev.oreslang.runtime.FutureChannelSelectTest,dev.oreslang.runtime.ChannelCommittedCompletionDrainTest' test

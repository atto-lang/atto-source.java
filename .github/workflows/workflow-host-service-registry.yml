name: Workflow host service registry (standalone JVM)

on:
  push:
    branches:
      - feat/workflow-host-service-registry-20261029
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/WorkflowHostServiceRegistry.java'
      - 'src/main/java/dev/oreslang/runtime/OresContext.java'
      - 'src/main/java/dev/oreslang/runtime/LinkedProgramRunner.java'
      - 'src/test/java/dev/oreslang/runtime/WorkflowHostServiceRegistryTest.java'
      - 'scripts/check-workflow-host-registry.sh'
      - '.github/workflows/workflow-host-service-registry.yml'

permissions:
  contents: read

jobs:
  isolated-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run standalone fail-closed host registry tests
        run: bash scripts/check-workflow-host-registry.sh

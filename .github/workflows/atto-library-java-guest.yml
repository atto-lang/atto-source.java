name: AttoLang canonical Java Core/Std linked guest
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/stdlib/CoreLibrarySources.java'
      - 'src/test/java/dev/oreslang/AttoLibraryNamespaceResolutionTest.java'
      - 'docs/ATTO_LIBRARY_JAVA_RESOLUTION_V1.md'
      - '.github/workflows/atto-library-java-guest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-atto-library-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact immutable PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          echo "ATTO_JAVA_SOURCE_HEAD=$EXPECTED_HEAD"
          echo "ATTO_JAVA_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Install JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Execute real Java/Truffle Atto Core namespace guest tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=AttoLibraryNamespaceResolutionTest -DfailIfNoTests=true test
          report=target/surefire-reports/TEST-dev.oreslang.AttoLibraryNamespaceResolutionTest.xml
          test -s "$report"
          grep -Eq '<testsuite[^>]*tests="[1-9][0-9]*"' "$report"
          if grep -Eq '<testsuite[^>]*(errors|failures|skipped)="[1-9][0-9]*"|<skipped([ >])' "$report"; then exit 1; fi
          echo 'ATTO_JAVA_COMPILER_GUEST=TEST_EXECUTED_CHECK_JUNIT'
      - name: Retain JUnit report on success or failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atto-java-library-guest-evidence
          path: target/surefire-reports/*AttoLibraryNamespaceResolutionTest*
          if-no-files-found: error

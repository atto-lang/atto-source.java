name: Private exact-candidate Java/Native validation

# Trusted workflow must be dispatched from independently approved source main.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Independently approved immutable candidate commit in this repository"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: private-exact-candidate-validation
  cancel-in-progress: false

jobs:
  deny-unapproved:
    if: ${{ github.repository != 'ores-truffle-oreslang/oreslang-source.java' || github.event.repository.id != 1400792274 || github.event.repository.private != true || github.ref != 'refs/heads/main' || github.ref_protected != true || vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER != 'true' || vars.ORESLANG_PRIVATE_CANDIDATE_WORKFLOW_SHA == '' || vars.ORESLANG_PRIVATE_CANDIDATE_WORKFLOW_SHA != github.sha || vars.ORESLANG_PRIVATE_CANDIDATE_APPROVED_SHA == '' || vars.ORESLANG_PRIVATE_CANDIDATE_APPROVED_SHA != inputs.candidate_sha || vars.ORESLANG_PRIVATE_CANDIDATE_APPROVED_TREE == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject unapproved exact-commit or workflow admission
        run: |
          echo "::error::Private candidate validation denied; require reviewed exact workflow, commit and tree"
          exit 1

  validate-approved-candidate:
    if: ${{ github.repository == 'ores-truffle-oreslang/oreslang-source.java' && github.event.repository.id == 1400792274 && github.event.repository.private == true && github.ref == 'refs/heads/main' && github.ref_protected == true && vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER == 'true' && vars.ORESLANG_PRIVATE_CANDIDATE_WORKFLOW_SHA != '' && vars.ORESLANG_PRIVATE_CANDIDATE_WORKFLOW_SHA == github.sha && vars.ORESLANG_PRIVATE_CANDIDATE_APPROVED_SHA != '' && vars.ORESLANG_PRIVATE_CANDIDATE_APPROVED_SHA == inputs.candidate_sha && vars.ORESLANG_PRIVATE_CANDIDATE_APPROVED_TREE != '' }}
    runs-on: [self-hosted, linux, x64, oreslang-private-ephemeral]
    timeout-minutes: 180
    env:
      APPROVED_WORKFLOW_SHA: ${{ vars.ORESLANG_PRIVATE_CANDIDATE_WORKFLOW_SHA }}
      APPROVED_CANDIDATE_SHA: ${{ vars.ORESLANG_PRIVATE_CANDIDATE_APPROVED_SHA }}
      APPROVED_CANDIDATE_TREE: ${{ vars.ORESLANG_PRIVATE_CANDIDATE_APPROVED_TREE }}
      REQUESTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Verify approvals before any candidate source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ores-truffle-oreslang/oreslang-source.java'
          test "$GITHUB_REPOSITORY_ID" = '1400792274'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REF_PROTECTED" = 'true'
          test "$GITHUB_SHA" = "$APPROVED_WORKFLOW_SHA"
          test "$REQUESTED_CANDIDATE_SHA" = "$APPROVED_CANDIDATE_SHA"
          [[ "$APPROVED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APPROVED_CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APPROVED_CANDIDATE_TREE" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - name: Verify immutable candidate and clean checkout before tool setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$APPROVED_CANDIDATE_SHA"
          test "$(git rev-parse --verify HEAD^{tree})" = "$APPROVED_CANDIDATE_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "TRUSTED_WORKFLOW_COMMIT=$APPROVED_WORKFLOW_SHA"
          echo "TESTED_CANDIDATE_COMMIT=$APPROVED_CANDIDATE_SHA"
          echo "TESTED_CANDIDATE_TREE=$APPROVED_CANDIDATE_TREE"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          distribution: graalvm
          java-version: '25'
          version: '25.3'
      - name: Verify GraalVM JDK 25 and Maven
        run: |
          set -euo pipefail
          java --version
          native-image --version
          mvn --version
      - name: Clear and attest focused Surefire report provenance
        shell: bash
        run: |
          set -euo pipefail
          # The candidate's source tree may contain prebuilt test-result XML.
          # Never count a preexisting/symlinked report as proof of execution.
          test ! -L target
          test ! -L target/surefire-reports
          if test -e target/surefire-reports && test ! -d target/surefire-reports; then
            echo "::error::Invalid Surefire report directory"
            exit 1
          fi
          rm -rf -- target/surefire-reports
          test ! -e target/surefire-reports
      - name: Focused permissions and scoped host interop regressions
        run: mvn -B -ntp -Dores.runtime.carriers=native '-Dtest=DenoCliDefaultPermissionsTest,RuntimePermissionsNetworkAuditTest,RuntimePermissionsTest,RuntimePermissionsExplicitPolicyTest,IsolatePolicySerializationAuditTest,ScopedPermissionInteropTest' test
      - name: Prove all six security JUnit classes executed
        shell: bash
        run: |
          set -euo pipefail
          # This verifier is in the *trusted workflow*, not a script loaded
          # from the untrusted candidate checkout.
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          required = {
              "dev.oreslang.launcher.DenoCliDefaultPermissionsTest",
              "dev.oreslang.runtime.RuntimePermissionsNetworkAuditTest",
              "dev.oreslang.runtime.RuntimePermissionsTest",
              "dev.oreslang.runtime.RuntimePermissionsExplicitPolicyTest",
              "dev.oreslang.runtime.IsolatePolicySerializationAuditTest",
              "dev.oreslang.runtime.ScopedPermissionInteropTest",
          }
          executed = {name: 0 for name in required}
          # This is a single-module Maven project. Never accept reports
          # from candidate-controlled nested fixture directories.
          report_dir = Path("target/surefire-reports")
          if (not report_dir.is_dir() or report_dir.is_symlink()
                  or report_dir.parent.is_symlink()):
              raise SystemExit("Missing or symlinked Maven Surefire report directory")
          # Ignore unrelated suites: each expected test class must have its
          # own real Maven report, with matching suite and testcase identity.
          # Never accept a forged testcase tucked inside an unrelated report.
          for classname in sorted(required):
              report = report_dir / f"TEST-{classname}.xml"
              if report.is_symlink() or not report.is_file():
                  raise SystemExit(f"Missing required Surefire report: {report}")
              if not 0 < report.stat().st_size <= 16 * 1024 * 1024:
                  raise SystemExit(f"Empty or oversized Surefire report: {report}")
              root = ElementTree.parse(report).getroot()
              if root.tag != "testsuite" or root.get("name") != classname:
                  raise SystemExit(f"Invalid Surefire suite identity: {report}")
              # Only direct Surefire testcase children count; an unrelated
              # nested element must not smuggle fake test evidence.
              cases = root.findall("testcase")
              try:
                  declared = int(root.get("tests", "-1"))
              except ValueError:
                  raise SystemExit(f"Invalid Surefire test count: {report}")
              if declared < 1 or declared != len(cases):
                  raise SystemExit(f"Surefire test count mismatch: {report}")
              for case in cases:
                  if case.get("classname") != classname:
                      raise SystemExit(f"Mismatched Surefire testcase: {report}")
                  if any(case.find(tag) is not None
                         for tag in ("failure", "error", "skipped")):
                      raise SystemExit(f"Unsuccessful required test in {classname}")
                  executed[classname] += 1
          missing = sorted(name for name, count in executed.items() if count == 0)
          if missing:
              raise SystemExit("Required security test classes not executed: "
                               + ", ".join(missing))
          for name, count in sorted(executed.items()):
              print(f"VERIFIED_SECURITY_JUNIT {name}: {count} executed")
          PY
      - name: Full Java 25 Maven candidate verification
        run: mvn -B -ntp -Dores.runtime.carriers=native verify
      - name: Native AOT candidate build and guest execution
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Pnative-aot -DskipTests package
          timeout 180s ./target/ores-aot --mode=aot --platform=linux examples/together.ores
      - name: Native hybrid candidate build and guest execution
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Pnative-hybrid -DskipTests package
          timeout 180s ./target/ores-hybrid --mode=hybrid --platform=linux examples/together.ores
      - name: Strict polyglot isolate candidate build and guest execution
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Pnative-isolate -DskipTests package
          lib="$(find target -maxdepth 1 -type f \( -name 'oresvm.so' -o -name 'liboresvm.so' \) | head -n1)"
          test -n "$lib"
          timeout 180s mvn -B -ntp "-Dpolyglot.engine.IsolateLibrary=$PWD/$lib" -DskipTests exec:java -Dexec.args="--strict-isolate --mode=hybrid --platform=linux examples/together.ores"

name: Private exact-candidate Java/Native validation

# Trusted workflow must be dispatched from independently approved source main.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Independently approved immutable candidate commit in this repository"
        required: true
        type: string
      verify_option_pattern:
        description: "Also require 13 Option-pattern JUnit methods on the approved candidate"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# All three private-source validation workflows share one admission queue.
# Never run two source candidates on the same class of disposable runner.
concurrency:
  group: private-oreslang-isolated-validation
  cancel-in-progress: false

jobs:
  deny-unapproved:
    if: ${{ github.repository != 'ores-truffle-oreslang/oreslang-source.java' || github.event.repository.id != 1400792274 || github.event.repository.private != true || github.ref != 'refs/heads/main' || github.ref_protected != true || vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER != 'true' || vars.ORESLANG_PRIVATE_CANDIDATE_WORKFLOW_SHA == '' || vars.ORESLANG_PRIVATE_CANDIDATE_WORKFLOW_SHA != github.sha || vars.ORESLANG_PRIVATE_CANDIDATE_APPROVED_SHA == '' || vars.ORESLANG_PRIVATE_CANDIDATE_APPROVED_SHA != inputs.candidate_sha || vars.ORESLANG_PRIVATE_CANDIDATE_APPROVED_TREE == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject unapproved exact-commit or workflow admission
        run: |
          echo "::error::Private candidate validation denied; require reviewed exact workflow, commit and tree"
          exit 1

  validate-approved-candidate:
    if: ${{ github.repository == 'ores-truffle-oreslang/oreslang-source.java' && github.event.repository.id == 1400792274 && github.event.repository.private == true && github.ref == 'refs/heads/main' && github.ref_protected == true && vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER == 'true' && vars.ORESLANG_PRIVATE_CANDIDATE_WORKFLOW_SHA != '' && vars.ORESLANG_PRIVATE_CANDIDATE_WORKFLOW_SHA == github.sha && vars.ORESLANG_PRIVATE_CANDIDATE_APPROVED_SHA != '' && vars.ORESLANG_PRIVATE_CANDIDATE_APPROVED_SHA == inputs.candidate_sha && vars.ORESLANG_PRIVATE_CANDIDATE_APPROVED_TREE != '' }}
    runs-on: [self-hosted, linux, x64, oreslang-private-ephemeral]
    timeout-minutes: 180
    env:
      APPROVED_WORKFLOW_SHA: ${{ vars.ORESLANG_PRIVATE_CANDIDATE_WORKFLOW_SHA }}
      APPROVED_CANDIDATE_SHA: ${{ vars.ORESLANG_PRIVATE_CANDIDATE_APPROVED_SHA }}
      APPROVED_CANDIDATE_TREE: ${{ vars.ORESLANG_PRIVATE_CANDIDATE_APPROVED_TREE }}
      REQUESTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      REQUIRE_OPTION_PATTERN: ${{ inputs.verify_option_pattern }}
      APPROVED_OPTION_TEST_BLOB: ${{ vars.ORESLANG_PRIVATE_CANDIDATE_OPTION_TEST_BLOB }}
    steps:
      - name: Verify approvals before any candidate source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ores-truffle-oreslang/oreslang-source.java'
          test "$GITHUB_REPOSITORY_ID" = '1400792274'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REF_PROTECTED" = 'true'
          test "$GITHUB_SHA" = "$APPROVED_WORKFLOW_SHA"
          test "$REQUESTED_CANDIDATE_SHA" = "$APPROVED_CANDIDATE_SHA"
          [[ "$APPROVED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APPROVED_CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APPROVED_CANDIDATE_TREE" =~ ^[a-f0-9]{40}$ ]]
          if test "$REQUIRE_OPTION_PATTERN" = 'true'; then
            [[ "$APPROVED_OPTION_TEST_BLOB" =~ ^[a-f0-9]{40}$ ]]
          fi
      - name: Create isolated runner user/tool state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          test -d "$RUNNER_TEMP"
          test ! -L "$RUNNER_TEMP"
          cleanroom=$(/usr/bin/mktemp -d "$RUNNER_TEMP/oreslang-cleanroom.XXXXXXXXXX")
          [[ "$cleanroom" != *[[:space:]]* ]]
          test -d "$cleanroom"
          test ! -L "$cleanroom"
          umask 077
          /usr/bin/mkdir -p "$cleanroom/home" "$cleanroom/xdg" "$cleanroom/m2-repository"
          : > "$cleanroom/home/.gitconfig"
          {
            printf 'CLEANROOM_ROOT=%s\n' "$cleanroom"
            printf 'HOME=%s\n' "$cleanroom/home"
            printf 'XDG_CONFIG_HOME=%s\n' "$cleanroom/xdg"
            printf 'PATH=/usr/bin:/bin\n'
            printf 'GIT_CONFIG_NOSYSTEM=1\n'
            printf 'GIT_CONFIG_GLOBAL=%s\n' "$cleanroom/home/.gitconfig"
            printf 'GIT_CONFIG_COUNT=0\n'
            printf 'GIT_DIR=\nGIT_WORK_TREE=\nGIT_INDEX_FILE=\n'
            printf 'GIT_OBJECT_DIRECTORY=\nGIT_ALTERNATE_OBJECT_DIRECTORIES=\nGIT_COMMON_DIR=\n'
            printf 'GIT_SSH=\nGIT_SSH_COMMAND=\nGIT_ASKPASS=\nSSH_ASKPASS=\n'
            printf 'BASH_ENV=\nENV=\nPYTHONPATH=\nPYTHONHOME=\n'
            printf 'JAVA_TOOL_OPTIONS=\nJDK_JAVA_OPTIONS=\n_JAVA_OPTIONS=\nCLASSPATH=\n'
            printf 'MAVEN_ARGS=\n'
            printf 'MAVEN_OPTS=-Dmaven.repo.local=%s\n' "$cleanroom/m2-repository"
            printf 'HTTP_PROXY=\nHTTPS_PROXY=\nALL_PROXY=\nNO_PROXY=\n'
            printf 'http_proxy=\nhttps_proxy=\nall_proxy=\nno_proxy=\n'
            printf 'SSL_CERT_FILE=\nSSL_CERT_DIR=\nCURL_CA_BUNDLE=\nREQUESTS_CA_BUNDLE=\nNODE_EXTRA_CA_CERTS=\n'
            printf 'LD_PRELOAD=\nLD_LIBRARY_PATH=\n'
          } >> "$GITHUB_ENV"
          test -s "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - name: Verify immutable candidate and clean checkout before tool setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$APPROVED_CANDIDATE_SHA"
          test "$(git rev-parse --verify HEAD^{tree})" = "$APPROVED_CANDIDATE_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "TRUSTED_WORKFLOW_COMMIT=$APPROVED_WORKFLOW_SHA"
          echo "TESTED_CANDIDATE_COMMIT=$APPROVED_CANDIDATE_SHA"
          echo "TESTED_CANDIDATE_TREE=$APPROVED_CANDIDATE_TREE"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          distribution: graalvm
          java-version: '25'
          version: '25.3'
      - name: Verify GraalVM JDK 25 and Maven
        run: |
          set -euo pipefail
          java --version
          native-image --version
          mvn --version
      - name: Clear and attest focused Surefire report provenance
        shell: bash
        run: |
          set -euo pipefail
          # The candidate's source tree may contain prebuilt test-result XML.
          # Never count a preexisting/symlinked report as proof of execution.
          test ! -L target
          test ! -L target/surefire-reports
          if test -e target/surefire-reports && test ! -d target/surefire-reports; then
            echo "::error::Invalid Surefire report directory"
            exit 1
          fi
          rm -rf -- target/surefire-reports
          test ! -e target/surefire-reports
      - name: Focused permissions and scoped host interop regressions
        run: mvn -B -ntp -Dores.runtime.carriers=native '-Dtest=DenoCliDefaultPermissionsTest,RuntimePermissionsNetworkAuditTest,RuntimePermissionsTest,RuntimePermissionsExplicitPolicyTest,IsolatePolicySerializationAuditTest,ScopedPermissionInteropTest,VerifiedTcpSocketTest,NativeSocketBoundaryTest' clean test
      - name: Prove all eight security JUnit classes executed
        shell: bash
        run: |
          set -euo pipefail
          # This verifier is in the *trusted workflow*, not a script loaded
          # from the untrusted candidate checkout.
          python3 -I - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          required = {
              "dev.oreslang.launcher.DenoCliDefaultPermissionsTest",
              "dev.oreslang.runtime.RuntimePermissionsNetworkAuditTest",
              "dev.oreslang.runtime.RuntimePermissionsTest",
              "dev.oreslang.runtime.RuntimePermissionsExplicitPolicyTest",
              "dev.oreslang.runtime.IsolatePolicySerializationAuditTest",
              "dev.oreslang.runtime.ScopedPermissionInteropTest",
              "dev.oreslang.runtime.VerifiedTcpSocketTest",
              "dev.oreslang.runtime.NativeSocketBoundaryTest",
          }
          executed = {name: 0 for name in required}
          # This is a single-module Maven project. Never accept reports
          # from candidate-controlled nested fixture directories.
          report_dir = Path("target/surefire-reports")
          if (not report_dir.is_dir() or report_dir.is_symlink()
                  or report_dir.parent.is_symlink()):
              raise SystemExit("Missing or symlinked Maven Surefire report directory")
          # Ignore unrelated suites: each expected test class must have its
          # own real Maven report, with matching suite and testcase identity.
          # Never accept a forged testcase tucked inside an unrelated report.
          for classname in sorted(required):
              report = report_dir / f"TEST-{classname}.xml"
              if report.is_symlink() or not report.is_file():
                  raise SystemExit(f"Missing required Surefire report: {report}")
              if not 0 < report.stat().st_size <= 16 * 1024 * 1024:
                  raise SystemExit(f"Empty or oversized Surefire report: {report}")
              root = ElementTree.parse(report).getroot()
              if root.tag != "testsuite" or root.get("name") != classname:
                  raise SystemExit(f"Invalid Surefire suite identity: {report}")
              # Only direct Surefire testcase children count; an unrelated
              # nested element must not smuggle fake test evidence.
              cases = root.findall("testcase")
              try:
                  declared = int(root.get("tests", "-1"))
              except ValueError:
                  raise SystemExit(f"Invalid Surefire test count: {report}")
              if declared < 1 or declared != len(cases):
                  raise SystemExit(f"Surefire test count mismatch: {report}")
              # A forged or partially written report can contradict its
              # aggregate status. Validate the suite totals as well as each
              # testcase, including rerun/flaky failure markers.
              for attribute in ("failures", "errors", "skipped"):
                  try:
                      count = int(root.get(attribute, "-1"))
                  except ValueError:
                      raise SystemExit(f"Invalid Surefire {attribute}: {report}")
                  if count != 0:
                      raise SystemExit(f"Unsuccessful Surefire {attribute}: {report}")
              for case in cases:
                  if case.get("classname") != classname:
                      raise SystemExit(f"Mismatched Surefire testcase: {report}")
                  if any(case.find(tag) is not None for tag in
                         ("failure", "error", "skipped", "flakyFailure",
                          "flakyError", "rerunFailure", "rerunError")):
                      raise SystemExit(f"Unsuccessful required test in {classname}")
                  executed[classname] += 1
          missing = sorted(name for name, count in executed.items() if count == 0)
          if missing:
              raise SystemExit("Required security test classes not executed: "
                               + ", ".join(missing))
          for name, count in sorted(executed.items()):
              print(f"VERIFIED_SECURITY_JUNIT {name}: {count} executed")
          PY
      - name: Reset actor-memory Surefire reports before focused execution
        shell: bash
        run: |
          set -euo pipefail
          # No report created by a previous step or the candidate checkout
          # can satisfy the upcoming required actor regression check.
          test ! -L target
          test ! -L target/surefire-reports
          if test -e target/surefire-reports && test ! -d target/surefire-reports; then
            echo "::error::Invalid actor-memory Surefire report directory"
            exit 1
          fi
          rm -rf -- target/surefire-reports
          test ! -e target/surefire-reports
      - name: Execute exact candidate actor-memory regression classes
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dores.runtime.carriers=native -DskipTests=false -Dmaven.test.skip=false \
            '-Dtest=PersistentActorMapTest,ActorSharedLocalMemoryTest,ActorStateModeContractsTest' test
      - name: Prove actor-memory regression classes executed
        shell: bash
        run: |
          set -euo pipefail
          # Trusted workflow checks report provenance without executing a
          # candidate-provided evidence-verifier script.
          python3 -I - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          required = {
              "dev.oreslang.runtime.PersistentActorMapTest",
              "dev.oreslang.runtime.ActorSharedLocalMemoryTest",
              "dev.oreslang.types.ActorStateModeContractsTest",
          }
          reports = Path("target/surefire-reports")
          if not reports.is_dir() or reports.is_symlink() or reports.parent.is_symlink():
              raise SystemExit("Missing or symlinked fresh actor-memory test reports")
          total_cases = 0
          for classname in sorted(required):
              report = reports / ("TEST-" + classname + ".xml")
              if report.is_symlink() or not report.is_file():
                  raise SystemExit("Missing required actor-memory JUnit report: " + str(report))
              if not 0 < report.stat().st_size <= 16 * 1024 * 1024:
                  raise SystemExit("Empty/oversized actor-memory JUnit report: " + str(report))
              root = ElementTree.parse(report).getroot()
              if root.tag != "testsuite" or root.get("name") != classname:
                  raise SystemExit("Actor-memory JUnit suite identity mismatch: " + str(report))
              cases = root.findall("testcase")
              try:
                  tests = int(root.get("tests", "-1"))
                  counts = [int(root.get(k, "-1")) for k in ("failures", "errors", "skipped")]
              except ValueError as exc:
                  raise SystemExit("Invalid actor-memory JUnit count: " + str(report)) from exc
              if tests < 1 or tests != len(cases) or any(value != 0 for value in counts):
                  raise SystemExit("Missing, failed or skipped actor-memory cases: " + str(report))
              for case in cases:
                  if case.get("classname") != classname or any(
                      case.find(k) is not None for k in (
                          "failure", "error", "skipped", "flakyFailure",
                          "flakyError", "rerunFailure", "rerunError"
                      )
                  ):
                      raise SystemExit("Invalid actor-memory testcase: " + str(report))
              total_cases += tests
              print("VERIFIED_ACTOR_MEMORY_JUNIT", classname, tests)
          print("VERIFIED_ACTOR_MEMORY_JUNIT_TOTAL", total_cases)
          PY
      - name: Require exact Option-pattern source when requested
        if: ${{ inputs.verify_option_pattern == true }}
        shell: bash
        run: |
          set -euo pipefail
          source='src/test/java/dev/oreslang/OptionIfMatchesTest.java'
          test -f "$source"
          test ! -L "$source"
          test -s "$source"
          test "$(git hash-object "$source")" = "$APPROVED_OPTION_TEST_BLOB"
          test -f contracts/v1/option-pattern-v1.json
          test ! -L contracts/v1/option-pattern-v1.json
          test -f scripts/check_option_pattern_contract.py
          test ! -L scripts/check_option_pattern_contract.py
          echo "OPTION_PATTERN_EXACT_SOURCE_PRESENT=$APPROVED_CANDIDATE_SHA"
      - name: Remove prior Surefire reports before Option-pattern execution
        if: ${{ inputs.verify_option_pattern == true }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -L target
          test ! -L target/surefire-reports
          if test -e target/surefire-reports && test ! -d target/surefire-reports; then
            echo "::error::Invalid Option-pattern Surefire report directory"
            exit 1
          fi
          rm -rf -- target/surefire-reports
          test ! -e target/surefire-reports
      - name: Execute exact candidate Option-pattern JUnit runtime
        if: ${{ inputs.verify_option_pattern == true }}
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dores.runtime.carriers=native -DskipTests=false \
            -Dmaven.test.skip=false '-Dtest=OptionIfMatchesTest' test
      - name: Attest all 13 Option-pattern JUnit methods from fresh Surefire XML
        if: ${{ inputs.verify_option_pattern == true }}
        shell: bash
        run: |
          set -euo pipefail
          # Trusted workflow code, not the candidate's own report checker.
          python3 -I - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          classname = "dev.oreslang.OptionIfMatchesTest"
          names = {
              "optionalFooCanBeInitializedLaterAndCalledOnlyInsideSuccessfulMatch",
              "payloadAliasDoesNotEscapeThenBranch",
              "payloadAliasDoesNotLeakToElseBranch",
              "disjunctionNeverSpeculativelyExposesSomePayload",
              "payloadAliasDoesNotLeakIntoElif",
              "nestedSomeBindingsResolveOwnershipThroughLeftAndScope",
              "independentAndPayloadsKeepDistinctOwners",
              "nestedAndCannotMovePayloadThenMoveItsOptionOwner",
              "projectedSomePayloadCannotBeMovedSeparatelyFromHolder",
              "independentProjectedSomePayloadsHaveDistinctOwners",
              "projectedCopyPayloadDoesNotConsumeMoveOnlyHolder",
              "ordinaryFooIsNotAutomaticallyOptional",
              "optionDoesNotPermitUncheckedMemberCalls",
          }
          report_dir = Path("target/surefire-reports")
          report = report_dir / ("TEST-" + classname + ".xml")
          if (not report_dir.is_dir() or report_dir.is_symlink()
                  or report_dir.parent.is_symlink()
                  or report.is_symlink() or not report.is_file()
                  or not 0 < report.stat().st_size <= 16 * 1024 * 1024):
              raise SystemExit("Missing or untrusted fresh Option-pattern Surefire report")
          root = ElementTree.parse(report).getroot()
          if root.tag != "testsuite" or root.get("name") != classname:
              raise SystemExit("Option-pattern test suite identity mismatch")
          cases = root.findall("testcase")
          try:
              total = int(root.get("tests", "-1"))
              statuses = [int(root.get(key, "-1"))
                          for key in ("failures", "errors", "skipped")]
          except ValueError as exc:
              raise SystemExit("Malformed Option-pattern test totals") from exc
          if total != len(names) or total != len(cases) or any(statuses):
              raise SystemExit("Option-pattern JUnit tests failed, skipped or were omitted")
          witnessed = set()
          for case in cases:
              name = case.get("name")
              if (case.get("classname") != classname or name not in names
                      or name in witnessed or any(case.find(tag) is not None for tag in (
                          "failure", "error", "skipped", "flakyFailure",
                          "flakyError", "rerunFailure", "rerunError"))):
                  raise SystemExit("Invalid, duplicated or unsuccessful Option-pattern method")
              witnessed.add(name)
          if witnessed != names:
              raise SystemExit("Missing Option-pattern JUnit methods: " +
                               ", ".join(sorted(names - witnessed)))
          print("VERIFIED_OPTION_PATTERN_JUNIT_METHODS=13")
          PY
      - name: Execute pinned nine-case Option admission and real guest exits
        if: ${{ inputs.verify_option_pattern == true }}
        shell: bash
        run: |
          set -euo pipefail
          # Independently pin the shared v1 checker and fixture blobs. Candidate
          # code must not silently replace the oracle before evidence is read.
          test "$(git hash-object contracts/v1/option-pattern-v1.json)" = \
            'bb2302e138f4b36d68afd6ffa9280b24fa270d04'
          test "$(git hash-object scripts/check_option_pattern_contract.py)" = \
            '77a30027582d2496d5e7087a9a51a75c075496cd'
          # The Python launcher controls Java process execution; pin it too.
          test "$(git hash-object contracts/v1/java_probe.py)" = \
            '6ef4692b0d6c30e572d0f5520e2dd29ad68932cf'
          mvn -B -ntp -q dependency:build-classpath \
            -Dmdep.outputFile=target/conformance-classpath.txt
          python3 scripts/check_option_pattern_contract.py --backend graal \
            --revision "$APPROVED_CANDIDATE_SHA" \
            --report "$RUNNER_TEMP/option-pattern-private-candidate.json" \
            --run-command 'python3 contracts/v1/java_probe.py {source} --execute' \
            -- python3 contracts/v1/java_probe.py '{source}'
      - name: Attest pinned Option guest exit matrix without candidate-supplied verifier
        if: ${{ inputs.verify_option_pattern == true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "option-pattern-private-candidate.json"
          if path.is_symlink() or not path.is_file() or not 0 < path.stat().st_size < 128 * 1024:
              raise SystemExit("Option admission proof missing or untrusted")
          report = json.loads(path.read_text(encoding="utf-8"))
          if (report.get("suite") != "oreslang.option-if-matches.v1"
                  or report.get("backend") != "graal"
                  or report.get("revision") != os.environ["APPROVED_CANDIDATE_SHA"]
                  or report.get("status") != "reference_admission_and_runtime_verified"):
              raise SystemExit("Option admission proof identity or result mismatch")
          expected = {
              "some.foo": ("accept", 42),
              "none.fallback": ("accept", 7),
              "and.refinement": ("accept", 43),
              "scope.after-fi": ("reject", None),
              "scope.else": ("reject", None),
              "scope.or": ("reject", None),
              "no-implicit-option": ("reject", None),
              "ownership.projected-double-move": ("reject", None),
              "ownership.projected-copy": ("accept", 0),
          }
          cases = report.get("cases")
          if not isinstance(cases, list) or len(cases) != len(expected):
              raise SystemExit("Incomplete Option-pattern source admission report")
          seen = set()
          for case in cases:
              if not isinstance(case, dict):
                  raise SystemExit("Malformed Option-pattern case report")
              name = case.get("id")
              if name in seen or name not in expected:
                  raise SystemExit("Duplicate/unknown Option-pattern case")
              seen.add(name)
              mode, exit_code = expected[name]
              if (case.get("expected_reference") != mode
                      or case.get("verified") is not True
                      or case.get("compiler_exit") != (0 if mode == "accept" else 1)
                      or case.get("runtime_exit") != exit_code):
                  raise SystemExit("Option compiler/guest exit mismatch: " + name)
          if seen != set(expected):
              raise SystemExit("Missing Option guest test: " +
                               ", ".join(sorted(set(expected) - seen)))
          print("VERIFIED_OPTION_PATTERN_GUEST_CASES=9")
          PY
      - name: Full Java 25 Maven candidate verification
        # Clean again so focused security/actor reports cannot masquerade as a
        # complete full-suite verification run.
        run: mvn -B -ntp -Dores.runtime.carriers=native -DskipTests=false -Dmaven.test.skip=false clean verify
      - name: Prove full Maven suite executed beyond focused security classes
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          focused = {
              "dev.oreslang.launcher.DenoCliDefaultPermissionsTest",
              "dev.oreslang.runtime.RuntimePermissionsNetworkAuditTest",
              "dev.oreslang.runtime.RuntimePermissionsTest",
              "dev.oreslang.runtime.RuntimePermissionsExplicitPolicyTest",
              "dev.oreslang.runtime.IsolatePolicySerializationAuditTest",
              "dev.oreslang.runtime.ScopedPermissionInteropTest",
              "dev.oreslang.runtime.VerifiedTcpSocketTest",
              "dev.oreslang.runtime.NativeSocketBoundaryTest",
              "dev.oreslang.runtime.PersistentActorMapTest",
              "dev.oreslang.runtime.ActorSharedLocalMemoryTest",
              "dev.oreslang.types.ActorStateModeContractsTest",
          }
          report_dir = Path("target/surefire-reports")
          if (not report_dir.is_dir() or report_dir.is_symlink()
                  or report_dir.parent.is_symlink()):
              raise SystemExit("Full Maven suite has no trustworthy report directory")
          reports = list(report_dir.glob("TEST-*.xml"))
          if len(reports) <= len(focused):
              raise SystemExit("Full Maven suite did not produce broader JUnit reports")
          executed = set()
          focused_seen = set()
          for report in reports:
              if report.is_symlink() or not report.is_file():
                  raise SystemExit(f"Invalid full-suite report: {report}")
              if not 0 < report.stat().st_size <= 16 * 1024 * 1024:
                  raise SystemExit(f"Empty or oversized full-suite report: {report}")
              classname = report.name[len("TEST-"):-len(".xml")]
              root = ElementTree.parse(report).getroot()
              if root.tag != "testsuite" or root.get("name") != classname:
                  raise SystemExit(f"Mismatched full-suite identity: {report}")
              cases = root.findall("testcase")
              try:
                  declared = int(root.get("tests", "-1"))
                  totals = [int(root.get(k, "-1"))
                            for k in ("failures", "errors", "skipped")]
              except ValueError:
                  raise SystemExit(f"Invalid full-suite JUnit totals: {report}")
              if declared < 1 or declared != len(cases) or any(n != 0 for n in totals):
                  raise SystemExit(f"Unsuccessful or inconsistent JUnit suite: {report}")
              # A green Maven exit code is not sufficient evidence when a
              # module/plugin can suppress failures or skip tests. Every
              # report and testcase must pass, including flaky reruns.
              for case in cases:
                  if case.get("classname") != classname:
                      raise SystemExit(f"Incorrect testcase identity: {report}")
                  if any(case.find(k) is not None for k in
                         ("failure", "error", "skipped", "flakyFailure",
                          "flakyError", "rerunFailure", "rerunError")):
                      raise SystemExit(f"Failed/skipped/flaky testcase in {report}")
              executed.add(classname)
              if classname in focused:
                  focused_seen.add(classname)
          if focused_seen != focused:
              raise SystemExit("Full Maven verification omitted focused classes: "
                               + ", ".join(sorted(focused - focused_seen)))
          import os
          if (os.environ.get("REQUIRE_OPTION_PATTERN") == "true"
                  and "dev.oreslang.OptionIfMatchesTest" not in executed):
              raise SystemExit("Full Maven suite omitted the requested Option-pattern JUnit class")
          extra = executed - focused
          if not extra:
              raise SystemExit("No executable full-suite tests beyond security subset")
          print(f"VERIFIED_FULL_JUNIT_CLASSES={len(executed)}")
          print(f"VERIFIED_FULL_JUNIT_EXTRA_CLASSES={len(extra)}")
          PY
      - name: Native AOT candidate build and guest execution
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Pnative-aot -DskipTests clean package
          timeout 180s ./target/ores-aot --mode=aot --platform=linux examples/together.ores
      - name: Native hybrid candidate build and guest execution
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Pnative-hybrid -DskipTests clean package
          timeout 180s ./target/ores-hybrid --mode=hybrid --platform=linux examples/together.ores
      - name: Strict polyglot isolate candidate build and guest execution
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Pnative-isolate -DskipTests clean package
          # Choose exactly one fresh regular shared library; reject absent,
          # ambiguous or symlinked artifacts rather than picking arbitrarily.
          test -d target && test ! -L target
          libraries=()
          for candidate in target/oresvm.so target/liboresvm.so; do
            if test -e "$candidate" || test -L "$candidate"; then
              if ! test -f "$candidate" || test -L "$candidate" || ! test -s "$candidate"; then
                echo "::error::Reject invalid native isolate artifact: $candidate" >&2
                exit 1
              fi
              libraries+=("$candidate")
            fi
          done
          test "${#libraries[@]}" -eq 1
          lib="${libraries[0]}"
          echo "VERIFIED_ISOLATE_LIBRARY=$lib"
          timeout 180s mvn -B -ntp "-Dpolyglot.engine.IsolateLibrary=$PWD/$lib" -DskipTests exec:java -Dexec.args="--strict-isolate --mode=hybrid --platform=linux examples/together.ores"
      - name: Write scoped exact-candidate identity metadata (not certification)
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def git_hash(ref):
              value = subprocess.check_output(
                  ["git", "rev-parse", "--verify", ref], text=True, timeout=10).strip()
              if not re.fullmatch(r"[a-f0-9]{40}", value):
                  raise SystemExit("Invalid source Git identity")
              return value

          commit = git_hash("HEAD")
          tree = git_hash("HEAD^{tree}")
          if (commit != os.environ["APPROVED_CANDIDATE_SHA"]
                  or tree != os.environ["APPROVED_CANDIDATE_TREE"]
                  or os.environ["GITHUB_SHA"] != os.environ["APPROVED_WORKFLOW_SHA"]):
              raise SystemExit("Candidate identity changed after exact-head testing")
          if os.environ["GITHUB_REPOSITORY_ID"] != "1400792274":
              raise SystemExit("Wrong source repository")
          data = {
              "schema": "oreslang-private-exact-candidate-diagnostic-v1",
              "source_repository": os.environ["GITHUB_REPOSITORY"],
              "source_repository_id": os.environ["GITHUB_REPOSITORY_ID"],
              "workflow_dispatch_commit": os.environ["GITHUB_SHA"],
              "candidate_commit": commit,
              "candidate_tree": tree,
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_name": os.environ.get("RUNNER_NAME", ""),
              "actor_junit_classes_expected": [
                  "dev.oreslang.runtime.PersistentActorMapTest",
                  "dev.oreslang.runtime.ActorSharedLocalMemoryTest",
                  "dev.oreslang.types.ActorStateModeContractsTest",
              ],
              "native_modes_expected": ["aot", "hybrid", "isolate"],
              "option_pattern_requested": os.environ["REQUIRE_OPTION_PATTERN"] == "true",
              "option_pattern_test_blob": (
                  os.environ["APPROVED_OPTION_TEST_BLOB"]
                  if os.environ["REQUIRE_OPTION_PATTERN"] == "true" else None),
              "option_pattern_junit_methods_required": (
                  13 if os.environ["REQUIRE_OPTION_PATTERN"] == "true" else 0),
              "verified_execution_claim": False,
              "native_guest_parity_certified": False,
              "requires_independent_api_job_steps_and_test_reports": True,
              "source_or_binaries_in_artifact": False,
          }
          out = Path(os.environ["RUNNER_TEMP"]) / "oreslang-private-candidate-identity.json"
          out.write_text(json.dumps(data, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload exact-candidate identity metadata only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-candidate-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oreslang-private-candidate-identity.json
          if-no-files-found: error
          retention-days: 3

name: Java Channel Read pre-HIR JVM and Native Image
on:
  pull_request:
    paths:
      - 'src/compiler/channel/**'
      - 'tests/compiler/AttoChannelReadPlanProbe.java'
permissions:
  contents: read
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: graalvm
          java-version: '25'
      - name: Verify exact source and run checked-read host preflight
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          bash ci/compiler/verify-channel-read.sh

name: Grouped spawn reservation host substrate (no guest claim)
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorSpawnReservation.java'
      - 'src/test/java/dev/oreslang/runtime/ActorSpawnReservationSmoke.java'
      - '.github/workflows/grouped-spawn-reservation-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reservation-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head and execute host smoke
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'head=%s tree=%s\n' "$EXPECTED_HEAD" "$(git rev-parse HEAD^{tree})"
          javac -version
          mkdir -p target/grouped-spawn-host
          javac --release 21 -Xlint:all -Werror -d target/grouped-spawn-host src/main/java/dev/oreslang/runtime/ActorSpawnReservation.java src/test/java/dev/oreslang/runtime/ActorSpawnReservationSmoke.java
          java -cp target/grouped-spawn-host dev.oreslang.runtime.ActorSpawnReservationSmoke

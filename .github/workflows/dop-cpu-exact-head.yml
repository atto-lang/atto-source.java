name: DOP CPU exact-head verification

on:
  push:
    branches:
      - integration/dop-cpu-current-main-20261016
    paths:
      - 'src/main/java/dev/oreslang/runtime/DataOrientedLayout.java'
      - 'src/main/java/dev/oreslang/runtime/DopRegionSchedule.java'
      - 'src/main/java/dev/oreslang/runtime/accel/DopKernelIR.java'
      - 'src/test/java/dev/oreslang/runtime/Dop*.java'
      - 'src/test/java/dev/oreslang/runtime/accel/Dop*.java'
      - 'scripts/dop-planner/**'
      - 'scripts/test-dop-planner-standalone.sh'
      - '.github/workflows/dop-cpu-exact-head.yml'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dop-cpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-owned-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source repository commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source head, no detached mirror
        shell: bash
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git remote get-url origin | sed -E 's#^https://github.com/##; s#\.git$##')" = 'ores-truffle-oreslang/oreslang-source.java'
          git diff --quiet
      - name: Install pinned Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Standalone planner and owned-region assertions
        shell: bash
        run: bash scripts/test-dop-planner-standalone.sh
      - name: Complete CPU DOP JUnit suite using production Maven project
        shell: bash
        run: mvn -B -ntp -Dtest='Dop*' -DfailIfNoTests=true test
      - name: Report exact source tree and smoke scope
        shell: bash
        run: |
          set -euo pipefail
          printf 'DOP_SOURCE_COMMIT=%s\n' "$(git rev-parse HEAD)"
          printf 'DOP_SOURCE_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
          printf '%s\n' 'DOP_SCOPE=host CPU and planner; no .ores graph lowering or GPU execution'

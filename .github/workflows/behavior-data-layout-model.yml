name: Behavior data-layout model verification

on:
  pull_request:
    paths:
      - 'tools/formal/BehaviorLayoutModel.java'
      - 'docs/proposals/BEHAVIOR_DATA_LAYOUT_ECS_V1.md'
      - 'scripts/check_behavior_layout_models.sh'
      - 'src/main/java/dev/oreslang/runtime/OresSymbol.java'
      - '.github/workflows/behavior-data-layout-model.yml'
  push:
    branches: [main]
    paths:
      - 'tools/formal/BehaviorLayoutModel.java'
      - 'scripts/check_behavior_layout_models.sh'
      - 'src/main/java/dev/oreslang/runtime/OresSymbol.java'
      - '.github/workflows/behavior-data-layout-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-host-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile exact repository Symbol and layout reference model
        shell: bash
        run: bash scripts/check_behavior_layout_models.sh

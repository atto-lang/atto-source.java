name: Native Oreslang actor turn ABI
on:
  pull_request:
    paths:
      - 'src/main/c/oresactorturn*.c'
      - 'src/main/c/oresactorturn.h'
      - 'src/test/c/oresactorturn*_test.c'
      - 'scripts/test-native-actor-turn.sh'
      - 'scripts/test-native-actor-jni.sh'
      - 'src/main/java/dev/oreslang/runtime/NativeActorTurnKernel.java'
      - 'src/main/java/dev/oreslang/runtime/OresScheduler.java'
      - 'src/test/java/dev/oreslang/runtime/NativeActorTurnKernelStandaloneSmoke.java'
      - 'src/test/java/dev/oreslang/runtime/NativeActorTurnSchedulerJniTest.java'
      - '.github/workflows/native-actor-turn.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/c/oresactorturn*.c'
      - 'src/main/c/oresactorturn.h'
      - 'src/test/c/oresactorturn*_test.c'
      - 'scripts/test-native-actor-turn.sh'
      - 'scripts/test-native-actor-jni.sh'
      - 'src/main/java/dev/oreslang/runtime/NativeActorTurnKernel.java'
      - 'src/main/java/dev/oreslang/runtime/OresScheduler.java'
      - 'src/test/java/dev/oreslang/runtime/NativeActorTurnKernelStandaloneSmoke.java'
      - 'src/test/java/dev/oreslang/runtime/NativeActorTurnSchedulerJniTest.java'
permissions:
  contents: read
jobs:
  native-turn-contract:
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        sanitizer: [plain, asan-ubsan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: ${{ matrix.cc }}
      ORES_NATIVE_SANITIZE: ${{ matrix.sanitizer == 'asan-ubsan' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record exact full-tree and native source identities
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git hash-object src/main/c/oresactorturn.c src/main/c/oresactorturn.h src/test/c/oresactorturn_test.c src/test/c/oresactorturn_scheduler_boundary_test.c
      - name: Full native suites at O0 and O2
        run: sh scripts/test-native-actor-turn.sh
  native-turn-tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC: gcc
      ORES_NATIVE_TSAN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record exact full-tree identity
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: ThreadSanitizer — both original and scheduler-boundary suites
        run: sh scripts/test-native-actor-turn.sh
  native-jni-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record exact JVM/JNI source tree
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git hash-object src/main/java/dev/oreslang/runtime/NativeActorTurnKernel.java src/main/c/oresactorturnjni.c src/test/java/dev/oreslang/runtime/NativeActorTurnKernelStandaloneSmoke.java
      - name: Compile and run opt-in JDK 21 native JNI boundary smoke
        run: |
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then
            export JAVA_HOME="$JAVA_HOME_21_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
            # A run-step environment is NOT retained by later Actions steps.
            # Keep Maven on the same exact JDK that compiled the JNI class.
            printf 'JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
            printf '%s\n' "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          fi
          java -version
          javac -version
          sh scripts/test-native-actor-jni.sh
      - name: Real OresScheduler TaskRunner JNI lifecycle test (opt-in)
        run: |
          java -version
          javac -version
          mvn -B -q -Dtest=NativeActorTurnSchedulerJniTest \
            -DargLine="-Djava.library.path=$PWD/target/native-jni/lib -Dores.native.actor.turn.experimental=true" \
            test

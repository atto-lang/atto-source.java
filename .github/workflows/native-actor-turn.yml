name: Native Oreslang actor turn ABI
on:
  pull_request:
    paths:
      - 'src/main/c/oresactorturn.*'
      - 'src/test/c/oresactorturn_test.c'
      - 'scripts/test-native-actor-turn.sh'
      - '.github/workflows/native-actor-turn.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/c/oresactorturn.*'
      - 'src/test/c/oresactorturn_test.c'
      - 'scripts/test-native-actor-turn.sh'
permissions:
  contents: read
jobs:
  native-turn-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Native actor turn contract O0 and O2
        run: sh scripts/test-native-actor-turn.sh
      - name: Address and undefined-behavior sanitizer proof
        env:
          ORES_NATIVE_SANITIZE: '1'
        run: sh scripts/test-native-actor-turn.sh

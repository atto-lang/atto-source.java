name: Typed Map compiler exact-head

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/main/java/dev/oreslang/types/OwnershipChecker.java'
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/main/java/dev/oreslang/runtime/OresKeyedMap.java'
      - 'src/main/java/dev/oreslang/runtime/OresSymbol.java'
      - 'src/test/java/dev/oreslang/TypedMapGuestLanguageTest.java'
      - 'src/test/java/dev/oreslang/runtime/OresKeyedMapTest.java'
      - 'src/test/java/dev/oreslang/runtime/OresKeyedMapLookupOptionTest.java'
      - '.github/workflows/typed-map-compiler-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Execute typed Map guest and runtime regressions
        run: >
          mvn -B -ntp
          -Dtest=TypedMapGuestLanguageTest,OresKeyedMapTest,OresKeyedMapLookupOptionTest
          test

name: Private typed Future-select language integration
on:
  push:
    branches:
      - integration/future-select-guest-on-runtime-20261014
  workflow_dispatch:
# Self-hosted mode requires explicit exact-SHA approval in repository variable
# ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA; other branches/commits fail at job
# admission. No shared Maven cache on an ephemeral private-source runner.
permissions:
  contents: read
concurrency:
  group: pr950-typed-select-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Denial check never checks out repository source and never uses a private
  # runner. If the approved SHA is missing/mismatched, executable test jobs
  # skip before self-hosted admission, while this job makes the workflow FAIL
  # rather than falsely appear green from skipped required checks.
  deny-unapproved-runner:
    if: ${{ github.repository != 'ores-truffle-oreslang/oreslang-source.java' || github.event.repository.private != true || github.ref != 'refs/heads/integration/future-select-guest-on-runtime-20261014' || (vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER == 'true' && (vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA == '' || vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA != github.sha)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed without source checkout
        shell: bash
        run: |
          echo "::error::Private CI job admission denied: verify private repository/ref and exact approved commit SHA"
          exit 1
  language-contract:
    if: ${{ github.repository == 'ores-truffle-oreslang/oreslang-source.java' && github.event.repository.private == true && github.ref == 'refs/heads/integration/future-select-guest-on-runtime-20261014' && (vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER != 'true' || (vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA != '' && vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA == github.sha)) }}
    # Opt-in only: dedicated disposable private repo runner; maintainers
    # must register the ephemeral machine and set the approved repo variable.
    runs-on: ${{ vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER == 'true' && fromJSON('["self-hosted","linux","x64","oreslang-private-ephemeral"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify private source and exact integration branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ores-truffle-oreslang/oreslang-source.java"
          test "$GITHUB_REF" = "refs/heads/integration/future-select-guest-on-runtime-20261014"
          test "${{ github.event.repository.private }}" = "true"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Verified source SHA: $(git rev-parse HEAD)"
          echo "Verified source tree: $(git rev-parse HEAD^{tree})"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: '25'
          version: '25.3'
          distribution: graalvm

      - name: Typecheck and execute typed Future select plus legacy channel select
        run: mvn -B -ntp '-Dtest=NativeFutureSelectSmokeTest,SelectAwaitFutureLanguageTest,SelectTypedBindingOwnershipTest,NativeChannelSelectSmokeTest,ChannelSelectSyntaxTest,OresFutureHostWaiterDetachmentTest,FutureChannelSelectTest,ChannelMappedSelectionCancellationTest,ChannelMappedCancellationStressTest,PrivateCiRunnerWorkflowSecurityTest' test
  full-maven:
    needs: language-contract
    if: ${{ github.repository == 'ores-truffle-oreslang/oreslang-source.java' && github.event.repository.private == true && github.ref == 'refs/heads/integration/future-select-guest-on-runtime-20261014' && (vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER != 'true' || (vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA != '' && vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA == github.sha)) }}
    # Opt-in only: dedicated disposable private repo runner; maintainers
    # must register the ephemeral machine and set the approved repo variable.
    runs-on: ${{ vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER == 'true' && fromJSON('["self-hosted","linux","x64","oreslang-private-ephemeral"]') || 'ubuntu-24.04' }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify private source and exact integration branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ores-truffle-oreslang/oreslang-source.java"
          test "$GITHUB_REF" = "refs/heads/integration/future-select-guest-on-runtime-20261014"
          test "${{ github.event.repository.private }}" = "true"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Verified source SHA: $(git rev-parse HEAD)"
          echo "Verified source tree: $(git rev-parse HEAD^{tree})"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: '25'
          version: '25.3'
          distribution: graalvm

      - name: Full JVM regression
        run: mvn -B -ntp verify
  compiled-native-future:
    needs: language-contract
    if: ${{ github.repository == 'ores-truffle-oreslang/oreslang-source.java' && github.event.repository.private == true && github.ref == 'refs/heads/integration/future-select-guest-on-runtime-20261014' && (vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER != 'true' || (vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA != '' && vars.ORESLANG_PRIVATE_EPHEMERAL_APPROVED_SHA == github.sha)) }}
    # Opt-in only: dedicated disposable private repo runner; maintainers
    # must register the ephemeral machine and set the approved repo variable.
    runs-on: ${{ vars.ORESLANG_PRIVATE_EPHEMERAL_RUNNER == 'true' && fromJSON('["self-hosted","linux","x64","oreslang-private-ephemeral"]') || 'ubuntu-24.04' }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        mode: [native-aot, native-hybrid]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify private source and exact integration branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ores-truffle-oreslang/oreslang-source.java"
          test "$GITHUB_REF" = "refs/heads/integration/future-select-guest-on-runtime-20261014"
          test "${{ github.event.repository.private }}" = "true"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Verified source SHA: $(git rev-parse HEAD)"
          echo "Verified source tree: $(git rev-parse HEAD^{tree})"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: '25'
          version: '25.3'
          distribution: graalvm

      - name: Build native Oreslang CLI
        run: mvn -B -ntp -DskipTests -P${{ matrix.mode }} package
      - name: Execute typed Future-select guest on native compiler
        shell: bash
        run: |
          set -euo pipefail
          bin=target/ores-aot
          if test "${{ matrix.mode }}" = "native-hybrid"; then bin=target/ores-hybrid; fi
          timeout --signal=TERM --kill-after=5s 60s "$bin" examples/native-future-select-smoke.ores > /tmp/future-select-output.txt
          test "$(cat /tmp/future-select-output.txt)" = "future:4"
          echo "NATIVE_FUTURE_SELECT_PASS mode=${{ matrix.mode }}"

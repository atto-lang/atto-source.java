name: Singleton initializer Java runtime gate (exact head, non-promoting)

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/SingletonSharedDomain.java'
      - 'src/main/java/dev/oreslang/runtime/SingletonDependencyGraph.java'
      - 'src/test/java/dev/oreslang/runtime/Singleton*'
      - 'scripts/test-singleton-initializer-dependencies.sh'
      - '.github/workflows/singleton-initializer-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  singleton-host:
    name: JDK25 source-only runtime + targeted JUnit (not guest parity)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Attest checked-out exact source head and file blobs
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SOURCE_HEAD=$EXPECTED_SHA"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          git hash-object src/main/java/dev/oreslang/runtime/SingletonSharedDomain.java
          git hash-object src/main/java/dev/oreslang/runtime/SingletonDependencyGraph.java
          git hash-object src/test/java/dev/oreslang/runtime/SingletonCrossThreadCycleSmoke.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile real host runtime and run two bounded standalone smokes
        run: bash scripts/test-singleton-initializer-dependencies.sh
      - name: Run actual focused Maven JUnit tests
        run: |
          mvn -B -ntp -DfailIfNoTests=true \
            -Dtest=SingletonCrossThreadCycleTest,SingletonSharedDomainHostTest,SingletonSnapshotCompilerV1Test \
            test
      - name: Publish JUnit reports for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singleton-initializer-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/surefire-reports/*.xml
          if-no-files-found: warn
          retention-days: 7

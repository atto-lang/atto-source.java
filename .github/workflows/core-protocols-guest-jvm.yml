name: Atto core protocols exact-head JVM guest
on:
  pull_request:
    paths:
      - 'src/main/resources/dev/oreslang/core/protocols.atto'
      - 'src/main/java/dev/oreslang/stdlib/CoreLibrarySources.java'
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/main/java/dev/oreslang/ast/Ast.java'
      - 'src/main/java/dev/oreslang/compiler/ImportGraph.java'
      - 'src/main/java/dev/oreslang/compiler/IncrementalCompiler.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/test/java/dev/oreslang/compiler/ImportGraphTraitKindTest.java'
      - 'src/test/java/dev/oreslang/CoreProtocolsGuestTest.java'
      - 'src/main/java/dev/oreslang/runtime/ActorRuntime.java'
      - 'src/main/java/dev/oreslang/runtime/ChannelRuntime.java'
      - 'src/main/java/dev/oreslang/runtime/OresFuture.java'
      - 'src/test/java/dev/oreslang/runtime/ActorRefIncarnationFenceTest.java'
      - 'src/test/java/dev/oreslang/runtime/DirectionalChannelCapabilityFenceTest.java'
      - 'tests/fixtures/core-protocols-v1/**'
      - '.github/workflows/core-protocols-guest-jvm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-and-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout immutable triggering HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact SHA/tree and clean checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
          echo "CORE_PROTOCOLS_EXACT_HEAD=$EXPECTED_HEAD"
          echo "CORE_PROTOCOLS_EXACT_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Setup GraalVM 25 / Maven
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Compile and execute real Atto guests plus actor reference, channel and Future hardening tests
        run: |
          set -euo pipefail
          mvn -B -ntp -Dores.runtime.carriers=native -Dtest=CoreProtocolsGuestTest,ImportGraphTraitKindTest,ActorRefIncarnationFenceTest,DirectionalChannelCapabilityFenceTest,ChannelRuntimeTest,ChannelPendingAdmissionTest,OresFutureTerminalNotificationRaceTest -DfailIfNoTests=true test
          echo 'CORE_PROTOCOLS_ACTOR_CHANNEL_JAVA_JUNIT=EXECUTED'
      - name: Preserve evidence boundary
        if: always()
        run: |
          echo 'This workflow is Java JVM guest only, not Graal Native Image/LLVM/Wasm/Forge/.NET parity.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A queued/zero-step/runner-admission failure is NOT_EXECUTED.' >> "$GITHUB_STEP_SUMMARY"

name: Paired JSON representation diagnostics
on:
  pull_request:
    paths:
      - 'benchmarks/jmh/**'
      - '.github/workflows/paired-json-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: "25.3"
          java-version: "25"
          distribution: graalvm
      - name: Same-host paired diagnostic (not official benchmark)
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git rev-parse HEAD HEAD^{tree}
          lscpu
          bash benchmarks/jmh/run.sh '.*json.*' -p entries=16,128,512 -p representation=mutable,immutable -f 2 -wi 2 -w 250ms -i 3 -r 250ms -prof gc -rf json -rff "$RUNNER_TEMP/paired.json"
          test -s "$RUNNER_TEMP/paired.json"
          cat "$RUNNER_TEMP/paired.json"

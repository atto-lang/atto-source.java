name: Default parameters staged compiler conformance

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/compiler/V3ScalarDefaultProgramNormalizer.java'
      - 'src/main/java/dev/oreslang/types/V3ClosedOptionCallLowering.java'
      - 'src/main/java/dev/oreslang/types/V3ScalarDefaultLiteralLowering.java'
      - 'src/main/java/dev/oreslang/types/V3DefaultArgValsPolicy.java'
      - 'src/main/java/dev/oreslang/types/V3CallLoweringPreview.java'
      - 'src/main/java/dev/oreslang/types/V3SourceContractFingerprint.java'
      - 'src/main/java/dev/oreslang/types/DefaultArgumentPolicy.java'
      - 'src/main/java/dev/oreslang/types/OptionalCallShapeBinder.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/main/java/dev/oreslang/types/OwnershipChecker.java'
      - 'src/main/java/dev/oreslang/types/ReturnCleanupChecker.java'
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/main/java/dev/oreslang/ast/Ast.java'
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/test/java/dev/oreslang/V3DefaultBudgetAdmissionTest.java'
      - 'src/test/java/dev/oreslang/V3ScalarDefaultProgramNormalizerTest.java'
      - 'src/test/java/dev/oreslang/V3ZeroArgumentCallRegressionTest.java'
      - 'src/test/java/dev/oreslang/V3SourceContractFingerprintBudgetTest.java'
      - 'src/test/java/dev/oreslang/V3CallPreviewProofFlagTest.java'
      - 'src/test/java/dev/oreslang/V3ScalarDefaultLiteralLoweringTest.java'
      - 'src/test/java/dev/oreslang/V3DefaultArgValsAdmissionTest.java'
      - 'src/test/java/dev/oreslang/DefaultAnnotationAdmissionTest.java'
      - 'src/test/java/dev/oreslang/DefaultArgumentPolicyTest.java'
      - 'src/test/java/dev/oreslang/OptionalCallShapeBinderTest.java'
      - 'src/test/java/dev/oreslang/DirectNamedLiteralCallExecutionTest.java'
      - 'src/test/java/dev/oreslang/NamedScalarTailCallRegressionTest.java'
      - '.github/workflows/default-parameter-compiler-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-java:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout immutable source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact immutable source revision
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo "NAMED_SCALAR_EXACT_SOURCE_HEAD=$EXPECTED_HEAD"
          echo "NAMED_SCALAR_EXACT_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: GraalVM JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Check actual compiler and source-order named-call tests on this PR head
        run: |
          java --version
          mvn -B -ntp -DfailIfNoTests=true -Dtest=V3CallPreviewProofFlagTest,V3SourceContractFingerprintBudgetTest,V3ZeroArgumentCallRegressionTest,V3ScalarDefaultProgramNormalizerTest,V3DefaultBudgetAdmissionTest,V3ScalarDefaultLiteralLoweringTest,V3DefaultArgValsAdmissionTest,DefaultAnnotationAdmissionTest,DefaultArgumentPolicyTest,OptionalCallShapeBinderTest,DirectNamedLiteralCallExecutionTest,NamedScalarTailCallRegressionTest test

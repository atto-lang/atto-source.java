name: AttoLang DOP inverted Java restricted guest exact-head

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/compiler/DopInvertedGuestI64V1.java'
      - 'src/main/java/dev/oreslang/compiler/OresCompiler.java'
      - 'src/main/java/dev/oreslang/parser/Lexer.java'
      - 'src/main/java/dev/oreslang/parser/Token.java'
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/main/java/dev/oreslang/ast/Ast.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/main/java/dev/oreslang/types/OwnershipChecker.java'
      - 'pom.xml'
      - 'tools/VerifyDopInvertedJUnit.java'
      - 'tools/verify-dop-inverted-atto-contract.sh'
      - 'tools/test-verify-dop-inverted-atto-contract.sh'
      - 'src/main/java/dev/oreslang/runtime/InvertedColumnStore.java'
      - 'src/test/java/dev/oreslang/compiler/DopInvertedGuestI64V1Test.java'
      - 'src/test/java/dev/oreslang/DopInvertedGuestAdmissionTest.java'
      - 'contracts/dop-inverted-v1/**'
      - '.github/workflows/dop-inverted-java-guest-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restricted-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: checkout-head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: verify-head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD" ]]
          git diff --quiet --exit-code
          [[ -z "$(git ls-files --others --exclude-standard)" ]]
          echo "DOP_EXACT_HEAD=$EXPECTED_HEAD"
          echo "DOP_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: verify-fixture
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tools/verify-dop-inverted-atto-contract.sh
      - name: source-admission-mutation-tests
        shell: bash
        run: bash tools/test-verify-dop-inverted-atto-contract.sh
      - name: setup-graalvm
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: compile-guest
        run: mvn -B -ntp -DskipTests package
      - name: execute-guest
        run: mvn -B -ntp -Dtest=DopInvertedGuestI64V1Test,DopInvertedGuestAdmissionTest test
      - name: verify-junit-report
        run: java tools/VerifyDopInvertedJUnit.java
      - name: verify-post-execution-source
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Run the pinned Git-object script; JUnit/build code could rewrite its
          # working-tree copy and otherwise bypass the post-execution check.
          git show HEAD:tools/verify-dop-inverted-atto-contract.sh | bash

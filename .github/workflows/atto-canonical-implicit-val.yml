name: Atto canonical implicit-val Java admission

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/test/java/dev/oreslang/AttoCanonicalImplicitValClassFieldTest.java'
      - 'docs/ATTO_CANONICAL_CLASS_FIELD_VAL_V2.md'
      - '.github/workflows/atto-canonical-implicit-val.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-field-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout immutable PR commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head and tree
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'RECEIPT source_sha=%s source_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"
      - name: GraalVM 25 / Java 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
          cache: maven
      - name: Execute real parser and typed-checker tests
        run: >-
          mvn -B -ntp '-P!native-thread-unix'
          -Dtest=AttoCanonicalImplicitValClassFieldTest
          -Dsurefire.failIfNoSpecifiedTests=true clean test
      - name: Require nonempty passing JUnit receipt
        shell: bash
        run: |
          set -euo pipefail
          report=target/surefire-reports/TEST-dev.oreslang.AttoCanonicalImplicitValClassFieldTest.xml
          test -s "$report"
          test "$(grep -c '<testcase' "$report")" -ge 5
          if grep -Eq '<testsuite[^>]*(errors|failures|skipped)="[1-9][0-9]*"' "$report"; then exit 1; fi
          echo 'RECEIPT scope=parser_typechecker guest_runtime=NOT_EXECUTED'

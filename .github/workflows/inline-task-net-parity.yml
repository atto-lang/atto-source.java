name: Exact .NET-proven inline task Java parity
on:
  pull_request:
    paths:
      - 'src/main/**'
      - 'src/test/java/dev/oreslang/InlineTaskTerminalReturnTest.java'
      - 'pom.xml'
      - 'tests/fixtures/inline-task-net-parity/**'
      - 'tools/run-inline-task-net-parity.py'
      - '.github/workflows/inline-task-net-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            mode: jvm
          - runner: macos-15
            mode: jvm
          - runner: macos-15
            mode: native
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git log -1 --format='%H %T'
          git diff --quiet HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
          github-token: ${{ github.token }}
          cache: maven
      - name: Build real compiler
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == native ]]; then
            native-image --version
            mvn -B -ntp -Pnative-aot -Dmaven.test.skip=true package
            test -x target/ores-aot
          else
            mvn -B -ntp -Dmaven.test.skip=true package
            mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile=target/conformance-classpath.txt
          fi
      - name: Check and execute every identical source fixture
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          python3 tools/run-inline-task-net-parity.py "$MODE" | tee target/inline-task-net-parity.log
          grep -Fx 'EXACT_INLINE_TASK_JAVA_PASS 4/4' target/inline-task-net-parity.log
          grep -Fx 'INLINE_TASK_DO_JAVA_PASS 1/1' target/inline-task-net-parity.log
          grep -Fx 'INLINE_TASK_EARLY_CONDITIONAL_JAVA_PASS 1/1' target/inline-task-net-parity.log
          grep -Fx 'INLINE_TASK_MULTI_CONDITIONAL_JAVA_PASS 1/1' target/inline-task-net-parity.log
          grep -Fx 'INLINE_TASK_SHORTCIRCUIT_JAVA_PASS 1/1' target/inline-task-net-parity.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inline-task-net-parity-${{ matrix.runner }}-${{ matrix.mode }}
          path: target/inline-task-net-parity.log
          if-no-files-found: warn

  trace-entropy:
    name: TraceParent native entropy component (not guest parity)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
          github-token: ${{ github.token }}
      - name: Compile real TraceParent and exercise independent JVM and native processes
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git log -1 --format='%H %T'
          git hash-object src/main/java/dev/oreslang/runtime/TraceParent.java
          test -z "$(git status --porcelain)"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/classes"
          cat > "$work/TraceEntropyProbe.java" <<'JAVA'
          import dev.oreslang.runtime.TraceParent;
          public class TraceEntropyProbe {
              public static void main(String[] args) {
                  var parent = TraceParent.newRoot(true);
                  var child = parent.newChild();
                  if (!parent.sampled() || !child.sampled()
                          || !parent.traceId().equals(child.traceId())
                          || parent.spanId().equals(child.spanId())
                          || !TraceParent.parse(parent.toHeader()).orElseThrow().equals(parent)
                          || !TraceParent.parse(child.toHeader()).orElseThrow().equals(child)) {
                      throw new AssertionError("invalid trace context");
                  }
                  System.out.println(parent.toHeader());
                  System.out.println(child.toHeader());
              }
          }
          JAVA
          javac -d "$work/classes" src/main/java/dev/oreslang/runtime/TraceParent.java "$work/TraceEntropyProbe.java"
          native-image --no-fallback --initialize-at-run-time=dev.oreslang.runtime.TraceParent -cp "$work/classes" -o "$work/probe" TraceEntropyProbe
          file "$work/probe" | grep -E 'Mach-O.*arm64'
          for mode in jvm native; do
            for attempt in 1 2 3 4; do
              if [[ "$mode" == jvm ]]; then
                java -cp "$work/classes" TraceEntropyProbe > "$work/$mode-$attempt"
              else
                "$work/probe" > "$work/$mode-$attempt"
              fi
            done
          done
          python3 - "$work" <<'PY'
          import pathlib, re, sys
          work = pathlib.Path(sys.argv[1])
          roots, spans = set(), set()
          for mode in ("jvm", "native"):
              for attempt in range(1, 5):
                  lines = (work / f"{mode}-{attempt}").read_text().splitlines()
                  assert len(lines) == 2, lines
                  p, c = [re.fullmatch(r"00-([0-9a-f]{32})-([0-9a-f]{16})-01", line) for line in lines]
                  assert p and c
                  assert int(p[1], 16) and p[1] == c[1] and p[1] not in roots
                  roots.add(p[1])
                  for match in (p, c):
                      assert int(match[2], 16) and match[2] not in spans
                      spans.add(match[2])
          assert len(roots) == 8 and len(spans) == 16
          print("TRACE_ENTROPY_COMPONENT_PASS independent_processes=8 roots=8 spans=16 GUEST_PARITY=NOT_EXECUTED")
          PY

  focused-junit:
    name: Production inline task JVM edge cases
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
          github-token: ${{ github.token }}
          cache: maven
      - name: Build production compiler and execute focused JUnit class
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git log -1 --format='%H %T'
          test -z "$(git status --porcelain)"
          mvn -B -ntp -Dmaven.test.skip=true package
          mvn -B -ntp -q dependency:build-classpath -DincludeScope=test -Dmdep.outputFile=target/inline-junit-classpath.txt
          # Isolate this test from unrelated inherited test compilation failures.
          # This is a focused suite, not a replacement for the full Maven gate.
          mkdir -p target/test-classes
          javac -proc:none -cp "target/classes:$(cat target/inline-junit-classpath.txt)" -d target/test-classes src/test/java/dev/oreslang/InlineTaskTerminalReturnTest.java
          mvn -B -ntp -Dtest=InlineTaskTerminalReturnTest -DfailIfNoTests=true surefire:test
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path("target/surefire-reports/TEST-dev.oreslang.InlineTaskTerminalReturnTest.xml")
          result = ET.parse(report).getroot()
          expected = {
              "terminalReturnIsScalarAndNestedBlocksStayLocal",
              "cooperationUsesCallerAndPreservesOuterAssignment",
              "resultCannotBeMistypedAsFutureOrDifferentPayload",
              "unimplementedControlFlowIsExplicitlyRejected",
              "outerLoopTransfersCannotEscapeInlineTask",
              "nestedTaskCannotBorrowItsParentTasksLoopTarget",
              "localLoopsCanBreakContinueAndWriteBack",
              "assignmentDestinationIsWrittenAfterTaskCompletes",
              "lexicalLocalsCannotEscapeAndImmutableBindingsCannotBeReassigned",
              "boundedConditionalReturnsStayInsideTaskAndPreserveWriteback",
              "earlyReturnPayloadAndConditionAreCheckedOnBothPaths",
              "boundedConditionalReturnCannotChangeFallthroughDeclarationScope",
              "orderedEarlyReturnChainEvaluatesOnlySelectedBranch",
              "conditionalReturnBudgetIsBounded",
              "skippedShortCircuitTasksCannotMutateOuterState",
              "voidTaskUsesCallerScopeAndDoesNotReturnFromCaller",
              "voidTaskLocalLoopAndNestedScopeRemainIndependent",
              "voidTaskRejectsNonlocalTransfersAndValueReturns",
              "inlineTaskDefersExecuteOnceInLexicalOrderBeforeCallerContinues",
              "conditionalVoidReturnsSkipSuffixAndResumeCaller",
              "nestedValueReturnsKeepBothBranchScopesAndSkipSuffixes",
              "nestedEarlyReturnsUnwindBothDefersOnce",
          }
          cases = result.findall("testcase")
          assert result.tag == "testsuite", result.tag
          assert int(result.attrib["tests"]) == len(expected) == len(cases), result.attrib
          assert all(int(result.attrib[key]) == 0 for key in ("failures", "errors", "skipped")), result.attrib
          assert {case.attrib["name"] for case in cases} == expected
          assert all(case.attrib["classname"] == "dev.oreslang.InlineTaskTerminalReturnTest"
                     and not any(case.find(tag) is not None for tag in ("failure", "error", "skipped"))
                     for case in cases)
          print(f"INLINE_TASK_FOCUSED_JUNIT_PASS tests={len(expected)}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inline-task-focused-junit
          path: target/surefire-reports/TEST-dev.oreslang.InlineTaskTerminalReturnTest.xml
          if-no-files-found: warn

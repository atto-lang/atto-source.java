name: Prohibit Python
on:
  pull_request:
  push:
    branches: [main]
jobs:
  prohibit-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format check
        run: cargo fmt --manifest-path tools/no-python-check/Cargo.toml -- --check
      - name: Rust clippy check
        run: cargo clippy --manifest-path tools/no-python-check/Cargo.toml --all-targets -- -D warnings
      - name: Rust policy tests
        run: cargo test --manifest-path tools/no-python-check/Cargo.toml
      - name: Reject Python files and execution
        run: cargo run --manifest-path tools/no-python-check/Cargo.toml -- .

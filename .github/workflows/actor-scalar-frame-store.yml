name: Actor scalar frame store - exact source / physical turn
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ScalarFrameLayout.java'
      - 'src/main/java/dev/oreslang/runtime/ActorScalarFrameStore.java'
      - 'src/test/java/dev/oreslang/runtime/ScalarFrameLayoutTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorScalarFrameStoreTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorScalarFrameCodecTest.java'
      - 'scripts/verify-actor-scalar-frame-store.sh'
      - 'scripts/VerifyActorScalarFrameReports.java'
      - '.github/workflows/actor-scalar-frame-store.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-head-real-actor-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout immutable PR head (no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure GraalVM JDK 25 and Maven
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          distribution: graalvm
          java-version: '25'
          version: '25.3'
          cache: maven
      - name: Execute exact-head JUnit tests, reject zero/skipped cases
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_TREE="$(git rev-parse "${EXPECTED_HEAD}^{tree}")"
          export EXPECTED_TREE
          bash scripts/verify-actor-scalar-frame-store.sh

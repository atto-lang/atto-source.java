name: Lazy native actor carrier lifecycle (exact source)

on:
  push:
    branches:
      - feat/lazy-actor-pool-pthreads-20261103
    paths:
      - ".github/workflows/lazy-native-carrier-lifecycle.yml"
      - "src/main/c/oresthread.c"
      - "src/main/java/dev/oreslang/runtime/NativeCarrierExecutor.java"
      - "src/main/java/dev/oreslang/runtime/ActorAffinityDispatcher.java"
      - "src/main/java/dev/oreslang/runtime/ActorRuntime.java"
      - "src/test/java/dev/oreslang/runtime/NativeCarrierExecutorTest.java"
      - "src/test/java/dev/oreslang/runtime/ActorPoolLazyStartTest.java"
      - "pom.xml"
      - "scripts/build-native-thread.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lazy-native-carrier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-jni-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - name: Checkout immutable source revision without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Attest exact HEAD and native source blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --porcelain
          echo "source_commit=$(git rev-parse HEAD)"
          echo "source_tree=$(git rev-parse 'HEAD^{tree}')"
          echo "jni_blob=$(git rev-parse HEAD:src/main/c/oresthread.c)"
      - name: Install JDK 25 GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify compiler and JNI toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          "$CC" --version | head -n 1
          test -f "$JAVA_HOME/include/jni.h"
      - name: Compile real JNI library and run actor carrier lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dores.runtime.carriers=native \
            '-Dtest=ActorPoolLazyStartTest,NativeCarrierExecutorTest,ActorRuntimeNativeCarrierTest,ActorAffinityDispatcherTest,ActorAffinitySoftSpillTest,ActorJvmFirstCarrierAdmissionTest' \
            test
          test -s target/native/liboresthread.so
          test -n "$(find target/surefire-reports -maxdepth 1 -name 'TEST-*.xml' -print -quit)"
      - name: Report executed test and source identity
        if: always()
        shell: bash
        run: |
          echo "verified_source_sha=$GITHUB_SHA"
          echo "compiler=$CC"
          test -d target/surefire-reports && grep -h '<testsuite ' target/surefire-reports/TEST-*.xml | head -n 12 || true

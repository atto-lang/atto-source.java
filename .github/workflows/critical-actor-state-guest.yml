name: Critical actor-state modes — native Graal guest
on:
  push:
    branches:
      - feat/sealed-actor-state-forward-port-20261029
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  critical-mode-guest-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact submitted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reject stale, dirty or switched source tree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
          test "$(git ls-files 'src/test/resources/parity/actor-critical-modes/*.ores' | wc -l)" -eq 9
          for file in \
            src/main/java/dev/oreslang/ast/Ast.java \
            src/main/java/dev/oreslang/parser/Parser.java \
            src/main/java/dev/oreslang/types/TypeChecker.java \
            src/main/java/dev/oreslang/nodes/OresEvalRootNode.java \
            src/test/java/dev/oreslang/ActorCriticalStateModeTest.java \
            src/test/java/dev/oreslang/ActorSealedStateAuthorityGateTest.java; do
            git ls-files --error-unmatch -- "$file" >/dev/null
            test "$(git ls-files -s -- "$file" | cut -d ' ' -f 1)" = 100644
            echo "GUEST_SOURCE_BLOB $file $(git hash-object "$file")"
          done
          echo "CRITICAL_MODE_HEAD=$EXPECTED_SHA"
      - name: Install GraalVM and Maven
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Run actual compiler and Truffle guest tests
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -version
          mvn -B -ntp -Dtest=ActorSealedStateAuthorityGateTest,ActorCriticalStateModeTest,ActorCriticalModeConformanceTest,ActorStateLoanTest,ActorSingleStateSchemaTest test
          for spec in \
            ActorSealedStateAuthorityGateTest:1 \
            ActorCriticalStateModeTest:13 \
            ActorCriticalModeConformanceTest:9 \
            ActorStateLoanTest:9 \
            ActorSingleStateSchemaTest:7; do
            class="${spec%%:*}"
            expected="${spec##*:}"
            report="target/surefire-reports/TEST-dev.oreslang.${class}.xml"
            test -s "$report"
            grep -Eq '<testsuite[^>]*tests="'"${expected}"'"' "$report"
            for field in errors failures skipped; do
              grep -Eq '<testsuite[^>]*'"${field}"'="0"' "$report"
            done
            echo "GUEST_SUITE_PASS ${class} tests=${expected}"
          done
          echo 'NATIVE_GRAAL_CRITICAL_MODES_PASS tests=39'

name: Accelerator typed source safety
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accelerator-source-smoke:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check quantum resource bounds and GPU fence anti-forgery
        run: bash scripts/verify-accelerator-safety.sh

name: JMH runtime diagnostics smoke (host-only)
on:
  pull_request:
    paths:
      - 'benchmarks/jmh/**'
      - '.github/workflows/jmh-runtime-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: "25.3"
          java-version: "25"
          distribution: graalvm
      - name: Smoke every method with smallest parameters, no score admission
        run: |
          bash benchmarks/jmh/run.sh '.*json.*' -p entries=16 -wi 0 -i 1 -r 100ms -f 1
          bash benchmarks/jmh/run.sh '.*(utf8|Bytes|boxedList).*' -p size=1024 -p chunkSize=256 -wi 0 -i 1 -r 100ms -f 1

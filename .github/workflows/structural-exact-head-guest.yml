name: Structural exact-head GraalVM guest regressions
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/ast/**'
      - 'src/main/java/dev/oreslang/parser/**'
      - 'src/main/java/dev/oreslang/types/**'
      - 'src/test/java/dev/oreslang/*Structural*Test.java'
      - 'src/test/java/dev/oreslang/*Tuple*Test.java'
      - 'src/test/java/dev/oreslang/*Container*Test.java'
      - 'src/test/java/dev/oreslang/RecordWriteVarianceTest.java'
      - 'contracts/structural/**'
      - 'scripts/verify_structural_exact_head_evidence.py'
      - '.github/workflows/structural-exact-head-guest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source PR head without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind evidence to immutable source tree
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --quiet HEAD --
          mkdir -p target
          printf '{"source_sha":"%s","source_tree":"%s","scope":"java-structural-exact-head-guest"}\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" \
            > target/structural-guest-provenance.json
      - name: GraalVM JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify case-level evidence verifier rejects forged reports
        run: python3 scripts/verify_structural_exact_head_evidence.py --self-test
      - name: Execute real parser, readonly, ownership and guest regressions
        run: |
          mvn -B -ntp -Dtest=StructuralTuplePolicyTest,PositionalTupleSyntaxTest,StructuralCallableParityTest,FixedProductCallPlanTest,RecordWriteVarianceTest,StructuralCrossSurfaceParityTest,StructuralTuplePatternMatchTest,StructuralContainerPolicyTest,StructuralContainerSourceParityTest test
      - name: Recheck immutable Git HEAD and clean tracked tree after Maven
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
      - name: Bind JUnit testcase evidence to the checked-out source revision
        run: |
          python3 scripts/verify_structural_exact_head_evidence.py \
            --reports target/surefire-reports \
            --source-root . \
            --provenance target/structural-guest-provenance.json \
            --out target/structural-guest-junit-manifest.json
      - name: Publish successful exact-head JUnit evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: structural-graal-exact-head-${{ github.run_id }}
          path: |
            target/structural-guest-provenance.json
            target/structural-guest-junit-manifest.json
            target/surefire-reports/TEST-dev.oreslang.*.xml
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failing-run diagnostics (not certification)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: structural-graal-FAILED-DIAGNOSTICS-${{ github.run_id }}
          path: |
            target/structural-guest-provenance.json
            target/surefire-reports/TEST-dev.oreslang.*.xml
          if-no-files-found: warn
          retention-days: 7

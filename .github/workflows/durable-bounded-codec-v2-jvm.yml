name: Draft bounded checkpoint v2 JVM and Native Image
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/compiler/DurableBoundedSourceV2.java'
      - 'tests/durable_bounded_codec_jvm.mjs'
      - '.github/workflows/durable-bounded-codec-v2-jvm.yml'
permissions:
  contents: read
jobs:
  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
      - name: Verify actual compiler tree and emitted codecs
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD^{tree}
          mvn -B -ntp -DskipTests package
          mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile=target/conformance-classpath.txt
          ATTO_JAVA_CP="target/classes:$(cat target/conformance-classpath.txt)" ATTO_TEST_NATIVE_IMAGE=1 node tests/durable_bounded_codec_jvm.mjs

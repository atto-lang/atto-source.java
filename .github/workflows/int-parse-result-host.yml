name: Java checked int.parse Result HOST ONLY
on:
  pull_request:
    paths:
      - 'src/compiler/adt/AttoIntParseRuntime.java'
      - 'src/compiler/adt/AttoAdtPatternPlanner.java'
      - 'tests/compiler/AttoIntParseRuntimeProbe.java'
      - 'ci/compiler/verify-int-parse-result.sh'
      - '.github/workflows/int-parse-result-host.yml'
permissions:
  contents: read
jobs:
  host-result:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: graalvm
          java-version: '25'
      - name: Prove host-only Java/Graal bounded Result semantics (not .atto guest)
        env:
          ATTO_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ATTO_NATIVE_IMAGE_REQUIRED: '1'
        run: bash ci/compiler/verify-int-parse-result.sh

name: Standalone effect-closure proof
on:
  pull_request:
    paths:
      - "src/main/java/dev/oreslang/types/EffectContracts.java"
      - "src/main/java/dev/oreslang/types/EffectAbiV1.java"
      - "src/main/java/dev/oreslang/types/LatentEffectRows.java"
      - "src/main/java/dev/oreslang/types/SourceEffectAudit.java"
      - "src/test/java/dev/oreslang/EffectGraph*Test.java"
      - "src/test/java/dev/oreslang/EffectAbiV1Test.java"
      - "src/test/java/dev/oreslang/SourceEffectAudit*Test.java"
      - "src/test/java/dev/oreslang/types/LatentEffectRowsTest.java"
      - "tools/formal-standalone/**"
      - "formal/README.md"
      - ".github/workflows/static-effects-formal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-effect-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Check source effect closure with JDK only
        run: bash tools/formal-standalone/verify-effects.sh

name: AOT class proxy exact-head guest gate

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/ast/StaticProxySynthesis.java'
      - 'src/main/java/dev/oreslang/parser/Parser.java'
      - 'src/test/java/dev/oreslang/AotClassProxyLanguageTest.java'
      - '.github/workflows/aot-class-proxy-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          printf 'ATTO_PROXY_HEAD=%s\n' "$ACTUAL_SHA"
          git rev-parse HEAD^{tree}
      - name: Set up GraalVM JDK25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Execute compiler-backed proxy guest and negative tests
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=AotClassProxyLanguageTest test
      - name: Require a nonempty Surefire receipt
        run: |
          set -euo pipefail
          test -s target/surefire-reports/TEST-dev.oreslang.AotClassProxyLanguageTest.xml
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("target/surefire-reports/TEST-dev.oreslang.AotClassProxyLanguageTest.xml")
          assert path.is_file() and path.stat().st_size > 0, "proxy Surefire XML missing"
          root = ET.parse(path).getroot()
          assert root.tag == "testsuite", "wrong XML root"
          assert root.attrib.get("name") == "dev.oreslang.AotClassProxyLanguageTest", "wrong test class"
          count = int(root.attrib.get("tests", "0"))
          assert count >= 36, f"only {count} proxy tests executed"
          for failure in ("failures", "errors", "skipped"):
              assert int(root.attrib.get(failure, "0")) == 0, f"nonzero {failure}"
          assert len(root.findall("testcase")) >= 36, "missing testcase evidence"
          for element in ("failure", "error", "skipped"):
              assert not root.findall(".//" + element), f"unexpected {element} node"
          print(f"ATTO_PROXY_TEST_COUNT={count}")
          print("ATTO_PROXY_GUEST_RECEIPT=present")
          PY

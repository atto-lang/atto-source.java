name: Persistent actor data v1 policy conformance
on:
  pull_request:
    paths:
      - 'contracts/v1/persistent_actor_data_v1.json'
      - 'scripts/verify_persistent_actor_data_contract.py'
      - 'scripts/test_persistent_actor_data_contract.py'
      - '.github/workflows/persistent-actor-data-contract.yml'
      - 'src/main/java/dev/oreslang/runtime/ActorRuntime.java'
      - 'src/main/java/dev/oreslang/runtime/PersistentActorMap.java'
      - 'src/main/java/dev/oreslang/types/ActorStateModeContracts.java'
      - 'src/test/java/dev/oreslang/runtime/PersistentActorMapTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorSharedLocalMemoryTest.java'
      - 'src/test/java/dev/oreslang/types/ActorStateModeContractsTest.java'
  push:
    paths:
      - 'contracts/v1/persistent_actor_data_v1.json'
      - 'scripts/verify_persistent_actor_data_contract.py'
      - 'scripts/test_persistent_actor_data_contract.py'
      - '.github/workflows/persistent-actor-data-contract.yml'
      - 'src/main/java/dev/oreslang/runtime/ActorRuntime.java'
      - 'src/main/java/dev/oreslang/runtime/PersistentActorMap.java'
      - 'src/main/java/dev/oreslang/types/ActorStateModeContracts.java'
      - 'src/test/java/dev/oreslang/runtime/PersistentActorMapTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorSharedLocalMemoryTest.java'
      - 'src/test/java/dev/oreslang/types/ActorStateModeContractsTest.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin identical five-backend contract source blobs
        shell: bash
        run: |
          test "$(git hash-object contracts/v1/persistent_actor_data_v1.json)" = "83a40f637ab77437108d02fedc8cde997f753928"
          test "$(git hash-object scripts/verify_persistent_actor_data_contract.py)" = "64de299cfa548cbea3ab15a37f7a7638631fe73e"
          test "$(git hash-object scripts/test_persistent_actor_data_contract.py)" = "ff744f14de6d0da46f8bdc6eb1b04208480158b6"
      - name: Reject capability and fixture drift
        run: python3 scripts/verify_persistent_actor_data_contract.py
      - name: Execute negative policy mutation suite
        run: python3 scripts/test_persistent_actor_data_contract.py -v
  java-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: '25'
          distribution: graalvm
          cache: maven
      - name: HAMT and pure-actor runtime regression
        run: mvn -B -ntp -Dtest=PersistentActorMapTest,ActorSharedLocalMemoryTest,ActorStateModeContractsTest test
      - name: Full Java/GraalVM verification
        run: mvn -B -ntp -Dores.runtime.carriers=native verify

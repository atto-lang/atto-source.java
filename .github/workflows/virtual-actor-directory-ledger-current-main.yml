name: Virtual actor current-main directory ledger exact-head

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorRuntime.java'
      - 'src/main/java/dev/oreslang/runtime/VirtualActorRuntimeGenerationFence.java'
      - 'src/main/java/dev/oreslang/runtime/VirtualActorCurrentMainDirectory.java'
      - 'src/main/java/dev/oreslang/runtime/VirtualActorAddressV1.java'
      - 'src/test/java/dev/oreslang/runtime/VirtualActorCurrentMainDirectoryTest.java'
      - '.github/workflows/virtual-actor-directory-ledger-current-main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-main-directory-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-directory-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head, root tree and changed code blobs
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "HEAD_SHA=$EXPECTED_HEAD_SHA"
          echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
          git hash-object src/main/java/dev/oreslang/runtime/ActorRuntime.java
          git hash-object src/main/java/dev/oreslang/runtime/VirtualActorRuntimeGenerationFence.java
          git hash-object src/main/java/dev/oreslang/runtime/VirtualActorCurrentMainDirectory.java
          git hash-object src/main/java/dev/oreslang/runtime/VirtualActorAddressV1.java
          git hash-object src/test/java/dev/oreslang/runtime/VirtualActorCurrentMainDirectoryTest.java

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
          cache: maven

      - name: Execute directory, physical generation and CONTROL host suites
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=VirtualActorCurrentMainDirectoryTest,VirtualActorGenerationFenceCurrentMainTest,VirtualActorTerminalControlCurrentMainTest -DfailIfNoTests=true test
          for suite in VirtualActorCurrentMainDirectoryTest VirtualActorGenerationFenceCurrentMainTest VirtualActorTerminalControlCurrentMainTest; do
            report="target/surefire-reports/TEST-dev.oreslang.runtime.${suite}.xml"
            test -s "$report"
            grep -Eq 'tests="[1-9][0-9]*"' "$report"
            ! grep -Eq 'failures="[1-9]|errors="[1-9]|skipped="[1-9]' "$report"
            echo "EXECUTED_SUITE=$suite"
          done
          echo "VERIFIED_HEAD=$GITHUB_SHA"

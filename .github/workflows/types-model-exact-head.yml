name: Type-only declarations and model exact-head verification

on:
  push:
    branches:
      - feat/declare-types-model-hardening-20261023
    paths:
      - '.github/workflows/types-model-exact-head.yml'
      - 'pom.xml'
      - 'contracts/v1/type-alias-extension-constraint-v1.properties'
      - 'contracts/v1/type-declarations-conformance-v1.tsv'
      - 'src/main/java/**'
      - 'src/test/java/dev/oreslang/DeclaredTypeOnlySyntaxTest.java'
      - 'src/test/java/dev/oreslang/SharedTypeDeclarationConformanceTest.java'
      - 'src/test/java/dev/oreslang/ModelDefinitionHardeningTest.java'
      - 'src/test/java/dev/oreslang/AliasExtensionMethodTest.java'
      - 'src/test/java/dev/oreslang/TypeConstraintDescriptorTest.java'
      - 'src/test/java/dev/oreslang/ConstraintValidationBridgeTest.java'
  pull_request:
    branches:
      - main
      - feat/general-modelgraph-v1-current-20261019
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: type-model-exact-head-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-junit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact repository commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify GitHub commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'Exact Oreslang tree: %s\n' "$(git rev-parse HEAD^{tree})"
          sha256sum contracts/v1/type-declarations-conformance-v1.tsv
          printf 'Commit: %s\n' "$EXPECTED_SHA"
      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Focused declaration, model, extension and constraint-descriptor JUnit suite
        shell: bash
        run: |
          set -euo pipefail
          java --version
          mvn -B -ntp -Dtest=SharedTypeDeclarationConformanceTest,DeclaredTypeOnlySyntaxTest,ModelDefinitionHardeningTest,AliasExtensionMethodTest,TypeConstraintDescriptorTest,ConstraintValidationBridgeTest test

  complete-maven-regressions:
    needs: focused-junit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact repository commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Run full Java regression verification
        run: mvn -B -ntp verify

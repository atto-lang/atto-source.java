name: Checked quotient profile forward-port exact-head JVM
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/**'
      - 'src/test/java/dev/oreslang/**'
      - '.github/workflows/checked-quotient-forward-port.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-head-jvm:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
          github-token: ${{ github.token }}
          cache: maven
      - name: Build compiler and execute focused quotient tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git log -1 --format='%H %T'
          test -z "$(git status --porcelain)"
          mvn -B -ntp -Dtest=CheckedQuotientProfileForwardPortTest -DfailIfNoTests=true -Dsurefire.failIfNoSpecifiedTests=true test
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("target/surefire-reports/TEST-dev.oreslang.CheckedQuotientProfileForwardPortTest.xml").getroot()
          expected = {
              "checkedAttoAndLegacyOresKeepSeparateQuotientTypes",
              "checkedDirectiveSelectsSameSemanticsWithoutAttoExtension",
              "linkedAdmissionSelectsProfileByUnitWithoutCacheCrossContamination",
              "signedBoundaryAndZeroAreDistinctFailures",
              "checkedNumericFaultsAreTypedOrdinaryGuestErrors",
              "ordinaryNumericFaultIdentityDoesNotReclassifyHostArithmetic",
              "exactNumericOrderingMatchesIndependentOracle",
              "guestOrderingPreservesIntegerPrecisionAndIeeeUnorderedValues",
          }
          cases = root.findall("testcase")
          assert root.tag == "testsuite"
          assert len(cases) == int(root.attrib["tests"]) == len(expected)
          assert all(int(root.attrib[key]) == 0 for key in ("errors", "failures", "skipped"))
          assert {case.attrib["name"] for case in cases} == expected
          assert all(case.attrib["classname"] == "dev.oreslang.CheckedQuotientProfileForwardPortTest"
                     and not any(case.find(tag) is not None for tag in ("error", "failure", "skipped"))
                     for case in cases)
          print("CHECKED_QUOTIENT_PROFILE_JVM_PASS tests=8")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checked-quotient-junit
          path: target/surefire-reports/TEST-dev.oreslang.CheckedQuotientProfileForwardPortTest.xml
          if-no-files-found: warn

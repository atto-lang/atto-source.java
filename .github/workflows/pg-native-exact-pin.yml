name: PostgreSQL ORM native guests at pinned compiler
on:
  push:
    branches:
      - ci/pg-native-87a52-fixtures-20261031
  pull_request:
    branches:
      - ci-base/pg-native-87a52-20261031
permissions:
  contents: read
jobs:
  native-pg-guests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify exact compiler source and copied guest blobs
        shell: bash
        run: |
          set -euo pipefail
          pin=87a52fa7af40d3541277764533f51850b4db22bd
          git cat-file -e "$pin^{commit}"
          git diff --exit-code "$pin" -- pom.xml .mvn src
          test "$(git hash-object ci-pg-native/src/pg.ores)" = d9cfe1c1f3cc1ed14ee61cf80e648dd22291d924
          test "$(git hash-object ci-pg-native/tests/plans.ores)" = 58482d494207f657c85f56805c719d409181aedd
          test "$(git hash-object ci-pg-native/tests/negative/empty_identifier.ores)" = d6d0d2e64bdefa291dfa3e0828d0547f4e2f2575
          test "$(git hash-object ci-pg-native/tests/negative/empty_table.ores)" = a1a40e40b4baf14d17887f9e714d35d9d540aa7c
          test "$(git hash-object ci-pg-native/tests/negative/control_identifier.ores)" = 80c59d58e83c0cd345fd2cb9ba2cc55904f08ba1
          java --version
          mvn --version
      - name: Clean build pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests clean package dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
          test -s target/classpath.txt
          test -f target/classes/dev/oreslang/launcher/OresMain.class
      - name: Execute four native PostgreSQL ORM guest oracles
        shell: bash
        run: |
          set -euo pipefail
          launcher=(java --enable-native-access=ALL-UNNAMED -p "target/classes:$(cat target/classpath.txt)" -m dev.oreslang/dev.oreslang.launcher.OresMain)
          run_positive() {
            "${launcher[@]}" ci-pg-native/tests/plans.ores > /tmp/pg-positive.out 2> /tmp/pg-positive.err
            test "$(cat /tmp/pg-positive.out)" = 'Postgres SQL planning contracts passed'
          }
          run_negative() {
            label="$1"; source="$2"; marker="$3"; diagnostic="$4"
            set +e
            "${launcher[@]}" "$source" > "/tmp/$label.out" 2> "/tmp/$label.err"
            rc=$?
            set -e
            test "$rc" -ne 0
            test "$rc" -ne 69
            test "$rc" -ne 126
            test "$rc" -ne 127
            test "$(cat "/tmp/$label.out")" = "$marker"
            grep -Fq -- "$diagnostic" "/tmp/$label.err"
          }
          run_positive
          run_negative empty-identifier ci-pg-native/tests/negative/empty_identifier.ores PG_NEGATIVE_EMPTY_IDENTIFIER_STARTED 'invalid PostgreSQL identifier surface'
          run_negative empty-table ci-pg-native/tests/negative/empty_table.ores PG_NEGATIVE_EMPTY_TABLE_STARTED 'PostgreSQL table requires at least one column'
          run_negative control-identifier ci-pg-native/tests/negative/control_identifier.ores PG_NEGATIVE_CONTROL_IDENTIFIER_STARTED 'invalid PostgreSQL identifier surface'
          printf '%s\n' 'NATIVE_PG_FOUR_GUESTS_PASS'

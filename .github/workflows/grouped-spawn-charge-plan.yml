name: Grouped spawn charge plan (host only)
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorSpawnChargePlan.java'
      - 'src/main/java/dev/oreslang/runtime/ActorSpawnReservation.java'
      - 'src/test/java/dev/oreslang/runtime/ActorSpawnChargePlanSmoke.java'
      - '.github/workflows/grouped-spawn-charge-plan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  charge-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify head and execute host charge checks
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'head=%s tree=%s\n' "$EXPECTED_HEAD" "$(git rev-parse HEAD^{tree})"
          mkdir -p target/grouped-spawn-charge
          javac --release 21 -Xlint:all -Werror -d target/grouped-spawn-charge src/main/java/dev/oreslang/runtime/ActorSpawnChargePlan.java src/main/java/dev/oreslang/runtime/ActorSpawnReservation.java src/test/java/dev/oreslang/runtime/ActorSpawnChargePlanSmoke.java
          java -cp target/grouped-spawn-charge dev.oreslang.runtime.ActorSpawnChargePlanSmoke

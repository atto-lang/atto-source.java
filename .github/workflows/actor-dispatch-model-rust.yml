name: Rust actor dispatch-ticket model

on:
  pull_request:
    paths:
      - 'tools/actor-dispatch-model/**'
      - '.github/workflows/actor-dispatch-model-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --manifest-path tools/actor-dispatch-model/Cargo.toml -- --check
      - name: Rust lint
        run: cargo clippy --manifest-path tools/actor-dispatch-model/Cargo.toml --all-targets -- -D warnings
      - name: Exhaustive model and mutation tests
        run: cargo test --manifest-path tools/actor-dispatch-model/Cargo.toml
      - name: Deterministic witness output
        run: cargo run --manifest-path tools/actor-dispatch-model/Cargo.toml

name: Atto nominal enum compiled guest actor mail

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enum-actor-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git status --porcelain)"
      - name: Install JDK21 for verified Graal guest runtime
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute typed enum matcher and compiled actor mailbox guest tests
        run: >-
          mvn -B -ntp -Dtest=NominalEnumActorMailGuestTest,EnumMatchArmSyntaxGuestTest,OresEnumSymbolActorMailTest,ActorStateRetirementPermitTest
          -DfailIfNoTests=true test
      - name: Preserve actual Surefire method reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atto-enum-guest-mail-surefire
          path: target/surefire-reports/
          if-no-files-found: warn

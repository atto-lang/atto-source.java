name: Awaitable I/O natural names
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/main/java/dev/oreslang/runtime/AsyncNativeIo.java'
      - 'src/main/java/dev/oreslang/runtime/CapabilityChecker.java'
      - 'src/test/java/dev/oreslang/AsyncAwaitLanguageTest.java'
      - 'src/test/java/dev/oreslang/runtime/AsyncNativeIoTest.java'
      - 'src/test/java/dev/oreslang/runtime/NativeCliIoTest.java'
      - 'src/test/java/dev/oreslang/runtime/RuntimePermissionsTest.java'
      - 'src/test/resources/oreslang/stack-cli-main.ores'
      - 'docs/ASYNC_IO.md'
      - '.github/workflows/awaitable-io-natural-names.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jdk25-awaitable-io:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up GraalVM/JDK25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          version: '25.3'
          java-version: '25'
      - name: Verify exact source
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          java -version
          javac -version
      - name: Awaitable I/O contract suites
        run: >
          mvn -B
          -Dtest=AsyncAwaitLanguageTest,AsyncNativeIoTest,NativeCliIoTest,RuntimePermissionsTest
          test

name: task-resolved-send-kernel

on:
  push:
    branches: ["feat/task-resolved-send-bridge-*"]
  pull_request:
    paths:
      - "src/main/java/dev/oreslang/types/Types.java"
      - "src/main/java/dev/oreslang/types/ThreadSafetyTraits.java"
      - "src/main/java/dev/oreslang/types/TypeChecker.java"
      - "src/test/java/dev/oreslang/TaskResolvedSendBridgeTest.java"
      - "src/test/java/dev/oreslang/types/TaskResolvedSendIntrinsicSmoke.java"
      - "scripts/test-task-resolved-send-intrinsics.sh"
      - ".github/workflows/task-resolved-send-kernel.yml"

permissions:
  contents: read

concurrency:
  group: task-resolved-send-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Strict resolved Send proof kernel smoke
        run: bash scripts/test-task-resolved-send-intrinsics.sh

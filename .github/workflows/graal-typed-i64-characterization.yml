name: Real Graal typed i64 characterization

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graal-i64-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Print exact checked-out source identity
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          test -z "$(git status --porcelain)"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Run actual typed Graal guest boundary tests
        run: mvn -B -ntp -Dtest=GraalI64RuntimeCharacterizationTest test
      - name: Prepare real compiler fixture runner
        run: |
          mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile=target/conformance-classpath.txt
          python3 -m pip install --break-system-packages 'jsonschema>=4.20,<5'
          python3 contracts/v1/semantics/run.py --validate
      - name: Execute all required Graal compiler and guest fixtures
        run: |
          python3 contracts/v1/semantics/run.py \
            --backend graal \
            --command 'python3 contracts/v1/java_probe.py {source}' \
            --run-command 'python3 contracts/v1/java_probe.py {source} --execute' \
            --revision "$(git rev-parse HEAD)" \
            --report target/semantics-graal.json
      - name: Preserve actual test and conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graal-typed-i64-evidence
          path: |
            target/surefire-reports/GraalI64RuntimeCharacterizationTest*
            target/semantics-graal.json
            target/conformance-engine-logs/*.log
          if-no-files-found: ignore

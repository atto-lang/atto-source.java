name: Supervisor terminal CONTROL

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorRuntime.java'
      - 'src/main/java/dev/oreslang/runtime/CoreLog.java'
      - 'src/main/java/dev/oreslang/runtime/SupervisorTerminalLedger.java'
      - 'src/test/java/dev/oreslang/runtime/SupervisorTerminalLedgerTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorGroupTerminalControlTest.java'
      - 'scripts/verify_supervisor_terminal_ledger.py'
      - 'docs/SUPERVISOR_TERMINAL_CONTROL_V1.md'
      - '.github/workflows/supervisor-terminal-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Run finite terminal-control model
        run: python3 scripts/verify_supervisor_terminal_ledger.py
      - name: Run terminal CONTROL runtime tests
        run: >
          mvn -B -ntp
          -Dtest=SupervisorTerminalLedgerTest,ActorGroupTerminalControlTest
          test

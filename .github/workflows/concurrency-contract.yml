name: concurrency-contract

on:
  push:
    branches:
      - integration/concurrency-contract-20261006
  pull_request:

permissions:
  contents: read
jobs:
  concurrency-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile
        run: mvn -B -DskipTests -Dores.runtime.carriers=java test-compile
      - name: Runtime and language proof suite
        run: >
          mvn -B -Dores.runtime.carriers=java -Dsurefire.failIfNoSpecifiedTests=true
          -Dtest=OresVMTest,OresSchedulerTest,ChannelRuntimeTest,ActorEventBusTest,ChannelSelectSyntaxTest,TaskTraitAdmissionHardeningTest,OresScalarTaskFrameTest,GuestScalarTaskAwaitTest,TaskBlockSyntaxTest,TaskSpellingSyntaxTest,TaskSpawnSendAdmissionTest,TaskAccessVerifierTest,ScopedTaskTypeBridgeTest,TaskRegionHostScopeIntegrationTest,TaskRegionPhysicalExitBridgeTest,OresTaskScopeCancellationOrderingTest,OresTaskScopePreAdmissionOwnershipTest,OresTaskScopeFailedSlotCleanupTest,OresTaskScopeRetirementBookkeepingTest,OresTaskScopeCoherentQuiescenceTest,OresTaskScopeFrameTest,OresTaskProvisionalAdmissionTest,OresTaskRuntimeAdmissionTest,OresTaskOrdinaryRetirementTest,OresTaskScopeAdmissionStressTest,OresTaskConvergedAdmissionStressTest,OresTaskScopeUnlinkOrderingTest,OresTaskScopeLoanBindingTest,OresTaskScopeTest,TaskLoanAdmissionTest,AsyncRuntimeAdversarialAdmissionTest,TaskResolvedSafetyProofTest,OresTaskPartitionQuiescenceTest
          test

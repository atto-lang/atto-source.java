name: concurrency-contract

on:
  push:
    branches:
      - integration/concurrency-contract-20261006
  pull_request:

permissions:
  contents: read
jobs:
  concurrency-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact source head before compilation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code HEAD --
          echo "Oreslang Java source head: $EXPECTED_HEAD"
          echo "Oreslang Java source tree: $(git rev-parse 'HEAD^{tree}')"
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Compile
        run: mvn -B -DskipTests -Dores.runtime.carriers=java test-compile
      - name: Runtime and language proof suite
        run: >
          mvn -B -Dores.runtime.carriers=java
          -Dtest=OresVMTest,OresSchedulerTest,ChannelRuntimeTest,ActorEventBusTest,ChannelSelectSyntaxTest,CriticalTryLoanRuntimeTest,CriticalSuspendsDeclarationBoundaryTest
          test

name: Source actor receive quiescence exact-head

on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorRuntime.java'
      - 'src/main/java/dev/oreslang/runtime/ActorSourceLifecycleGate.java'
      - 'src/test/java/dev/oreslang/runtime/ActorReceiveQuiescenceGateTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorSourceLifecycleGateTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorSourceTearDownTest.java'
      - '.github/workflows/actor-receive-quiescence-v1.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorRuntime.java'
      - 'src/main/java/dev/oreslang/runtime/ActorSourceLifecycleGate.java'
      - 'src/test/java/dev/oreslang/runtime/ActorReceiveQuiescenceGateTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorSourceLifecycleGateTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorSourceTearDownTest.java'
      - '.github/workflows/actor-receive-quiescence-v1.yml'

permissions:
  contents: read

jobs:
  java-source-actor-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source PR head with no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up GraalVM JDK25 for real actor runtime tests
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
          cache: maven
      - name: Verify exact head and run real JUnit tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          java --version
          mvn -B -ntp -DfailIfNoTests=true \
            -Dtest=ActorReceiveQuiescenceGateTest,ActorSourceLifecycleGateTest,ActorSourceTearDownTest \
            -Dsurefire.failIfNoSpecifiedTests=true test

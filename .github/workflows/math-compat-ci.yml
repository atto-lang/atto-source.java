name: math-compat-ci

on:
  push:
    branches:
      - feat/math-linear-algebra-ee-20261002

permissions:
  contents: read

jobs:
  math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run focused math/import tests
        run: mvn -B -ntp -Dtest=MathLanguageTest,MathExecutionTest test

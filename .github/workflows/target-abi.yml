name: Target ABI (x86-64 and ARM64)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

env:
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  target-abi:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD }}
          persist-credentials: false
      - name: Verify exact source revision and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git diff --quiet
          git diff --cached --quiet
          printf 'EXACT_SOURCE_HEAD=%s\n' "$SOURCE_HEAD"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify target ABI without build-system dependencies
        run: bash scripts/verify-target-abi.sh
      - name: Validate target ABI registry and bounds
        run: mvn -B -ntp -Dtest=TargetAbiTest test

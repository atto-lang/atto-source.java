name: Grouped spawn option shape (host only)
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/parser/GroupedSpawnOptions.java'
      - 'src/test/java/dev/oreslang/parser/GroupedSpawnOptionsSmoke.java'
      - '.github/workflows/grouped-spawn-option-shape.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head and run shape tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'head=%s tree=%s\n' "$EXPECTED_HEAD" "$(git rev-parse HEAD^{tree})"
          mkdir -p target/grouped-spawn-shape
          javac --release 21 -Xlint:all -Werror -d target/grouped-spawn-shape src/main/java/dev/oreslang/parser/GroupedSpawnOptions.java src/test/java/dev/oreslang/parser/GroupedSpawnOptionsSmoke.java
          java -cp target/grouped-spawn-shape dev.oreslang.parser.GroupedSpawnOptionsSmoke

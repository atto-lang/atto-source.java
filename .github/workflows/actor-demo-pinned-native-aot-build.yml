name: Actor demo pinned native AOT compiler build
on:
  push:
    branches:
      - test/actor-demo-14-sealed-state-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-trusted-compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact compiler revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Assert exact source provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          printf 'COMPILER_SOURCE_SHA=%s\n' "$EXPECTED_SHA"
          printf 'COMPILER_SOURCE_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')"
      - name: Set up pinned GraalVM JDK
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Build real Oreslang Native Image and retain source/build identity
        shell: bash
        run: |
          set -euo pipefail
          java -version
          native-image --version
          mvn -version
          mvn -B -ntp -DskipTests -Pnative-aot package
          test -f target/ores-aot && test -x target/ores-aot
          sha256sum target/ores-aot | tee target/ores-aot.sha256
          {
            printf 'compiler_source_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'compiler_tree_sha=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'compiler_sha256=%s\n' "$(sha256sum target/ores-aot | cut -d ' ' -f 1)"
            printf 'github_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'github_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'build_profile=native-aot\n'
            java -version 2>&1
            native-image --version
            mvn -version
          } > target/ores-aot.build-provenance.txt
          cat target/ores-aot.build-provenance.txt
          echo 'NATIVE_AOT_BINARY_BUILT'
      - name: Verify genuine native CLI metadata and source execution
        shell: bash
        run: |
          set -euo pipefail
          test -x target/ores-aot
          timeout --kill-after=5s 15s target/ores-aot --build-info > target/ores-aot.build-info.json
          test "$(wc -c < target/ores-aot.build-info.json)" -le 2048
          jq -e -s 'length == 1 and (.[0] | type == "object"
            and (.build_mode | type == "string" and length > 0)
            and .guest_execution == true)' target/ores-aot.build-info.json >/dev/null
          invalid="$(mktemp --suffix=.ores)"
          trap 'rm -f "$invalid"' EXIT
          printf 'define actor BadSyntax as\n  this-is-not-valid-oreslang-@@@\nend\n' > "$invalid"
          if timeout --kill-after=5s 15s target/ores-aot --check "$invalid" > /dev/null 2> target/ores-aot.invalid.err; then
            echo 'BAD_COMPILER: invalid source passed --check' >&2
            exit 1
          else
            status=$?
            case "$status" in
              124|125|126|127) echo "BAD_COMPILER: syntax challenge infrastructure failure ($status)" >&2; exit 1 ;;
            esac
            if test "$status" -ge 128; then
              echo "BAD_COMPILER: syntax challenge signal failure ($status)" >&2
              exit 1
            fi
          fi
          fixture=src/test/resources/parity/actor-step-sequential.ores
          test -f "$fixture"
          timeout --kill-after=5s 30s target/ores-aot --check "$fixture"
          timeout --kill-after=5s 30s target/ores-aot "$fixture" > target/ores-aot.guest.stdout
          printf complete > target/ores-aot.guest.expected
          cmp target/ores-aot.guest.expected target/ores-aot.guest.stdout
          echo 'NATIVE_AOT_ACTOR_GUEST_SMOKE_PASS=1'
      # Same-source-repository artifact only: not permission to mirror compiler
      # bytes or private source across organizations. Security incident #22
      # remains a separate gate. Expiration intentionally limits exposure.
      - name: Retain private binary and provenance for independent review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oreslang-native-aot-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/ores-aot
            target/ores-aot.sha256
            target/ores-aot.build-provenance.txt
            target/ores-aot.build-info.json
            target/ores-aot.guest.stdout
            target/ores-aot.invalid.err
          if-no-files-found: ignore
          retention-days: 1

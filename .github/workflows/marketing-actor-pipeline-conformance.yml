name: Marketing actor pipeline compiler conformance
on:
  pull_request:
    paths:
      - 'examples/marketing-actor-pipeline-three-stage.ores'
      - 'src/test/java/dev/oreslang/MarketingActorPipelineConformanceTest.java'
      - 'contracts/conformance/language-motion-v1.json'
      - '.github/workflows/marketing-actor-pipeline-conformance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-and-compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject unearned compilation verification claims
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg blob '87136de0c131a20ca3891d88f6b69f0d13177b3a' '
            .schema_version == 1
            and .candidate.not_in_main == true
            and .candidate.baseline_compiler_revision == "00c344e05a5265a340a5dc68c012caa7e375115d"
            and .public_site.merged_revision == "b499725f5eb345c8b3828f1e70c9fc8fed836d21"
            and (.examples | length == 4)
            and ([.examples[].public_property] | sort) == ["httpCode","mlCode","pipelineCode","selectCode"]
            and ([.examples[] | select(.id == "three-actor-pipeline") | .source_blob_sha1] == [$blob])
            and ([.examples[] | select(.id == "three-actor-pipeline") | .java_status] == ["pending_ci"])
            and (all(.examples[]; .java_status != "verified" and .llvm_status != "verified" and .ci_evidence_url == null))
          ' contracts/conformance/language-motion-v1.json
      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
          cache: maven
      - name: Run actual source compiler and three-stage actor roundtrip
        run: mvn -B -ntp -Dtest=MarketingActorPipelineConformanceTest test

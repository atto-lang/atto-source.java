name: Typed Map language exact-head

on:
  push:
    branches:
      - 'feat/closed-typed-map-language-20261020'
    paths:
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/main/java/dev/oreslang/types/OwnershipChecker.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/test/java/dev/oreslang/TypedMapClosedSurfaceLanguageTest.java'
      - '.github/workflows/typed-map-language-exact-head.yml'
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/nodes/OresEvalRootNode.java'
      - 'src/main/java/dev/oreslang/types/OwnershipChecker.java'
      - 'src/main/java/dev/oreslang/types/TypeChecker.java'
      - 'src/test/java/dev/oreslang/TypedMapClosedSurfaceLanguageTest.java'
      - '.github/workflows/typed-map-language-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-language:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Run closed Map language and runtime regressions
        run: >
          mvn -B -ntp
          -Dtest=TypedMapClosedSurfaceLanguageTest,OresKeyedMapTest,OresKeyedMapLookupOptionTest,SymbolPropertyKeyCodecTest
          test

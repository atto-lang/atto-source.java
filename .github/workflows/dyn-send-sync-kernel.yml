name: dyn-send-sync-kernel

on:
  push:
    branches: ["feat/dyn-send-sync-arc-convergence-*"]
  pull_request:
    paths:
      - "src/main/java/dev/oreslang/types/Types.java"
      - "src/main/java/dev/oreslang/types/ThreadSafetyTraits.java"
      - "src/test/java/dev/oreslang/types/SendSyncIntrinsicSmoke.java"
      - "src/test/java/dev/oreslang/DynSendSyncConvergenceTest.java"
      - "scripts/test-send-sync-intrinsics.sh"
      - ".github/workflows/dyn-send-sync-kernel.yml"

permissions:
  contents: read

concurrency:
  group: dyn-send-sync-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Strict exact-checkout compiler and Send/Sync proof smoke
        run: bash scripts/test-send-sync-intrinsics.sh

name: AttoLang precompiled Java host import Native Image proof
on:
  pull_request:
    paths:
      - 'src/main/java/**'
      - 'src/test/java/dev/oreslang/JavaPrecompiledHostImportAotPolicyTest.java'
      - 'examples/interop/precompiled-java-long.atto'
      - 'pom.xml'
      - '.github/workflows/atto-precompiled-java-native-import.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  precompiled-jdk-interop-aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact Java source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Provision pinned GraalVM JDK25 toolchain
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: graalvm
          java-version: '25'
      - name: Test real AttoLang to precompiled Java library import under JVM AOT policy
        run: mvn -B -ntp -Dtest=JavaPrecompiledHostImportAotPolicyTest -DfailIfNoTests=true test
      - name: Build true native binary without JVM/JIT fallback
        run: mvn -B -ntp -Pnative-aot -DskipTests package
      - name: Execute native-image AttoLang guest with pinned JDK host-library import
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          file target/ores-aot
          test -x target/ores-aot
          output="$(target/ores-aot --mode=aot --no-core-log --allow=JAVA_INTEROP --allow-host-class=java.lang.Long examples/interop/precompiled-java-long.atto)"
          test "$output" = '42'
          printf 'JAVA_PRECOMPILED_HOST_NATIVE_IMAGE_AOT|head=%s|stdout=%s\n' "$EXPECTED_HEAD" "$output"
          sha256sum target/ores-aot
          git rev-parse 'HEAD^{tree}'
          git status --porcelain
          echo 'Host native image and guest interpreter only; not compiler-lowered guest machine code or zero-GC proof'

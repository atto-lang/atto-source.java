name: AttoLang precompiled Java host import Native Image proof
on:
  pull_request:
    paths:
      - 'src/main/java/**'
      - 'src/test/java/dev/oreslang/JavaPrecompiledHostImportAotPolicyTest.java'
      - 'src/test/java/dev/oreslang/runtime/SafeHostMemberManifestTest.java'
      - 'examples/interop/precompiled-java-long.atto'
      - 'pom.xml'
      - '.github/workflows/atto-precompiled-java-native-import.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  precompiled-jdk-interop-aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact Java source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Provision pinned GraalVM JDK25 toolchain
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: graalvm
          java-version: '25'
      - name: Bind evidence to exact pristine source HEAD before any build
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse 'HEAD^{tree}'
      - name: Test real AttoLang to precompiled Java library import under JVM AOT policy
        run: mvn -B -ntp -Dtest=JavaPrecompiledHostImportAotPolicyTest,SafeHostMemberManifestTest -DfailIfNoTests=true test
      - name: Build true native binary without JVM/JIT fallback
        run: mvn -B -ntp -Pnative-aot -DskipTests package
      - name: Execute native-image AttoLang guest with pinned JDK host-library import
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          file target/ores-aot
          test -x target/ores-aot
          output="$(target/ores-aot --mode=aot --no-core-log --allow=JAVA_INTEROP --allow-host-method='java.lang.Long#sum(long,long)' examples/interop/precompiled-java-long.atto)"
          test "$output" = '42'
          # Both grants are mandatory: JAVA_INTEROP and the exact member
          # signature. A class-wide legacy grant is deliberately not used.
          if target/ores-aot --mode=aot --no-core-log --allow=JAVA_INTEROP \
               examples/interop/precompiled-java-long.atto >/dev/null 2>&1; then
            echo 'missing method grant was unexpectedly accepted' >&2
            exit 1
          fi
          if target/ores-aot --mode=aot --no-core-log --allow-host-method='java.lang.Long#sum(long,long)' \
               examples/interop/precompiled-java-long.atto >/dev/null 2>&1; then
            echo 'missing JAVA_INTEROP capability was unexpectedly accepted' >&2
            exit 1
          fi
          if target/ores-aot --mode=aot --no-core-log --allow=JAVA_INTEROP \
               --allow-host-method='java.lang.Long#toString(long)' \
               examples/interop/precompiled-java-long.atto >/dev/null 2>&1; then
            echo 'forged method overload grant was unexpectedly accepted' >&2
            exit 1
          fi
          printf 'JAVA_PRECOMPILED_HOST_NATIVE_IMAGE_AOT|head=%s|stdout=%s|denials=3\n' "$EXPECTED_HEAD" "$output"
          sha256sum target/ores-aot
          git rev-parse 'HEAD^{tree}'
          git diff --quiet HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          echo 'SOURCE_WORKTREE_UNCHANGED=1'
          echo 'Host native image and guest interpreter only; not compiler-lowered guest machine code or zero-GC proof'

name: Actor-state RW ownership and physical retirement (Java exact head)

on:
  pull_request:
    paths:
      - "src/main/java/dev/oreslang/runtime/ActorStateRwLoans.java"
      - "src/test/java/dev/oreslang/runtime/ActorStateRwLoansTest.java"
      - "docs/ACTOR_STATE_RW_ALLOCATION_BOUND_AUDIT.md"
      - ".github/workflows/actor-state-rw-ownership.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actor-state-rw-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reject mismatched head, dirty tree or untracked payload
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          echo "EXACT_JAVA_HEAD=$EXPECTED_HEAD"
          echo "EXACT_JAVA_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run real Java RW loan JUnit regressions
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -B -ntp -Dores.runtime.carriers=java \
            -Dtest=ActorStateRwLoansTest -DfailIfNoTests=true test
      - name: Verify exact focused Surefire evidence (25+ real tests)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("target/surefire-reports/TEST-dev.oreslang.runtime.ActorStateRwLoansTest.xml")
          if not path.is_file():
              raise SystemExit("FAIL: mandatory focused Surefire XML absent")
          suite = ET.parse(path).getroot()
          total = int(suite.attrib.get("tests", "0"))
          failed = int(suite.attrib.get("failures", "0"))
          errors = int(suite.attrib.get("errors", "0"))
          skipped = int(suite.attrib.get("skipped", "0"))
          if total < 25 or failed or errors or skipped:
              raise SystemExit(f"FAIL: invalid focused JUnit receipt: tests={total} failed={failed} errors={errors} skipped={skipped}")
          print(f"RW_JUNIT_EXECUTED tests={total} failed={failed} errors={errors} skipped={skipped}")
          PY
      - name: Preserve machine-readable JUnit receipts for independent review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actor-state-rw-junit-receipts
          path: target/surefire-reports/TEST-dev.oreslang.runtime.ActorStateRwLoansTest.xml
          if-no-files-found: warn

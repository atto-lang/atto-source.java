name: Actor-state RW and .atto ownership compiler (Java exact head)

on:
  pull_request:
    paths:
      - "src/main/java/dev/oreslang/runtime/ActorStateRwLoans.java"
      - "src/main/java/dev/oreslang/runtime/ActorStateSupervisorLoans.java"
      - "src/main/java/dev/oreslang/runtime/ActorRuntime.java"
      - "src/main/java/dev/oreslang/parser/Parser.java"
      - "src/main/java/dev/oreslang/types/OwnershipChecker.java"
      - "src/test/java/dev/oreslang/ActorStateContainerOwnershipCompilerTest.java"
      - "src/test/java/dev/oreslang/ActorStateBorrowReturnFenceTest.java"
      - "src/test/java/dev/oreslang/ActorStateFieldBorrowBoundaryTest.java"
      - "scripts/ci/actor_state_return_borrow_negative_mutation.py"
      - "src/test/resources/ownership/actor-state/**"
      - "src/test/java/dev/oreslang/runtime/ActorStateRwLoansTest.java"
      - "src/test/java/dev/oreslang/runtime/ActorStateSupervisorLoansTest.java"
      - "docs/ACTOR_STATE_RW_ALLOCATION_BOUND_AUDIT.md"
      - "docs/ACTOR_SUPERVISOR_CONTROL_GUARDED_STATE_V1.md"
      - "docs/ACTOR_SUPERVISOR_SCOPED_CONTROL_LOANS_V1.md"
      - "docs/ACTOR_STATE_CONTAINER_COMPILER_V1.md"
      - "docs/ACTOR_STATE_RETURN_BORROW_FENCE_V1.md"
      - "docs/ACTOR_STATE_FIELD_BORROW_ADMISSION_V1.md"
      - ".github/workflows/actor-state-rw-ownership.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actor-state-rw-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reject mismatched head, dirty tree or untracked payload
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          echo "EXACT_JAVA_HEAD=$EXPECTED_HEAD"
          echo "EXACT_JAVA_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run real Java RW loan JUnit regressions
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -B -ntp -Dores.runtime.carriers=java \
            -Dtest=ActorStateRwLoansTest,ActorStateSupervisorLoansTest,ActorStateContainerOwnershipCompilerTest,ActorStateBorrowReturnFenceTest,ActorStateFieldBorrowBoundaryTest -DfailIfNoTests=true test
      - name: Verify focused Surefire receipts (27 RW, 32 CONTROL, 12 actor-state, 7 return-fence and 8 field-path tests)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          base = Path("target/surefire-reports")
          cases = {
              "dev.oreslang.runtime.ActorStateRwLoansTest": 27,
              "dev.oreslang.runtime.ActorStateSupervisorLoansTest": 32,
              "dev.oreslang.ActorStateContainerOwnershipCompilerTest": 12,
              "dev.oreslang.ActorStateBorrowReturnFenceTest": 7,
              "dev.oreslang.ActorStateFieldBorrowBoundaryTest": 8,
          }
          for class_name, minimum in cases.items():
              path = base / f"TEST-{class_name}.xml"
              if not path.is_file():
                  raise SystemExit(f"FAIL: mandatory Surefire XML absent: {path}")
              suite = ET.parse(path).getroot()
              total = int(suite.attrib.get("tests", "0"))
              failed = int(suite.attrib.get("failures", "0"))
              errors = int(suite.attrib.get("errors", "0"))
              skipped = int(suite.attrib.get("skipped", "0"))
              if total < minimum or failed or errors or skipped:
                  raise SystemExit(
                      f"FAIL: invalid {class_name} receipt: tests={total} "
                      f"failed={failed} errors={errors} skipped={skipped}")
              print(
                  f"RW_JUNIT_EXECUTED class={class_name} tests={total} "
                  f"failed={failed} errors={errors} skipped={skipped}")
          PY
      - name: Require a real negative mutation to kill the returned-actor-borrow regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/actor_state_return_borrow_negative_mutation.py
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --quiet HEAD
      - name: Preserve machine-readable JUnit receipts for independent review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actor-state-rw-junit-receipts
          path: |
            target/surefire-reports/TEST-dev.oreslang.runtime.ActorStateRwLoansTest.xml
            target/surefire-reports/TEST-dev.oreslang.runtime.ActorStateSupervisorLoansTest.xml
            target/surefire-reports/TEST-dev.oreslang.ActorStateContainerOwnershipCompilerTest.xml
            target/surefire-reports/TEST-dev.oreslang.ActorStateBorrowReturnFenceTest.xml
            target/surefire-reports/TEST-dev.oreslang.ActorStateFieldBorrowBoundaryTest.xml
            target/actor-state-negative-mutation/TEST-MUTATION-ActorStateBorrowReturnFenceTest.xml
            target/actor-state-negative-mutation/negative-mutation-receipt.json
          if-no-files-found: warn

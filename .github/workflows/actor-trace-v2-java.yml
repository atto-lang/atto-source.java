name: JVM actual actor host trace v2 (not compiled Atto guest)
on:
  pull_request:
    paths:
      - 'src/test/java/dev/oreslang/runtime/ActorTraceContractIntegrationTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorDistinctCarriersOverlapV2Test.java'
      - 'src/test/java/dev/oreslang/runtime/ActorSerialCarrierSafetyV2Test.java'
      - 'src/test/java/dev/oreslang/AttoCanonicalFixtureGuestTest.java'
      - 'src/test/java/dev/oreslang/AttoAsyncNioActorGuestTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorStopMailboxRaceTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorAsyncSendAdmissionRaceTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorStateLoansTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorSupervisorMailChannelBoundaryTest.java'
      - 'src/test/java/dev/oreslang/SourceActorSpawnExecutionTest.java'
      - 'src/test/java/dev/oreslang/SealedActorStateAdmissionTest.java'
      - 'src/test/java/dev/oreslang/runtime/ActorPhysicalTurnGateTest.java'
      - 'src/test/java/dev/oreslang/ActorInvocationRuntimeTest.java'
      - 'src/test/java/dev/oreslang/SourceActorEndCleanupExecutionTest.java'
      - 'src/test/java/dev/oreslang/SourceActorNbSelectStopExecutionTest.java'
      - 'src/test/resources/atto/canonical-v1/**'
      - 'contracts/actor-trace-v2.json'
      - 'scripts/check_actor_trace_v2.py'
      - '.github/workflows/actor-trace-v2-java.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jvm-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact commit
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse 'HEAD^{tree}'
          test "$(git hash-object scripts/check_actor_trace_v2.py)" = '02a42b5781947b87af0ee868aab177031d48d41a'
          test "$(git hash-object contracts/actor-trace-v2.json)" = '732cf613c10a49bc75280f31ecfe6559614d4702'
          echo 'CANONICAL_V2_CONTRACT_AND_CHECKER_SHA_MATCH=PASS'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Execute real JVM actor JUnit ingress and retirement probe
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=ActorTraceContractIntegrationTest,ActorDistinctCarriersOverlapV2Test,ActorSerialCarrierSafetyV2Test \
            -Dores.runtime.carriers=java -Dores.actor.affinity=none test
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ("ActorTraceContractIntegrationTest", "ActorDistinctCarriersOverlapV2Test", "ActorSerialCarrierSafetyV2Test"):
              path = Path("target/surefire-reports/TEST-dev.oreslang.runtime." + name + ".xml")
              assert path.is_file(), f"missing executed JUnit receipt: {name}"
              receipt = ET.parse(path).getroot()
              assert int(receipt.attrib["tests"]) == 1, f"test not executed: {name}"
              assert all(int(receipt.attrib[k]) == 0 for k in ("errors", "failures", "skipped")), name
          print("THREE_REAL_JVM_JUNIT_TESTS_EXECUTED=PASS")
          PY
          test -s target/actor-trace-graal-v2.json
          python3 scripts/check_actor_trace_v2.py \
            --require-backend java --require-subject runtime_host \
            --require-emission reconstructed_after_quiescence \
            --min-admitted 24 target/actor-trace-graal-v2.json
          if python3 scripts/check_actor_trace_v2.py \
            --require-subject compiled_atto_guest target/actor-trace-graal-v2.json; then
            echo 'HOST_RECEIPT_WAS_PROMOTED_TO_GUEST_PROOF' >&2
            exit 1
          fi
          test -s target/actor-two-carrier-graal-v2.json
          python3 scripts/check_actor_trace_v2.py \
            --require-backend java --require-subject runtime_host \
            --require-emission reconstructed_after_quiescence \
            --min-admitted 2 --require-cross-actor-overlap \
            target/actor-two-carrier-graal-v2.json
          if python3 scripts/check_actor_trace_v2.py \
            --require-parallel-receives target/actor-two-carrier-graal-v2.json; then
            echo 'DISTINCT_ACTORS_FALSLY_CLAIMED_PARALLEL_RECEIVERS' >&2
            exit 1
          fi
          if python3 scripts/check_actor_trace_v2.py \
            --require-subject compiled_atto_guest target/actor-two-carrier-graal-v2.json; then
            echo 'DISTINCT_JVM_HOST_ACTORS_FALSLY_CLAIMED_GUEST' >&2
            exit 1
          fi
          echo 'JVM_CROSS_ACTOR_OVERLAP_RECEIPT=PASS'
          echo 'HOST_ONLY_PROVENANCE_FENCE=PASS'
          python3 -c "import json; t=json.load(open('target/actor-trace-graal-v2.json')); assert len(t['events'])==75; assert t['producer']['subject']=='runtime_host'"
          echo 'JVM_ACTOR_HOST_TRACE_V2=PASS'
          echo 'COMPILED_ATTO_GUEST_TRACE_V2=NOT_EXECUTED'
      - name: Run compiled .atto guest and adversarial original source actor tests
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=AttoCanonicalFixtureGuestTest,AttoAsyncNioActorGuestTest,ActorStopMailboxRaceTest,ActorAsyncSendAdmissionRaceTest,ActorStateLoansTest,ActorSupervisorMailChannelBoundaryTest \
            -Dores.runtime.carriers=java -Dores.actor.affinity=none test
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {
            "dev.oreslang.AttoCanonicalFixtureGuestTest": 3,
            "dev.oreslang.AttoAsyncNioActorGuestTest": 1,
            "dev.oreslang.runtime.ActorStopMailboxRaceTest": 1,
            "dev.oreslang.runtime.ActorAsyncSendAdmissionRaceTest": 2,
            "dev.oreslang.runtime.ActorStateLoansTest": 7,
            "dev.oreslang.runtime.ActorSupervisorMailChannelBoundaryTest": 3,
          }
          for name, cases in expected.items():
              path = Path("target/surefire-reports/TEST-" + name + ".xml")
              assert path.exists(), "missing source JUnit run: " + name
              suite = ET.parse(path).getroot()
              assert int(suite.attrib["tests"]) == cases, "incomplete JUnit cases: " + name
              assert all(int(suite.attrib[k]) == 0 for k in ("failures", "errors", "skipped")), name
          print("SOURCE_JAVA_ACTOR_GUEST_PLUS_ADVERSARIAL_17_CASES=PASS")
          PY
          echo 'COMPILED_GUEST_EXECUTION=PASS'
          echo 'COMPILED_GUEST_ACTOR_TRACE_V2=NOT_EXECUTED'
      - name: Test original compiler-backed actor lifecycle and physical turn-gate regressions
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=SourceActorSpawnExecutionTest,SealedActorStateAdmissionTest,ActorPhysicalTurnGateTest,ActorInvocationRuntimeTest,SourceActorEndCleanupExecutionTest,SourceActorNbSelectStopExecutionTest \
            -Dores.runtime.carriers=java -Dores.actor.affinity=none test
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {
            "dev.oreslang.SourceActorSpawnExecutionTest": 7,
            "dev.oreslang.SealedActorStateAdmissionTest": 11,
            "dev.oreslang.runtime.ActorPhysicalTurnGateTest": 15,
            "dev.oreslang.ActorInvocationRuntimeTest": 4,
            "dev.oreslang.SourceActorEndCleanupExecutionTest": 6,
            "dev.oreslang.SourceActorNbSelectStopExecutionTest": 1,
          }
          for name, cases in expected.items():
              path = Path("target/surefire-reports/TEST-" + name + ".xml")
              assert path.exists(), "missing original source JUnit: " + name
              suite = ET.parse(path).getroot()
              assert int(suite.attrib["tests"]) == cases, "missing cases from " + name
              assert all(int(suite.attrib[k]) == 0 for k in ("failures", "errors", "skipped")), name
          print("ORIGINAL_ACTOR_LIFECYCLE_TURN_GATE_JUNIT_44_CASES=PASS")
          PY
          echo 'ACTUAL_ATTO_GUEST_LIFECYCLE=EXECUTED'
          echo 'PHYSICAL_HOST_ACTOR_TURN_GATE=EXECUTED'
          echo 'SEALED_STATE_PARSER_GATE=EXECUTED'
          echo 'ONLINE_COMPILED_GUEST_ACTOR_TRACE_V2=NOT_EXECUTED'

name: Oreslang logic exact-blob guest canary and suite

on:
  push:
    branches:
      - ci/logic-canary-20261030

permissions:
  contents: read

concurrency:
  group: oreslang-logic-canary-20261030
  cancel-in-progress: true

jobs:
  compile-and-run-oreslang:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout compiler with no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Verify exact pinned logic test-source Git blobs
        run: |
          set -eu
          git rev-parse HEAD
          java -version
          mvn -version
          while read -r expected path; do
            [ -f "$path" ] || { echo "missing $path"; exit 1; }
            actual="$(git hash-object "$path")"
            [ "$actual" = "$expected" ] || { echo "logic blob mismatch: $path expected $expected got $actual"; exit 1; }
          done < ci/logic_lib/expected-blobs.txt
      - name: Build genuine Oreslang Java/GraalVM compiler
        run: mvn -B -ntp -Dores.runtime.carriers=native -DskipTests package
      - name: Real compiler check - scalar canary
        run: mvn -B -ntp -Dores.runtime.carriers=native -DskipTests exec:java -Dexec.args="--check ci/logic_lib/tests/compiler_canary.ores"
      - name: Real Oreslang guest execution - scalar canary
        run: mvn -B -ntp -Dores.runtime.carriers=native -DskipTests exec:java -Dexec.args="ci/logic_lib/tests/compiler_canary.ores"
      - name: Real compiler check - full logic import graph
        run: mvn -B -ntp -Dores.runtime.carriers=native -DskipTests exec:java -Dexec.args="--check ci/logic_lib/tests/main.ores"
      - name: Real Oreslang guest execution - full logic suite
        run: mvn -B -ntp -Dores.runtime.carriers=native -DskipTests exec:java -Dexec.args="ci/logic_lib/tests/main.ores"

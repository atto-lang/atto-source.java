name: Source-org isolated runner capability canary (no checkout)
# MANUAL ONLY. Do not schedule self-hosted runners from PR-controlled
# workflow definitions. Requires independently reviewed workflow on a
# protected default branch and deliberate administrator dispatch.
# Use a dedicated v2 runner label: historical queued PR-triggered jobs require
# the retired oreslang-isolated-ephemeral label and cannot match this worker.
on:
  workflow_dispatch:
permissions: {}
jobs:
  source-free-runner-canary:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, oreslang-isolated-canary-2172-v2]
    timeout-minutes: 5
    steps:
      - name: Verify isolated source-free runner state
        shell: bash
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ores-truffle-oreslang/oreslang-source.java"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"

          # A persistent self-hosted workspace must not carry prior repository
          # material into this no-checkout canary. Fail closed rather than
          # attempting cleanup that could hide contamination.
          if find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null | grep -q .; then
            echo "::error::source-free runner workspace is not empty"
            exit 1
          fi
          for credential_file in "$HOME/.git-credentials" "$HOME/.netrc"; do
            if test -e "$credential_file"; then
              echo "::error::persistent credential file present: $credential_file"
              exit 1
            fi
          done
          if git config --global --get-regexp '^(credential\.|http\..*\.extraheader)' >/dev/null 2>&1; then
            echo "::error::persistent git credential configuration present"
            exit 1
          fi
          echo "ASYNC_INTEROP_SOURCE_FREE_WORKSPACE_CLEAN=true"

      - name: Verify source-free tooling prerequisites only
        shell: bash
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: |
          set -euo pipefail
          # The workflow intentionally has no checkout and no access to
          # private-source files; source validation uses a separate job.
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          command -v java
          command -v javac
          command -v native-image
          command -v mvn
          command -v python3
          java -version
          javac -version
          native-image --version
          mvn --version
          python3 --version
          java -XshowSettings:properties -version 2>&1 |
            grep -E 'java.specification.version[[:space:]]*=[[:space:]]*25$'
          native-image --version 2>&1 | grep -qi 'graalvm'
          echo "ASYNC_INTEROP_SOURCE_FREE_RUNNER_EXECUTED=true"
          echo "ASYNC_INTEROP_PRIVATE_SOURCE_CHECKOUT=false"
          echo "ASYNC_INTEROP_JVM_TESTS_EXECUTED=false"
          echo "ASYNC_INTEROP_ISOLATION_REQUIRES_ADMIN_ATTESTATION=true"

name: GenServer reply port real-Future and admission verification
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/GenServerCallPort.java'
      - 'src/main/java/dev/oreslang/runtime/GenServerReplyLedger.java'
      - 'src/test/java/dev/oreslang/runtime/GenServerCallPortTest.java'
      - 'src/test/java/dev/oreslang/runtime/GenServerCallPortTransactionalTest.java'
      - '.github/workflows/genserver-call-port-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-future:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          distribution: graalvm
          java-version: '25'
          version: '25.3'
          cache: maven
      - name: Execute real OresFuture and indexed reply ledger integration
        run: >-
          mvn -B -ntp -Dtest=GenServerCallPortTest,GenServerCallPortTransactionalTest test

name: Actor startup scalar schema (host only)
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/ActorStartupSchema.java'
      - 'src/test/java/dev/oreslang/runtime/ActorStartupSchemaSmoke.java'
      - '.github/workflows/actor-startup-scalar-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify head and execute scalar schema smoke
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'head=%s tree=%s\n' "$EXPECTED_HEAD" "$(git rev-parse HEAD^{tree})"
          mkdir -p target/actor-startup-schema
          javac --release 21 -Xlint:all -Werror -d target/actor-startup-schema src/main/java/dev/oreslang/runtime/ActorStartupSchema.java src/test/java/dev/oreslang/runtime/ActorStartupSchemaSmoke.java
          java -cp target/actor-startup-schema dev.oreslang.runtime.ActorStartupSchemaSmoke

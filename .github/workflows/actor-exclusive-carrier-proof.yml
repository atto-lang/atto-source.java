name: Oreslang actor-exclusive carrier proof

on:
  pull_request:
  push:
    branches: [feat/logical-race-snapshot-cas-v1-20261011]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-models:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Explore actor claims and stale dispatch identities
        run: |
          python3 scripts/verify_actor_carrier_exclusivity.py
          python3 scripts/verify_actor_dispatch_tickets.py
          python3 scripts/verify_actor_thread_policy_v2.py

  actor-runtime-exclusivity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Compile and run actual actor execution boundary tests
        run: >
          mvn -B -ntp -Dores.runtime.carriers=native
          -Dtest=ActorDispatchIdentityTest,ActorMailboxExecutionBoundaryTest,ActorOffCarrierTurnExecutorTest,VersionedActorCellTest,ActorThreadPolicySyntaxTest,ActorThreadPolicyHardeningTest,ActorThreadsLegacyCompatibilityTest,ActorExecutionGrantGateTest,ActorThreadPolicyRuntimeTest
          test

  tla-plus-tlc:
    name: TLC model check both finite specifications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Download checksum-verified official TLA+ tools v1.7.4
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output /tmp/ores-tla2tools.jar
          echo '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/ores-tla2tools.jar' \
            | sha256sum --check --status
      - name: Parse and model check actor exclusivity and dispatch identity
        shell: bash
        working-directory: docs/formal
        run: |
          set -euo pipefail
          for name in ReentrantActorExclusiveCarrier ActorDispatchIdentity; do
            timeout 120s java -cp /tmp/ores-tla2tools.jar tlc2.TLC \
              -workers 1 -config "${name}.cfg" "${name}.tla"
          done

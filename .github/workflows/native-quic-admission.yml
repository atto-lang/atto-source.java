name: Java Native QUIC admission (not wire parity)
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/NativeQuicAdmission.java'
      - 'src/test/java/dev/oreslang/runtime/NativeQuicAdmissionTest.java'
      - 'src/main/java/dev/oreslang/runtime/NativeQuicLoopbackUdp.java'
      - 'src/test/java/dev/oreslang/runtime/NativeQuicLoopbackUdpSmoke.java'
      - 'docs/QUIC_HTTP3_BACKEND_GATE.md'
      - '.github/workflows/native-quic-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graal-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@2a2412009026a83f51d179f92dc2b3fd4c8142df # v1.4.1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run exact-checkout JUnit admission negatives
        run: mvn -q -Dtest=NativeQuicAdmissionTest test
      - name: Compile and run JDK25 nonblocking loopback UDP smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quic-loopback"
          javac -d "$RUNNER_TEMP/quic-loopback" \
            src/main/java/dev/oreslang/runtime/NativeQuicLoopbackUdp.java \
            src/test/java/dev/oreslang/runtime/NativeQuicLoopbackUdpSmoke.java
          java -cp "$RUNNER_TEMP/quic-loopback" \
            dev.oreslang.runtime.NativeQuicLoopbackUdpSmoke

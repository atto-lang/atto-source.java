name: Java Native QUIC admission (not wire parity)
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/runtime/NativeQuicAdmission.java'
      - 'src/test/java/dev/oreslang/runtime/NativeQuicAdmissionTest.java'
      - 'docs/QUIC_HTTP3_BACKEND_GATE.md'
      - '.github/workflows/native-quic-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graal-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@4a56e59d0a490bbdb4f33af73438247e75c3cb48 # v1.4.1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run exact-checkout JUnit admission negatives
        run: mvn -q -Dtest=NativeQuicAdmissionTest test

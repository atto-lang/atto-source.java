name: concurrency-contract-verified

on:
  push:
    branches:
      - integration/concurrency-contract-20261006
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verified:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact trusted source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"
      - name: Clean compile
        run: mvn -B -Dores.runtime.carriers=java -DskipTests test-compile
      - name: Runtime proof
        run: mvn -B -Dores.runtime.carriers=java -Dtest=OresVMTest,OresSchedulerTest,ChannelRuntimeTest,ChannelSelectSyntaxTest test
      - name: Actor and security proof
        run: mvn -B -Dores.runtime.carriers=java -Dtest=ActorEventBusTest,HungryActorTest,ActorStructuredCancellationTest,UntrustedActorTest,ConcurrencyContractProofTest test

name: Protected actor exact-head JDK21 smoke

on:
  pull_request:
    paths:
      - '.github/workflows/protected-actor-exact-head-jdk21.yml'
      - 'scripts/test-protected-actor-exact-head-jdk21.sh'
      - 'src/main/java/dev/oreslang/runtime/StateContainerAccessGate.java'
      - 'src/main/java/dev/oreslang/runtime/VirtualActorActivationRegistry.java'
      - 'src/main/java/dev/oreslang/runtime/ScalarStateContainer.java'
      - 'src/main/java/dev/oreslang/runtime/LocalVirtualActorI64.java'
      - 'src/test/java/dev/oreslang/runtime/ProtectedActorStandaloneSmoke.java'
  workflow_dispatch:
    inputs:
      expected_head:
        description: "Exact 40-hex commit SHA to verify, not a mutable branch"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: protected-actor-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-host-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source SHA without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_head }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # pinned v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile and execute exact-head protected-actor host substrate
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || inputs.expected_head }}
        run: bash scripts/test-protected-actor-exact-head-jdk21.sh

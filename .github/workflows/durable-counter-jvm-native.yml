name: Java durable Counter compiled JVM and GraalVM guest
on:
  pull_request:
    paths:
      - 'src/main/java/dev/oreslang/compiler/DurableCounterSourceV1.java'
      - 'src/main/java/dev/oreslang/compiler/DurableScalarSourceV1.java'
      - 'tests/durable_scalar_codec_jvm.mjs'
      - 'src/main/java/dev/oreslang/launcher/OresMain.java'
      - 'tests/durable_counter_jvm_native.mjs'
      - '.github/workflows/durable-counter-jvm-native.yml'
permissions:
  contents: read
jobs:
  jvm-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
      - name: Build exact source compiler and execute generated JVM and Native Image guests
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD^{tree}
          mvn -B -ntp -DskipTests package
          mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile=target/conformance-classpath.txt
          ATTO_JAVA_CP="target/classes:$(cat target/conformance-classpath.txt)" ATTO_TEST_NATIVE_IMAGE=1 node tests/durable_counter_jvm_native.mjs
          ATTO_JAVA_CP="target/classes:$(cat target/conformance-classpath.txt)" ATTO_TEST_CLI=1 ATTO_TEST_NATIVE_IMAGE=1 node tests/durable_scalar_codec_jvm.mjs

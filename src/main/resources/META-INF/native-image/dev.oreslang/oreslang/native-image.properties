# The telemetry span RNG must be seeded when the Native Image starts, not embedded
# as a SecureRandom object with a build-time seed in the persisted image heap.
# Keep the holder runtime-initialized even though the wider package builds early.
Args = --initialize-at-build-time=dev.oreslang --initialize-at-run-time=dev.oreslang.runtime.NativeCarrierExecutor,dev.oreslang.runtime.TelemetrySpanScope$RandomId
